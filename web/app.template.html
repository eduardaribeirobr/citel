<title>Preparo TJSP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: uma coluna, cartões empilhados, barra de abas fixa embaixo (Hoje, Questões, Painel, Edital, Mais), pensado para o celular. */
:root {
  --bg: #f4f6f5;
  --panel: #ffffff;
  --fg: #17211c;
  --muted: #58665f;
  --line: #d7ded9;
  --accent: #17634b;
  --accent-fg: #ffffff;
  --accent-soft: #e2f0e9;
  --ok: #17663f; --ok-bg: #e0f1e7;
  --warn: #7a4b00; --warn-bg: #fbeed2;
  --bad: #a4261d; --bad-bg: #fbe5e2;
  --info: #3b4a43; --info-bg: #e9eeea;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1511; --panel: #17201b; --fg: #e8eee9; --muted: #9db0a5; --line: #2b3a31;
    --accent: #5fc79f; --accent-fg: #0c1510; --accent-soft: #1d3329;
    --ok: #86dfae; --ok-bg: #16301f; --warn: #f1c978; --warn-bg: #352a0d; --bad: #ffa196; --bad-bg: #3a1b18;
    --info: #b9c9bf; --info-bg: #222d26;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1511; --panel: #17201b; --fg: #e8eee9; --muted: #9db0a5; --line: #2b3a31;
  --accent: #5fc79f; --accent-fg: #0c1510; --accent-soft: #1d3329;
  --ok: #86dfae; --ok-bg: #16301f; --warn: #f1c978; --warn-bg: #352a0d; --bad: #ffa196; --bad-bg: #3a1b18;
  --info: #b9c9bf; --info-bg: #222d26;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--sans);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(84px + env(safe-area-inset-bottom, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 20; }
.wrap { max-width: 720px; margin: 0 auto; }
header.topo {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg);
  display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0 10px; border-bottom: 1px solid var(--line);
}
header.topo h1 { font-size: 1.05rem; margin: 0; letter-spacing: .01em; }
main { display: grid; gap: 14px; padding-top: 14px; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.card h2 { margin: 0; font-size: .75rem; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.card h3 { margin: 0; font-size: 1rem; }
.big { font: 500 2rem/1.1 var(--mono); letter-spacing: -.01em; }
.big small { font-size: .95rem; color: var(--muted); font-weight: 400; }
.note { color: var(--muted); font-size: .85rem; margin: 0; overflow-wrap: anywhere; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-width: 0; }
.row > :first-child { min-width: 0; }
.stack { display: grid; gap: 8px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.kpi { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 4px; min-width: 0; }
.kpi .v { font: 500 1.35rem/1.15 var(--mono); }
.kpi .l { font-size: .78rem; color: var(--muted); }
.chip { display: inline-block; font: 600 .74rem/1 var(--sans); padding: 5px 9px; border-radius: 999px; white-space: nowrap; }
.chip.ok { color: var(--ok); background: var(--ok-bg); } .chip.warn { color: var(--warn); background: var(--warn-bg); }
.chip.bad { color: var(--bad); background: var(--bad-bg); } .chip.info { color: var(--info); background: var(--info-bg); }
.bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); }
button, .btn { font: 600 .92rem var(--sans); min-height: 44px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-fg); cursor: pointer; }
button.sec, .btn.sec { background: transparent; color: var(--accent); }
button.peq { min-height: 36px; padding: 0 10px; font-size: .84rem; }
button:disabled { opacity: .5; cursor: default; }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
input, select { font: 400 .95rem var(--sans); min-height: 44px; padding: 0 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); min-width: 0; width: 100%; }
label { font-size: .82rem; color: var(--muted); display: grid; gap: 4px; min-width: 0; }
.acoes { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.item { display: grid; gap: 6px; padding: 10px 0; border-top: 1px solid var(--line); min-width: 0; }
.item:first-child { border-top: 0; padding-top: 0; }
.item .t { overflow-wrap: anywhere; }
.item .m { color: var(--muted); font-size: .82rem; }
.mono { font-family: var(--mono); }
.chart .area { position: relative; display: flex; align-items: flex-end; gap: 4px; height: 96px; }
.chart .area .col { flex: 1; display: flex; align-items: flex-end; height: 100%; min-width: 0; }
.chart .area .col i { display: block; width: 100%; background: var(--accent); border-radius: 3px 3px 0 0; }
.chart .area .metalinha { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--muted); pointer-events: none; }
.chart .rotulos { display: flex; gap: 4px; margin-top: 4px; }
.chart .rotulos span { flex: 1; text-align: center; font: 400 .62rem var(--mono); color: var(--muted); min-width: 0; }
details { border-top: 1px solid var(--line); padding: 8px 0; }
details > summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
details > summary::-webkit-details-marker { display: none; }
details.disc { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); padding: 12px 14px; }
.topico { display: grid; gap: 6px; padding: 10px 0; border-top: 1px solid var(--line); }
.topico .cab { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; min-width: 0; }
.topico .tit { overflow-wrap: anywhere; min-width: 0; }
.topico .det { font-size: .82rem; color: var(--muted); display: grid; gap: 4px; overflow-wrap: anywhere; }
.estudado-sim { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
nav.abas {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: var(--panel); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(5, 1fr);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
}
nav.abas a { text-align: center; text-decoration: none; color: var(--muted); font-weight: 600; font-size: .78rem; padding: 10px 2px; border-radius: 9px; min-height: 44px; display: grid; place-items: center; }
nav.abas a[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 10px; font-size: .88rem; z-index: 30; max-width: min(92vw, 520px); }
.erro-bloco { border-color: var(--bad); }
.timer { font: 500 1.8rem/1 var(--mono); }
pre.mono { white-space: pre-wrap; overflow-wrap: anywhere; font: 400 .78rem/1.5 var(--mono); margin: 0; }
ul.limpa { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.enun { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 1.02rem; line-height: 1.55; margin: 0; }
.alts { display: grid; gap: 8px; }
button.alt, button.conf, .motivos button { background: var(--panel); color: var(--fg); border: 1px solid var(--line); font-weight: 500; text-align: left; }
button.alt { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; padding: 10px 12px; min-height: 48px; line-height: 1.4; }
button.alt .l { font: 600 .95rem var(--mono); color: var(--accent); }
button.alt .corpo { display: grid; gap: 4px; min-width: 0; overflow-wrap: anywhere; }
button.alt .com { font-size: .82rem; color: var(--muted); font-weight: 400; }
button.alt[aria-pressed="true"], button.conf[aria-pressed="true"], .motivos button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
button.alt.certa { border-color: var(--ok); background: var(--ok-bg); box-shadow: inset 0 0 0 1px var(--ok); }
button.alt.errada { border-color: var(--bad); background: var(--bad-bg); box-shadow: inset 0 0 0 1px var(--bad); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
button.conf { text-align: center; font-size: .84rem; padding: 0 6px; }
.motivos { display: grid; gap: 8px; }
.explic { display: grid; gap: 8px; padding: 12px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); }
.explic p { margin: 0; overflow-wrap: anywhere; }
#q-feedback { scroll-margin-top: 64px; }
#q-feedback:focus { outline: none; }
</style>

<div class="wrap">
  <header class="topo">
    <h1>Preparo TJSP</h1>
    <span id="status" class="chip info" role="status" aria-live="polite">Carregando…</span>
  </header>
  <main id="view" aria-live="polite"><div class="card"><p class="note">Carregando o edital e o seu histórico…</p></div></main>
</div>
<nav class="abas" aria-label="Seções">
  <a href="#hoje" data-aba="hoje">Hoje</a>
  <a href="#questoes" data-aba="questoes">Questões</a>
  <a href="#painel" data-aba="painel">Painel</a>
  <a href="#edital" data-aba="edital">Edital</a>
  <a href="#mais" data-aba="mais">Mais</a>
</nav>
<div id="toast" class="toast" role="status" hidden></div>

<script>
/*__MODULOS__*/
</script>
<script>
(function () {
  'use strict';
  var PROVA = Date.UTC(2027, 2, 14, 17, 0, 0);          // 14/03/2027 (edital p.28)
  var TZ = -180;                                         // Brasília
  var PADRAO = { disponivelMinDia: 60, diasPorSemana: 6, reservaFinalDias: 14 };
  // Peso de cada etapa na CARGA (estimativa nossa): o estudo da teoria é a etapa mais longa.
  var PESOS_APP = { estudo: 0.40, exercicio: 0.25, desempenho: 0.20, retencao: 0.15 };
  var NOMES_ETAPA = { 1: '1 dia', 2: '7 dias', 3: '30 dias' };
  var ABAS = ['hoje', 'questoes', 'painel', 'edital', 'mais'];

  var S = { matriz: null, topicos: [], porId: new Map(), discs: new Map(), store: null, uid: null, dl: null, aba: 'hoje', filtro: { q: '', disc: '', estado: 'todos' },
    topicoSel: '', semBanco: false, erroCarga: null, importacao: null, parando: null, toastTimer: null, tick: null, q: null, aux: { validacao: null, regras: null }, comQuestoes: new Set() };

  function $(id) { return document.getElementById(id); }
  function h(tag, attrs) {
    var e = document.createElement(tag);
    var kids = Array.prototype.slice.call(arguments, 2);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v === null || v === undefined || v === false) return;
      if (k === 'class') e.className = v;
      else if (k === 'text') e.textContent = v;
      else if (k === 'style') Object.assign(e.style, v);
      else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? '' : v);
    });
    (function add(list) {
      list.forEach(function (c) {
        if (Array.isArray(c)) return add(c);
        if (c === null || c === undefined || c === false) return;
        e.append(c.nodeType ? c : document.createTextNode(String(c)));
      });
    })(kids);
    return e;
  }
  function chip(tipo, texto) { return h('span', { class: 'chip ' + tipo, text: texto }); }
  function barra(frac) { var i = h('i'); i.style.width = Math.max(0, Math.min(100, frac * 100)) + '%'; return h('div', { class: 'bar', role: 'progressbar', 'aria-valuemin': '0', 'aria-valuemax': '100', 'aria-valuenow': String(Math.round(Math.max(0, Math.min(1, frac)) * 100)) }, i); }
  function pct(x) { return (Math.round(x * 1000) / 10).toLocaleString('pt-BR') + '%'; }
  function dur(min) { min = Math.round(min); return min >= 60 ? Math.floor(min / 60) + 'h' + String(min % 60).padStart(2, '0') : min + ' min'; }
  function plataforma() { var u = navigator.userAgent; return /iPhone|iPad|iPod/.test(u) ? 'iOS' : /Android/.test(u) ? 'Android' : 'computador'; }
  function hhmm(ts) { return new Date(ts).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', timeZone: 'America/Sao_Paulo' }); }
  function dataBR(ts) { return new Date(ts).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', timeZone: 'America/Sao_Paulo' }); }

  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(S.toastTimer); S.toastTimer = setTimeout(function () { t.hidden = true; }, 3200);
  }

  // ---------- armazenamento local (pode não existir) ----------
  function armazenamento() { try { var s = window.localStorage; s.getItem('__t'); return s; } catch (e) { return null; } }
  var LS = armazenamento();
  function lsGet(k) { try { return LS ? LS.getItem(k) : null; } catch (e) { return null; } }
  function lsSet(k, v) { try { if (LS) LS.setItem(k, v); } catch (e) { /* sem cópia local */ } }
  function lsDel(k) { try { if (LS) LS.removeItem(k); } catch (e) { /* sem cópia local */ } }

  // ---------- dados do edital ----------
  function indexar() {
    S.topicos = S.matriz.topicos;
    S.topicos.forEach(function (t) { S.porId.set(t.id, t); });
    S.matriz.disciplinas.forEach(function (d) { S.discs.set(d.cod, d); });
    S.comQuestoes = new Set(); Questoes.ativos().forEach(function (t) { Questoes.topicosDe(t).forEach(function (id) { S.comQuestoes.add(id); }); });
  }
  function titulo(id) { var t = S.porId.get(id); return t ? t.titulo : id; }
  function curto(txt, n) { return txt.length > n ? txt.slice(0, n - 1) + '…' : txt; }

  // ---------- cálculo central ----------
  function calcular() {
    var agora = Date.now();
    var est = S.store ? S.store.estado() : { dados: {}, derivado: { eventos: [], sessoes: [], marcacoes: [], revisoes: [], estudados: new Set(), ultimaMarcacao: new Map(), minutosPorTopico: new Map() }, config: {} };
    var d = est.derivado;
    var cfg = Object.assign({}, PADRAO, est.config);
    var hojeIdx = Progresso.diaIdx(agora, TZ);
    var devidas = Plano.revisoesDevidas({ derivado: d, hojeIdx: hojeIdx });
    var proximas = Plano.proximasRevisoes({ derivado: d, hojeIdx: hojeIdx, limite: 5 });
    var minutosHoje = Plano.minutosNoDia(d.sessoes, hojeIdx);
    var sugestao = Plano.sugerirHoje({ topicos: S.topicos, derivado: d, disponivelMin: cfg.disponivelMinDia, minutosHoje: minutosHoje, revisoes: devidas });
    // respostas de questões: os registros de "motivo do erro" não são respostas e não entram no motor
    var respostas = Aprendizagem.paraMotor(d.eventos);
    var qCart = Aprendizagem.cartoes(d.eventos, hojeIdx, TZ);
    var qDevidas = Aprendizagem.revisoesVencidas(qCart);
    var engine = Progresso.calcularProgresso({
      topicos: S.topicos.map(function (t) { return { id: t.id, esforcoMin: t.esforco_min }; }),
      eventos: respostas,
      sessoes: d.sessoes.filter(function (s) { return s.min > 0; }).map(function (s) { return { ts: s.ts, min: s.min, topicId: s.topicId || undefined }; }),
      estudados: Array.from(d.estudados), agora: agora, dataProva: PROVA, revisoesVencidas: devidas.length + qDevidas.length,
    }, { disponivelMinDia: cfg.disponivelMinDia, diasPorSemana: cfg.diasPorSemana, reservaFinalDias: cfg.reservaFinalDias, pesosEtapas: PESOS_APP, tzOffsetMin: TZ });
    var serie = Plano.serieDiaria(d.sessoes, hojeIdx, 14);
    var q = { cart: qCart, devidas: qDevidas, stats: Aprendizagem.estatisticas(d.eventos, hojeIdx, TZ), caderno: Aprendizagem.cadernoErros(d.eventos, hojeIdx) };
    return { agora: agora, est: est, d: d, cfg: cfg, hojeIdx: hojeIdx, devidas: devidas, proximas: proximas, minutosHoje: minutosHoje, sugestao: sugestao, engine: engine, serie: serie, q: q, engTop: new Map(engine.topicos.map(function (t) { return [t.id, t]; })),
      diasProva: Progresso.diaIdx(PROVA, TZ) - hojeIdx, configurado: !!(est.config && est.config.atualizadoEm) };
  }

  // ---------- status de gravação ----------
  function atualizarStatus(st) {
    var el = $('status');
    st = st || (S.store ? S.store.status() : null);
    if (!S.store || !st) { el.className = 'chip ' + (S.semBanco ? 'bad' : 'info'); el.textContent = S.semBanco ? 'Sem banco de dados' : 'Carregando…'; return; }
    var cls = 'ok', txt;
    if (st.erro && st.erro.fatal) { cls = 'bad'; txt = 'Não salvou: ' + st.erro.code; }
    else if (st.erro) { cls = 'warn'; txt = 'Sem conexão, tentando de novo (' + st.pendentes + ')'; }
    else if (st.gravando) { cls = 'info'; txt = 'Salvando…'; }
    else if (st.pendentes > 0) { cls = 'info'; txt = 'Pendente (' + st.pendentes + ')'; }
    else { txt = st.ultimoSalvo ? 'Salvo às ' + hhmm(st.ultimoSalvo) : 'Tudo salvo'; }
    el.className = 'chip ' + cls;
    el.textContent = txt;
    el.dataset.estado = st.erro ? 'erro' : st.gravando ? 'salvando' : st.pendentes > 0 ? 'pendente' : 'salvo';
  }

  // ---------- ações (todas passam pelo registro confiável) ----------
  function registrar(colecao, item, msg) {
    if (!S.store) { toast('Sem banco de dados: não foi possível salvar.'); return null; }
    try { var r = S.store.registrar(colecao, item); if (msg) toast(msg); render(); return r; }
    catch (e) { toast('Não foi possível registrar: ' + e.message); return null; }
  }
  function registrarSessao(min, topicId) {
    min = Math.round(Number(min));
    if (!(min >= 1 && min <= 480)) { toast('Informe entre 1 e 480 minutos.'); return; }
    registrar('sessoes', { min: min, topicId: topicId || null }, 'Registrado: ' + min + ' min');
  }
  function alternarEstudado(id, estudadoAtual) {
    registrar('marcacoes', { topicId: id, estudado: !estudadoAtual }, estudadoAtual ? 'Desmarcado.' : 'Marcado como estudado. Revisões em 1, 7 e 30 dias.');
  }
  function desfazer(id) { registrar('cancelamentos', { ref: id }, 'Desfeito.'); }

  // ---------- cronômetro ----------
  function chaveTimer() { return 'pl:' + S.uid + ':timer'; }
  function timerAtual() { try { return JSON.parse(lsGet(chaveTimer()) || 'null'); } catch (e) { return null; } }
  function iniciarTimer(topicId) { lsSet(chaveTimer(), JSON.stringify({ topicId: topicId || '', inicio: Date.now() })); render(); }
  function pararTimer() { var t = timerAtual(); if (!t) return; S.parando = { topicId: t.topicId, min: Math.max(1, Math.round((Date.now() - t.inicio) / 60000)) }; lsDel(chaveTimer()); render(); }
  function mmss(ms) { var s = Math.max(0, Math.floor(ms / 1000)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
  function atualizarCronometro() {
    var t = timerAtual(); var el = $('timer-display');
    if (t && el) el.textContent = mmss(Date.now() - t.inicio);
  }

  // ---------- telas ----------
  function selectTopicos(valor, id) {
    var sel = h('select', { id: id, 'aria-label': 'Tópico estudado' });
    sel.append(h('option', { value: '', text: '(sem tópico específico)' }));
    S.matriz.disciplinas.forEach(function (d) {
      var g = h('optgroup', { label: d.nome });
      S.topicos.filter(function (t) { return t.disciplina === d.cod; }).forEach(function (t) {
        g.append(h('option', { value: t.id, text: curto(t.id.replace('OJ26-', '') + ' · ' + t.titulo, 80) }));
      });
      sel.append(g);
    });
    sel.value = valor || '';
    sel.addEventListener('change', function () { S.topicoSel = sel.value; });
    return sel;
  }

  function viewHoje(c) {
    var nodes = [];
    var meta = c.cfg.disponivelMinDia;
    var diasTxt = c.diasProva > 0 ? 'A prova é em ' + c.diasProva + ' dias (14/03/2027, prevista no edital).' : 'A data prevista da prova já chegou.';
    nodes.push(h('section', { class: 'card', id: 'card-hoje' },
      h('h2', null, 'Hoje'),
      h('div', { class: 'big', id: 'minutos-hoje', 'data-minutos': String(c.minutosHoje) }, String(c.minutosHoje), h('small', null, ' / ' + meta + ' min')),
      barra(c.minutosHoje / meta),

  // ---------- auditoria e regras (arquivos gerados no build, só leitura) ----------
  function carregarAux() {
    [['validacao', 'validacao-questoes.json'], ['regras', 'edital-regras.json']].forEach(function (par) {
      fetch(par[1]).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })

  function cardAuditoria() {

      cob.append(h('div', { class: 'row item' }, h('span', { class: 't', text: d.nome }), d.topicosComQuestoes === d.topicos ? chip('ok', d.topicosComQuestoes + '/' + d.topicos + ' tópicos') : d.topicosComQuestoes > 0 ? chip('warn', d.topicosComQuestoes + '/' + d.topicos + ' tópicos') : chip('bad', 'sem questões')));
    });
    card.append(cob);
    if (v.diplomas) {
      var ing = v.diplomas.filter(function (d) { return d.fonte === 'ingerida'; }).length;
      var dip = h('details', { id: 'det-diplomas' }, h('summary', null, 'Fontes oficiais por diploma (' + ing + ' de ' + v.diplomas.length + ' ingeridas)'));
      v.diplomas.forEach(function (d) {
        dip.append(h('div', { class: 'item', 'data-diploma': d.nome }, h('div', { class: 'row' }, h('span', { class: 't', text: d.nome }), d.fonte === 'ingerida' ? chip(d.artigos_ausentes.length ? 'warn' : 'ok', 'fonte ingerida') : chip('bad', 'fonte pendente')),
          h('div', { class: 'm' }, d.lei_integral ? 'Lei integral no edital · ' : '', d.artigos_citados + ' artigo(s) citado(s) no edital · ' + d.topicos + ' tópico(s)' + (d.fonte === 'ingerida' ? ' · ' + d.artigos_conferidos + ' conferido(s) no texto oficial' + (d.artigos_ausentes.length ? ' (ausentes: ' + d.artigos_ausentes.slice(0, 5).join(', ') + ')' : '') + (d.artigos_revogados_ou_vetados.length ? ' · ' + d.artigos_revogados_ou_vetados.length + ' revogado(s)/vetado(s)/incerto(s), que não geram questão' : '') + (d.artigos_com_dispositivo_omitido ? ' · ' + d.artigos_com_dispositivo_omitido + ' com dispositivo omitido por dúvida (supressão ou decisão judicial)' : '') + (d.artigos_com_alteracao_posterior && d.artigos_com_alteracao_posterior.length ? ' · art. ' + d.artigos_com_alteracao_posterior.join(', ') + ': o Senado registra norma alteradora posterior ao texto guardado; fora das questões até atualizar' : '') : '')),
          d.observacao ? h('div', { class: 'm', text: 'Atenção: ' + d.observacao }) : null));
      });
      card.append(dip, h('p', { class: 'note' }, 'Enquanto a fonte oficial de um diploma não estiver ingerida e conferida, o app não terá questões dele. Contagem pelos intervalos numéricos do edital.'));
    }
    var mod = h('details', null, h('summary', null, 'Modelos de questão (' + v.modelos.length + ')'));
    v.modelos.forEach(function (m) {
      var cap = v.variacoes_max;
      var vars = [1, 2, 3, 4, 5].map(function (n) { return m.variacoes[n] >= cap ? cap + '+' : String(m.variacoes[n]); }).join(' · ');
      var fraco = !m.aposentado && [1, 2, 3, 4, 5].some(function (n) { return m.variacoes[n] < v.limite_variacao_baixa; });
      mod.append(h('div', { class: 'item', 'data-modelo': m.id },
        h('div', { class: 'row' }, h('div', { class: 't', text: m.titulo }), m.aposentado ? chip('info', 'aposentado') : fraco ? chip('warn', 'pouca variação') : null),

    });
    card.append(mod,
      v.variacao_baixa.length ? h('p', { class: 'note', id: 'texto-variacao' }, v.variacao_baixa.length + ' combinações de modelo e nível têm menos de ' + v.limite_variacao_baixa + ' variações (' + v.variacao_baixa.map(function (x) { return x.modelo.split('-').slice(0, 2).join('-') + ' nível ' + x.nivel; }).join('; ') + '). Nelas, as questões se repetem mais; o app usa o nível vizinho antes de repetir.') : null,
      h('ul', { class: 'limpa' }, v.limites.map(function (l) { return h('li', { text: l }); })));

  }
  var ACENTOS = { minimo: 'mínimo', nomeacao: 'nomeação', retificacao: 'retificação', inscricoes: 'inscrições', remuneracao: 'remuneração', atribuicoes: 'atribuições', duracao: 'duração', periodo: 'período', habilitacao: 'habilitação', legislacao: 'legislação', carater: 'caráter', eliminatoria: 'eliminatória', classificatorio: 'classificatório', revisao: 'revisão', portugues: 'português', unica: 'única', criterios: 'critérios', ate: 'até', nao: 'não', excluido: 'excluído', identificacao: 'identificação', bloco3: 'bloco 3', dejesp: 'DEJESP', cj: 'CJ', referencia: 'referência' };
  function cardRegras() {
    var r = S.aux.regras;
    var card = h('section', { class: 'card', id: 'card-regras' }, h('h2', null, 'Regras do edital'));
    if (!r) { card.append(h('p', { class: 'note' }, 'Carregando…')); return card; }

  // ---------- backup ----------
  async function exportar() {
    try {
      var texto = await Backup.criarBackup(S.store.exportar(), { dispositivo: plataforma() });
      var hoje = new Date().toISOString().slice(0, 10);
      var r = await S.dl.save({ filename: 'preparo-tjsp-' + hoje + '.json', data: texto });
      toast(r.status === 'saved' ? 'Backup entregue ao aparelho.' : 'Backup: ' + r.status);
    } catch (e) { toast(e && e.code === 'declined' ? 'Exportação cancelada.' : 'Não foi possível exportar: ' + ((e && (e.code || e.message)) || e)); }
  }
  function lerArquivo(f) {
    if (f.text) return f.text();
    return new Promise(function (res, rej) { var r = new FileReader(); r.onload = function () { res(String(r.result)); }; r.onerror = function () { rej(r.error); }; r.readAsText(f); });
  }
  async function importarArquivo(input) {
    var f = input.files && input.files[0];
    if (!f) return;
    try {
      var v = await Backup.verificarBackup(await lerArquivo(f));
      if (!v.ok) { S.importacao = { erro: v.motivo }; }
      else { S.importacao = { backup: v.backup, plano: Backup.planejarImportacao(S.store.exportar(), v.backup.dados) }; }
    } catch (e) { S.importacao = { erro: 'não foi possível ler o arquivo: ' + ((e && e.message) || e) }; }
    render();
  }
  function painelImportacao() {
    var im = S.importacao;
    if (im.erro) return h('div', { class: 'item', id: 'painel-importacao' }, chip('bad', 'Backup recusado'), h('div', { class: 't', text: im.erro }), h('div', { class: 'acoes' }, h('button', { class: 'sec peq', onclick: function () { S.importacao = null; render(); } }, 'Fechar')));
    var p = im.plano, rot = { eventos: 'respostas', sessoes: 'sessões', marcacoes: 'marcações', revisoes: 'revisões', cancelamentos: 'cancelamentos' };
    var novos = Object.keys(rot).map(function (k) { return p.relatorio.novos[k] ? p.relatorio.novos[k] + ' ' + rot[k] : null; }).filter(Boolean);
    var confl = Object.keys(rot).reduce(function (s, k) { return s + p.relatorio.conflitos[k].length; }, 0);
    return h('div', { class: 'item', id: 'painel-importacao' },
      chip(p.tipo === 'NADA NOVO' ? 'info' : p.tipo === 'COM CONFLITOS' ? 'warn' : 'ok', 'Backup íntegro: ' + p.tipo.toLowerCase()),
      h('div', { class: 't' }, 'Criado em ' + im.backup.criadoEm.slice(0, 10) + (im.backup.dispositivo ? ' (' + im.backup.dispositivo + ')' : '') + '. ' + (novos.length ? 'Traria: ' + novos.join(', ') + '.' : 'Não traria nada novo.')),
      confl ? h('div', { class: 'm' }, confl + ' registro(s) com o mesmo id e conteúdo diferente: o que você já tem é mantido.') : null,
      h('div', { class: 'acoes' },
        h('button', { id: 'btn-confirmar-importacao', disabled: p.totalNovos === 0 && !(im.backup.dados.config && im.backup.dados.config.atualizadoEm), onclick: function () {
          var r = S.store.adicionarItens(p.resultado); S.importacao = null; toast('Importado: ' + (r.eventos + r.sessoes + r.marcacoes + r.revisoes + r.cancelamentos + r.estudadosLegados) + ' registro(s).'); render();
        } }, 'Juntar ao meu histórico'),
        h('button', { class: 'sec', onclick: function () { S.importacao = null; render(); } }, 'Cancelar')));
  }
  async function verificarGravacao() {
    var b = $('btn-verificar'); b.disabled = true; $('texto-verificacao').textContent = 'Testando…';
    var r = await S.store.verificar();
    $('texto-verificacao').textContent = r.ok ? 'Gravação, leitura e remoção funcionaram (' + r.ms + ' ms).' : 'Falhou: ' + r.motivo;
    b.disabled = false;
  }

  // ---------- navegação e renderização ----------
  function abaDoHash() { var a = (location.hash || '').slice(1); return ABAS.indexOf(a) >= 0 ? a : 'hoje'; }
  function render() {
    var v = $('view');
    document.querySelectorAll('nav.abas a').forEach(function (a) { if (a.dataset.aba === S.aba) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    if (S.erroCarga) {
      v.replaceChildren(h('section', { class: 'card erro-bloco' }, h('h2', null, 'Não foi possível carregar'), h('p', { class: 'note' }, 'O histórico não foi lido do banco de dados (' + (S.erroCarga.code || S.erroCarga.message || 'erro') + '). Nada foi alterado. Tente de novo.'), h('div', { class: 'acoes' }, h('button', { id: 'btn-tentar', onclick: function () { S.erroCarga = null; iniciar(); } }, 'Tentar de novo'))));
      atualizarStatus(); return;
    }
    if (!S.matriz) return;
    var c = calcular();
    var nodes = [];
    if (S.semBanco) nodes.push(h('section', { class: 'card erro-bloco', id: 'aviso-sem-banco' }, h('h2', null, 'Sem banco de dados'), h('p', { class: 'note' }, 'Esta visualização não tem acesso ao banco de dados da plataforma ou à sua identidade, então nada pode ser salvo. Abra o documento logada(o), pelo aplicativo ou navegador. Você ainda pode consultar o edital.')));
    if (S.aba === 'hoje') nodes = nodes.concat(viewHoje(c));
    else if (S.aba === 'questoes') nodes = nodes.concat(viewQuestoes(c));
    else if (S.aba === 'painel') nodes = nodes.concat(viewPainel(c));
    else if (S.aba === 'edital') nodes = nodes.concat(viewEdital(c));
    else nodes = nodes.concat(viewMais(c));
    v.replaceChildren.apply(v, nodes);
    atualizarStatus();
    document.body.dataset.pronto = '1';
  }
  function irParaAba() { S.aba = abaDoHash(); render(); window.scrollTo(0, 0); }

  async function usar(nome) {
    try {
      if (!window.claude || !window.claude.use) return null;
      return await Promise.race([window.claude.use(nome), new Promise(function (r) { setTimeout(function () { r(null); }, 10000); })]);
    } catch (e) { return null; }
  }
  function comTempo(p, ms) { return new Promise(function (res, rej) { var t = setTimeout(function () { rej({ code: 'tempo_esgotado', message: 'tempo esgotado' }); }, ms); p.then(function (v) { clearTimeout(t); res(v); }, function (e) { clearTimeout(t); rej(e); }); }); }

  async function iniciar() {
    S.aba = abaDoHash();
    try {
      if (!S.matriz) { var resp = await fetch('matriz-edital.json'); if (!resp.ok) throw new Error('HTTP ' + resp.status); S.matriz = await resp.json(); indexar(); }
    } catch (e) { $('view').replaceChildren(h('section', { class: 'card erro-bloco' }, h('p', { class: 'note' }, 'Não foi possível carregar o edital (' + ((e && e.message) || e) + ').'))); return; }
    carregarAux();
    var db = await usar('db'); var user = await usar('user'); S.dl = await usar('downloads');
    S.uid = user ? await user.id() : null;
    if (!db || !S.uid) { S.semBanco = true; render(); return; }
    S.store = Store.criarStore({ db: db, uid: S.uid, storage: LS });
    S.store.onStatus(atualizarStatus);
    try { await comTempo(S.store.carregar(), 20000); } catch (e) { S.store = null; S.erroCarga = e; render(); return; }
    render();
  }

  window.addEventListener('hashchange', irParaAba);
  document.addEventListener('visibilitychange', function () {
    if (!S.store) return;
    if (document.visibilityState === 'hidden') S.store.flush();
    else S.store.sincronizar().then(function () { var a = document.activeElement; if (!a || a === document.body) render(); }, function () { /* sem conexão: tenta na próxima vez */ });
  });
  window.addEventListener('pagehide', function () { if (S.store) S.store.flush(); });
  setInterval(atualizarCronometro, 1000);
  iniciar();
})();

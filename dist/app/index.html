2. No caso do art. 110 deste Código, a prescrição começa a correr:\nI - do dia em que transita em julgado a sentença condenatória, para a acusação, ou a que revoga a suspensão condicional da pena ou o livramento condicional;\nII - do dia em que se interrompe a execução, salvo quando o tempo da interrupção deva computar-se na pena."},"113":{"topicId":"OJ26-DPEN-CP-03","texto":"Art. 113. No caso de evadir-se o condenado ou de revogar-se o livramento condicional, a prescrição é regulada pelo tempo que resta da pena."},"114":{"topicId":"OJ26-DPEN-CP-03","texto":"Art. 114. A prescrição da pena de multa ocorrerá:\nI - em dois anos, quando a multa for a única cominada ou aplicada;\nII - no mesmo prazo estabelecido para prescrição da pena privativa de liberdade, quando a multa for alternativa ou cumulativamente cominada ou cumulativamente aplicada."},"115":{"topicId":"OJ26-DPEN-CP-03","texto":"Art. 115. São reduzidos de metade os prazos de prescrição quando o criminoso era, ao tempo do crime, menor de 21 (vinte e um) anos ou, na data da sentença, maior de 70 (setenta) anos, salvo se o crime envolver violência sexual contra a mulher."},"116":{"topicId":"OJ26-DPEN-CP-03","texto":"Art. 116. Antes de passar em julgado a sentença final, a prescrição não corre:\nI - enquanto não resolvida, em outro processo, questão de que dependa o reconhecimento da existência do crime;\nII - enquanto o agente cumpre pena no exterior;\nIII - na pendência de embargos de declaração ou de recursos aos Tribunais Superiores, quando inadmissíveis; e\nIV - enquanto não cumprido ou não rescindido o acordo de não persecução penal.\nParágrafo único. Depois de passada em julgado a sentença condenatória, a prescrição não corre durante o tempo em que o condenado está preso por outro motivo."},"117":{"topicId":"OJ26-DPEN-CP-03","texto":"Art. 117. O curso da prescrição interrompe-se:\nI - pelo recebimento da denúncia ou da queixa;\nII - pela pronúncia;\nIII - pela decisão confirmatória da pronúncia;\nIV - pela publicação da sentença ou acórdão condenatórios recorríveis;\nV - pelo início ou continuação do cumprimento da pena;\nVI - pela reincidência.\n§ 1º Excetuados os casos dos incisos V e VI deste artigo, a interrupção da prescrição produz efeitos relativamente a todos os autores do crime. Nos crimes conexos, que sejam objeto do mesmo processo, estende-se aos demais a interrupção relativa a qualquer deles.\n§ 2º Interrompida a prescrição, salvo a hipótese do inciso V deste artigo, todo o prazo começa a correr, novamente, do dia da interrupção."},"118":{"topicId":"OJ26-DPEN-CP-03","texto":"Art. 118. As penas mais leves prescrevem com as mais graves."},"119":{"topicId":"OJ26-DPEN-CP-03","texto":"Art. 119. No caso de concurso de crimes, a extinção da punibilidade incidirá sobre a pena de cada um, isoladamente."},"120":{"topicId":"OJ26-DPEN-CP-03","texto":"Art. 120. A sentença que conceder perdão judicial não será considerada para efeitos de reincidência.\n(Canceladas na Parte Especial quaisquer referências a valores de multas, substituindo-se a expressão \"multa de\" por \"multa\", de acordo com o art. 2º da Lei nº 7.209, de 11/7/1984, publicada no DOU de 13/7/1984, em vigor 6 meses após a publicação)"},"121":{"topicId":"OJ26-DPEN-CP-03","texto":"Art. 121. Matar alguém:\nPena - reclusão, de seis a vinte anos.\n§ 1º Se o agente comete o crime impelido por motivo de relevante valor social ou moral, ou sob o domínio de violenta emoção, logo em seguida a injusta provocação da vítima, o juiz pode reduzir a pena de um sexto a um terço.\n§ 2º Se o homicídio é cometido:\nI - mediante paga ou promessa de recompensa, ou por outro motivo torpe;\nII - por motivo fútil;\nIII - com emprego de veneno, fogo, explosivo, asfixia, tortura ou outro meio insidioso ou cruel, ou de que possa resultar perigo comum;\nIV - à traição, de emboscada, ou mediante dissimulação ou outro recurso que dificulte ou torne impossível a defesa do ofendido;\nV - para assegurar a execução, a ocultação, a impunidade ou vantagem de outro crime;\nVI - (Inciso acrescido pela Lei nº 13.104, de 9/3/2015 , e revogado pela Lei nº 14.994, de 9/10/2024)\nVII - contra:\na) autoridade ou agente descrito nos arts. 142 e 144 da Constituição Federal, integrantes do sistema prisional e da Força Nacional de Segurança Pública, no exercício da função ou em decorrência dela, ou contra seu cônjuge, companheiro ou parente consanguíneo até o terceiro grau, em razão dessa condição;\nb) membro do Poder Judiciário, do Ministério Público, da Defensoria Pública ou da Advocacia Pública, de que tratam os arts. 131 e 132 da Constituição Federal, ou oficial de justiça, no exercício da função ou em decorrência dela, ou contra seu cônjuge, companheiro ou parente, inclusive por afinidade, até o terceiro grau, em razão dessa condição;\nVIII - com emprego de arma de fogo de uso restrito ou proibido: (Inciso vetado pelo Presidente da República na Lei nº 13.964, de 24/12/2019, mantido pelo Congresso Nacional e publicado no DOU de 30/4/2021)\nIX - contra menor de 14 (quatorze) anos:\nX - nas dependências de instituição de ensino:\nPena - reclusão, de doze a trinta anos.\n§ 2º -A. (Parágrafo acrescido pela Lei nº 13.104, de 9/3/2015 , e revogado pela Lei nº 14.994, de 9/10/2024)\n§ 2º -B. A pena do homicídio contra menor de 14 (quatorze) anos é aumentada de:\nI - 1/3 (um terço) até a metade se a vítima é pessoa com deficiência ou com doença que implique o aumento de sua vulnerabilidade;\nII - 2/3 (dois terços) se o autor é ascendente, padrasto ou madrasta, tio, irmão, cônjuge, companheiro, tutor, curador, preceptor ou empregador da vítima ou por qualquer outro título tiver autoridade sobre ela.\nIII - 2/3 (dois terços) se o crime for praticado em instituição de educação básica pública ou privada.\n§ 2º-C. A pena do homicídio cometido nas dependências de instituição de ensino é aumentada de:\nI - 1/3 (um terço) até a metade se a vítima é pessoa com deficiência ou com doença que acarrete condição limitante ou de vulnerabilidade física ou mental;\nII - 2/3 (dois terços) se o autor é ascendente, padrasto ou madrasta, tio, irmão, cônjuge, companheiro, tutor, curador, preceptor ou empregador da vítima ou por qualquer outro título tem autoridade sobre ela ou, ainda, se é professor ou funcionário da instituição de ensino.\n§ 2º-D. Se o homicídio doloso é cometido por integrante de organização criminosa ultraviolenta, grupo paramilitar ou milícia privada, no contexto da atuação ou para a consecução das condutas previstas no art. 2º da lei que institui o marco legal do combate ao crime organizado no Brasil.\nPena - reclusão, de 20 (vinte) a 40 (quarenta anos).\n§ 3º Se o homicídio é culposo:\nPena - detenção, de um a três anos.\n§ 4º No homicídio culposo, a pena é aumentada de 1/3 (um terço), se o crime resulta de inobservância de regra técnica de profissão, arte ou ofício, ou se o agente deixa de prestar imediato socorro à vítima, não procura diminuir as conseqüências do seu ato, ou foge para evitar prisão em flagrante. Sendo doloso o homicídio, a pena é aumentada de 1/3 (um terço) se o crime é praticado contra pessoa menor de 14 (quatorze) ou maior de 60 (sessenta) anos.\n§ 5º Na hipótese de homicídio culposo, o juiz poderá deixar de aplicar a pena, se as conseqüências da infração atingiram o próprio agente de forma tão grave que a sanção penal se torne desnecessária.\n§ 6º A pena é aumentada de 1/3 (um terço) até a metade se o crime for praticado por milícia privada, sob o pretexto de prestação de serviço de segurança, ou por grupo de extermínio.\n§ 7º (Parágrafo acrescido pela Lei nº 13.104, de 9/3/2015 , e revogado pela Lei nº 14.994, de 9/10/2024)"},"129":{"topicId":"OJ26-DPEN-CP-04","texto":"Art. 129. Ofender a integridade corporal ou a saúde de outrem:\nPena - detenção, de três meses a um ano.\n§ 1º Se resulta:\nI - Incapacidade para as ocupações habituais, por mais de trinta dias;\nII - perigo de vida;\nIII - debilidade permanente de membro, sentido ou função;\nIV - aceleração de parto:\nPena - reclusão, de um a cinco anos.\n§ 2º Se resulta:\nI - Incapacidade permanente para o trabalho;\nII - enfermidade incurável;\nIII- perda ou inutilização de membro, sentido ou função; (Retificado no DOU de 3/1/1941)\nIV - deformidade permanente;\nV - aborto:\nPena - reclusão, de dois a oito anos.\n§ 3º Se resulta morte e as circunstâncias evidenciam que o agente não quis o resultado, nem assumiu o risco de produzi-lo:\nPena - reclusão, de quatro a doze anos.\n§ 3º-A. No crime previsto no § 3º deste artigo, se cometido no contexto da atuação ou para a consecução das condutas previstas no art. 2º da lei que institui o marco legal do combate ao crime organizado no Brasil:\nPena - reclusão, de 20 (vinte) a 40 (quarenta) anos.\n§ 4º Se o agente comete o crime impelido por motivo de relevante valor social ou moral ou sob o domínio de violenta emoção, logo em seguida a injusta provocação da vítima, o juiz pode reduzir a pena de um sexto a um terço.\n§ 5º O juiz, não sendo graves as lesões, pode ainda substituir a pena de detenção pela de multa:\nI - se ocorre qualquer das hipóteses do parágrafo anterior;\nII - se as lesões são recíprocas.\n§ 6º Se a lesão é culposa:\nPena - detenção, de dois meses a um ano.\n§ 7º Aumenta-se a pena de 1/3 (um terço) se ocorrer qualquer das hipóteses dos §§ 4º e 6º do art. 121 deste Código.\n§ 8º Aplica-se à lesão culposa o disposto no § 5º do art. 121. (Parágrafo acrescido pela Lei nº 6.416, de 24/5/1977, e com redação dada pela Lei nº 8.069, de 13/7/1990, publicada no DOU de 16/7/1990, em vigor 90 dias após a publicação\n§ 8º-A. Com exceção do disposto no § 3º-A deste artigo, aumenta-se a pena em 2/3 (dois terços) se a lesão é praticada por integrante de organização criminosa ultraviolenta, grupo paramilitar ou milícia privada, no contexto da atuação ou para a consecução das condutas previstas no art. 2º da lei que institui o marco legal do combate ao crime organizado no Brasil.\n§ 9º Se a lesão for praticada contra ascendente, descendente, irmão, cônjuge ou companheiro, pessoa com relação de trabalho doméstico ou com quem conviva ou tenha convivido, ou, ainda, prevalecendo-se o agente das relações domésticas, de trabalho doméstico, de coabitação ou de hospitalidade:\nPena - reclusão, de 2 (dois) a 5 (cinco) anos.\n§ 10. Nos casos previstos nos §§ 1º a 3º deste artigo, se as circunstâncias são as indicadas no § 9º deste artigo, aumenta-se a pena em 1/3 (um terço).\n§ 11. Na hipótese do § 9º deste artigo, a pena será aumentada de um terço se o crime for cometido contra pessoa portadora de deficiência.\n§ 12. Aumenta-se a pena de:\nI - 1/3 (um terço) a 2/3 (dois terços) se a lesão dolosa for praticada:\na) contra autoridade ou agente descrito nos arts. 142 e 144 da Constituição Federal ou integrantes do sistema prisional ou da Força Nacional de Segurança Pública, no exercício da função ou em decorrência dela, ou contra seu cônjuge, companheiro ou parente consanguíneo até terceiro grau, em razão dessa condição;\nb) contra membro do Poder Judiciário, do Ministério Público, da Defensoria Pública ou da Advocacia Pública, de que tratam os arts. 131 e 132 da Constituição Federal, ou oficial de justiça, no exercício da função ou em decorrência dela, ou contra seu cônjuge, companheiro ou parente, inclusive por afinidade, até o terceiro grau, em razão dessa condição; ou\nc) nas dependências de instituição de ensino;\nII - 2/3 (dois terços) ao dobro se a lesão dolosa for praticada nas dependências de instituição de ensino e:\na) a vítima for pessoa com deficiência ou com doença que acarrete condição limitante ou de vulnerabilidade física ou mental; ou\nb) o autor for ascendente, padrasto ou madrasta, tio, irmão, cônjuge, companheiro, tutor, curador, preceptor ou empregador da vítima ou por qualquer outro título tiver autoridade sobre ela ou, ainda, for professor ou funcionário da instituição de ensino.\n§ 13. Se a lesão é praticada contra a mulher, por razões da condição do sexo feminino, nos termos do § 1º do art. 121-A deste Código:"},"150":{"topicId":"OJ26-DPEN-CP-05","texto":"Art. 150. Entrar ou permanecer, clandestina ou astuciosamente, ou contra a vontade expressa ou tácita de quem de direito, em casa alheia ou em suas dependências:\nPena - detenção, de um a três meses, ou multa.\n§ 1º Se o crime é cometido durante a noite, ou em lugar ermo, ou com o emprego de violência ou de arma, ou por duas ou mais pessoas:\nPena - detenção, de seis meses a dois anos, além da pena correspondente à violência.\n§ 2º (Revogado pela Lei nº 13.869, de 5/9/2019, publicada no DOU Edição Extra de 5/9/2019, em vigor 120 dias após a publicação)\n§ 3º Não constitui crime a entrada ou permanência em casa alheia ou em suas dependências:\nI - durante o dia, com observância das formalidades legais, para efetuar prisão ou outra diligência;\nII - a qualquer hora do dia ou da noite, quando algum crime está sendo ali praticado ou na iminência de o ser.\n§ 4º A expressão \"casa\" compreende:\nI - qualquer compartimento habitado;\nII - aposento ocupado de habitação coletiva;\nIII - compartimento não aberto ao público, onde alguém exerce profissão ou atividade.\n§ 5º Não se compreendem na expressão \"casa\":\nI - hospedaria, estalagem ou qualquer outra habitação coletiva, enquanto aberta, salvo a restrição do n º II do parágrafo anterior;\nII - taverna, casa de jogo e outras do mesmo gênero."},"154":{"topicId":"OJ26-DPEN-CP-06","texto":"Art. 154. Revelar alguém, sem justa causa, segredo, de que tem ciência em razão de função, ministério, ofício ou profissão, e cuja revelação possa produzir dano a outrem:\nPena - detenção, de três meses a um ano, ou multa.\nParágrafo único. Somente se procede mediante representação."},"293":{"topicId":"OJ26-DPEN-CP-07","texto":"Art. 293. Falsificar, fabricando-os ou alterando-os:\nI - selo destinado a controle tributário, papel selado ou qualquer papel de emissão legal destinado à arrecadação de tributo;\nII - papel de crédito público que não seja moeda de curso legal;\nIII - vale postal;\nIV - cautela de penhor, caderneta de depósito de caixa econômica ou de outro estabelecimento mantido por entidade de direito público;\nV - talão, recibo, guia, alvará ou qualquer outro documento relativo a arrecadação de rendas públicas ou a depósito ou caução por que o poder público seja responsável;\nVI - bilhete, passe ou conhecimento de empresa de transporte administrada pela União, por Estado ou por Município:\nPena - reclusão, de dois a oito anos, e multa.\n§ 1º Incorre na mesma pena quem:\nI - usa, guarda, possui ou detém qualquer dos papéis falsificados a que se refere este artigo;\nII - importa, exporta, adquire, vende, troca, cede, empresta, guarda, fornece ou restitui à circulação selo falsificado destinado a controle tributário;\nIII - importa, exporta, adquire, vende, expõe à venda, mantém em depósito, guarda, troca, cede, empresta, fornece, porta ou, de qualquer forma, utiliza em proveito próprio ou alheio, no exercício de atividade comercial ou industrial, produto ou mercadoria:\na) em que tenha sido aplicado selo que se destine a controle tributário, falsificado;\nb) sem selo oficial, nos casos em que a legislação tributária determina a obrigatoriedade de sua aplicação.\n§ 2º Suprimir, em qualquer desses papéis, quando legítimos, com o fim de torná-los novamente utilizáveis, carimbo ou sinal indicativo de sua inutilização:\nPena - reclusão, de um a quatro anos, e multa.\n§ 3º Incorre na mesma pena quem usa, depois de alterado, qualquer dos papéis a que se refere o parágrafo anterior.\n§ 4º Quem usa ou restitui à circulação, embora recebido de boa fé, qualquer dos papeis falsificados ou alterados, a que se referem este artigo e o seu § 2º , depois de conhecer a falsidade ou alteração, incorre na pena de detenção, de seis meses a dois anos, ou multa.\n§ 5º Equipara-se a atividade comercial, para os fins do inciso III do § 1º , qualquer forma de comércio irregular ou clandestino, inclusive o exercido em vias, praças ou outros logradouros públicos e em residências."},"294":{"topicId":"OJ26-DPEN-CP-07","texto":"Art. 294. Fabricar, adquirir, fornecer, possuir ou guardar objeto especialmente destinado à falsificação de qualquer dos papéis referidos no artigo anterior:\nPena - reclusão, de um a três anos, e multa."},"295":{"topicId":"OJ26-DPEN-CP-07","texto":"Art. 295. Se o agente é funcionário público, e comete o crime prevalecendo-se do cargo, aumenta-se a pena de sexta parte."},"296":{"topicId":"OJ26-DPEN-CP-07","texto":"Art. 296. Falsificar, fabricando-os ou alterando-os:\nI - selo público destinado a autenticar atos oficiais da União, de Estado ou de Município;\nII - selo ou sinal atribuído por lei a entidade de direito público, ou a autoridade, ou sinal público de tabelião:\nPena - reclusão, de dois a seis anos, e multa.\n§ 1º Incorre nas mesmas penas:\nI - quem faz uso do selo ou sinal falsificado;\nII - quem utiliza indevidamente o selo ou sinal verdadeiro em prejuízo de outrem ou em proveito próprio ou alheio;\nIII - quem altera, falsifica ou faz uso indevido de marcas, logotipos, siglas ou quaisquer outros símbolos utilizados ou identificadores de órgãos ou entidades da Administração Pública.\n§ 2º Se o agente é funcionário público, e comete o crime prevalecendo-se do cargo, aumenta-se a pena de sexta parte."},"297":{"topicId":"OJ26-DPEN-CP-07","texto":"Art. 297. Falsificar, no todo ou em parte, documento público, ou alterar documento público verdadeiro:\nPena - reclusão, de dois a seis anos, e multa.\n§ 1º Se o agente é funcionário público, e comete o crime prevalecendo-se do cargo, aumenta-se a pena de sexta parte.\n§ 2º Para os efeitos penais, equiparam-se a documento público o emanado de entidade paraestatal, o título ao portador ou transmissível por endosso, as ações de sociedade comercial, os livros mercantis e o testamento particular.\n§ 3º Nas mesmas penas incorre quem insere ou faz inserir:\nI - na folha de pagamento ou em documento de informações que seja destinado a fazer prova perante a previdência social, pessoa que não possua a qualidade de segurado obrigatório;\nII - na Carteira de Trabalho e Previdência Social do empregado ou em documento que deva produzir efeito perante a previdência social, declaração falsa ou diversa da que deveria ter sido escrita;\nIII - em documento contábil ou em qualquer outro documento relacionado com as obrigações da empresa perante a previdência social, declaração falsa ou diversa da que deveria ter constado.\n§ 4º Nas mesmas penas incorre quem omite, nos documentos mencionados no § 3º , nome do segurado e seus dados pessoais, a remuneração, a vigência do contrato de trabalho ou de prestação de serviços."},"298":{"topicId":"OJ26-DPEN-CP-07","texto":"Art. 298. Falsificar, no todo ou em parte, documento particular ou alterar documento particular verdadeiro:\nPena - reclusão, de um a cinco anos, e multa.\nParágrafo único. Para fins do disposto no caput , equipara-se a documento particular o cartão de crédito ou débito."},"299":{"topicId":"OJ26-DPEN-CP-07","texto":"Art. 299. Omitir, em documento público ou particular, declaração que dele devia constar, ou nele inserir ou fazer inserir declaração falsa ou diversa da que devia ser escrita, com o fim de prejudicar direito, criar obrigação ou alterar a verdade sobre fato juridicamente relevante:\nPena - reclusão, de um a cinco anos, e multa, se o documento é público, e reclusão, de um a três anos, e multa, se o documento é particular.\nParágrafo único. Se o agente é funcionário público, e comete o crime prevalecendo-se do cargo, ou se a falsificação ou alteração é de assentamento de registo civil, aumenta-se a pena de sexta parte."},"300":{"topicId":"OJ26-DPEN-CP-07","texto":"Art. 300. Reconhecer, como verdadeira, no exercício de função pública, firma ou letra que o não seja:\nPena - reclusão, de um a cinco anos, e multa, se o documento é público; e de um a três anos, e multa, se o documento é particular."},"301":{"topicId":"OJ26-DPEN-CP-07","texto":"Art. 301. Atestar ou certificar falsamente, em razão de função pública, fato ou circunstância que habilite alguém a obter cargo público, isenção de ônus ou de serviço de caráter público, ou qualquer outra vantagem:\nPena - detenção, de dois meses a um ano.\n§ 1º Falsificar, no todo ou em parte, atestado ou certidão, ou alterar o teor de certidão ou de atestado verdadeiro, para prova de fato ou circunstância que habilite alguém a obter cargo público, isenção de ônus ou de serviço de caráter público, ou qualquer outra vantagem:\nPena - detenção, de três meses a dois anos.\n§ 2º Se o crime é praticado com o fim de lucro, aplica-se, além da pena privativa de liberdade, a de multa."},"302":{"topicId":"OJ26-DPEN-CP-07","texto":"Art. 302. Dar o médico, no exercício da sua profissão, atestado falso:\nPena - detenção, de um mês a um ano.\nParágrafo único. Se o crime é cometido com o fim de lucro, aplica-se também multa."},"303":{"topicId":"OJ26-DPEN-CP-07","texto":"Art. 303. Reproduzir ou alterar selo ou peça filatélica que tenha valor para coleção, salvo quando a reprodução ou a alteração está visivelmente anotada na face ou no verso do selo ou peça:\nPena - detenção, de um a três anos, e multa.\nParágrafo único. Na mesma pena incorre quem, para fins de comércio, faz uso do selo ou peça filatélica."},"304":{"topicId":"OJ26-DPEN-CP-07","texto":"Art. 304. Fazer uso de qualquer dos papéis falsificados ou alterados, a que se referem os artigos 297 a 302:\nPena - a cominada à falsificação ou à alteração."},"305":{"topicId":"OJ26-DPEN-CP-07","texto":"Art. 305. Destruir, suprimir ou ocultar, em benefício próprio ou de outrem, ou em prejuízo alheio, documento público ou particular verdadeiro, de que não podia dispor:\nPena - reclusão, de dois a seis anos, e multa, se o documento é público, e reclusão, de um a cinco anos, e multa, se o documento é particular.\nFalsificação do sinal empregado no contraste de metal precioso ou na fiscalização alfandegária, ou para outros fins"},"307":{"topicId":"OJ26-DPEN-CP-08","texto":"Art. 307. Atribuir-se ou atribuir a terceiro falsa identidade para obter vantagem, em proveito próprio ou alheio, ou para causar dano a outrem:\nPena - detenção, de três meses a um ano, ou multa, se o fato não constitui elementos de crime mais grave."},"308":{"topicId":"OJ26-DPEN-CP-09","texto":"Art. 308. Usar, como próprio, passaporte, título de eleitor, caderneta de reservista ou qualquer documento de identidade alheia ou ceder a outrem, para que dele se utilize, documento dessa natureza, próprio ou de terceiro:\nPena - detenção, de quatro meses a dois anos, e multa, se o fato não constitui elemento de crime mais grave."},"311":{"topicId":"OJ26-DPEN-CP-10","texto":"Art. 311. Adulterar, remarcar ou suprimir número de chassi, monobloco, motor, placa de identificação, ou qualquer sinal identificador de veículo automotor, elétrico, híbrido, de reboque, de semirreboque ou de suas combinações, bem como de seus componentes ou equipamentos, sem autorização do órgão competente:\nPena - reclusão, de três a seis anos, e multa.\n§ 1º Se o agente comete o crime no exercício da função pública ou em razão dela, a pena é aumentada de um terço.\n§ 2º Incorrem nas mesmas penas do caput deste artigo:\nI - o funcionário público que contribui para o licenciamento ou registro do veículo remarcado ou adulterado, fornecendo indevidamente material ou informação oficial;\nII - aquele que adquire, recebe, transporta, oculta, mantém em depósito, fabrica, fornece, a título oneroso ou gratuito, possui ou guarda maquinismo, aparelho, instrumento ou objeto especialmente destinado à falsificação e/ou adulteração de que trata o caput deste artigo; ou\nIII - aquele que adquire, recebe, transporta, conduz, oculta, mantém em depósito, desmonta, monta, remonta, vende, expõe à venda, ou de qualquer forma utiliza, em proveito próprio ou alheio, veículo automotor, elétrico, híbrido, de reboque, semirreboque ou suas combinações ou partes, com número de chassi ou monobloco, placa de identificação ou qualquer sinal identificador veicular que devesse saber estar adulterado ou remarcado.\n§ 3º Praticar as condutas de que tratam os incisos II ou III do § 2º deste artigo no exercício de atividade comercial ou industrial:\nPena - reclusão, de 4 (quatro) a 8 (oito) anos, e multa.\n§ 4º Equipara-se a atividade comercial, para efeito do disposto no § 3º deste artigo, qualquer forma de comércio irregular ou clandestino, inclusive aquele exercido em residência."},"312":{"topicId":"OJ26-DPEN-CP-11","texto":"Art. 312. Apropriar-se o funcionário público de dinheiro, valor ou qualquer outro bem móvel, público ou particular, de que tem a posse em razão do cargo, ou desviá-lo, em proveito próprio ou alheio:\nPena - reclusão, de dois a doze anos, e multa.\n§ 1º Aplica-se a mesma pena, se o funcionário público, embora não tendo a posse do dinheiro, valor ou bem, o subtrai, ou concorre para que seja subtraído, em proveito próprio ou alheio, valendo-se de facilidade que lhe proporciona a qualidade de funcionário.\n§ 2º Se o funcionário concorre culposamente para o crime de outrem:\nPena - detenção, de três meses a um ano.\n§ 3º No caso do parágrafo anterior, a reparação do dano, se precede a sentença irrecorrível, extingue a punibilidade; se lhe é posterior, reduz de metade a pena imposta."},"313":{"topicId":"OJ26-DPEN-CP-11","texto":"Art. 313. Apropriar-se de dinheiro ou qualquer utilidade que, no exercício do cargo, recebeu por erro de outrem:\nPena - reclusão, de um a quatro anos, e multa."},"314":{"topicId":"OJ26-DPEN-CP-11","texto":"Art. 314. Extraviar livro oficial ou qualquer documento, de que tem a guarda em razão do cargo; sonegá-lo ou inutilizá-lo, total ou parcialmente:\nPena - reclusão, de um a quatro anos, se o fato não constitui crime mais grave."},"315":{"topicId":"OJ26-DPEN-CP-11","texto":"Art. 315. Dar às verbas ou rendas públicas aplicação diversa da estabelecida em lei:\nPena - detenção, de um a três meses, ou multa."},"316":{"topicId":"OJ26-DPEN-CP-11","texto":"Art. 316. Exigir, para si ou para outrem, direta ou indiretamente, ainda que fora da função ou antes de assumi-la, mas em razão dela, vantagem indevida:\nPena - reclusão, de 2 (dois) a 12 (doze) anos, e multa.\n§ 1º Se o funcionário exige tributo ou contribuição social que sabe ou deveria saber indevido, ou, quando devido, emprega na cobrança meio vexatório ou gravoso, que a lei não autoriza:\nPena - reclusão, de 3 (três) a 8 (oito) anos, e multa.\n§ 2º Se o funcionário desvia, em proveito próprio ou de outrem, o que recebeu indevidamente para recolher aos cofres públicos:\nPena - reclusão, de dois a doze anos, e multa."},"317":{"topicId":"OJ26-DPEN-CP-11","texto":"Art. 317. Solicitar ou receber, para si ou para outrem, direta ou indiretamente, ainda que fora da função ou antes de assumi-la, mas em razão dela, vantagem indevida, ou aceitar promessa de tal vantagem:\nPena - reclusão, de 2 (dois) a 12 (doze) anos, e multa.\n§ 1º A pena é aumentada de um terço, se, em conseqüência da vantagem ou promessa, o funcionário retarda ou deixa de praticar qualquer ato de ofício ou o pratica infringindo dever funcional.\n§ 2º Se o funcionário pratica, deixa de praticar ou retarda ato de ofício, com infração de dever funcional, cedendo a pedido ou influência de outrem:\nPena - detenção, de três meses a um ano, ou multa."},"319":{"topicId":"OJ26-DPEN-CP-12","texto":"Art. 319. Retardar ou deixar de praticar, indevidamente, ato de ofício, ou praticá-lo contra disposição expressa de lei, para satisfazer interesse ou sentimento pessoal:\nPena - detenção, de três meses a um ano, e multa."},"320":{"topicId":"OJ26-DPEN-CP-12","texto":"Art. 320. Deixar o funcionário, por indulgência, de responsabilizar subordinado que cometeu infração no exercício do cargo ou, quando lhe falte competência, não levar o fato ao conhecimento da autoridade competente:\nPena - detenção, de quinze dias a um mês, ou multa."},"321":{"topicId":"OJ26-DPEN-CP-12","texto":"Art. 321. Patrocinar, direta ou indiretamente, interesse privado perante a administração pública, valendo-se da qualidade de funcionário:\nPena - detenção de um a três meses, ou multa.\nParágrafo único. Se o interesse é ilegítimo:\nPena - detenção de três meses a um ano, além da multa."},"322":{"topicId":"OJ26-DPEN-CP-12","texto":"Art. 322. Praticar violência, no exercício de função ou a pretexto de exercê-la:\nPena - detenção, de seis meses a três anos, além da pena correspondente à violência."},"323":{"topicId":"OJ26-DPEN-CP-12","texto":"Art. 323. Abandonar cargo público, fora dos casos permitidos em lei:\nPena - detenção, de quinze dias a um mês, ou multa.\n§ 1º Se do fato resulta prejuízo público:\nPena - detenção, de três meses a um ano, e multa.\n§ 2º Se o fato ocorre em lugar compreendido na faixa de fronteira:\nPena - detenção de um a três anos, e multa."},"324":{"topicId":"OJ26-DPEN-CP-12","texto":"Art. 324. Entrar no exercício de função pública antes de satisfeitas as exigências legais, ou continuar a exercê-la, sem autorização, depois de saber oficialmente que foi exonerado, removido, substituído ou suspenso:\nPena - detenção, de quinze dias a um mês, ou multa."},"325":{"topicId":"OJ26-DPEN-CP-12","texto":"Art. 325. Revelar fato de que tem ciência em razão do cargo e que deva permanecer em segredo, ou facilitar-lhe a revelação:\nPena - detenção, de seis meses a dois anos, ou multa, se o fato não constitui crime mais grave.\n§ 1º Nas mesmas penas deste artigo incorre quem:\nI - permite ou facilita, mediante atribuição, fornecimento e empréstimo de senha ou qualquer outra forma, o acesso de pessoas não autorizadas a sistemas de informações ou banco de dados da Administração Pública;\nII - se utiliza, indevidamente, do acesso restrito.\n§ 2º Se da ação ou omissão resulta dano à Administração Pública ou a outrem:\nPena - reclusão, de 2 (dois) a 6 (seis) anos, e multa."},"326":{"topicId":"OJ26-DPEN-CP-12","texto":"Art. 326. Devassar o sigilo de proposta de concorrência pública, ou proporcionar a terceiro o ensejo de devassá-lo:\nPena - detenção, de três meses um ano, e multa."},"327":{"topicId":"OJ26-DPEN-CP-12","texto":"Art. 327. Considera-se funcionário público, para os efeitos penais, quem, embora transitoriamente ou sem remuneração, exerce cargo, emprego ou função pública.\n§ 1º Equipara-se a funcionário público quem exerce cargo, emprego ou função em entidade paraestatal, e quem trabalha para empresa prestadora de serviço contratada ou conveniada para a execução de atividade típica da Administração Pública.\n§ 2º A pena será aumentada da terça parte quando os autores dos crimes previstos neste capítulo forem ocupantes de cargos em comissão ou de função de direção ou assessoramento de órgão da administração direta, sociedade de economia mista, empresa pública ou fundação instituída pelo poder público."},"328":{"topicId":"OJ26-DPEN-CP-12","texto":"Art. 328. Usurpar o exercício de função pública:\nPena - detenção, de três meses a dois anos, e multa.\nParágrafo único. Se do fato o agente aufere vantagem:\nPena - reclusão, de dois a cinco anos, e multa."},"329":{"topicId":"OJ26-DPEN-CP-12","texto":"Art. 329. Opor-se à execução de ato legal, mediante violência ou ameaça a funcionário competente para executá-lo ou a quem lhe esteja prestando auxílio:\nPena - detenção, de dois meses a dois anos.\n§ 1º Se o ato, em razão da resistência, não se executa:\nPena - reclusão, de um a três anos.\n§ 2º As penas deste artigo são aplicáveis sem prejuízo das correspondentes à violência."},"330":{"topicId":"OJ26-DPEN-CP-12","texto":"Art. 330. Desobedecer a ordem legal de funcionário público:\nPena - detenção, de quinze dias a seis meses, e multa."},"331":{"topicId":"OJ26-DPEN-CP-12","texto":"Art. 331. Desacatar funcionário público no exercício da função ou em razão dela:\nPena - detenção, de seis meses a dois anos, ou multa."},"332":{"topicId":"OJ26-DPEN-CP-12","texto":"Art. 332. Solicitar, exigir, cobrar ou obter, para si ou para outrem, vantagem ou promessa de vantagem, a pretexto de influir em ato praticado por funcionário público no exercício da função.\nPena - Reclusão, de dois a cinco anos, e multa.\nParágrafo único. A pena é aumentada da metade, se o agente alega ou insinua que a vantagem é também destinada ao funcionário."},"333":{"topicId":"OJ26-DPEN-CP-12","texto":"Art. 333. Oferecer ou prometer vantagem indevida a funcionário público, para determiná-lo a praticar, omitir ou retardar ato de ofício:\nPena - reclusão, de 2 (dois) a 12 (doze) anos, e multa.\nParágrafo único. A pena é aumentada de um terço, se, em razão da vantagem ou promessa, o funcionário retarda ou omite ato de ofício, ou o pratica infringindo dever funcional."},"336":{"topicId":"OJ26-DPEN-CP-13","texto":"Art. 336. Rasgar ou, de qualquer forma inutilizar ou conspurcar edital afixado por ordem de funcionário público; violar ou inutilizar selo ou sinal empregado, por determinação legal ou por ordem de funcionário público, para identificar ou cerrar qualquer objeto:\nPena - detenção, de um mês a um ano, ou multa."},"337":{"topicId":"OJ26-DPEN-CP-14","texto":"Art. 337. Subtrair, ou inutilizar, total ou parcialmente, livro oficial, processo ou documento confiado à custódia de funcionário, em razão de ofício, ou de particular em serviço público:\nPena - reclusão, de dois a cinco anos, se o fato não constitui crime grave."},"339":{"topicId":"OJ26-DPEN-CP-15","texto":"Art. 339. Dar causa à instauração de inquérito policial, de procedimento investigatório criminal, de processo judicial, de processo administrativo disciplinar, de inquérito civil ou de ação de improbidade administrativa contra alguém, imputando-lhe crime, infração ético-disciplinar ou ato ímprobo de que o sabe inocente:\nPena - reclusão, de dois a oito anos, e multa.\n§ 1º A pena é aumentada de sexta parte, se o agente se serve de anonimato ou de nome suposto.\n§ 2º A pena é diminuída de metade, se a imputação é de prática de contravenção."},"340":{"topicId":"OJ26-DPEN-CP-15","texto":"Art. 340. Provocar a ação de autoridade, comunicando-lhe a ocorrência de crime ou de contravenção que sabe não se ter verificado:\nPena - detenção, de um a seis meses, ou multa."},"341":{"topicId":"OJ26-DPEN-CP-15","texto":"Art. 341. Acusar-se, perante a autoridade, de crime inexistente ou praticado por outrem:\nPena - detenção, de três meses a dois anos, ou multa."},"342":{"topicId":"OJ26-DPEN-CP-15","texto":"Art. 342. Fazer afirmação falsa, ou negar ou calar a verdade, como testemunha, perito, contador, tradutor ou intérprete em processo judicial, ou administrativo, inquérito policial, ou em juízo arbitral:\nPena - reclusão, de 2 (dois) a 4 (quatro) anos, e multa.\n§ 1º As penas aumentam-se de um sexto a um terço, se o crime é praticado mediante suborno ou se cometido com o fim de obter prova destinada a produzir efeito em processo penal, ou em processo civil em que for parte entidade da administração pública direta ou indireta.\n§ 2º O fato deixa de ser punível se, antes da sentença no processo em que ocorreu o ilícito, o agente se retrata ou declara a verdade."},"343":{"topicId":"OJ26-DPEN-CP-15","texto":"Art. 343. Dar, oferecer ou prometer dinheiro ou qualquer outra vantagem a testemunha, perito, contador, tradutor ou intérprete, para fazer afirmação falsa, negar ou calar a verdade em depoimento, perícia, cálculos, tradução ou interpretação:\nPena - reclusão, de três a quatro anos, e multa.\nParágrafo único. As penas aumentam-se de um sexto a um terço, se o crime é cometido com o fim de obter prova destinada a produzir efeito em processo penal ou em processo civil em que for parte entidade da administração pública direta ou indireta."},"344":{"topicId":"OJ26-DPEN-CP-15","texto":"Art. 344. Usar de violência ou grave ameaça, com o fim de favorecer interesse próprio ou alheio, contra autoridade, parte, ou qualquer outra pessoa que funciona ou é chamada a intervir em processo judicial, policial ou administrativo, ou em juízo arbitral:\nPena - reclusão, de um a quatro anos, e multa, além da pena correspondente à violência.\nParágrafo único. A pena aumenta-se de 1/3 (um terço) até a metade se o processo envolver crime contra a dignidade sexual."},"345":{"topicId":"OJ26-DPEN-CP-15","texto":"Art. 345. Fazer justiça pelas próprias mãos, para satisfazer pretensão, embora legítima, salvo quando a lei o permite:\nPena - detenção, de quinze dias a um mês, ou multa, além da pena correspondente à violência.\nParágrafo único. Se não há emprego de violência, somente se procede mediante queixa."},"346":{"topicId":"OJ26-DPEN-CP-15","texto":"Art. 346. Tirar, suprimir, destruir ou danificar coisa própria, que se acha em poder de terceiro por determinação judicial ou convenção:\nPena - detenção, de seis meses a dois anos, e multa."},"347":{"topicId":"OJ26-DPEN-CP-15","texto":"Art. 347. Inovar artificiosamente, na pendência de processo civil ou administrativo, o estado de lugar, de coisa ou de pessoa, com o fim de induzir a erro o juiz ou o perito:\nPena - detenção, de três meses a dois anos, e multa.\nParágrafo único. Se a inovação se destina a produzir efeito em processo penal, ainda que não iniciado, as penas aplicam-se em dobro."},"357":{"topicId":"OJ26-DPEN-CP-16","texto":"Art. 357. Solicitar ou receber dinheiro ou qualquer outra utilidade, a pretexto de influir em juiz, jurado, órgão do ministério público, funcionário de justiça, perito, tradutor, intérprete ou testemunha:\nPena - reclusão, de um a cinco anos, e multa.\nParágrafo único. As penas aumentam-se de um terço, se o agente alega ou insinua que o dinheiro ou utilidade também se destina a qualquer das pessoas referidas neste artigo."},"359":{"topicId":"OJ26-DPEN-CP-17","texto":"Art. 359. Exercer função, atividade, direito, autoridade ou múnus, de que foi suspenso ou privado por decisão judicial:\nPena - detenção, de três meses a dois anos, ou multa."},"121-A":{"topicId":"OJ26-DPEN-CP-03","texto":"Art. 121-A. Matar mulher por razões da condição do sexo feminino:\nPena - reclusão, de 20 (vinte) a 40 (quarenta) anos.\n§ 1º Considera-se que há razões da condição do sexo feminino quando o crime envolve:\nI - violência doméstica e familiar;\nII - menosprezo ou discriminação à condição de mulher.\n§ 2º A pena do feminicídio é aumentada de 1/3 (um terço) até a metade se o crime é praticado:\nI - durante a gestação, nos 3 (três) meses posteriores ao parto ou se a vítima é a mãe ou a responsável por criança, adolescente ou pessoa com deficiência de qualquer idade;\nII - contra pessoa menor de 14 (catorze) anos, maior de 60 (sessenta) anos, com deficiência ou portadora de doenças degenerativas que acarretem condição limitante ou de vulnerabilidade física ou mental;\nIII - na presença física ou virtual de descendente ou de ascendente da vítima;\nIV - em descumprimento das medidas protetivas de urgência previstas nos incisos I, II e III do caput do art. 22 da Lei n º 11.340, de 7 de agosto de 2006 (Lei Maria da Penha);\nV - nas circunstâncias previstas nos incisos III, IV e VIII do § 2º do art. 121 deste Código.\n§ 3º Comunicam-se ao coautor ou partícipe as circunstâncias pessoais elementares do crime previstas no § 1º deste artigo."},"121-B":{"topicId":"OJ26-DPEN-CP-03","texto":"Art. 121-B. Matar descendente, ascendente, dependente, enteado ou pessoa sob guarda ou responsabilidade direta da mulher, com o fim específico de causar-lhe sofrimento, punição ou controle, no contexto de violência doméstica e familiar.\nPena - reclusão, de 20 (vinte) a 40 (quarenta) anos.\nParágrafo único. A pena do vicaricídio é aumentada de 1/3 (um terço) até a metade se o crime for praticado:\nI - na presença da mulher a quem se pretende causar sofrimento, punição ou controle;\nII - contra criança ou adolescente ou pessoa idosa ou com deficiência;\nIII - em descumprimento de medida protetiva de urgência."},"154-A":{"topicId":"OJ26-DPEN-CP-06","texto":"Art. 154-A. Invadir dispositivo informático de uso alheio, conectado ou não à rede de computadores, com o fim de obter, adulterar ou destruir dados ou informações sem autorização expressa ou tácita do usuário do dispositivo ou de instalar vulnerabilidades para obter vantagem ilícita:\nPena - reclusão, de 1 (um) a 4 (quatro) anos, e multa.\n§ 1º Na mesma pena incorre quem produz, oferece, distribui, vende ou difunde dispositivo ou programa de computador com o intuito de permitir a prática da conduta definida no caput .\n§ 2º Aumenta-se a pena de 1/3 (um terço) a 2/3 (dois terços) se da invasão resulta prejuízo econômico.\n§ 3º Se da invasão resultar a obtenção de conteúdo de comunicações eletrônicas privadas, segredos comerciais ou industriais, informações sigilosas, assim definidas em lei, ou o controle remoto não autorizado do dispositivo invadido:\nPena - reclusão, de 2 (dois) a 5 (cinco) anos, e multa.\n§ 4º Na hipótese do § 3º , aumenta-se a pena de um a dois terços se houver divulgação, comercialização ou transmissão a terceiro, a qualquer título, dos dados ou informações obtidos.\n§ 5º Aumenta-se a pena de um terço à metade se o crime for praticado contra:\nI - Presidente da República, governadores e prefeitos;\nII - Presidente do Supremo Tribunal Federal;\nIII - Presidente da Câmara dos Deputados, do Senado Federal, de Assembleia Legislativa de Estado, da Câmara Legislativa do Distrito Federal ou de Câmara Municipal; ou\nIV - dirigente máximo da administração direta e indireta federal, estadual, municipal ou do Distrito Federal."},"154-B":{"topicId":"OJ26-DPEN-CP-06","texto":"Art. 154-B. Nos crimes definidos no art. 154-A, somente se procede mediante representação, salvo se o crime é cometido contra a administração pública direta ou indireta de qualquer dos Poderes da União, Estados, Distrito Federal ou Municípios ou contra empresas concessionárias de serviços públicos."},"311-A":{"topicId":"OJ26-DPEN-CP-10","texto":"Art. 311-A. Utilizar ou divulgar, indevidamente, com o fim de beneficiar a si ou a outrem, ou de comprometer a credibilidade do certame, conteúdo sigiloso de:\nI - concurso público;\nII - avaliação ou exame públicos;\nIII - processo seletivo para ingresso no ensino superior; ou\nIV - exame ou processo seletivo previstos em lei:\nPena - reclusão, de 1 (um) a 4 (quatro) anos, e multa.\n§ 1º Nas mesmas penas incorre quem permite ou facilita, por qualquer meio, o acesso de pessoas não autorizadas às informações mencionadas no caput .\n§ 2º Se da ação ou omissão resulta dano à administração pública:\nPena - reclusão, de 2 (dois) a 6 (seis) anos, e multa.\n§ 3º Aumenta-se a pena de 1/3 (um terço) se o fato é cometido por funcionário público."},"313-A":{"topicId":"OJ26-DPEN-CP-11","texto":"Art. 313-A. Inserir ou facilitar, o funcionário autorizado, a inserção de dados falsos, alterar ou excluir indevidamente dados corretos nos sistemas informatizados ou bancos de dados da Administração Pública com o fim de obter vantagem indevida para si ou para outrem ou para causar dano;\nPena - reclusão, de 2 (dois) a 12 (doze) anos, e multa."},"313-B":{"topicId":"OJ26-DPEN-CP-11","texto":"Art. 313-B. Modificar ou alterar, o funcionário, sistema de informações ou programa de informática sem autorização ou solicitação de autoridade competente:\nPena - detenção, de 3 (três) meses a 2 (dois) anos, e multa.\nParágrafo único. As penas são aumentadas de um terço até a metade se da modificação ou alteração resulta dano para a Administração Pública ou para o administrado."},"319-A":{"topicId":"OJ26-DPEN-CP-12","texto":"Art. 319-A. Deixar o Diretor de Penitenciária e/ou agente público, de cumprir seu dever de vedar ao preso o acesso a aparelho telefônico, de rádio ou similar, que permita a comunicação com outros presos ou com o ambiente externo:\nPena: detenção, de 3 (três) meses a 1 (um) ano."},"337-A":{"topicId":"OJ26-DPEN-CP-14","texto":"Art. 337-A. Suprimir ou reduzir contribuição social previdenciária e qualquer acessório, mediante as seguintes condutas:\nI - omitir de folha de pagamento da empresa ou de documento de informações previsto pela legislação previdenciária segurados empregado, empresário, trabalhador avulso ou trabalhador autônomo ou a este equiparado que lhe prestem serviços;\nII - deixar de lançar mensalmente nos títulos próprios da contabilidade da empresa as quantias descontadas dos segurados ou as devidas pelo empregador ou pelo tomador de serviços;\nIII - omitir, total ou parcialmente, receitas ou lucros auferidos, remunerações pagas ou creditadas e demais fatos geradores de contribuições sociais previdenciárias:\nPena - reclusão, de 2 (dois) a 5 (cinco) anos, e multa.\n§ 1º É extinta a punibilidade se o agente, espontaneamente, declara e confessa as contribuições, importâncias ou valores e presta as informações devidas à previdência social, na forma definida em lei ou regulamento, antes do início da ação fiscal.\n§ 2º É facultado ao juiz deixar de aplicar a pena ou aplicar somente a de multa se o agente for primário e de bons antecedentes, desde que:\nI - (VETADO)\nII - o valor das contribuições devidas, inclusive acessórios, seja igual ou inferior àquele estabelecido pela previdência social administrativamente, como sendo o mínimo para o ajuizamento de suas execuções fiscais.\n§ 3º Se o empregador não é pessoa jurídica e sua folha de pagamento mensal não ultrapassa R$ 1.510,00 (um mil, quinhentos e dez reais), o juiz poderá reduzir a pena de um terço até a metade ou aplicar apenas a de multa.\n§ 4º O valor a que se refere o parágrafo anterior será reajustado nas mesmas datas e nos mesmos índices do reajuste dos benefícios da previdência social.\n§ 5º A extinção de punibilidade de que trata o § 1º deste artigo não se aplica ao agente declarado devedor contumaz em decisão administrativa definitiva e inscrito no Cadastro Informativo dos créditos não quitados do setor público federal (Cadin), previsto na Lei nº 10.522, de 19 de julho de 2002.\n§ 6º O fato de o agente deixar de ser considerado devedor contumaz não afasta o disposto no § 5º deste artigo em relação aos atos praticados no período em que era assim considerado."},"337-B":{"topicId":"OJ26-DPEN-CP-14","texto":"Art. 337-B. Prometer, oferecer ou dar, direta ou indiretamente, vantagem indevida a funcionário público estrangeiro, ou a terceira pessoa, para determiná-lo a praticar, omitir ou retardar ato de ofício relacionado à transação comercial internacional:\nPena - reclusão, de 1 (um) a 8 (oito) anos, e multa.\nParágrafo único. A pena é aumentada de 1/3 (um terço), se, em razão da vantagem ou promessa, o funcionário público estrangeiro retarda ou omite o ato de ofício, ou o pratica infringindo dever funcional."},"337-C":{"topicId":"OJ26-DPEN-CP-14","texto":"Art. 337-C. Solicitar, exigir, cobrar ou obter, para si ou para outrem, direta ou indiretamente, vantagem ou promessa de vantagem a pretexto de influir em ato praticado por funcionário público estrangeiro no exercício de suas funções, relacionado a transação comercial internacional:\nPena - reclusão, de 2 (dois) a 5 (cinco) anos, e multa.\nParágrafo único. A pena é aumentada da metade, se o agente alega ou insinua que a vantagem é também destinada a funcionário estrangeiro."},"337-D":{"topicId":"OJ26-DPEN-CP-14","texto":"Art. 337-D. Considera-se funcionário público estrangeiro, para os efeitos penais, quem, ainda que transitoriamente ou sem remuneração, exerce cargo, emprego ou função pública em entidades estatais ou em representações diplomáticas de país estrangeiro.\nParágrafo único. Equipara-se a funcionário público estrangeiro quem exerce cargo, emprego ou função em empresas controladas, diretamente ou indiretamente, pelo Poder Público de país estrangeiro ou em organizações públicas internacionais ."},"337-E":{"topicId":"OJ26-DPEN-CP-14","texto":"Art. 337-E. Admitir, possibilitar ou dar causa à contratação direta fora das hipóteses previstas em lei:\nPena - reclusão, de 4 (quatro) a 8 (oito) anos, e multa."},"337-F":{"topicId":"OJ26-DPEN-CP-14","texto":"Art. 337-F. Frustrar ou fraudar, com o intuito de obter para si ou para outrem vantagem decorrente da adjudicação do objeto da licitação, o caráter competitivo do processo licitatório:\nPena - reclusão, de 4 (quatro) anos a 8 (oito) anos, e multa."},"337-G":{"topicId":"OJ26-DPEN-CP-14","texto":"Art. 337-G. Patrocinar, direta ou indiretamente, interesse privado perante a Administração Pública, dando causa à instauração de licitação ou à celebração de contrato cuja invalidação vier a ser decretada pelo Poder Judiciário:\nPena - reclusão, de 6 (seis) meses a 3 (três) anos, e multa."},"337-H":{"topicId":"OJ26-DPEN-CP-14","texto":"Art. 337-H. Admitir, possibilitar ou dar causa a qualquer modificação ou vantagem, inclusive prorrogação contratual, em favor do contratado, durante a execução dos contratos celebrados com a Administração Pública, sem autorização em lei, no edital da licitação ou nos respectivos instrumentos contratuais, ou, ainda, pagar fatura com preterição da ordem cronológica de sua exigibilidade:\nPena - reclusão, de 4 (quatro) anos a 8 (oito) anos, e multa."},"337-I":{"topicId":"OJ26-DPEN-CP-14","texto":"Art. 337-I. Impedir, perturbar ou fraudar a realização de qualquer ato de processo licitatório:\nPena - detenção, de 6 (seis) meses a 3 (três) anos, e multa."},"337-J":{"topicId":"OJ26-DPEN-CP-14","texto":"Art. 337-J. Devassar o sigilo de proposta apresentada em processo licitatório ou proporcionar a terceiro o ensejo de devassá-lo:\nPena - detenção, de 2 (dois) anos a 3 (três) anos, e multa."},"337-K":{"topicId":"OJ26-DPEN-CP-14","texto":"Art. 337-K. Afastar ou tentar afastar licitante por meio de violência, grave ameaça, fraude ou oferecimento de vantagem de qualquer tipo:\nPena - reclusão, de 3 (três) anos a 5 (cinco) anos, e multa, além da pena correspondente à violência.\nParágrafo único. Incorre na mesma pena quem se abstém ou desiste de licitar em razão de vantagem oferecida."},"337-L":{"topicId":"OJ26-DPEN-CP-14","texto":"Art. 337-L. Fraudar, em prejuízo da Administração Pública, licitação ou contrato dela decorrente, mediante:\nI - entrega de mercadoria ou prestação de serviços com qualidade ou em quantidade diversas das previstas no edital ou nos instrumentos contratuais;\nII - fornecimento, como verdadeira ou perfeita, de mercadoria falsificada, deteriorada, inservível para consumo ou com prazo de validade vencido;\nIII - entrega de uma mercadoria por outra;\nIV - alteração da substância, qualidade ou quantidade da mercadoria ou do serviço fornecido;\nV - qualquer meio fraudulento que torne injustamente mais onerosa para a Administração Pública a proposta ou a execução do contrato:\nPena - reclusão, de 4 (quatro) anos a 8 (oito) anos, e multa."},"337-M":{"topicId":"OJ26-DPEN-CP-14","texto":"Art. 337-M. Admitir à licitação empresa ou profissional declarado inidôneo:\nPena - reclusão, de 1 (um) ano a 3 (três) anos, e multa.\n§ 1º Celebrar contrato com empresa ou profissional declarado inidôneo:\nPena - reclusão, de 3 (três) anos a 6 (seis) anos, e multa.\n§ 2º Incide na mesma pena do caput deste artigo aquele que, declarado inidôneo, venha a participar de licitação e, na mesma pena do § 1º deste artigo, aquele que, declarado inidôneo, venha a contratar com a Administração Pública."},"337-N":{"topicId":"OJ26-DPEN-CP-14","texto":"Art. 337-N. Obstar, impedir ou dificultar injustamente a inscrição de qualquer interessado nos registros cadastrais ou promover indevidamente a alteração, a suspensão ou o cancelamento de registro do inscrito:\nPena - reclusão, de 6 (seis) meses a 2 (dois) anos, e multa."},"337-O":{"topicId":"OJ26-DPEN-CP-14","texto":"Art. 337-O. Omitir, modificar ou entregar à Administração Pública levantamento cadastral ou condição de contorno em relevante dissonância com a realidade, em frustração ao caráter competitivo da licitação ou em detrimento da seleção da proposta mais vantajosa para a Administração Pública, em contratação para a elaboração de projeto básico, projeto executivo ou anteprojeto, em diálogo competitivo ou em procedimento de manifestação de interesse:\nPena - reclusão, de 6 (seis) meses a 3 (três) anos, e multa.\n§ 1º Consideram-se condição de contorno as informações e os levantamentos suficientes e necessários para a definição da solução de projeto e dos respectivos preços pelo licitante, incluídos sondagens, topografia, estudos de demanda, condições ambientais e demais elementos ambientais impactantes, considerados requisitos mínimos ou obrigatórios em normas técnicas que orientam a elaboração de projetos.\n§ 2º Se o crime é praticado com o fim de obter benefício, direto ou indireto, próprio ou de outrem, aplica-se em dobro a pena prevista no caput deste artigo."},"337-P":{"topicId":"OJ26-DPEN-CP-14","texto":"Art. 337-P. A pena de multa cominada aos crimes previstos neste Capítulo seguirá a metodologia de cálculo prevista neste Código e não poderá ser inferior a 2% (dois por cento) do valor do contrato licitado ou celebrado com contratação direta."},"359-A":{"topicId":"OJ26-DPEN-CP-17","texto":"Art. 359-A. Ordenar, autorizar ou realizar operação de crédito, interno ou externo, sem prévia autorização legislativa:\nPena - reclusão, de 1 (um) a 2 (dois) anos.\nParágrafo único. Incide na mesma pena quem ordena, autoriza ou realiza operação de crédito, interno ou externo:\nI - com inobservância de limite, condição ou montante estabelecido em lei ou em resolução do Senado Federal;\nII - quando o montante da dívida consolidada ultrapassa o limite máximo autorizado por lei."},"359-B":{"topicId":"OJ26-DPEN-CP-17","texto":"Art. 359-B. Ordenar ou autorizar a inscrição em restos a pagar, de despesa que não tenha sido previamente empenhada ou que exceda limite estabelecido em lei:\nPena - detenção, de 6 (seis) meses a 2 (dois) anos."},"359-C":{"topicId":"OJ26-DPEN-CP-17","texto":"Art. 359-C. Ordenar ou autorizar a assunção de obrigação, nos dois últimos quadrimestres do último ano do mandato ou legislatura, cuja despesa não possa ser paga no mesmo exercício financeiro ou, caso reste parcela a ser paga no exercício seguinte, que não tenha contrapartida suficiente de disponibilidade de caixa:\nPena - reclusão, de 1 (um) a 4 (quatro) anos."},"359-D":{"topicId":"OJ26-DPEN-CP-17","texto":"Art. 359-D. Ordenar despesa não autorizada por lei:\nPena - reclusão, de 1 (um) a 4 (quatro) anos."},"359-E":{"topicId":"OJ26-DPEN-CP-17","texto":"Art. 359-E. Prestar garantia em operação de crédito sem que tenha sido constituída contragarantia em valor igual ou superior ao valor da garantia prestada, na forma da lei:\nPena - detenção, de 3(três) meses a 1 (um) ano."},"359-F":{"topicId":"OJ26-DPEN-CP-17","texto":"Art. 359-F. Deixar de ordenar, de autorizar ou de promover o cancelamento do montante de restos a pagar inscrito em valor superior ao permitido em lei:\nPena - detenção, de 6 (seis) meses a 2 (dois) anos."},"359-G":{"topicId":"OJ26-DPEN-CP-17","texto":"Art. 359-G. Ordenar, autorizar ou executar ato que acarrete aumento de despesa total com pessoal, nos cento e oitenta dias anteriores ao final do mandato ou da legislatura:\nPena - reclusão, de 1 (um) a 4 (quatro) anos."},"359-H":{"topicId":"OJ26-DPEN-CP-17","texto":"Art. 359-H. Ordenar, autorizar ou promover a oferta pública ou a colocação no mercado financeiro de títulos da dívida pública sem que tenham sido criados por lei ou sem que estejam registrados em sistema centralizado de liquidação e de custódia:\nPena - reclusão, de 1 (um) a 4 (quatro) anos."},"359-I":{"topicId":"OJ26-DPEN-CP-17","texto":"Art. 359-I. Negociar com governo ou grupo estrangeiro, ou seus agentes, com o fim de provocar atos típicos de guerra contra o País ou invadi-lo:\nPena - reclusão, de 3 (três) a 8 (oito) anos.\n§ 1º Aumenta-se a pena de metade até o dobro, se declarada guerra em decorrência das condutas previstas no caput deste artigo.\n§ 2º Se o agente participa de operação bélica com o fim de submeter o território nacional, ou parte dele, ao domínio ou à soberania de outro país:\nPena - reclusão, de 4 (quatro) a 12 (doze) anos."},"359-J":{"topicId":"OJ26-DPEN-CP-17","texto":"Art. 359-J. Praticar violência ou grave ameaça com a finalidade de desmembrar parte do território nacional para constituir país independente:\nPena - reclusão, de 2 (dois) a 6 (seis) anos, além da pena correspondente à violência."},"359-K":{"topicId":"OJ26-DPEN-CP-17","texto":"Art. 359-K. Entregar a governo estrangeiro, a seus agentes, ou a organização criminosa estrangeira, em desacordo com determinação legal ou regulamentar, documento ou informação classificados como secretos ou ultrassecretos nos termos da lei, cuja revelação possa colocar em perigo a preservação da ordem constitucional ou a soberania nacional:\nPena - reclusão, de 3 (três) a 12 (doze) anos.\n§ 1º Incorre na mesma pena quem presta auxílio a espião, conhecendo essa circunstância, para subtraí-lo à ação da autoridade pública.\n§ 2º Se o documento, dado ou informação é transmitido ou revelado com violação do dever de sigilo:\nPena - reclusão, de 6 (seis) a 15 (quinze) anos.\n§ 3º Facilitar a prática de qualquer dos crimes previstos neste artigo mediante atribuição, fornecimento ou empréstimo de senha, ou de qualquer outra forma de acesso de pessoas não autorizadas a sistemas de informações:\nPena - detenção, de 1 (um) a 4 (quatro) anos.\n§ 4º Não constitui crime a comunicação, a entrega ou a publicação de informações ou de documentos com o fim de expor a prática de crime ou a violação de direitos humanos."},"359-L":{"topicId":"OJ26-DPEN-CP-17","texto":"Art. 359-L. Tentar, com emprego de violência ou grave ameaça, abolir o Estado Democrático de Direito, impedindo ou restringindo o exercício dos poderes constitucionais:\nPena - reclusão, de 4 (quatro) a 8 (oito) anos, além da pena correspondente à violência."},"359-M":{"topicId":"OJ26-DPEN-CP-17","texto":"Art. 359-M. Tentar depor, por meio de violência ou grave ameaça, o governo legitimamente constituído:\nPena - reclusão, de 4 (quatro) a 12 (doze) anos, além da pena correspondente à violência."},"359-N":{"topicId":"OJ26-DPEN-CP-17","texto":"Art. 359-N. Impedir ou perturbar a eleição ou a aferição de seu resultado, mediante violação indevida de mecanismos de segurança do sistema eletrônico de votação estabelecido pela Justiça Eleitoral:\nPena - reclusão, de 3 (três) a 6 (seis) anos, e multa.\n(VETADO na Lei nº 14.197, de 1º/9/2021)"},"359-O":{"topicId":"OJ26-DPEN-CP-17","texto":"Art. 359-O. (VETADO na Lei nº 14.197, de 1º/9/2021)"},"359-P":{"topicId":"OJ26-DPEN-CP-17","texto":"Art. 359-P. Restringir, impedir ou dificultar, com emprego de violência física, sexual ou psicológica, o exercício de direitos políticos a qualquer pessoa em razão de seu sexo, raça, cor, etnia, religião ou procedência nacional:\nPena - reclusão, de 3 (três) a 6 (seis) anos, e multa, além da pena correspondente à violência.\n(VETADO na Lei nº 14.197, de 1º/9/2021)"},"359-Q":{"topicId":"OJ26-DPEN-CP-17","texto":"Art. 359-Q. (VETADO na Lei nº 14.197, de 1º/9/2021)"},"359-R":{"topicId":"OJ26-DPEN-CP-17","texto":"Art. 359-R. Destruir ou inutilizar meios de comunicação ao público, estabelecimentos, instalações ou serviços destinados à defesa nacional, com o fim de abolir o Estado Democrático de Direito:\nPena - reclusão, de 2 (dois) a 8 (oito) anos.\n(VETADO na Lei nº 14.197, de 1º/9/2021)"},"359-T":{"topicId":"OJ26-DPEN-CP-17","texto":"Art. 359-T. Não constitui crime previsto neste Título a manifestação crítica aos poderes constitucionais nem a atividade jornalística ou a reivindicação de direitos e garantias constitucionais por meio de passeatas, de reuniões, de greves, de aglomerações ou de qualquer outra forma de manifestação política com propósitos sociais.\n(VETADO na Lei nº 14.197, de 1º/9/2021)"},"359-U":{"topicId":"OJ26-DPEN-CP-17","texto":"Art. 359-U. (VETADO na Lei nº 14.197, de 1º/9/2021)"}}},"senado-cf-1988":{"id":"DIR-DCON-CF","concordancia":true,"nome":"Constituição Federal","rotulo":"da Constituição Federal de 1988","titulo":"Direito: Constituição Federal","disciplina":"DCON","url":"https://normas.leg.br/api/public/normas?urn=urn:lex:br:federal:constituicao:1988-10-05;1988&&tipo_documento=maior-detalhe","consultado_em":"2026-11-21","sha256":"21d69cf0a84d91a90ce51265fecaeed776500e808f728cc1bf114f445d59008c","observacao":"Texto consolidado do Senado reconstruído na data de referência do edital (14/10/2026). A própria fonte informa atualização até 2026-10-16: alterações posteriores a essa data podem não constar.","artigos":{"1":{"topicId":"OJ26-DCON-CF-01","texto":"Art. 1º A República Federativa do Brasil, formada pela união indissolúvel dos Estados e Municípios e do Distrito Federal, constitui-se em Estado democrático de direito e tem como fundamentos:\nI - a soberania;\nII - a cidadania;\nIII - a dignidade da pessoa humana;\nIV - os valores sociais do trabalho e da livre iniciativa;\nV - o pluralismo político.\nParágrafo único. Todo o poder emana do povo, que o exerce por meio de representantes eleitos ou diretamente, nos termos desta Constituição .\n- Os débitos de natureza alimentícia compreendem aqueles decorrentes da relação laboral ou previdenciária, independentemente da sua natureza tributária, inclusive os oriundos de repetição de indébito incidente sobre remuneração ou proventos de aposentadoria, bem como indenizações por morte ou por invalidez, fundadas em responsabilidade civil, em virtude de sentença judicial transitada em julgado, e serão pagos com preferência sobre todos os demais débitos, exceto sobre aqueles referidos no § 2º deste artigo."},"2":{"topicId":"OJ26-DCON-CF-01","texto":"Art. 2º São Poderes da União, independentes e harmônicos entre si, o Legislativo, o Executivo e o Judiciário."},"3":{"topicId":"OJ26-DCON-CF-01","texto":"Art. 3º Constituem objetivos fundamentais da República Federativa do Brasil:\nI - construir uma sociedade livre, justa e solidária;\nII - garantir o desenvolvimento nacional;\nIII - erradicar a pobreza e a marginalização e reduzir as desigualdades sociais e regionais;\nIV - promover o bem de todos, sem preconceitos de origem, raça, sexo, cor, idade e quaisquer outras formas de discriminação."},"4":{"topicId":"OJ26-DCON-CF-01","texto":"Art. 4º A República Federativa do Brasil rege-se nas suas relações internacionais pelos seguintes princípios:\nI - independência nacional;\nII - prevalência dos direitos humanos;\nIII - autodeterminação dos povos;\nIV - não-intervenção;\nV - igualdade entre os Estados;\nVI - defesa da paz;\nVII - solução pacífica dos conflitos;\nVIII - repúdio ao terrorismo e ao racismo;\nIX - cooperação entre os povos para o progresso da humanidade;\nX - concessão de asilo político.\nParágrafo único. A República Federativa do Brasil buscará a integração econômica, política, social e cultural dos povos da América Latina, visando à formação de uma comunidade latino-americana de nações."},"5":{"topicId":"OJ26-DCON-CF-01","texto":"Art. 5º Todos são iguais perante a lei, sem distinção de qualquer natureza, garantindo-se aos brasileiros e aos estrangeiros residentes no País a inviolabilidade do direito à vida, à liberdade, à igualdade, à segurança e à propriedade, nos termos seguintes:\nI - homens e mulheres são iguais em direitos e obrigações, nos termos desta Constituição ;\nII - ninguém será obrigado a fazer ou deixar de fazer alguma coisa senão em virtude de lei;\nIII - ninguém será submetido a tortura nem a tratamento desumano ou degradante;\nIV - é livre a manifestação do pensamento, sendo vedado o anonimato;\nV - é assegurado o direito de resposta, proporcional ao agravo, além da indenização por dano material, moral ou à imagem;\nVI - é inviolável a liberdade de consciência e de crença, sendo assegurado o livre exercício dos cultos religiosos e garantida, na forma da lei, a proteção aos locais de culto e a suas liturgias;\nVII - é assegurada, nos termos da lei, a prestação de assistência religiosa nas entidades civis e militares de internação coletiva;\nVIII - ninguém será privado de direitos por motivo de crença religiosa ou de convicção filosófica ou política, salvo se as invocar para eximir-se de obrigação legal a todos imposta e recusar-se a cumprir prestação alternativa, fixada em lei;\nIX - é livre a expressão da atividade intelectual, artística, científica e de comunicação, independentemente de censura ou licença;\nX - são invioláveis a intimidade, a vida privada, a honra e a imagem das pessoas, assegurado o direito a indenização pelo dano material ou moral decorrente de sua violação;\nXI - a casa é asilo inviolável do indivíduo, ninguém nela podendo penetrar sem consentimento do morador, salvo em caso de flagrante delito ou desastre, ou para prestar socorro, ou, durante o dia, por determinação judicial;\nXII - é inviolável o sigilo da correspondência e das comunicações telegráficas, de dados e das comunicações telefônicas, salvo, no último caso, por ordem judicial, nas hipóteses e na forma que a lei estabelecer para fins de investigação criminal ou instrução processual penal;\nXIII - é livre o exercício de qualquer trabalho, ofício ou profissão, atendidas as qualificações profissionais que a lei estabelecer;\nXIV - é assegurado a todos o acesso à informação e resguardado o sigilo da fonte, quando necessário ao exercício profissional;\nXV - é livre a locomoção no território nacional em tempo de paz, podendo qualquer pessoa, nos termos da lei, nele entrar, permanecer ou dele sair com seus bens;\nXVI - todos podem reunir-se pacificamente, sem armas, em locais abertos ao público, independentemente de autorização, desde que não frustrem outra reunião anteriormente convocada para o mesmo local, sendo apenas exigido prévio aviso à autoridade competente;\nXVII - é plena a liberdade de associação para fins lícitos, vedada a de caráter paramilitar;\nXVIII - a criação de associações e, na forma da lei, a de cooperativas independem de autorização, sendo vedada a interferência estatal em seu funcionamento;\nXIX - as associações só poderão ser compulsoriamente dissolvidas ou ter suas atividades suspensas por decisão judicial, exigindo-se, no primeiro caso, o trânsito em julgado;\nXX - ninguém poderá ser compelido a associar-se ou a permanecer associado;\nXXI - as entidades associativas, quando expressamente autorizadas, têm legitimidade para representar seus filiados judicial ou extrajudicialmente;\nXXII - é garantido o direito de propriedade;\nXXIII - a propriedade atenderá a sua função social;\nXXIV - a lei estabelecerá o procedimento para desapropriação por necessidade ou utilidade pública, ou por interesse social, mediante justa e prévia indenização em dinheiro, ressalvados os casos previstos nesta Constituição ;\nXXV - no caso de iminente perigo público, a autoridade competente poderá usar de propriedade particular, assegurada ao proprietário indenização ulterior, se houver dano;\nXXVI - a pequena propriedade rural, assim definida em lei, desde que trabalhada pela família, não será objeto de penhora para pagamento de débitos decorrentes de sua atividade produtiva, dispondo a lei sobre os meios de financiar o seu desenvolvimento;\nXXVII - aos autores pertence o direito exclusivo de utilização, publicação ou reprodução de suas obras, transmissível aos herdeiros pelo tempo que a lei fixar;\nXXVIII - são assegurados, nos termos da lei:\na) a proteção às participações individuais em obras coletivas e à reprodução da imagem e voz humanas, inclusive nas atividades desportivas;\nb) o direito de fiscalização do aproveitamento econômico das obras que criarem ou de que participarem aos criadores, aos intérpretes e às respectivas representações sindicais e associativas;\nXXIX - a lei assegurará aos autores de inventos industriais privilégio temporário para sua utilização, bem como proteção às criações industriais, à propriedade das marcas, aos nomes de empresas e a outros signos distintivos, tendo em vista o interesse social e o desenvolvimento tecnológico e econômico do País;\nXXX - é garantido o direito de herança;\nXXXI - a sucessão de bens de estrangeiros situados no País será regulada pela lei brasileira em benefício do cônjuge ou dos filhos brasileiros, sempre que não lhes seja mais favorável a lei pessoal do de cujus;\nXXXII - o Estado promoverá, na forma da lei, a defesa do consumidor;\nXXXIII - todos têm direito a receber dos órgãos públicos informações de seu interesse particular, ou de interesse coletivo ou geral, que serão prestadas no prazo da lei, sob pena de responsabilidade, ressalvadas aquelas cujo sigilo seja imprescindível à segurança da sociedade e do Estado;\nXXXIV - são a todos assegurados, independentemente do pagamento de taxas:\na) o direito de petição aos poderes públicos em defesa de direitos ou contra ilegalidade ou abuso de poder;\nb) a obtenção de certidões em repartições públicas, para defesa de direitos e esclarecimento de situações de interesse pessoal;\nXXXV - a lei não excluirá da apreciação do Poder Judiciário lesão ou ameaça a direito;\nXXXVI - a lei não prejudicará o direito adquirido, o ato jurídico perfeito e a coisa julgada;\nXXXVII - não haverá juízo ou tribunal de exceção;\nXXXVIII - é reconhecida a instituição do júri, com a organização que lhe der a lei, assegurados:\na) a plenitude de defesa;\nb) o sigilo das votações;\nc) a soberania dos veredictos;\nd) a competência para o julgamento dos crimes dolosos contra a vida;\nXXXIX - não há crime sem lei anterior que o defina, nem pena sem prévia cominação legal;\nXL - a lei penal não retroagirá, salvo para beneficiar o réu;\nXLIII - a lei considerará crimes inafiançáveis e insuscetíveis de graça ou anistia a prática da tortura, o tráfico ilícito de entorpecentes e drogas afins, o terrorismo e os definidos como crimes hediondos, por eles respondendo os mandantes, os executores e os que, podendo evitá-los, se omitirem;\nXLIV - constitui crime inafiançável e imprescritível a ação de grupos armados, civis ou militares, contra a ordem constitucional e o Estado democrático;\nXLV - nenhuma pena passará da pessoa do condenado, podendo a obrigação de reparar o dano e a decretação do perdimento de bens ser, nos termos da lei, estendidas aos sucessores e contra eles executadas, até o limite do valor do patrimônio transferido;\nXLVI - a lei regulará a individualização da pena e adotará, entre outras, as seguintes:\na) privação ou restrição da liberdade;\nb) perda de bens;\nc) multa;\nd) prestação social alternativa;\ne) suspensão ou interdição de direitos;\nXLVII - não haverá penas:\na) de morte, salvo em caso de guerra declarada, nos termos do art. 84, XIX;\nb) de caráter perpétuo;\nc) de trabalhos forçados;\nd) de banimento;\ne) cruéis;\nXLVIII - a pena será cumprida em estabelecimentos distintos, de acordo com a natureza do delito, a idade e o sexo do apenado;\nXLIX - é assegurado aos presos o respeito à integridade física e moral;\nL - às presidiárias serão asseguradas condições para que possam permanecer com seus filhos durante o período de amamentação;\nLI - nenhum brasileiro será extraditado, salvo o naturalizado, em caso de crime comum, praticado antes da naturalização, ou de comprovado envolvimento em tráfico ilícito de entorpecentes e drogas afins, na forma da lei;\nLII - não será concedida extradição de estrangeiro por crime político ou de opinião;\nLIII - ninguém será processado nem sentenciado senão pela autoridade competente;\nLIV - ninguém será privado da liberdade ou de seus bens sem o devido processo legal;\nLV - aos litigantes, em processo judicial ou administrativo, e aos acusados em geral são assegurados o contraditório e a ampla defesa, com os meios e recursos a ela inerentes;\nLVI - são inadmissíveis, no processo, as provas obtidas por meios ilícitos;\nLVII - ninguém será considerado culpado até o trânsito em julgado de sentença penal condenatória;\nLVIII - o civilmente identificado não será submetido a identificação criminal, salvo nas hipóteses previstas em lei;\nLIX - será admitida ação privada nos crimes de ação pública, se esta não for intentada no prazo legal;\nLX - a lei só poderá restringir a publicidade dos atos processuais quando a defesa da intimidade ou o interesse social o exigirem;\nLXI - ninguém será preso senão em flagrante delito ou por ordem escrita e fundamentada de autoridade judiciária competente, salvo nos casos de transgressão militar ou crime propriamente militar, definidos em lei;\nLXII - a prisão de qualquer pessoa e o local onde se encontre serão comunicados imediatamente ao juiz competente e à família do preso ou à pessoa por ele indicada;\nLXIII - o preso será informado de seus direitos, entre os quais o de permanecer calado, sendo-lhe assegurada a assistência da família e de advogado;\nLXIV - o preso tem direito à identificação dos responsáveis por sua prisão ou por seu interrogatório policial;\nLXV - a prisão ilegal será imediatamente relaxada pela autoridade judiciária;\nLXVI - ninguém será levado à prisão ou nela mantido quando a lei admitir a liberdade provisória, com ou sem fiança;\nLXVII - não haverá prisão civil por dívida, salvo a do responsável pelo inadimplemento voluntário e inescusável de obrigação alimentícia e a do depositário infiel;\nLXVIII - conceder-se-á habeas corpus sempre que alguém sofrer ou se achar ameaçado de sofrer violência ou coação em sua liberdade de locomoção, por ilegalidade ou abuso de poder;\nLXIX - conceder-se-á mandado de segurança para proteger direito líquido e certo, não amparado por habeas corpus ou habeas data, quando o responsável pela ilegalidade ou abuso de poder for autoridade pública ou agente de pessoa jurídica no exercício de atribuições do poder público;\nLXX - o mandado de segurança coletivo pode ser impetrado por:\na) partido político com representação no Congresso Nacional;\nb) organização sindical, entidade de classe ou associação legalmente constituída e em funcionamento há pelo menos um ano, em defesa dos interesses de seus membros ou associados;\nLXXI - conceder-se-á mandado de injunção sempre que a falta de norma regulamentadora torne inviável o exercício dos direitos e liberdades constitucionais e das prerrogativas inerentes à nacionalidade, à soberania e à cidadania;\nLXXII - conceder-se-á habeas data:\na) para assegurar o conhecimento de informações relativas à pessoa do impetrante, constantes de registros ou bancos de dados de entidades governamentais ou de caráter público;\nb) para a retificação de dados, quando não se prefira fazê-lo por processo sigiloso, judicial ou administrativo;\nLXXIII - qualquer cidadão é parte legítima para propor ação popular que vise a anular ato lesivo ao patrimônio público ou de entidade de que o Estado participe, à moralidade administrativa, ao meio ambiente e ao patrimônio histórico e cultural, ficando o autor, salvo comprovada má-fé, isento de custas judiciais e do ônus da sucumbência;\nLXXIV - o Estado prestará assistência jurídica integral e gratuita aos que comprovarem insuficiência de recursos;\nLXXV - o Estado indenizará o condenado por erro judiciário, assim como o que ficar preso além do tempo fixado na sentença;\nLXXVI - são gratuitos para os reconhecidamente pobres, na forma da lei:\na) o registro civil de nascimento;\nb) a certidão de óbito;\nLXXVII - são gratuitas as ações de habeas corpus e habeas data, e, na forma da lei, os atos necessários ao exercício da cidadania.\nLXXVIII - a todos, no âmbito judicial e administrativo, são assegurados a razoável duração do processo e os meios que garantam a celeridade de sua tramitação;\nLXXIX - é assegurado, nos termos da lei, o direito à proteção dos dados pessoais, inclusive nos meios digitais.\n§ 1º As normas definidoras dos direitos e garantias fundamentais têm aplicação imediata.\n§ 2º Os direitos e garantias expressos nesta Constituição não excluem outros decorrentes do regime e dos princípios por ela adotados, ou dos tratados internacionais em que a República Federativa do Brasil seja parte.\n§ 3º Os tratados e convenções internacionais sobre direitos humanos que forem aprovados, em cada Casa do Congresso Nacional, em dois turnos, por três quintos dos votos dos respectivos membros, serão equivalentes às emendas constitucionais.\n§ 4º O Brasil se submete à jurisdição de Tribunal Penal Internacional a cuja criação tenha manifestado adesão."},"6":{"topicId":"OJ26-DCON-CF-01","texto":"Art. 6º São direitos sociais a educação, a saúde, a alimentação, o trabalho, a moradia, o transporte, o lazer, a segurança, a previdência social, a proteção à maternidade e à infância, a assistência aos desamparados, na forma desta Constituição.\nParágrafo único. Todo brasileiro em situação de vulnerabilidade social terá direito a uma renda básica familiar, garantida pelo poder público em programa permanente de transferência de renda, cujas normas e requisitos de acesso serão determinados em lei, observada a legislação fiscal e orçamentária."},"7":{"topicId":"OJ26-DCON-CF-01","texto":"Art. 7º São direitos dos trabalhadores urbanos e rurais, além de outros que visem à melhoria de sua condição social:\nI - relação de emprego protegida contra despedida arbitrária ou sem justa causa, nos termos de lei complementar, que preverá indenização compensatória, dentre outros direitos;\nII - seguro-desemprego, em caso de desemprego involuntário;\nIII - fundo de garantia do tempo de serviço;\nIV - salário mínimo, fixado em lei, nacionalmente unificado, capaz de atender às suas necessidades vitais básicas e às de sua família com moradia, alimentação, educação, saúde, lazer, vestuário, higiene, transporte e previdência social, com reajustes periódicos que lhe preservem o poder aquisitivo, sendo vedada sua vinculação para qualquer fim;\nV - piso salarial proporcional à extensão e à complexidade do trabalho;\nVI - irredutibilidade do salário, salvo o disposto em convenção ou acordo coletivo;\nVII - garantia de salário, nunca inferior ao mínimo, para os que percebem remuneração variável;\nVIII - décimo terceiro salário com base na remuneração integral ou no valor da aposentadoria;\nIX - remuneração do trabalho noturno superior à do diurno;\nXII - salário-família pago em razão do dependente do trabalhador de baixa renda nos termos da lei;\nXIII - duração do trabalho normal não superior a oito horas diárias e quarenta e quatro semanais, facultada a compensação de horários e a redução da jornada, mediante acordo ou convenção coletiva de trabalho;\nXIV - jornada de seis horas para o trabalho realizado em turnos ininterruptos de revezamento, salvo negociação coletiva;\nXV - repouso semanal remunerado, preferencialmente aos domingos;\nXVI - remuneração do serviço extraordinário superior, no mínimo, em cinqüenta por cento à do normal;\nXVII - gozo de férias anuais remuneradas com, pelo menos, um terço a mais do que o salário normal;\nXVIII - licença à gestante, sem prejuízo do emprego e do salário, com a duração de cento e vinte dias;\nXX - proteção do mercado de trabalho da mulher, mediante incentivos específicos, nos termos da lei;\nXXI - aviso prévio proporcional ao tempo de serviço, sendo no mínimo de trinta dias, nos termos da lei;\nXXII - redução dos riscos inerentes ao trabalho, por meio de normas de saúde, higiene e segurança;\nXXIV - aposentadoria;\nXXV - assistência gratuita aos filhos e dependentes desde o nascimento até 5 (cinco) anos de idade em creches e pré-escolas;\nXXVI - reconhecimento das convenções e acordos coletivos de trabalho;\nXXVIII - seguro contra acidentes de trabalho, a cargo do empregador, sem excluir a indenização a que este está obrigado, quando incorrer em dolo ou culpa;\nXXIX - ação, quanto aos créditos resultantes das relações de trabalho, com prazo prescricional de cinco anos para os trabalhadores urbanos e rurais, até o limite de dois anos após a extinção do contrato de trabalho;\nXXX - proibição de diferença de salários, de exercício de funções e de critério de admissão por motivo de sexo, idade, cor ou estado civil;\nXXXI - proibição de qualquer discriminação no tocante a salário e critérios de admissão do trabalhador portador de deficiência;\nXXXII - proibição de distinção entre trabalho manual, técnico e intele

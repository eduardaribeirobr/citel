ctual ou entre os profissionais respectivos;\nXXXIV - igualdade de direitos entre o trabalhador com vínculo empregatício permanente e o trabalhador avulso.\nParágrafo único. São assegurados à categoria dos trabalhadores domésticos os direitos previstos nos incisos IV, VI, VII, VIII, X, XIII, XV, XVI, XVII, XVIII, XIX, XXI, XXII, XXIV, XXVI, XXX, XXXI e XXXIII e, atendidas as condições estabelecidas em lei e observada a simplificação do cumprimento das obrigações tributárias, principais e acessórias, decorrentes da relação de trabalho e suas peculiaridades, os previstos nos incisos I, II, III, IX, XII, XXV e XXVIII, bem como a sua integração à previdência social."},"8":{"topicId":"OJ26-DCON-CF-01","texto":"Art. 8º É livre a associação profissional ou sindical, observado o seguinte:\nI - a lei não poderá exigir autorização do Estado para a fundação de sindicato, ressalvado o registro no órgão competente, vedadas ao poder público a interferência e a intervenção na organização sindical;\nII - é vedada a criação de mais de uma organização sindical, em qualquer grau, representativa de categoria profissional ou econômica, na mesma base territorial, que será definida pelos trabalhadores ou empregadores interessados, não podendo ser inferior à área de um Município;\nIII - ao sindicato cabe a defesa dos direitos e interesses coletivos ou individuais da categoria, inclusive em questões judiciais ou administrativas;\nIV - a assembléia geral fixará a contribuição que, em se tratando de categoria profissional, será descontada em folha, para custeio do sistema confederativo da representação sindical respectiva, independentemente da contribuição prevista em lei;\nV - ninguém será obrigado a filiar-se ou a manter-se filiado a sindicato;\nVI - é obrigatória a participação dos sindicatos nas negociações coletivas de trabalho;\nVII - o aposentado filiado tem direito a votar e ser votado nas organizações sindicais;\nVIII - é vedada a dispensa do empregado sindicalizado a partir do registro da candidatura a cargo de direção ou representação sindical e, se eleito, ainda que suplente, até um ano após o final do mandato, salvo se cometer falta grave nos termos da lei.\nParágrafo único. As disposições deste artigo aplicam-se à organização de sindicatos rurais e de colônias de pescadores, atendidas as condições que a lei estabelecer."},"9":{"topicId":"OJ26-DCON-CF-01","texto":"Art. 9º É assegurado o direito de greve, competindo aos trabalhadores decidir sobre a oportunidade de exercê-lo e sobre os interesses que devam por meio dele defender.\n§ 1º A lei definirá os serviços ou atividades essenciais e disporá sobre o atendimento das necessidades inadiáveis da comunidade.\n§ 2º Os abusos cometidos sujeitam os responsáveis às penas da lei."},"10":{"topicId":"OJ26-DCON-CF-01","texto":"Art. 10. É assegurada a participação dos trabalhadores e empregadores nos colegiados dos órgãos públicos em que seus interesses profissionais ou previdenciários sejam objeto de discussão e deliberação."},"11":{"topicId":"OJ26-DCON-CF-01","texto":"Art. 11. Nas empresas de mais de duzentos empregados, é assegurada a eleição de um representante destes com a finalidade exclusiva de promover-lhes o entendimento direto com os empregadores."},"12":{"topicId":"OJ26-DCON-CF-01","texto":"Art. 12. São brasileiros:\nI - natos:\na) os nascidos na República Federativa do Brasil, ainda que de pais estrangeiros, desde que estes não estejam a serviço de seu país;\nb) os nascidos no estrangeiro, de pai brasileiro ou de mãe brasileira, desde que qualquer deles esteja a serviço da República Federativa do Brasil;\nc) os nascidos no estrangeiro de pai brasileiro ou de mãe brasileira, desde que sejam registrados em repartição brasileira competente ou venham a residir na República Federativa do Brasil e optem, em qualquer tempo, depois de atingida a maioridade, pela nacionalidade brasileira;\nII - naturalizados:\na) os que, na forma da lei, adquiram a nacionalidade brasileira, exigidas aos originários de países de língua portuguesa apenas residência por um ano ininterrupto e idoneidade moral;\nb) os estrangeiros de qualquer nacionalidade, residentes na República Federativa do Brasil há mais de quinze anos ininterruptos e sem condenação penal, desde que requeiram a nacionalidade brasileira.\n§ 1º Aos portugueses com residência permanente no País, se houver reciprocidade em favor de brasileiros, serão atribuídos os direitos inerentes ao brasileiro, salvo os casos previstos nesta Constituição.\n§ 2º A lei não poderá estabelecer distinção entre brasileiros natos e naturalizados, salvo nos casos previstos nesta Constituição .\n§ 3º São privativos de brasileiro nato os cargos:\nI - de Presidente e Vice-Presidente da República;\nII - de Presidente da Câmara dos Deputados;\nIII - de Presidente do Senado Federal;\nIV - de Ministro do Supremo Tribunal Federal;\nV - da carreira diplomática;\nVI - de oficial das Forças Armadas;\nVII - de Ministro de Estado da Defesa.\n§ 4º Será declarada a perda da nacionalidade do brasileiro que:\nI - tiver cancelada sua naturalização, por sentença judicial, em virtude de fraude relacionada ao processo de naturalização ou de atentado contra a ordem constitucional e o Estado Democrático;\nII - fizer pedido expresso de perda da nacionalidade brasileira perante autoridade brasileira competente, ressalvadas situações que acarretem apatridia.\n§ 5º A renúncia da nacionalidade, nos termos do inciso II do § 4º deste artigo, não impede o interessado de readquirir sua nacionalidade brasileira originária, nos termos da lei."},"13":{"topicId":"OJ26-DCON-CF-01","texto":"Art. 13. A língua portuguesa é o idioma oficial da República Federativa do Brasil.\n§ 1º São símbolos da República Federativa do Brasil a bandeira, o hino, as armas e o selo nacionais.\n§ 2º Os Estados, o Distrito Federal e os Municípios poderão ter símbolos próprios."},"14":{"topicId":"OJ26-DCON-CF-01","texto":"Art. 14. A soberania popular será exercida pelo sufrágio universal e pelo voto direto e secreto, com valor igual para todos, e, nos termos da lei, mediante:\nI - plebiscito;\nII - referendo;\nIII - iniciativa popular.\n§ 1º O alistamento eleitoral e o voto são:\nI - obrigatórios para os maiores de dezoito anos;\nII - facultativos para:\na) os analfabetos;\nb) os maiores de setenta anos;\nc) os maiores de dezesseis e menores de dezoito anos.\n§ 2º Não podem alistar-se como eleitores os estrangeiros e, durante o período do serviço militar obrigatório, os conscritos.\n§ 3º São condições de elegibilidade, na forma da lei:\nI - a nacionalidade brasileira;\nII - o pleno exercício dos direitos políticos;\nIII - o alistamento eleitoral;\nIV - o domicílio eleitoral na circunscrição;\nV - a filiação partidária;\nVI - a idade mínima de:\na) trinta e cinco anos para Presidente e Vice-Presidente da República e Senador;\nb) trinta anos para Governador e Vice-Governador de Estado e do Distrito Federal;\nc) vinte e um anos para Deputado Federal, Deputado Estadual ou Distrital, Prefeito, Vice-Prefeito e juiz de paz;\nd) dezoito anos para Vereador.\n§ 4º São inelegíveis os inalistáveis e os analfabetos.\n§ 5º O Presidente da República, os Governadores de Estado e do Distrito Federal, os Prefeitos e quem os houver sucedido ou substituído no curso dos mandatos poderão ser reeleitos para um único período subseqüente.\n§ 6º Para concorrerem a outros cargos, o Presidente da República, os Governadores de Estado e do Distrito Federal e os Prefeitos devem renunciar aos respectivos mandatos até seis meses antes do pleito.\n§ 7º São inelegíveis, no território de jurisdição do titular, o cônjuge e os parentes consangüíneos ou afins, até o segundo grau ou por adoção, do Presidente da República, de Governador de Estado ou Território, do Distrito Federal, de Prefeito ou de quem os haja substituído dentro dos seis meses anteriores ao pleito, salvo se já titular de mandato eletivo e candidato à reeleição.\n§ 8º O militar alistável é elegível, atendidas as seguintes condições:\nI - se contar menos de dez anos de serviço, deverá afastar-se da atividade;\nII - se contar mais de dez anos de serviço, será agregado pela autoridade superior e, se eleito, passará automaticamente, no ato da diplomação, para a inatividade.\n§ 9º Lei complementar estabelecerá outros casos de inelegibilidade e os prazos de sua cessação, a fim de proteger a probidade administrativa, a moralidade para o exercício do mandato, considerada a vida pregressa do candidato, e a normalidade e legitimidade das eleições contra a influência do poder econômico ou o abuso do exercício de função, cargo ou emprego na administração direta ou indireta.\n§ 10. O mandato eletivo poderá ser impugnado ante a Justiça Eleitoral no prazo de quinze dias contados da diplomação, instruída a ação com provas de abuso do poder econômico, corrupção ou fraude.\n§ 11. A ação de impugnação de mandato tramitará em segredo de justiça, respondendo o autor, na forma da lei, se temerária ou de manifesta má-fé.\n§ 12. Serão realizadas concomitantemente às eleições municipais as consultas populares sobre questões locais aprovadas pelas Câmaras Municipais e encaminhadas à Justiça Eleitoral até 90 (noventa) dias antes da data das eleições, observados os limites operacionais relativos ao número de quesitos.\n§ 13. As manifestações favoráveis e contrárias às questões submetidas às consultas populares nos termos do § 12 ocorrerão durante as campanhas eleitorais, sem a utilização de propaganda gratuita no rádio e na televisão."},"15":{"topicId":"OJ26-DCON-CF-01","texto":"Art. 15. É vedada a cassação de direitos políticos, cuja perda ou suspensão só se dará nos casos de:\nI - cancelamento da naturalização por sentença transitada em julgado;\nII - incapacidade civil absoluta;\nIII - condenação criminal transitada em julgado, enquanto durarem seus efeitos;\nIV - recusa de cumprir obrigação a todos imposta ou prestação alternativa, nos termos do art. 5º, VIII;\nV - improbidade administrativa, nos termos do art. 37, § 4º."},"16":{"topicId":"OJ26-DCON-CF-01","texto":"Art. 16. A lei que alterar o processo eleitoral entrará em vigor na data de sua publicação, não se aplicando à eleição que ocorra até um ano da data de sua vigência."},"18":{"topicId":"OJ26-DCON-CF-02","texto":"Art. 18. A organização político-administrativa da República Federativa do Brasil compreende a União, os Estados, o Distrito Federal e os Municípios, todos autônomos, nos termos desta Constituição .\n§ 1º Brasília é a Capital Federal.\n§ 2º Os Territórios Federais integram a União, e sua criação, transformação em Estado ou reintegração ao Estado de origem serão reguladas em lei complementar.\n§ 3º Os Estados podem incorporar-se entre si, subdividir-se ou desmembrar-se para se anexarem a outros, ou formarem novos Estados ou Territórios Federais, mediante aprovação da população diretamente interessada, através de plebiscito, e do Congresso Nacional, por lei complementar.\n§ 4º A criação, a incorporação, a fusão e o desmembramento de Municípios, far-se-ão por lei estadual, dentro do período determinado por lei complementar federal, e dependerão de consulta prévia, mediante plebiscito, às populações dos Municípios envolvidos, após divulgação dos Estudos de Viabilidade Municipal, apresentados e publicados na forma da lei."},"37":{"topicId":"OJ26-DCON-CF-03","texto":"Art. 37. A administração pública direta e indireta de qualquer dos Poderes da União, dos Estados, do Distrito Federal e dos Municípios obedecerá aos princípios de legalidade, impessoalidade, moralidade, publicidade e eficiência e, também, ao seguinte:\nI - os cargos, empregos e funções públicas são acessíveis aos brasileiros que preencham os requisitos estabelecidos em lei, assim como aos estrangeiros, na forma da lei;\nII - a investidura em cargo ou emprego público depende de aprovação prévia em concurso público de provas ou de provas e títulos, de acordo com a natureza e a complexidade do cargo ou emprego, na forma prevista em lei, ressalvadas as nomeações para cargo em comissão declarado em lei de livre nomeação e exoneração;\nIII - o prazo de validade do concurso público será de até dois anos, prorrogável uma vez, por igual período;\nIV - durante o prazo improrrogável previsto no edital de convocação, aquele aprovado em concurso público de provas ou de provas e títulos será convocado com prioridade sobre novos concursados para assumir cargo ou emprego, na carreira;\nV - as funções de confiança, exercidas exclusivamente por servidores ocupantes de cargo efetivo, e os cargos em comissão, a serem preenchidos por servidores de carreira nos casos, condições e percentuais mínimos previstos em lei, destinam-se apenas às atribuições de direção, chefia e assessoramento;\nVI - é garantido ao servidor público civil o direito à livre associação sindical;\nVII - o direito de greve será exercido nos termos e nos limites definidos em lei específica;\nVIII - a lei reservará percentual dos cargos e empregos públicos para as pessoas portadoras de deficiência e definirá os critérios de sua admissão;\nIX - a lei estabelecerá os casos de contratação por tempo determinado para atender a necessidade temporária de excepcional interesse público;\nX - a remuneração dos servidores públicos e o subsídio de que trata o § 4º do art. 39 somente poderão ser fixados ou alterados por lei específica, observada a iniciativa privativa em cada caso, assegurada revisão geral anual, sempre na mesma data e sem distinção de índices;\nXII - os vencimentos dos cargos do Poder Legislativo e do Poder Judiciário não poderão ser superiores aos pagos pelo Poder Executivo;\nXIII - é vedada a vinculação ou equiparação de quaisquer espécies remuneratórias para o efeito de remuneração de pessoal do serviço público;\nXIV - os acréscimos pecuniários percebidos por servidor público não serão computados nem acumulados para fins de concessão de acréscimos ulteriores;\nXV - o subsídio e os vencimentos dos ocupantes de cargos e empregos públicos são irredutíveis, ressalvado o disposto nos incisos XI e XIV deste artigo e nos arts. 39, § 4º, 150, II, 153, III, e 153, § 2º, I;\nXVI - é vedada a acumulação remunerada de cargos públicos, exceto, quando houver compatibilidade de horários, observado em qualquer caso o disposto no inciso XI:\na) a de dois cargos de professor;\nb) a de um cargo de professor com outro de qualquer natureza;\nc) a de dois cargos ou empregos privativos de profissionais de saúde, com profissões regulamentadas;\nXVII - a proibição de acumular estende-se a empregos e funções e abrange autarquias, fundações, empresas públicas, sociedades de economia mista, suas subsidiárias, e sociedades controladas, direta ou indiretamente, pelo poder público;\nXVIII - a administração fazendária e seus servidores fiscais terão, dentro de suas áreas de competência e jurisdição, precedência sobre os demais setores administrativos, na forma da lei;\nXIX - somente por lei específica poderá ser criada autarquia e autorizada a instituição de empresa pública, de sociedade de economia mista e de fundação, cabendo à lei complementar, neste último caso, definir as áreas de sua atuação;\nXX - depende de autorização legislativa, em cada caso, a criação de subsidiárias das entidades mencionadas no inciso anterior, assim como a participação de qualquer delas em empresa privada;\nXXI - ressalvados os casos especificados na legislação, as obras, serviços, compras e alienações serão contratados mediante processo de licitação pública que assegure igualdade de condições a todos os concorrentes, com cláusulas que estabeleçam obrigações de pagamento, mantidas as condições efetivas da proposta, nos termos da lei, o qual somente permitirá as exigências de qualificação técnica e econômica indispensáveis à garantia do cumprimento das obrigações;\nXXII - as administrações tributárias da União, dos Estados, do Distrito Federal e dos Municípios, atividades essenciais ao funcionamento do Estado, exercidas por servidores de carreiras específicas, terão recursos prioritários para a realização de suas atividades e atuarão de forma integrada, inclusive com o compartilhamento de cadastros e de informações fiscais, na forma da lei ou convênio.\n§ 1º A publicidade dos atos, programas, obras, serviços e campanhas dos órgãos públicos deverá ter caráter educativo, informativo ou de orientação social, dela não podendo constar nomes, símbolos ou imagens que caracterizem promoção pessoal de autoridades ou servidores públicos.\n§ 2º A não-observância do disposto nos incisos II e III implicará a nulidade do ato e a punição da autoridade responsável, nos termos da lei.\n§ 3º A lei disciplinará as formas de participação do usuário na administração pública direta e indireta, regulando especialmente:\nI - as reclamações relativas à prestação dos serviços públicos em geral, asseguradas a manutenção de serviços de atendimento ao usuário e a avaliação periódica, externa e interna, da qualidade dos serviços;\nII - o acesso dos usuários a registros administrativos e a informações sobre atos de governo, observado o disposto no art. 5º, X e XXXIII;\nIII - a disciplina da representação contra o exercício negligente ou abusivo de cargo, emprego ou função na administração pública.\n§ 4º Os atos de improbidade administrativa importarão a suspensão dos direitos políticos, a perda da função pública, a indisponibilidade dos bens e o ressarcimento ao erário, na forma e gradação previstas em lei, sem prejuízo da ação penal cabível.\n§ 5º A lei estabelecerá os prazos de prescrição para ilícitos praticados por qualquer agente, servidor ou não, que causem prejuízos ao erário, ressalvadas as respectivas ações de ressarcimento.\n§ 6º As pessoas jurídicas de direito público e as de direito privado prestadoras de serviços públicos responderão pelos danos que seus agentes, nessa qualidade, causarem a terceiros, assegurado o direito de regresso contra o responsável nos casos de dolo ou culpa.\n§ 7º A lei disporá sobre os requisitos e as restrições ao ocupante de cargo ou emprego da administração direta e indireta que possibilite o acesso a informações privilegiadas.\n§ 8º A autonomia gerencial, orçamentária e financeira dos órgãos e entidades da administração direta e indireta poderá ser ampliada mediante contrato, a ser firmado entre seus administradores e o poder público, que tenha por objeto a fixação de metas de desempenho para o órgão ou entidade, cabendo à lei dispor sobre:\nI - o prazo de duração do contrato;\nII - os controles e critérios de avaliação de desempenho, direitos, obrigações e responsabilidade dos dirigentes;\nIII - a remuneração do pessoal.\n§ 9º O disposto no inciso XI aplica-se às empresas públicas e às sociedades de economia mista, e suas subsidiárias, que receberem recursos da União, dos Estados, do Distrito Federal ou dos Municípios para pagamento de despesas de pessoal ou de custeio em geral.\n§ 10. É vedada a percepção simultânea de proventos de aposentadoria decorrentes do art. 40 ou dos arts. 42 e 142 com a remuneração de cargo, emprego ou função pública, ressalvados os cargos acumuláveis na forma desta Constituição, os cargos eletivos e os cargos em comissão declarados em lei de livre nomeação e exoneração.\n§ 11. Não serão computadas, para efeito dos limites remuneratórios de que trata o inciso XI do caput deste artigo, as parcelas de caráter indenizatório expressamente previstas em lei ordinária, aprovada pelo Congresso Nacional, de caráter nacional, aplicada a todos os Poderes e órgãos constitucionalmente autônomos.\n§ 13. O servidor público titular de cargo efetivo poderá ser readaptado para exercício de cargo cujas atribuições e responsabilidades sejam compatíveis com a limitação que tenha sofrido em sua capacidade física ou mental, enquanto permanecer nesta condição, desde que possua a habilitação e o nível de escolaridade exigidos para o cargo de destino, mantida a remuneração do cargo de origem.\n§ 14. A aposentadoria concedida com a utilização de tempo de contribuição decorrente de cargo, emprego ou função pública, inclusive do Regime Geral de Previdência Social, acarretará o rompimento do vínculo que gerou o referido tempo de contribuição.\n§ 15. É vedada a complementação de aposentadorias de servidores públicos e de pensões por morte a seus dependentes que não seja decorrente do disposto nos §§ 14 a 16 do art. 40 ou que não seja prevista em lei que extinga regime próprio de previdência social.\n§ 16. Os órgãos e entidades da administração pública, individual ou conjuntamente, devem realizar avaliação das políticas públicas, inclusive com divulgação do objeto a ser avaliado e dos resultados alcançados, na forma da lei."},"38":{"topicId":"OJ26-DCON-CF-03","texto":"Art. 38. Ao servidor público da administração direta, autárquica e fundacional, no exercício de mandato eletivo, aplicam-se as seguintes disposições:\nI - tratando-se de mandato eletivo federal, estadual ou distrital, ficará afastado de seu cargo, emprego ou função;\nII - investido no mandato de Prefeito, será afastado do cargo, emprego ou função, sendo-lhe facultado optar pela sua remuneração;\nIII - investido no mandato de Vereador, havendo compatibilidade de horários, perceberá as vantagens de seu cargo, emprego ou função, sem prejuízo da remuneração do cargo eletivo, e, não havendo compatibilidade, será aplicada a norma do inciso anterior;\nIV - em qualquer caso que exija o afastamento para o exercício de mandato eletivo, seu tempo de serviço será contado para todos os efeitos legais, exceto para promoção por merecimento;\nV - na hipótese de ser segurado de regime próprio de previdência social, permanecerá filiado a esse regime, no ente federativo de origem."},"39":{"topicId":"OJ26-DCON-CF-03","texto":"Art. 39. A União, os Estados, o Distrito Federal e os Municípios instituirão conselho de política de administração e remuneração de pessoal, integrado por servidores designados pelos respectivos Poderes.\n§ 1º A fixação dos padrões de vencimento e dos demais componentes do sistema remuneratório observará:\nI - a natureza, o grau de responsabilidade e a complexidade dos cargos componentes de cada carreira;\nII - os requisitos para a investidura;\nIII - as peculiaridades dos cargos.\n§ 2º A União, os Estados e o Distrito Federal manterão escolas de governo para a formação e o aperfeiçoamento dos servidores públicos, constituindo-se a participação nos cursos um dos requisitos para a promoção na carreira, facultada, para isso, a celebração de convênios ou contratos entre os entes federados.\n§ 3º Aplica-se aos servidores ocupantes de cargo público o disposto no art. 7º, IV, VII, VIII, IX, XII, XIII, XV, XVI, XVII, XVIII, XIX, XX, XXII e XXX, podendo a lei estabelecer requisitos diferenciados de admissão quando a natureza do cargo o exigir.\n§ 4º O membro de Poder, o detentor de mandato eletivo, os Ministros de Estado e os Secretários Estaduais e Municipais serão remunerados exclusivamente por subsídio fixado em parcela única, vedado o acréscimo de qualquer gratificação, adicional, abono, prêmio, verba de representação ou outra espécie remuneratória, obedecido, em qualquer caso, o disposto no art. 37, X e XI.\n§ 5º Lei da União, dos Estados, do Distrito Federal e dos Municípios poderá estabelecer a relação entre a maior e a menor remuneração dos servidores públicos, obedecido, em qualquer caso, o disposto no art. 37, XI.\n§ 6º Os Poderes Executivo, Legislativo e Judiciário publicarão anualmente os valores do subsídio e da remuneração dos cargos e empregos públicos.\n§ 7º Lei da União, dos Estados, do Distrito Federal e dos Municípios disciplinará a aplicação de recursos orçamentários provenientes da economia com despesas correntes em cada órgão, autarquia e fundação, para aplicação no desenvolvimento de programas de qualidade e produtividade, treinamento e desenvolvimento, modernização, reaparelhamento e racionalização do serviço público, inclusive sob a forma de adicional ou prêmio de produtividade.\n§ 8º A remuneração dos servidores públicos organizados em carreira poderá ser fixada nos termos do § 4º.\n§ 9º É vedada a incorporação de vantagens de caráter temporário ou vinculadas ao exercício de função de confiança ou de cargo em comissão à remuneração do cargo efetivo."},"40":{"topicId":"OJ26-DCON-CF-03","texto":"Art. 40. O regime próprio de previdência social dos servidores titulares de cargos efetivos terá caráter contributivo e solidário, mediante contribuição do respectivo ente federativo, de servidores ativos, de aposentados e de pensionistas, observados critérios que preservem o equilíbrio financeiro e atuarial.\n§ 1º O servidor abrangido por regime próprio de previdência social será aposentado:\nI - por incapacidade permanente para o trabalho, no cargo em que estiver investido, quando insuscetível de readaptação, hipótese em que será obrigatória a realização de avaliações periódicas para verificação da continuidade das condições que ensejaram a concessão da aposentadoria, na forma de lei do respectivo ente federativo;\nII - compulsoriamente, com proventos proporcionais ao tempo de contribuição, aos 70 (setenta) anos de idade, ou aos 75 (setenta e cinco) anos de idade, na forma de lei complementar;\nIII - no âmbito da União, aos 62 (sessenta e dois) anos de idade, se mulher, e aos 65 (sessenta e cinco) anos de idade, se homem, e, no âmbito dos Estados, do Distrito Federal e dos Municípios, na idade mínima estabelecida mediante emenda às respectivas Constituições e Leis Orgânicas, observados o tempo de contribuição e os demais requisitos estabelecidos em lei complementar do respectivo ente federativo.\n§ 2º Os proventos de aposentadoria não poderão ser inferiores ao valor mínimo a que se refere o § 2º do art. 201 ou superiores ao limite máximo estabelecido para o Regime Geral de Previdência Social, observado o disposto nos §§ 14 a 16.\n§ 3º As regras para cálculo de proventos de aposentadoria serão disciplinadas em lei do respectivo ente federativo.\n§ 4º É vedada a adoção de requisitos ou critérios diferenciados para concessão de benefícios em regime próprio de previdência social, ressalvado o disposto nos §§ 4º-A, 4º-B, 4º-C e 5º.\n- Poderão ser estabelecidos por lei complementar do respectivo ente federativo idade e tempo de contribuição diferenciados para aposentadoria de servidores com deficiência, previamente submetidos a avaliação biopsicossocial realizada por equipe multiprofissional e interdisciplinar.\n- Poderão ser estabelecidos por lei complementar do respectivo ente federativo idade e tempo de contribuição diferenciados para aposentadoria de ocupantes do cargo de agente penitenciário, de agente socioeducativo ou de policial dos órgãos de que tratam o inciso IV do caput do art. 51, o inciso XIII do caput do art. 52 e os incisos I a IV do caput do art. 144.\n- Poderão ser estabelecidos por lei complementar do respectivo ente federativo idade e tempo de contribuição diferenciados para aposentadoria de servidores cujas atividades sejam exercidas com efetiva exposição a agentes químicos, físicos e biológicos prejudiciais à saúde, ou associação desses agentes, vedada a caracterização por categoria profissional ou ocupação.\n§ 5º Os ocupantes do cargo de professor terão idade mínima reduzida em 5 (cinco) anos em relação às idades decorrentes da aplicação do disposto no inciso III do § 1º, desde que comprovem tempo de efetivo exercício das funções de magistério na educação infantil e no ensino fundamental e médio fixado em lei complementar do respectivo ente federativo.\n§ 6º Ressalvadas as aposentadorias decorrentes dos cargos acumuláveis na forma desta Constituição, é vedada a percepção de mais de uma aposentadoria à conta de regime próprio de previdência social, aplicando-se outras vedações, regras e condições para a acumulação de benefícios previdenciários estabelecidas no Regime Geral de Previdência Social.\n§ 7º Observado o disposto no § 2º do art. 201, quando se tratar da única fonte de renda formal auferida pelo dependente, o benefício de pensão por morte será concedido nos termos de lei do respectivo ente federativo, a qual tratará de forma diferenciada a hipótese de morte dos servidores de que trata o § 4º-B decorrente de agressão sofrida no exercício ou em razão da função.\n§ 8º É assegurado o reajustamento dos benefícios para preservar-lhes, em caráter permanente, o valor real, conforme critérios estabelecidos em lei.\n§ 9º O tempo de contribuição federal, estadual, distrital ou municipal será contado para fins de aposentadoria, observado o disposto nos §§ 9º e 9º-A do art. 201, e o tempo de serviço correspondente será contado para fins de disponibilidade.\n§ 10. A lei não poderá estabelecer qualquer forma de contagem de tempo de contribuição fictício.\n§ 11. Aplica-se o limite fixado no art. 37, XI, à soma total dos proventos de inatividade, inclusive quando decorrentes da acumulação de cargos ou empregos públicos, bem como de outras atividades sujeitas a contribuição para o regime geral de previdência social, e ao montante resultante da adição de proventos de inatividade com remuneração de cargo acumulável na forma desta Constituição, cargo em comissão declarado em lei de livre nomeação e exoneração, e de cargo eletivo.\n§ 12. Além do disposto neste artigo, serão observados, em regime próprio de previdência social, no que couber, os requisitos e critérios fixados para o Regime Geral de Previdência Social.\n§ 13. Aplica-se ao agente público ocupante, exclusivamente, de cargo em comissão declarado em lei de livre nomeação e exoneração, de outro cargo temporário, inclusive mandato eletivo, ou de emprego público, o Regime Geral de Previdência Social.\n§ 14. A União, os Estados, o Distrito Federal e os Municípios instituirão, por lei de iniciativa do respectivo Poder Executivo, regime de previdência complementar para servidores públicos ocupantes de cargo efetivo, observado o limite máximo dos benefícios do Regime Geral de Previdência Social para o valor das aposentadorias e das pensões em regime próprio de previdência social, ressalvado o disposto no § 16.\n§ 16. Somente mediante sua prévia e expressa opção, o disposto nos §§ 14 e 15 poderá ser aplicado ao servidor que tiver ingressado no serviço público até a data da publicação do ato de instituição do correspondente regime de previdência complementar.\n§ 17. Todos os valores de remuneração considerados para o cálculo do benefício previsto no § 3º serão devidamente atualizados, na forma da lei.\n§ 19. Observados critérios a serem estabelecidos em lei do respectivo ente federativo, o servidor titular de cargo efetivo que tenha completado as exigências para a aposentadoria voluntária e que opte por permanecer em atividade poderá fazer jus a um abono de permanência equivalente, no máximo, ao valor da sua contribuição previdenciária, até completar a idade para aposentadoria compulsória.\n§ 20. É vedada a existência de mais de um regime próprio de previdência social e de mais de um órgão ou entidade gestora desse regime em cada ente federativo, abrangidos todos os poderes, órgãos e entidades autárquicas e fundacionais, que serão responsáveis pelo seu financiamento, observados os critérios, os parâmetros e a natureza jurídica definidos na lei complementar de que trata o § 22.\n§ 22. Vedada a instituição de novos regimes próprios de previdência social, lei complementar federal estabelecerá, para os que já existam, normas gerais de organização, de funcionamento e de responsabilidade em sua gestão, dispondo, entre outros aspectos, sobre:\nI - requisitos para sua extinção e consequente migração para o Regime Geral de Previdência Social;\nII - modelo de arrecadação, de aplicação e de utilização dos recursos;\nIII - fiscalização pela União e controle externo e social;\nIV - definição de equilíbrio financeiro e atuarial;\nV - condições para instituição do fundo com finalidade previdenciária de que trata o art. 249 e para vinculação a ele dos recursos provenientes de contribuições e dos bens, direitos e ativos de qualquer natureza;\nVI - mecanismos de equacionamento do déficit atuarial;\nVII - estruturação do órgão ou entidade gestora do regime, observados os princípios relacionados com governança, controle interno e transparência;\nVIII - condições e hipóteses para responsabilização daqueles que desempenhem atribuições relacionadas, direta ou indiretamente, com a gestão do regime;\nIX - condições para adesão a consórcio público;\nX - parâmetros para apuração da base de cálculo e definição de alíquota de contribuições ordinárias e extraordinárias."},"41":{"topicId":"OJ26-DCON-CF-03","texto":"Art. 41. São estáveis após três anos de efetivo exercício os servidores nomeados para cargo de provimento efetivo em virtude de concurso público.\n§ 1º O servidor público estável só perderá o cargo:\nI - em virtude de sentença judicial transitada em julgado;\nII - mediante processo administrativo em que lhe seja assegurada ampla defesa;\nIII - mediante procedimento de avaliação periódica de desempenho, na forma de lei complementar, assegurada ampla defesa.\n§ 2º Invalidada por sentença judicial a demissão do servidor estável, será ele reintegrado, e o eventual ocupante da vaga, se estável, reconduzido ao cargo de origem, sem direito a indenização, aproveitado em outro cargo ou posto em disponibilidade com remuneração proporcional ao tempo de serviço.\n§ 3º Extinto o cargo ou declarada a sua desnecessidade, o servidor estável ficará em disponibilidade, com remuneração proporcional ao tempo de serviço, até seu adequado aproveitamento em outro cargo.\n§ 4º Como condição para a aquisição da estabilidade, é obrigatória a avaliação especial de desempenho por comissão instituída para essa finalidade."},"92":{"topicId":"OJ26-DCON-CF-04","texto":"Art. 92. São órgãos do Poder Judiciário:\nI - o Supremo Tribunal Federal;\n- o Conselho Nacional de Justiça;\nII - o Superior Tribunal de Justiça;\n- o Tribunal Superior do Trabalho;\nIII - os Tribunais Regionais Federais e Juízes Federais;\nIV - os Tribunais e Juízes do Trabalho;\nV - os Tribunais e Juízes Eleitorais;\nVI - os Tribunais e Juízes Militares;\nVII - os Tribunais e Juízes dos Estados e do Distrito Federal e Territórios.\nParágrafo único. O Supremo Tribunal Federal, o Conselho Nacional de Justiça e os Tribunais Superiores têm sede na Capital Federal.\n§ 2º O Supremo Tribunal Federal e os Tribunais Superiores têm jurisdição em todo o território nacional."},"93":{"topicId":"OJ26-DCON-CF-04","texto":"Art. 93. Lei complementar, de iniciativa do Supremo Tribunal Federal, disporá sobre o Estatuto da Magistratura, observados os seguintes princípios:\nI - ingresso na carreira, cujo cargo inicial será o de juiz substituto, mediante concurso público de provas e títulos, com a participação da Ordem dos Advogados do Brasil em todas as fases, exigindo-se do bacharel em direito, no mínimo, três anos de atividade jurídica e obedecendo-se, nas nomeações, à ordem de classificação;\nII - promoção de entrância para entrância, alternadamente, por antiguidade e merecimento, atendidas as seguintes normas:\na) é obrigatória a promoção do juiz que figure por três vezes consecutivas ou cinco alternadas em lista de merecimento;\nb) a promoção por merecimento pressupõe dois anos de exercício na respectiva entrância e integrar o juiz a primeira quinta parte da lista de antiguidade desta, salvo se não houver com tais requisitos quem aceite o lugar vago;\nc) aferição do merecimento conforme o desempenho e pelos critérios objetivos de produtividade e presteza no exercício da jurisdição e pela freqüência e aproveitamento em cursos oficiais ou reconhecidos de aperfeiçoamento;\nd) na apuração de antigüidade, o tribunal somente poderá recusar o juiz mais antigo pelo voto fundamentado de dois terços de seus membros, conforme procedimento próprio, e assegurada ampla defesa, repetindo-se a votação até fixar-se a indicação;\ne) não será promovido o juiz que, injustificadamente, retiver autos em seu poder além do prazo legal, não podendo devolvê-los ao cartório sem o devido despacho ou decisão;\nIII - o acesso aos tribunais de segundo grau far-se-á por antigüidade e merecimento, alternadamente, apurados na última ou única entrância;\nIV - previsão de cursos oficiais de preparação, aperfeiçoamento e promoção de magistrados, constituindo etapa obrigatória do processo de vitaliciamento a participação em curso oficial ou reconhecido por escola nacional de formação e aperfeiçoamento de magistrados;\nV - o subsídio dos Ministros dos Tribunais Superiores corresponderá a noventa e cinco por cento do subsídio mensal fixado para os Ministros do Supremo Tribunal Federal e os subsídios dos demais magistrados serão fixados em lei e escalonados, em nível federal e estadual, conforme as respectivas categorias da estrutura judiciária nacional, não podendo a diferença entre uma e outra ser superior a dez por cento ou inferior a cinco por cento, nem exceder a noventa e cinco por cento do subsídio mensal dos Ministros dos Tribunais Superiores, obedecido, em qualquer caso, o disposto nos arts. 37, XI, e 39, § 4º;\nVI - a aposentadoria dos magistrados e a pensão de seus dependentes observarão o disposto no art. 40;\nVII - o juiz titular residirá na respectiva comarca, salvo autorização do tribunal;\nVIII - o ato de remoção ou de disponibilidade do magistrado, por interesse público, fundar-se-á em decisão por voto da maioria absoluta do respectivo tribunal ou do Conselho Nacional de Justiça, assegurada ampla defesa;\n- a remoção a pedido de magistrados de comarca de igual entrância atenderá, no que couber, ao disposto nas alíneas \"a\", \"b\", \"c\" e \"e\" do inciso II do caput deste artigo e no art. 94 desta Constituição;\n- a permuta de magistrados de comarca de igual entrância, quando for o caso, e dentro do mesmo segmento de justiça, inclusive entre os juízes de segundo grau, vinculados a diferentes tribunais, na esfera da justiça estadual, federal ou do trabalho, atenderá, no que couber, ao disposto nas alíneas \"a\", \"b\", \"c\" e \"e\" do inciso II do caput deste artigo e no art. 94 desta Constituição;\nIX - todos os julgamentos dos órgãos do Poder Judiciário serão públicos, e fundamentadas todas as decisões, sob pena de nulidade, podendo a lei limitar a presença, em determinados atos, às próprias partes e a seus advogados, ou somente a estes, em casos nos quais a preservação do direito à intimidade do interessado no sigilo não prejudique o interesse público à informação;\nX - as decisões administrativas dos tribunais serão motivadas e em sessão pública, sendo as disciplinares tomadas pelo voto da maioria absoluta de seus membros;\nXI - nos tribunais com número superior a vinte e cinco julgadores, poderá ser constituído órgão especial, com o mínimo de onze e o máximo de vinte e cinco membros, para o exercício das atribuições administrativas e jurisdicionais delegadas da competência do tribunal pleno, provendo-se metade das vagas por antigüidade e a outra metade por eleição pelo tribunal pleno;\nXII - a atividade jurisdicional será ininterrupta, sendo vedado férias coletivas nos juízos e tribunais de segundo grau, funcionando, nos dias em que não houver expediente forense normal, juízes em plantão permanente;\nXIII - o número de juízes na unidade jurisdicional será proporcional à efetiva demanda judicial e à respectiva população;\nXIV - os servidores receberão delegação para a prática de atos de administração e atos de mero expediente sem caráter decisório;\nXV - a distribuição de processos será imediata, em todos os graus de jurisdição."},"94":{"topicId":"OJ26-DCON-CF-04","texto":"Art. 94. Um quinto dos lugares dos Tribunais Regionais Federais, dos tribunais dos Estados, e do Distrito Federal e Territórios será composto de membros do Ministério Público, com mais de dez anos de carreira, e de advogados de notório saber jurídico e de reputação ilibada, com mais de dez anos de efetiva atividade profissional, indicados em lista sêxtupla pelos órgãos de representação das respectivas classes.\nParágrafo único. Recebidas as indicações, o tribunal formará lista tríplice, enviando-a ao Poder Executivo, que, nos vinte dias subseqüentes, escolherá um de seus integrantes para nomeação."},"95":{"topicId":"OJ26-DCON-CF-04","texto":"Art. 95. Os juízes gozam das seguintes garantias:\nI - vitaliciedade, que, no primeiro grau, só será adquirida após dois anos de exercício, dependendo a perda do cargo, nesse período, de deliberação do tribunal a que o juiz estiver vinculado e, nos demais casos, de sentença judicial transitada em julgado;\nII - inamovibilidade, salvo por motivo de interesse público, na forma do art. 93, VIII;\nIII - irredutibilidade de subsídio, ressalvado o disposto nos arts. 37, X e XI, 39, § 4º, 150, II, 153, III, e 153, § 2º, I.\nParágrafo único. Aos juízes é vedado:\nI - exercer, ainda que em disponibilidade, outro cargo ou função, salvo uma de magistério;\nII - receber, a qualquer título ou pretexto, custas ou participação em processo;\nIII - dedicar-se a atividade político-partidária;\nIV - receber, a qualquer título ou pretexto, auxílios ou contribuições de pessoas físicas, entidades públicas ou privadas, ressalvadas as exceções previstas em lei;\nV - exercer a advocacia no juízo ou tribunal do qual se afastou, antes de decorridos três anos do afastamento do cargo por aposentadoria ou exoneração."},"96":{"topicId":"OJ26-DCON-CF-04","texto":"Art. 96. Compete privativamente:\nI - aos tribunais:\na) eleger seus órgãos diretivos e elaborar seus regimentos internos, com observância das normas de processo e das garantias processuais das partes, dispondo sobre a competência e o funcionamento dos respectivos órgãos jurisdicionais e administrativos;\nb) organizar suas secretarias e serviços auxiliares e os dos juízos que lhes forem vinculados, velando pelo exercício da atividade correicional respectiva;\nc) prover, na forma prevista nesta Constituição , os cargos de juiz de carreira da respectiva jurisdição;\nd) propor a criação de novas varas judiciárias;\ne) prover, por concurso público de provas, ou de provas e títulos, obedecido o disposto no art. 169, parágrafo único, os cargos necessários à administração da justiça, exceto os de confiança assim definidos em lei;\nf) conceder licença, férias e outros afastamentos a seus membros e aos juízes e servidores que lhes forem imediatamente vinculados;\nII - ao Supremo Tribunal Federal, aos Tribunais Superiores e aos Tribunais de Justiça propor ao Poder Legislativo respectivo, observado o disposto no art. 169:\na) a alteração do número de membros dos tribunais inferiores;\nb) a criação e a extinção de cargos e a remuneração dos seus serviços auxiliares e dos juízos que lhes forem vinculados, bem como a fixação do subsídio de seus membros e dos juízes, inclusive dos tribunais inferiores, onde houver;\nc) a criação ou extinção dos tribunais inferiores;\nd) a alteração da organização e da divisão judiciárias;\nIII - aos Tribunais de Justiça julgar os juízes estaduais e do Distrito Federal e Territórios, bem como os membros do Ministério Público, nos crimes comuns e de responsabilidade, ressalvada a competência da Justiça Eleitoral.\nParágrafo único. Nos Tribunais de Justiça compostos de mais de 170 (cento e setenta) desembargadores em efetivo exercício, a eleição para os cargos diretivos, de que trata a alínea \"a\" do inciso I do caput deste artigo, será realizada entre os membros do tribunal pleno, por maioria absoluta e por voto direto e secreto, para um mandato de 2 (dois) anos, vedada mais de 1 (uma) recondução sucessiva."},"97":{"topicId":"OJ26-DCON-CF-04","texto":"Art. 97. Somente pelo voto da maioria absoluta de seus membros ou dos membros do respectivo órgão especial poderão os tribunais declarar a inconstitucionalidade de lei ou ato normativo do poder público."},"98":{"topicId":"OJ26-DCON-CF-04","texto":"Art. 98. A União, no Distrito Federal e nos Territórios, e os Estados criarão:\nI - juizados especiais, providos por juízes togados, ou togados e leigos, competentes para a conciliação, o julgamento e a execução de causas cíveis de menor complexidade e infrações penais de menor potencial ofensivo, mediante os procedimentos oral e sumaríssimo, permitidos, nas hipóteses previstas em lei, a transação e o julgamento de recursos por turmas de juízes de primeiro grau;\nII - justiça de paz, remunerada, composta de cidadãos eleitos pelo voto direto, universal e secreto, com mandato de quatro anos e competência para, na forma da lei, celebrar casamentos, verificar, de ofício ou em face de impugnação apresentada, o processo de habilitação e exercer atribuições conciliatórias, sem caráter jurisdicional, além de outras previstas na legislação.\nParágrafo único. Lei federal disporá sobre a criação de juizados especiais no âmbito da Justiça Federal.\n§ 2º As custas e emolumentos serão destinados exclusivamente ao custeio dos serviços afetos às atividades específicas da Justiça."},"99":{"topicId":"OJ26-DCON-CF-04","texto":"Art. 99. Ao Poder Judiciário é assegurada autonomia administrativa e financeira.\n§ 1º Os tribunais elaborarão suas propostas orçamentárias dentro dos limites estipulados conjuntamente com os demais Poderes na lei de diretrizes orçamentárias.\n§ 2º O encaminhamento da proposta, ouvidos os outros tribunais interessados, compete:\nI - no âmbito da União, aos Presidentes do Supremo Tribunal Federal e dos Tribunais Superiores, com a aprovação dos respectivos tribunais;\nII - no âmbito dos Estados e no do Distrito Federal e Territórios, aos Presidentes dos Tribunais de Justiça, com a aprovação dos respectivos tribunais.\n§ 3º Se os órgãos referidos no § 2º não encaminharem as respectivas propostas orçamentárias dentro do prazo estabelecido na lei de diretrizes orçamentárias, o Poder Executivo considerará, para fins de consolidação da proposta orçamentária anual, os valores aprovados na lei orçamentária vigente, ajustados de acordo com os limites estipulados na forma do § 1º deste artigo.\n§ 4º Se as propostas orçamentárias de que trata este artigo forem encaminhadas em desacordo com os limites estipulados na forma do § 1º, o Poder Executivo procederá aos ajustes necessários para fins de consolidação da proposta orçamentária anual.\n§ 5º Durante a execução orçamentária do exercício, não poderá haver a realização de despesas ou a assunção de obrigações que extrapolem os limites estabelecidos na lei de diretrizes orçamentárias, exceto se previamente autorizadas, mediante a abertura de créditos suplementares ou especiais."},"125":{"topicId":"OJ26-DCON-CF-05","texto":"Art. 125. Os Estados organizarão sua Justiça, observados os princípios estabelecidos nesta Constituição .\n§ 1º A competência dos tribunais será definida na Constituição do Estado, sendo a lei de organização judiciária de iniciativa do Tribunal de Justiça.\n§ 2º Cabe aos Estados a instituição de representação de inconstitucionalidade de leis ou atos normativos estaduais ou municipais em face da Constituição estadual, vedada a atribuição da legitimação para agir a um único órgão.\n§ 3º A lei estadual poderá criar, mediante proposta do Tribunal de Justiça, a Justiça Militar estadual, constituída, em primeiro grau, pelos juízes de direito e pelos Conselhos de Justiça e, em segundo grau, pelo próprio Tribunal de Justiça, ou por Tribunal de Justiça Militar nos Estados em que o efetivo militar seja superior a vinte mil integrantes.\n§ 4º Compete à Justiça Militar estadual processar e julgar os militares dos Estados, nos crimes militares definidos em lei e as ações judiciais contra atos disciplinares militares, ressalvada a competência do júri quando a vítima for civil, cabendo ao tribunal competente decidir sobre a perda do posto e da patente dos oficiais e da graduação das praças.\n§ 5º Compete aos juízes de direito do juízo militar processar e julgar, singularmente, os crimes militares cometidos contra civis e as ações judiciais contra atos disciplinares militares, cabendo ao Conselho de Justiça, sob a presidência de juiz de direito, processar e julgar os demais crimes militares.\n§ 6º O Tribunal de Justiça poderá funcionar descentralizadamente, constituindo Câmaras regionais, a fim de assegurar o pleno acesso do jurisdicionado à justiça em todas as fases do processo.\n§ 7º O Tribunal de Justiça instalará a justiça itinerante, com a realização de audiências e demais funções da atividade jurisdicional, nos limites territoriais da respectiva jurisdição, servindo-se de equipamentos públicos e comunitários."},"127":{"topicId":"OJ26-DCON-CF-06","texto":"Art. 127. O Ministério Público é instituição permanente, essencial à função jurisdicional do Estado, incumbindo-lhe a defesa da ordem jurídica, do regime democrático e dos interesses sociais e individuais indisponíveis.\n§ 1º São princípios institucionais do Ministério Público a unidade, a indivisibilidade e a independência funcional.\n§ 2º Ao Ministério Público é assegurada autonomia funcional e administrativa, podendo, observado o disposto no art. 169, propor ao Poder Legislativo a criação e extinção de seus cargos e serviços auxiliares, provendo-os por concurso público de provas ou de provas e títulos, a política remuneratória e os planos de carreira; a lei disporá sobre sua organização e funcionamento.\n§ 3º O Ministério Público elaborará sua proposta orçamentária dentro dos limites estabelecidos na lei de diretrizes orçamentárias.\n§ 4º Se o Ministério Público não encaminhar a respectiva proposta orçamentária dentro do prazo estabelecido na lei de diretrizes orçamentárias, o Poder Executivo considerará, para fins de consolidação da proposta orçamentária anual, os valores aprovados na lei orçamentária vigente, ajustados de acordo com os limites estipulados na forma do § 3º.\n§ 5º Se a proposta orçamentária de que trata este artigo for encaminhada em desacordo com os limites estipulados na forma do § 3º, o Poder Executivo procederá aos ajustes necessários para fins de consolidação da proposta orçamentária anual.\n§ 6º Durante a execução orçamentária do exercício, não poderá haver a realização de despesas ou a assunção de obrigações que extrapolem os limites estabelecidos na lei de diretrizes orçamentárias, exceto se previamente autorizadas, mediante a abertura de créditos suplementares ou especiais."},"134":{"topicId":"OJ26-DCON-CF-07","texto":"Art. 134. A Defensoria Pública é instituição permanente, essencial à função jurisdicional do Estado, incumbindo-lhe, como expressão e instrumento do regime democrático, fundamentalmente, a orientação jurídica, a promoção dos direitos humanos e a defesa, em todos os graus, judicial e extrajudicial, dos direitos individuais e coletivos, de forma integral e gratuita, aos necessitados, na forma do inciso LXXIV do art. 5º desta Constituição Federal.\nParágrafo único. Lei complementar organizará a Defensoria Pública da União e do Distrito Federal e dos Territórios e prescreverá normas gerais para sua organização nos Estados, em cargos de carreira, providos, na classe inicial, mediante concurso público de provas e títulos, assegurada a seus integrantes a garantia da inamovibilidade e vedado o exercício da advocacia fora das atribuições institucionais.\n§ 2º Às Defensorias Públicas Estaduais são asseguradas autonomia funcional e administrativa e a iniciativa de sua proposta orçamentária dentro dos limites estabelecidos na lei de diretrizes orçamentárias e subordinação ao disposto no art. 99, § 2º.\n§ 3º Aplica-se o disposto no § 2º às Defensorias Públicas da União e do Distrito Federal.\n§ 4º São princípios institucionais da Defensoria Pública a unidade, a indivisibilidade e a independência funcional, aplicando-se também, no que couber, o disposto no art. 93 e no inciso II do art. 96 desta Constituição Federal."}}},"senado-lei-13146-2015":{"id":"DIR-ATUA-L13146","concordancia":true,"nome":"Estatuto da Pessoa com Deficiência (Lei n.º 13.146/2015)","rotulo":"do Estatuto da Pessoa com Deficiência (Lei 13.146/2015)","titulo":"Atualidades: Estatuto da Pessoa com Deficiência (Lei 13.146/2015)","disciplina":"ATUA","url":"https://normas.leg.br/api/public/normas?urn=urn:lex:br:federal:lei:2015-07-06;13146&&tipo_documento=maior-detalhe","consultado_em":"2026-11-21","sha256":"5e956a01cc8a4c27c79efca890a5af9adca633f50a9b87c6fbc4723811ebcbda","observacao":"Texto compilado vigente, publicado pela fonte (salvo em 2025-11-06); não é reconstruído por data. A própria fonte informa atualização até data não informada: alterações posteriores a essa data podem não constar.","artigos":{"1":{"topicId":"OJ26-ATUA-L13146-01","texto":"Art. 1º É instituída a Lei Brasileira de Inclusão da Pessoa com Deficiência (Estatuto da Pessoa com Deficiência), destinada a assegurar e a promover, em condições de igualdade, o exercício dos direitos e das liberdades fundamentais por pessoa com deficiência, visando à sua inclusão social e cidadania.\nParágrafo único. Esta Lei tem como base a Convenção sobre os Direitos das Pessoas com Deficiência e seu Protocolo Facultativo, ratificados pelo Congresso Nacional por meio do Decreto Legislativo nº 186, de 9 de julho de 2008, em conformidade com o procedimento previsto no § 3º do art. 5º da Constituição da República Federativa do Brasil, em vigor para o Brasil, no plano jurídico externo, desde 31 de agosto de 2008, e promulgados pelo Decreto nº 6.949, de 25 de agosto de 2009, data de início de sua vigência no plano interno."},"2":{"topicId":"OJ26-ATUA-L13146-01","texto":"Art. 2º Considera-se pessoa com deficiência aquela que tem impedimento de longo prazo de natureza física, mental, intelectual ou sensorial, o qual, em interação com uma ou mais barreiras, pode obstruir sua participação plena e efetiva na sociedade em igualdade de condições com as demais pessoas.\n§ 1º A avaliação da deficiência, quando necessária, será biopsicossocial, realizada por equipe multiprofissional e interdisciplinar e considerará:\nI - os impedimentos nas funções e nas estruturas do corpo;\nII - os fatores socioambientais, psicológicos e pessoais;\nIII - a limitação no desempenho de atividades; e\nIV - a restrição de participação.\n§ 2º O Poder Executivo criará instrumentos para avaliação da deficiência.\n§ 3º O exame médico-pericial componente da avaliação biopsicossocial da deficiência de que trata o § 1º deste artigo poderá ser realizado com o uso de tecnologia de telemedicina ou por análise documental conforme situações e requisitos definidos em regulamento."},"3":{"topicId":"OJ26-ATUA-L13146-01","texto":"Art. 3º Para fins de aplicação desta Lei, consideram-se:\nI - acessibilidade: possibilidade e condição de alcance para utilização, com segurança e autonomia, de espaços, mobiliários, equipamentos urbanos, edificações, transportes, informação e comunicação, inclusive seus sistemas e tecnologias, bem como de outros serviços e instalações abertos ao público, de uso público ou privados de uso coletivo, tanto na zona urbana como na rural, por pessoa com deficiência ou com mobilidade reduzida;\nII - desenho universal: concepção de produtos, ambientes, programas e serviços a serem usados por todas as pessoas, sem necessidade de adaptação ou de projeto específico, incluindo os recursos de tecnologia assistiva;\nIII - tecnologia assistiva ou ajuda técnica: produtos, equipamentos, dispositivos, recursos, metodologias, estratégias, práticas e serviços que objetivem promover a funcionalidade, relacionada à atividade e à participação da pessoa com deficiência ou com mobilidade reduzida, visando à sua autonomia, independência, qualidade de vida e inclusão social;\nIV - barreiras: qualquer entrave, obstáculo, atitude ou comportamento que limite ou impeça a participação social da pessoa, bem como o gozo, a fruição e o exercício de seus direitos à acessibilidade, à liberdade de movimento e de expressão, à comunicação, ao acesso à informação, à compreensão, à circulação com segurança, entre outros, classificadas em:\na) barreiras urbanísticas: as existentes nas vias e nos espaços públicos e privados abertos ao público ou de uso coletivo;\nb) barreiras arquitetônicas: as existentes nos edifícios públicos e privados;\nc) barreiras nos transportes: as existentes nos sistemas e meios de transportes;\nd) barreiras nas comunicações e na informação: qualquer entrave, obstáculo, atitude ou comportamento que dificulte ou impossibilite a expressão ou o recebimento de mensagens e de informações por intermédio de sistemas de comunicação e de tecnologia da informação;\ne) barreiras atitudinais: atitudes ou comportamentos que impeçam ou prejudiquem a participação social da pessoa com deficiência em igualdade de condições e oportunidades com as demais pessoas;\nf) barreiras tecnológicas: as que dificultam ou impedem o acesso da pessoa com deficiência às tecnologias;\nV - comunicação: forma de interação dos cidadãos que abrange, entre outras opções, as línguas, inclusive a Língua Brasileira de Sinais (Libras), a visualização de textos, o Braille, o sistema de sinalização ou de comunicação tátil, os caracteres ampliados, os dispositivos multimídia, assim como a linguagem simples, escrita e oral, os sistemas auditivos e os meios de voz digitalizados e os modos, meios e formatos aumentativos e alternativos de comunicação, incluindo as tecnologias da informação e das comunicações;\nVI - adaptações razoáveis: adaptações, modificações e ajustes necessários e adequados que não acarretem ônus desproporcional e indevido, quando requeridos em cada caso, a fim de assegurar que a pessoa com deficiência possa gozar ou exercer, em igualdade de condições e oportunidades com as demais pessoas, todos os direitos e liberdades fundamentais;\nVII - elemento de urbanização: quaisquer componentes de obras de urbanização, tais como os referentes a pavimentação, saneamento, encanamento para esgotos, distribuição de energia elétrica e de gás, iluminação pública, serviços de comunicação, abastecimento e distribuição de água, paisagismo e os que materializam as indicações do planejamento urbanístico;\nVIII - mobiliário urbano: conjunto de objetos existentes nas vias e nos espaços públicos, superpostos ou adicionados aos elementos de urbanização ou de edificação, de forma que sua modificação ou seu traslado não provoque alterações substanciais nesses elementos, tais como semáforos, postes de sinalização e similares, terminais e pontos de acesso coletivo às telecomunicações, fontes de água, lixeiras, toldos, marquises, bancos, quiosques e quaisquer outros de natureza análoga;\nIX - pessoa com mobilidade reduzida: aquela que tenha, por qualquer motivo, dificuldade de movimentação, permanente ou temporária, gerando redução efetiva da mobilidade, da flexibilidade, da coordenação motora ou da percepção, incluindo idoso, gestante, lactante, pessoa com criança de colo e obeso;\nX - residências inclusivas: unidades de oferta do Serviço de Acolhimento do Sistema Único de Assistência Social (Suas) localizadas em áreas residenciais da comunidade, com estruturas adequadas, que possam contar com apoio psicossocial para o atendimento das necessidades da pessoa acolhida, destinadas a jovens e adultos com deficiência, em situação de dependência, que não dispõem de condições de autossustentabilidade e com vínculos familiares fragilizados ou rompidos;\nXI - moradia para a vida independente da pessoa com deficiência: moradia com estruturas adequadas capazes de proporcionar serviços de apoio coletivos e individualizados que respeitem e ampliem o grau de autonomia de jovens e adultos com deficiência;\nXII - atendente pessoal: pessoa, membro ou não da família, que, com ou sem remuneração, assiste ou presta cuidados básicos e essenciais à pessoa com deficiência no exercício de suas atividades diárias, excluídas as técnicas ou os procedimentos identificados com profissões legalmente estabelecidas;\nXIII - profissional de apoio escolar: pessoa que exerce atividades de alimentação, higiene e locomoção do estudante com deficiência e atua em todas as atividades escolares nas quais se fizer necessária, em todos os níveis e modalidades de ensino, em instituições públicas e privadas, excluídas as técnicas ou os procedimentos identificados com profissões legalmente estabelecidas;\nXIV - acompanhante: aquele que acompanha a pessoa com deficiência, podendo ou não desempenhar as funções de atendente pessoal.\nXV - pessoa com necessidades complexas de comunicação: aquela que, por qualquer motivo, tem dificuldades significativas para compreender ou expressar mensagens de forma oral, escrita, gestual ou por meio de outras formas convencionais de comunicação, necessitando de recursos e estratégias alternativas ou aumentativas para viabilizar a interação social, o acesso à informação e a participação em atividades da vida cotidiana."},"4":{"topicId":"OJ26-ATUA-L13146-01","texto":"Art. 4º Toda pessoa com deficiência tem direito à igualdade de oportunidades com as demais pessoas e não sofrerá nenhuma espécie de discriminação.\n§ 1º Considera-se discriminação em razão da deficiência toda forma de distinção, restrição ou exclusão, por ação ou omissão, que tenha o propósito ou o efeito de prejudicar, impedir ou anular o reconhecimento ou o exercício dos direitos e das liberdades fundamentais de pessoa com deficiência, incluindo a recusa de adaptações razoáveis e de fornecimento de tecnologias assistivas.\n§ 2º A pessoa com deficiência não está obrigada à fruição de benefícios decorrentes de ação afirmativa."},"5":{"topicId":"OJ26-ATUA-L13146-01","texto":"Art. 5º A pessoa com deficiência será protegida de toda forma de negligência, discriminação, exploração, violência, tortura, crueldade, opressão e tratamento desumano ou degradante.\nParágrafo único. Para os fins da proteção mencionada no caput deste artigo, são considerados especialmente vulneráveis a criança, o adolescente, a mulher e o idoso, com deficiência."},"6":{"topicId":"OJ26-ATUA-L13146-01","texto":"Art. 6º A deficiência não afeta a plena capacidade civil da pessoa, inclusive para:\nI - casar-se e constituir união estável;\nII - exercer direitos sexuais e reprodutivos;\nIII - exercer o direito de decidir sobre o número de filhos e de ter acesso a informações adequadas sobre reprodução e planejamento familiar;\nIV - conservar sua fertilidade, sendo vedada a esterilização compulsória;\nV - exercer o direito à família e à convivência familiar e comunitária; e\nVI - exercer o direito à guarda, à tutela, à curatela e à adoção, como adotante ou adotando, em igualdade de oportunidades com as demais pessoas."},"7":{"topicId":"OJ26-ATUA-L13146-01","texto":"Art. 7º É dever de todos comunicar à autoridade competente qualquer forma de ameaça ou de violação aos direitos da pessoa com deficiência.\nParágrafo único. Se, no exercício de suas funções, os juízes e os tribunais tiverem conhecimento de fatos que caracterizem as violações previstas nesta Lei, devem remeter peças ao Ministério Público para as providências cabíveis."},"8":{"topicId":"OJ26-ATUA-L13146-01","texto":"Art. 8º É dever do Estado, da sociedade e da família assegurar à pessoa com deficiência, com prioridade, a efetivação dos direitos referentes à vida, à saúde, à sexualidade, à paternidade e à maternidade, à alimentação, à habitação, à educação, à profissionalização, ao trabalho, à previdência social, à habilitação e à reabilitação, ao transporte, à acessibilidade, à cultura, ao desporto, ao turismo, ao lazer, à informação, à comunicação, aos avanços científicos e tecnológicos, à dignidade, ao respeito, à liberdade, à convivência familiar e comunitária, entre outros decorrentes da Constituição Federal, da Convenção sobre os Direitos das Pessoas com Deficiência e seu Protocolo Facultativo e das leis e de outras normas que garantam seu bem-estar pessoal, social e econômico."},"9":{"topicId":"OJ26-ATUA-L13146-01","texto":"Art. 9º A pessoa com deficiência tem direito a receber atendimento prioritário, sobretudo com a finalidade de:\nI - proteção e socorro em quaisquer circunstâncias;\nII - atendimento em todas as instituições e serviços de atendimento ao público;\nIII - disponibilização de recursos, tanto humanos quanto tecnológicos, que garantam atendimento em igualdade de condições com as demais pessoas;\nIV - disponibilização de pontos de parada, estações e terminais acessíveis de transporte coletivo de passageiros e garantia de segurança no embarque e no desembarque;\nV - acesso a informações e disponibilização de recursos de comunicação acessíveis;\nVI - recebimento de restituição de imposto de renda;\nVII - tramitação processual e procedimentos judiciais e administrativos em que for parte ou interessada, em todos os atos e diligências.\n§ 1º Os direitos previstos neste artigo são extensivos ao acompanhante da pessoa com deficiência ou ao seu atendente pessoal, exceto quanto ao disposto nos incisos VI e VII deste artigo.\n§ 2º Nos serviços de emergência públicos e privados, a prioridade conferida por esta Lei é condicionada aos protocolos de atendimento médico."},"10":{"topicId":"OJ26-ATUA-L13146-01","texto":"Art. 10. Compete ao poder público garantir a dignidade da pessoa com deficiência ao longo de toda a vida.\nParágrafo único. Em situações de risco, emergência ou estado de calamidade pública, a pessoa com deficiência será considerada vulnerável, devendo o poder público adotar medidas para sua proteção e segurança."},"11":{"topicId":"OJ26-ATUA-L13146-01","texto":"Art. 11. A pessoa com deficiência não poderá ser obrigada a se submeter a intervenção clínica ou cirúrgica, a tratamento ou a institucionalização forçada.\nParágrafo único. O consentimento da pessoa com deficiência em situação de curatela poderá ser suprido, na forma da lei."},"12":{"topicId":"OJ26-ATUA-L13146-01","texto":"Art. 12. O consentimento prévio, livre e esclarecido da pessoa com deficiência é indispensável para a realização de tratamento, procedimento, hospitalização e pesquisa científica.\n§ 1º Em caso de pessoa com deficiência em situação de curatela, deve ser assegurada sua participação, no maior grau possível, para a obtenção de consentimento.\n§ 2º A pesquisa científica envolvendo pessoa com deficiência em situação de tutela ou de curatela deve ser realizada, em caráter excepcional, apenas quando houver indícios de benefício direto para sua saúde ou para a saúde de outras pessoas com deficiência e desde que não haja outra opção de pesquisa de eficácia comparável com participantes não tutelados ou curatelados."},"13":{"topicId":"OJ26-ATUA-L13146-01","texto":"Art. 13. A pessoa com deficiência somente será atendida sem seu consentimento prévio, livre e esclarecido em casos de risco de morte e de emergência em saúde, resguardado seu superior interesse e adotadas as salvaguardas legais cabíveis."},"34":{"topicId":"OJ26-ATUA-L13146-02","texto":"Art. 34. A pessoa com deficiência tem direito ao trabalho de sua livre escolha e aceitação, em ambiente acessível e inclusivo, em igualdade de oportunidades com as demais pessoas.\n§ 1º As pessoas jurídicas de direito público, privado ou de qualquer natureza são obrigadas a garantir ambientes de trabalho acessíveis e inclusivos.\n§ 2º A pessoa com deficiência tem direito, em igualdade de oportunidades com as demais pessoas, a condições justas e favoráveis de trabalho, incluindo igual remuneração por trabalho de igual valor.\n§ 3º É vedada restrição ao trabalho da pessoa com deficiência e qualquer discriminação em razão de sua condição, inclusive nas etapas de recrutamento, seleção, contratação, admissão, exames admissional e periódico, permanência no emprego, ascensão profissional e reabilitação profissional, bem como exigência de aptidão plena.\n§ 4º A pessoa com deficiência tem direito à participação e ao acesso a cursos, treinamentos, educação continuada, planos de carreira, promoções, bonificações e incentivos profissionais oferecidos pelo empregador, em igualdade de oportunidades com os demais empregados.\n§ 5º É garantida aos trabalhadores com deficiência acessibilidade em cursos de formação e de capacitação."},"35":{"topicId":"OJ26-ATUA-L13146-02","texto":"Art. 35. É finalidade primordial das políticas públicas de trabalho e emprego promover e garantir condições de acesso e de permanência da pessoa com deficiência no campo de trabalho.\nParágrafo único. Os programas de estímulo ao empreendedorismo e ao trabalho autônomo, incluídos o cooperativismo e o associativismo, devem prever a participação da pessoa com deficiência e a disponibilização de linhas de crédito, quando necessárias."},"36":{"topicId":"OJ26-ATUA-L13146-02","texto":"Art. 36. O poder público deve implementar serviços e programas completos de habilitação profissional e de reabilitação profissional para que a pessoa com deficiência possa ingressar, continuar ou retornar ao campo do trabalho, respeitados sua livre escolha, sua vocação e seu interesse.\n§ 1º Equipe multidisciplinar indicará, com base em critérios previstos no § 1º do art. 2º desta Lei, programa de habilitação ou de reabilitação que possibilite à pessoa com deficiência restaurar sua capacidade e habilidade profissional ou adquirir novas capacidades e habilidades de trabalho.\n§ 2º A habilitação profissional corresponde ao processo destinado a propiciar à pessoa com deficiência aquisição de conhecimentos, habilidades e aptidões para exercício de profissão ou de ocupação, permitindo nível suficiente de desenvolvimento profissional para ingresso no campo de trabalho.\n§ 3º Os serviços de habilitação profissional, de reabilitação profissional e de educação profissional devem ser dotados de recursos necessários para atender a toda pessoa com deficiência, independentemente de sua característica específica, a fim de que ela possa ser capacitada para trabalho que lhe seja adequado e ter perspectivas de obtê-lo, de conservá-lo e de nele progredir.\n§ 4º Os serviços de habilitação profissional, de reabilitação profissional e de educação profissional deverão ser oferecidos em ambientes acessíveis e inclusivos.\n§ 5º A habilitação profissional e a reabilitação profissional devem ocorrer articuladas com as redes públicas e privadas, especialmente de saúde, de ensino e de assistência social, em todos os níveis e modalidades, em entidades de formação profissional ou diretamente com o empregador.\n§ 6º A habilitação profissional pode ocorrer em empresas por meio de prévia formalização do contrato de emprego da pessoa com deficiência, que será considerada para o cumprimento da reserva de vagas prevista em lei, desde que por tempo determinado e concomitante com a inclusão profissional na empresa, observado o disposto em regulamento.\n§ 7º A habilitação profissional e a reabilitação profissional atenderão à pessoa com deficiência."},"37":{"topicId":"OJ26-ATUA-L13146-02","texto":"Art. 37. Constitui modo de inclusão da pessoa com deficiência no trabalho a colocação competitiva, em igualdade de oportunidades com as demais pessoas, nos termos da legislação trabalhista e previdenciária, na qual devem ser atendidas as regras de acessibilidade, o fornecimento de recursos de tecnologia assistiva e a adaptação razoável no ambiente de trabalho.\nParágrafo único. A colocação competitiva da pessoa com deficiência pode ocorrer por meio de trabalho com apoio, observadas as seguintes diretrizes:\nI - prioridade no atendimento à pessoa com deficiência com maior dificuldade de inserção no campo de trabalho;\nII - provisão de suportes individualizados que atendam a necessidades específicas da pessoa com deficiência, inclusive a disponibilização de recursos de tecnologia assistiva, de agente facilitador e de apoio no ambiente de trabalho;\nIII - respeito ao perfil vocacional e ao interesse da pessoa com deficiência apoiada;\nIV - oferta de aconselhamento e de apoio aos empregadores, com vistas à definição de estratégias de inclusão e de superação de barreiras, inclusive atitudinais;\nV - realização de avaliações periódicas;\nVI - articulação intersetorial das políticas públicas;\nVII - possibilidade de participação de organizações da sociedade civil."},"38":{"topicId":"OJ26-ATUA-L13146-02","texto":"Art. 38. A entidade contratada para a realização de processo seletivo público ou privado para cargo, função ou emprego está obrigada à observância do disposto nesta Lei e em outras normas de acessibilidade vigentes."},"79":{"topicId":"OJ26-ATUA-L13146-03","texto":"Art. 79. O poder público deve assegurar o acesso da pessoa com deficiência à justiça, em igualdade de oportunidades com as demais pessoas, garantindo, sempre que requeridos, adaptações e recursos de tecnologia assistiva.\n§ 1º A fim de garantir a atuação da pessoa com deficiência em todo o processo judicial, o poder público deve capacitar os membros e os servidores que atuam no Poder Judiciário, no Ministério Público, na Defensoria Pública, nos órgãos de segurança pública e no sistema penitenciário quanto aos direitos da pessoa com deficiência.\n§ 2º Devem ser assegurados à pessoa com deficiência submetida a medida restritiva de liberdade todos os direitos e garantias a que fazem jus os apenados sem deficiência, garantida a acessibilidade.\n§ 3º A Defensoria Pública e o Ministério Público tomarão as medidas necessárias à garantia dos direitos previstos nesta Lei."},"80":{"topicId":"OJ26-ATUA-L13146-03","texto":"Art. 80. Devem ser oferecidos todos os recursos de tecnologia assistiva disponíveis para que a pessoa com deficiência tenha garantido o acesso à justiça, sempre que figure em um dos polos da ação ou atue como testemunha, partícipe da lide posta em juízo, advogado, defensor público, magistrado ou membro do Ministério Público.\nParágrafo único. A pessoa com deficiência tem garantido o acesso ao conteúdo de todos os atos processuais de seu interesse, inclusive no exercício da advocacia."},"81":{"topicId":"OJ26-ATUA-L13146-03","texto":"Art. 81. Os direitos da pessoa com deficiência serão garantidos por ocasião da aplicação de sanções penais."},"83":{"topicId":"OJ26-ATUA-L13146-03","texto":"Art. 83. Os serviços notariais e de registro não podem negar ou criar óbices ou condições diferenciadas à prestação de seus serviços em razão de deficiência do solicitante, devendo reconhecer sua capacidade legal plena, garantida a acessibilidade.\nParágrafo único. O descumprimento do disposto no caput deste artigo constitui discriminação em razão de deficiência."},"84":{"topicId":"OJ26-ATUA-L13146-03","texto":"Art. 84. A pessoa com deficiência tem assegurado o direito ao exercício de sua capacidade legal em igualdade de condições com as demais pessoas.\n§ 1º Quando necessário, a pessoa com deficiência será submetida à curatela, conforme a lei.\n§ 2º É facultado à pessoa com deficiência a adoção de processo de tomada de decisão apoiada.\n§ 3º A definição de curatela de pessoa com deficiência constitui medida protetiva extraordinária, proporcional às necessidades e às circunstâncias de cada caso, e durará o menor tempo possível.\n§ 4º Os curadores são obrigados a prestar, anualmente, contas de sua administração ao juiz, apresentando o balanço do respectivo ano."},"85":{"topicId":"OJ26-ATUA-L13146-03","texto":"Art. 85. A curatela afetará tão somente os atos relacionados aos direitos de natureza patrimonial e negocial.\n§ 1º A definição da curatela não alcança o direito ao próprio corpo, à sexualidade, ao matrimônio, à privacidade, à educação, à saúde, ao trabalho e ao voto.\n§ 2º A curatela constitui medida extraordinária, devendo constar da sentença as razões e motivações de sua definição, preservados os interesses do curatelado.\n§ 3º No caso de pessoa em situação de institucionalização, ao nomear curador, o juiz deve dar preferência a pessoa que tenha vínculo de natureza familiar, afetiva ou comunitária com o curatelado."},"86":{"topicId":"OJ26-ATUA-L13146-03","texto":"Art. 86. Para emissão de documentos oficiais, não será exigida a situação de curatela da pessoa com deficiência."},"87":{"topicId":"OJ26-ATUA-L13146-03","texto":"Art. 87. Em casos de relevância e urgência e a fim de proteger os interesses da pessoa com deficiência em situação de curatela, será lícito ao juiz, ouvido o Ministério Público, de oficio ou a requerimento do interessado, nomear, desde logo, curador provisório, o qual estará sujeito, no que couber, às disposições do Código de Processo Civil."},"2-A":{"topicId":"OJ26-ATUA-L13146-01","texto":"Art. 2º-A. É instituído o cordão de fita com desenhos de girassóis como símbolo nacional de identificação de pessoas com deficiências ocultas.\n§ 1º O uso do símbolo de que trata o caput deste artigo é opcional, e sua ausência não prejudica o exercício de direitos e garantias previstos em lei.\n§ 2º A utilização do símbolo de que trata o caput deste artigo não dispensa a apresentação de documento comprobatório da deficiência, caso seja solicitado pelo atendente ou pela autoridade competente."}}},"senado-lei-9099-1995":{"id":"DIR-DPPE-L9099","concordancia":true,"nome":"Lei n.º 9.099/1995","rotulo":"da Lei 9.099/1995 (Juizados Especiais Cíveis e Criminais)","titulo":"Direito: Lei 9.099/1995 (Juizados Especiais)","disciplina":"DPPE","url":"https://normas.leg.br/api/public/normas?urn=urn:lex:br:federal:lei:1995-09-26;9099&&tipo_documento=maior-detalhe","consultado_em":"2026-11-21","sha256":"198e05083a1561c9acf733be90778753c6182e5b635f564b5d95e28d9ca4c9b8","observacao":"Texto compilado vigente, publicado pela fonte (salvo em 2021-11-23); não é reconstruído por data. A própria fonte informa atualização até data não informada: alterações posteriores a essa data podem não constar.","artigos":{"1":{"topicId":"OJ26-DPPE-L9099-01","texto":"Art. 1º Os Juizados Especiais Cíveis e Criminais, órgãos da Justiça Ordinária, serão criados pela União, no Distrito Federal e nos Territórios, e pelos Estados, para conciliação, processo, julgamento e execução, nas causas de sua competência."},"2":{"topicId":"OJ26-DPPE-L9099-02","texto":"Art. 2º O processo orientar-se-á pelos critérios da oralidade, simplicidade, informalidade, economia processual e celeridade, buscando, sempre que possível, a conciliação ou a transação."},"8":{"topicId":"OJ26-DPCI-L9099-01","texto":"Art. 8º Não poderão ser partes, no processo instituído por esta Lei, o incapaz, o preso, as pessoas jurídicas de direito público, as empresas públicas da União, a massa falida e o insolvente civil.\n§ 1º Somente serão admitidas a propor ação perante o Juizado Especial: ( P arágrafo com redação dada pela Lei nº 12.126, de 16/12/2009)\nI - as pessoas físicas capazes, excluídos os cessionários de direito de pessoas jurídicas;\nII - as pessoas enquadradas como microempreendedores individuais, microempresas e empresas de pequeno porte na forma da Lei Complementar n º 123, de 14 de dezembro de 2006 ;\nIII - as pessoas jurídicas qualificadas como Organização da Sociedade Civil de Interesse Público, nos termos da Lei nº 9.790, de 23 de março de 1999;\nIV - as sociedades de crédito ao microempreendedor, nos termos do art. 1º da Lei nº 10.194, de 14 de fevereiro de 2001.\n§ 2º O maior de dezoito anos poderá ser autor, independentemente de assistência, inclusive para fins de conciliação."},"9":{"topicId":"OJ26-DPCI-L9099-02","texto":"Art. 9º Nas causas de valor até vinte salários mínimos, as partes comparecerão pessoalmente, podendo ser assistidas por advogado; nas de valor superior, a assistência é obrigatória.\n§ 1º Sendo facultativa a assistência, se uma das partes comparecer assistida por advogado, ou se o réu for pessoa jurídica ou firma individual, terá a outra parte, se quiser, assistência judiciária prestada por órgão instituído junto ao Juizado Especial, na forma da lei local.\n§ 2º O Juiz alertará as partes da conveniência do patrocínio por advogado, quando a causa o recomendar.\n§ 3º O mandato ao advogado poderá ser verbal, salvo quanto aos poderes especiais.\n§ 4º O réu, sendo pessoa jurídica ou titular de firma individual, poderá ser representado por preposto credenciado, munido de carta de preposição com poderes para transigir, sem haver necessidade de vínculo empregatício."},"18":{"topicId":"OJ26-DPCI-L9099-03","texto":"Art. 18. A

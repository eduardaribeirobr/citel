eu fim econômico ou social, pela boa-fé ou pelos bons costumes."},"188":{"topicId":"OJ26-DCIV-CC-09","texto":"Art. 188. Não constituem atos ilícitos:\nI - os praticados em legítima defesa ou no exercício regular de um direito reconhecido;\nII - a deterioração ou destruição da coisa alheia, ou a lesão a pessoa, a fim de remover perigo iminente.\nParágrafo único. No caso do inciso II, o ato será legítimo somente quando as circunstâncias o tornarem absolutamente necessário, não excedendo os limites do indispensável para a remoção do perigo."},"189":{"topicId":"OJ26-DCIV-CC-09","texto":"Art. 189. Violado o direito, nasce para o titular a pretensão, a qual se extingue, pela prescrição, nos prazos a que aludem os arts. 205 e 206."},"190":{"topicId":"OJ26-DCIV-CC-09","texto":"Art. 190. A exceção prescreve no mesmo prazo em que a pretensão."},"191":{"topicId":"OJ26-DCIV-CC-09","texto":"Art. 191. A renúncia da prescrição pode ser expressa ou tácita, e só valerá, sendo feita, sem prejuízo de terceiro, depois que a prescrição se consumar; tácita é a renúncia quando se presume de fatos do interessado, incompatíveis com a prescrição."},"192":{"topicId":"OJ26-DCIV-CC-09","texto":"Art. 192. Os prazos de prescrição não podem ser alterados por acordo das partes."},"193":{"topicId":"OJ26-DCIV-CC-09","texto":"Art. 193. A prescrição pode ser alegada em qualquer grau de jurisdição, pela parte a quem aproveita."},"195":{"topicId":"OJ26-DCIV-CC-09","texto":"Art. 195. Os relativamente incapazes e as pessoas jurídicas têm ação contra os seus assistentes ou representantes legais, que derem causa à prescrição, ou não a alegarem oportunamente."},"196":{"topicId":"OJ26-DCIV-CC-09","texto":"Art. 196. A prescrição iniciada contra uma pessoa continua a correr contra o seu sucessor."},"197":{"topicId":"OJ26-DCIV-CC-09","texto":"Art. 197. Não corre a prescrição:\nI - entre os cônjuges, na constância da sociedade conjugal;\nII - entre ascendentes e descendentes, durante o poder familiar;\nIII - entre tutelados ou curatelados e seus tutores ou curadores, durante a tutela ou curatela."},"198":{"topicId":"OJ26-DCIV-CC-09","texto":"Art. 198. Também não corre a prescrição:\nI - contra os incapazes de que trata o art. 3º;\nII - contra os ausentes do País em serviço público da União, dos Estados ou dos Municípios;\nIII - contra os que se acharem servindo nas Forças Armadas, em tempo de guerra."},"199":{"topicId":"OJ26-DCIV-CC-09","texto":"Art. 199. Não corre igualmente a prescrição:\nI - pendendo condição suspensiva;\nII - não estando vencido o prazo;\nIII - pendendo ação de evicção."},"200":{"topicId":"OJ26-DCIV-CC-09","texto":"Art. 200. Quando a ação se originar de fato que deva ser apurado no juízo criminal, não correrá a prescrição antes da respectiva sentença definitiva."},"201":{"topicId":"OJ26-DCIV-CC-09","texto":"Art. 201. Suspensa a prescrição em favor de um dos credores solidários, só aproveitam os outros se a obrigação for indivisível."},"212":{"topicId":"OJ26-DCIV-CC-10","texto":"Art. 212. Salvo o negócio a que se impõe forma especial, o fato jurídico pode ser provado mediante:\nI - confissão;\nII - documento;\nIII - testemunha;\nIV - presunção;\nV - perícia."},"213":{"topicId":"OJ26-DCIV-CC-10","texto":"Art. 213. Não tem eficácia a confissão se provém de quem não é capaz de dispor do direito a que se referem os fatos confessados.\nParágrafo único. Se feita a confissão por um representante, somente é eficaz nos limites em que este pode vincular o representado."},"214":{"topicId":"OJ26-DCIV-CC-10","texto":"Art. 214. A confissão é irrevogável, mas pode ser anulada se decorreu de erro de fato ou de coação."},"215":{"topicId":"OJ26-DCIV-CC-10","texto":"Art. 215. A escritura pública, lavrada em notas de tabelião, é documento dotado de fé pública, fazendo prova plena.\n§ 1º Salvo quando exigidos por lei outros requisitos, a escritura pública deve conter:\nI - data e local de sua realização;\nII - reconhecimento da identidade e capacidade das partes e de quantos hajam comparecido ao ato, por si, como representantes, intervenientes ou testemunhas;\nIII - nome, nacionalidade, estado civil, profissão, domicílio e residência das partes e demais comparecentes, com a indicação, quando necessário, do regime de bens do casamento, nome do outro cônjuge e filiação;\nIV - manifestação clara da vontade das partes e dos intervenientes;\nV - referência ao cumprimento das exigências legais e fiscais inerentes à legitimidade do ato;\nVI - declaração de ter sido lida na presença das partes e demais comparecentes, ou de que todos a leram;\nVII - assinatura das partes e dos demais comparecentes, bem como a do tabelião ou seu substituto legal, encerrando o ato.\n§ 2º Se algum comparecente não puder ou não souber escrever, outra pessoa capaz assinará por ele, a seu rogo.\n§ 3º A escritura será redigida na língua nacional.\n§ 4º Se qualquer dos comparecentes não souber a língua nacional e o tabelião não entender o idioma em que se expressa, deverá comparecer tradutor público para servir de intérprete, ou, não o havendo na localidade, outra pessoa capaz que, a juízo do tabelião, tenha idoneidade e conhecimento bastantes.\n§ 5º Se algum dos comparecentes não for conhecido do tabelião, nem puder identificar-se por documento, deverão participar do ato pelo menos duas testemunhas que o conheçam e atestem sua identidade."},"653":{"topicId":"OJ26-DCIV-CC-11","texto":"Art. 653. Opera-se o mandato quando alguém recebe de outrem poderes para, em seu nome, praticar atos ou administrar interesses. A procuração é o instrumento do mandato."},"654":{"topicId":"OJ26-DCIV-CC-11","texto":"Art. 654. Todas as pessoas capazes são aptas para dar procuração mediante instrumento particular, que valerá desde que tenha a assinatura do outorgante.\n§ 1º O instrumento particular deve conter a indicação do lugar onde foi passado, a qualificação do outorgante e do outorgado, a data e o objetivo da outorga com a designação e a extensão dos poderes conferidos.\n§ 2º O terceiro com quem o mandatário tratar poderá exigir que a procuração traga a firma reconhecida."},"655":{"topicId":"OJ26-DCIV-CC-11","texto":"Art. 655. Ainda quando se outorgue mandato por instrumento público, pode substabelecer-se mediante instrumento particular."},"656":{"topicId":"OJ26-DCIV-CC-11","texto":"Art. 656. O mandato pode ser expresso ou tácito, verbal ou escrito."},"657":{"topicId":"OJ26-DCIV-CC-11","texto":"Art. 657. A outorga do mandato está sujeita à forma exigida por lei para o ato a ser praticado. Não se admite mandato verbal quando o ato deva ser celebrado por escrito."},"658":{"topicId":"OJ26-DCIV-CC-11","texto":"Art. 658. O mandato presume-se gratuito quando não houver sido estipulada retribuição, exceto se o seu objeto corresponder ao daqueles que o mandatário trata por ofício ou profissão lucrativa.\nParágrafo único. Se o mandato for oneroso, caberá ao mandatário a retribuição prevista em lei ou no contrato. Sendo estes omissos, será ela determinada pelos usos do lugar, ou, na falta destes, por arbitramento."},"659":{"topicId":"OJ26-DCIV-CC-11","texto":"Art. 659. A aceitação do mandato pode ser tácita, e resulta do começo de execução."},"660":{"topicId":"OJ26-DCIV-CC-11","texto":"Art. 660. O mandato pode ser especial a um ou mais negócios determinadamente, ou geral a todos os do mandante."},"661":{"topicId":"OJ26-DCIV-CC-11","texto":"Art. 661. O mandato em termos gerais só confere poderes de administração.\n§ 1º Para alienar, hipotecar, transigir, ou praticar outros quaisquer atos que exorbitem da administração ordinária, depende a procuração de poderes especiais e expressos.\n§ 2º O poder de transigir não importa o de firmar compromisso."},"662":{"topicId":"OJ26-DCIV-CC-11","texto":"Art. 662. Os atos praticados por quem não tenha mandato, ou o tenha sem poderes suficientes, são ineficazes em relação àquele em cujo nome foram praticados, salvo se este os ratificar.\nParágrafo único. A ratificação há de ser expressa, ou resultar de ato inequívoco, e retroagirá à data do ato."},"663":{"topicId":"OJ26-DCIV-CC-11","texto":"Art. 663. Sempre que o mandatário estipular negócios expressamente em nome do mandante, será este o único responsável; ficará, porém, o mandatário pessoalmente obrigado, se agir no seu próprio nome, ainda que o negócio seja de conta do mandante."},"664":{"topicId":"OJ26-DCIV-CC-11","texto":"Art. 664. O mandatário tem o direito de reter, do objeto da operação que lhe foi cometida, quanto baste para pagamento de tudo que lhe for devido em conseqüência do mandato."},"665":{"topicId":"OJ26-DCIV-CC-11","texto":"Art. 665. O mandatário que exceder os poderes do mandato, ou proceder contra eles, será considerado mero gestor de negócios, enquanto o mandante lhe não ratificar os atos."},"666":{"topicId":"OJ26-DCIV-CC-11","texto":"Art. 666. O maior de dezesseis e menor de dezoito anos não emancipado pode ser mandatário, mas o mandante não tem ação contra ele senão de conformidade com as regras gerais, aplicáveis às obrigações contraídas por menores."},"1169":{"topicId":"OJ26-DCIV-CC-12","texto":"Art. 1169. O preposto não pode, sem autorização escrita, fazer-se substituir no desempenho da preposição, sob pena de responder pessoalmente pelos atos do substituto e pelas obrigações por ele contraídas."},"1170":{"topicId":"OJ26-DCIV-CC-12","texto":"Art. 1170. O preposto, salvo autorização expressa, não pode negociar por conta própria ou de terceiro, nem participar, embora indiretamente, de operação do mesmo gênero da que lhe foi cometida, sob pena de responder por perdas e danos e de serem retidos pelo preponente os lucros da operação."},"1171":{"topicId":"OJ26-DCIV-CC-12","texto":"Art. 1171. Considera-se perfeita a entrega de papéis, bens ou valores ao preposto, encarregado pelo preponente, se os recebeu sem protesto, salvo nos casos em que haja prazo para reclamação."},"1172":{"topicId":"OJ26-DCIV-CC-12","texto":"Art. 1172. Considera-se gerente o preposto permanente no exercício da empresa, na sede desta, ou em sucursal, filial ou agência."},"1173":{"topicId":"OJ26-DCIV-CC-12","texto":"Art. 1173. Quando a lei não exigir poderes especiais, considera-se o gerente autorizado a praticar todos os atos necessários ao exercício dos poderes que lhe foram outorgados.\nParágrafo único. Na falta de estipulação diversa, consideram-se solidários os poderes conferidos a dois ou mais gerentes."},"1196":{"topicId":"OJ26-DCIV-CC-13","texto":"Art. 1196. Considera-se possuidor todo aquele que tem de fato o exercício, pleno ou não, de algum dos poderes inerentes à propriedade."},"1197":{"topicId":"OJ26-DCIV-CC-13","texto":"Art. 1197. A posse direta, de pessoa que tem a coisa em seu poder, temporariamente, em virtude de direito pessoal, ou real, não anula a indireta, de quem aquela foi havida, podendo o possuidor direto defender a sua posse contra o indireto."},"1198":{"topicId":"OJ26-DCIV-CC-13","texto":"Art. 1198. Considera-se detentor aquele que, achando-se em relação de dependência para com outro, conserva a posse em nome deste e em cumprimento de ordens ou instruções suas.\nParágrafo único. Aquele que começou a comportar-se do modo como prescreve este artigo, em relação ao bem e à outra pessoa, presume-se detentor, até que prove o contrário."},"1199":{"topicId":"OJ26-DCIV-CC-13","texto":"Art. 1199. Se duas ou mais pessoas possuírem coisa indivisa, poderá cada uma exercer sobre ela atos possessórios, contanto que não excluam os dos outros compossuidores."},"1200":{"topicId":"OJ26-DCIV-CC-13","texto":"Art. 1200. É justa a posse que não for violenta, clandestina ou precária."},"1201":{"topicId":"OJ26-DCIV-CC-13","texto":"Art. 1201. É de boa-fé a posse, se o possuidor ignora o vício, ou o obstáculo que impede a aquisição da coisa.\nParágrafo único. O possuidor com justo título tem por si a presunção de boa-fé, salvo prova em contrário, ou quando a lei expressamente não admite esta presunção."},"1202":{"topicId":"OJ26-DCIV-CC-13","texto":"Art. 1202. A posse de boa-fé só perde este caráter no caso e desde o momento em que as circunstâncias façam presumir que o possuidor não ignora que possui indevidamente."},"1203":{"topicId":"OJ26-DCIV-CC-13","texto":"Art. 1203. Salvo prova em contrário, entende-se manter a posse o mesmo caráter com que foi adquirida."},"1431":{"topicId":"OJ26-DCIV-CC-14","texto":"Art. 1431. Constitui-se o penhor pela transferência efetiva da posse que, em garantia do débito ao credor ou a quem o represente, faz o devedor, ou alguém por ele, de uma coisa móvel, suscetível de alienação.\nParágrafo único. No penhor rural, industrial, mercantil e de veículos, as coisas empenhadas continuam em poder do devedor, que as deve guardar e conservar."},"1432":{"topicId":"OJ26-DCIV-CC-14","texto":"Art. 1432. O instrumento do penhor deverá ser levado a registro, por qualquer dos contratantes; o do penhor comum será registrado no Cartório de Títulos e Documentos."},"1442":{"topicId":"OJ26-DCIV-CC-15","texto":"Art. 1442. Podem ser objeto de penhor:\nI - máquinas e instrumentos de agricultura;\nII - colheitas pendentes, ou em via de formação;\nIII - frutos acondicionados ou armazenados;\nIV - lenha cortada e carvão vegetal;\nV - animais do serviço ordinário de estabelecimento agrícola."},"1444":{"topicId":"OJ26-DCIV-CC-16","texto":"Art. 1444. Podem ser objeto de penhor os animais que integram a atividade pastoril, agrícola ou de lacticínios."},"1445":{"topicId":"OJ26-DCIV-CC-16","texto":"Art. 1445. O devedor não poderá alienar os animais empenhados sem prévio consentimento, por escrito, do credor.\nParágrafo único. Quando o devedor pretende alienar o gado empenhado ou, por negligência, ameace prejudicar o credor, poderá este requerer se depositem os animais sob a guarda de terceiro, ou exigir que se lhe pague a dívida de imediato."},"1446":{"topicId":"OJ26-DCIV-CC-16","texto":"Art. 1446. Os animais da mesma espécie, comprados para substituir os mortos, ficam sub-rogados no penhor.\nParágrafo único. Presume-se a substituição prevista neste artigo, mas não terá eficácia contra terceiros, se não constar de menção adicional ao respectivo contrato, a qual deverá ser averbada."},"1447":{"topicId":"OJ26-DCIV-CC-16","texto":"Art. 1447. Podem ser objeto de penhor máquinas, aparelhos, materiais, instrumentos, instalados e em funcionamento, com os acessórios ou sem eles; animais, utilizados na indústria; sal e bens destinados à exploração das salinas; produtos de suinocultura, animais destinados à industrialização de carnes e derivados; matérias-primas e produtos industrializados.\nParágrafo único. Regula-se pelas disposições relativas aos armazéns gerais o penhor das mercadorias neles depositadas."},"1451":{"topicId":"OJ26-DCIV-CC-17","texto":"Art. 1451. Podem ser objeto de penhor direitos, suscetíveis de cessão, sobre coisas móveis."},"1461":{"topicId":"OJ26-DCIV-CC-18","texto":"Art. 1461. Podem ser objeto de penhor os veículos empregados em qualquer espécie de transporte ou condução."},"1467":{"topicId":"OJ26-DCIV-CC-19","texto":"Art. 1467. São credores pignoratícios, independentemente de convenção:\nI - os hospedeiros, ou fornecedores de pousada ou alimento, sobre as bagagens, móveis, jóias ou dinheiro que os seus consumidores ou fregueses tiverem consigo nas respectivas casas ou estabelecimentos, pelas despesas ou consumo que aí tiverem feito;\nII - o dono do prédio rústico ou urbano, sobre os bens móveis que o rendeiro ou inquilino tiver guarnecendo o mesmo prédio, pelos aluguéis ou rendas."},"1468":{"topicId":"OJ26-DCIV-CC-19","texto":"Art. 1468. A conta das dívidas enumeradas no inciso I do artigo antecedente será extraída conforme a tabela impressa, prévia e ostensivamente exposta na casa, dos preços de hospedagem, da pensão ou dos gêneros fornecidos, sob pena de nulidade do penhor."},"1469":{"topicId":"OJ26-DCIV-CC-19","texto":"Art. 1469. Em cada um dos casos do art. 1.467, o credor poderá tomar em garantia um ou mais objetos até o valor da dívida."},"1470":{"topicId":"OJ26-DCIV-CC-19","texto":"Art. 1470. Os credores, compreendidos no art. 1.467, podem fazer efetivo o penhor, antes de recorrerem à autoridade judiciária, sempre que haja perigo na demora, dando aos devedores comprovante dos bens de que se apossarem."},"1471":{"topicId":"OJ26-DCIV-CC-19","texto":"Art. 1471. Tomado o penhor, requererá o credor, ato contínuo, a sua homologação judicial."},"1472":{"topicId":"OJ26-DCIV-CC-19","texto":"Art. 1472. Pode o locatário impedir a constituição do penhor mediante caução idônea."},"1728":{"topicId":"OJ26-DCIV-CC-20","texto":"Art. 1728. Os filhos menores são postos em tutela:\nI - com o falecimento dos pais, ou sendo estes julgados ausentes;\nII - em caso de os pais decaírem do poder familiar."},"1767":{"topicId":"OJ26-DCIV-CC-21","texto":"Art. 1767. Estão sujeitos a curatela:\nI - aqueles que, por causa transitória ou permanente, não puderem exprimir sua vontade;\nIII - os ébrios habituais e os viciados em tóxico;\nV - os pródigos."},"1775":{"topicId":"OJ26-DCIV-CC-22","texto":"Art. 1775. O cônjuge ou companheiro, não separado judicialmente ou de fato, é, de direito, curador do outro, quando interdito.\n§ 1º Na falta do cônjuge ou companheiro, é curador legítimo o pai ou a mãe; na falta destes, o descendente que se demonstrar mais apto.\n§ 2º Entre os descendentes, os mais próximos precedem aos mais remotos.\n§ 3º Na falta das pessoas mencionadas neste artigo, compete ao juiz a escolha do curador."},"1777":{"topicId":"OJ26-DCIV-CC-22","texto":"Art. 1777. As pessoas referidas no inciso I do art. 1.767 receberão todo o apoio necessário para ter preservado o direito à convivência familiar e comunitária, sendo evitado o seu recolhimento em estabelecimento que os afaste desse convívio."},"1778":{"topicId":"OJ26-DCIV-CC-22","texto":"Art. 1778. A autoridade do curador estende-se à pessoa e aos bens dos filhos do curatelado, observado o art. 5º."},"1997":{"topicId":"OJ26-DCIV-CC-23","texto":"Art. 1997. A herança responde pelo pagamento das dívidas do falecido; mas, feita a partilha, só respondem os herdeiros, cada qual em proporção da parte que na herança lhe coube.\n§ 1º Quando, antes da partilha, for requerido no inventário o pagamento de dívidas constantes de documentos, revestidos de formalidades legais, constituindo prova bastante da obrigação, e houver impugnação, que não se funde na alegação de pagamento, acompanhada de prova valiosa, o juiz mandará reservar, em poder do inventariante, bens suficientes para solução do débito, sobre os quais venha a recair oportunamente a execução.\n§ 2º No caso previsto no parágrafo antecedente, o credor será obrigado a iniciar a ação de cobrança no prazo de trinta dias, sob pena de se tornar de nenhum efeito a providência indicada."},"49-A":{"topicId":"OJ26-DCIV-CC-03","texto":"Art. 49-A. A pessoa jurídica não se confunde com os seus sócios, associados, instituidores ou administradores.\nParágrafo único. A autonomia patrimonial das pessoas jurídicas é um instrumento lícito de alocação e segregação de riscos, estabelecido pela lei com a finalidade de estimular empreendimentos, para a geração de empregos, tributo, renda e inovação em benefício de todos."},"1775-A":{"topicId":"OJ26-DCIV-CC-22","texto":"Art. 1775-A. Na nomeação de curador para a pessoa com deficiência, o juiz poderá estabelecer curatela compartilhada a mais de uma pessoa."}}},"senado-cpc-2015":{"id":"DIR-DPCI-CPC","concordancia":true,"nome":"Código de Processo Civil","rotulo":"do Código de Processo Civil (Lei 13.105/2015)","titulo":"Direito: Código de Processo Civil","disciplina":"DPCI","url":"https://normas.leg.br/api/public/normas?urn=urn:lex:br:federal:lei:2015-03-16;13105&&tipo_documento=maior-detalhe","consultado_em":"2026-11-21","sha256":"f77a0a459b6342419b05537f680321a40dd0089581c273b4fb445d274919223d","observacao":"Texto consolidado do Senado reconstruído na data de referência do edital (14/10/2026). A própria fonte informa atualização até 2025-03-13: alterações posteriores a essa data podem não constar.","artigos":{"1":{"topicId":"OJ26-DPCI-CPC-01","texto":"Art. 1º O processo civil será ordenado, disciplinado e interpretado conforme os valores e as normas fundamentais estabelecidos na Constituição da República Federativa do Brasil, observando-se as disposições deste Código."},"2":{"topicId":"OJ26-DPCI-CPC-01","texto":"Art. 2º O processo começa por iniciativa da parte e se desenvolve por impulso oficial, salvo as exceções previstas em lei."},"3":{"topicId":"OJ26-DPCI-CPC-01","texto":"Art. 3º Não se excluirá da apreciação jurisdicional ameaça ou lesão a direito.\n§ 1º É permitida a arbitragem, na forma da lei.\n§ 2º O Estado promoverá, sempre que possível, a solução consensual dos conflitos.\n§ 3º A conciliação, a mediação e outros métodos de solução consensual de conflitos deverão ser estimulados por juízes, advogados, defensores públicos e membros do Ministério Público, inclusive no curso do processo judicial."},"4":{"topicId":"OJ26-DPCI-CPC-01","texto":"Art. 4º As partes têm o direito de obter em prazo razoável a solução integral do mérito, incluída a atividade satisfativa."},"5":{"topicId":"OJ26-DPCI-CPC-01","texto":"Art. 5º Aquele que de qualquer forma participa do processo deve comportar-se de acordo com a boa-fé."},"6":{"topicId":"OJ26-DPCI-CPC-01","texto":"Art. 6º Todos os sujeitos do processo devem cooperar entre si para que se obtenha, em tempo razoável, decisão de mérito justa e efetiva."},"7":{"topicId":"OJ26-DPCI-CPC-01","texto":"Art. 7º É assegurada às partes paridade de tratamento em relação ao exercício de direitos e faculdades processuais, aos meios de defesa, aos ônus, aos deveres e à aplicação de sanções processuais, competindo ao juiz zelar pelo efetivo contraditório."},"8":{"topicId":"OJ26-DPCI-CPC-01","texto":"Art. 8º Ao aplicar o ordenamento jurídico, o juiz atenderá aos fins sociais e às exigências do bem comum, resguardando e promovendo a dignidade da pessoa humana e observando a proporcionalidade, a razoabilidade, a legalidade, a publicidade e a eficiência."},"9":{"topicId":"OJ26-DPCI-CPC-01","texto":"Art. 9º Não se proferirá decisão contra uma das partes sem que ela seja previamente ouvida.\nParágrafo único. O disposto no caput não se aplica:\nI - à tutela provisória de urgência;\nIII - à decisão prevista no art. 701."},"10":{"topicId":"OJ26-DPCI-CPC-01","texto":"Art. 10. O juiz não pode decidir, em grau algum de jurisdição, com base em fundamento a respeito do qual não se tenha dado às partes oportunidade de se manifestar, ainda que se trate de matéria sobre a qual deva decidir de ofício."},"11":{"topicId":"OJ26-DPCI-CPC-01","texto":"Art. 11. Todos os julgamentos dos órgãos do Poder Judiciário serão públicos, e fundamentadas todas as decisões, sob pena de nulidade.\nParágrafo único. Nos casos de segredo de justiça, pode ser autorizada a presença somente das partes, de seus advogados, de defensores públicos ou do Ministério Público."},"13":{"topicId":"OJ26-DPCI-CPC-02","texto":"Art. 13. A jurisdição civil será regida pelas normas processuais brasileiras, ressalvadas as disposições específicas previstas em tratados, convenções ou acordos internacionais de que o Brasil seja parte."},"14":{"topicId":"OJ26-DPCI-CPC-02","texto":"Art. 14. A norma processual não retroagirá e será aplicável imediatamente aos processos em curso, respeitados os atos processuais praticados e as situações jurídicas consolidadas sob a vigência da norma revogada."},"16":{"topicId":"OJ26-DPCI-CPC-02","texto":"Art. 16. A jurisdição civil é exercida pelos juízes e pelos tribunais em todo o território nacional, conforme as disposições deste Código."},"17":{"topicId":"OJ26-DPCI-CPC-02","texto":"Art. 17. Para postular em juízo é necessário ter interesse e legitimidade."},"18":{"topicId":"OJ26-DPCI-CPC-02","texto":"Art. 18. Ninguém poderá pleitear direito alheio em nome próprio, salvo quando autorizado pelo ordenamento jurídico.\nParágrafo único. Havendo substituição processual, o substituído poderá intervir como assistente litisconsorcial."},"21":{"topicId":"OJ26-DPCI-CPC-03","texto":"Art. 21. Compete à autoridade judiciária brasileira processar e julgar as ações em que:\nI - o réu, qualquer que seja a sua nacionalidade, estiver domiciliado no Brasil;\nII - no Brasil tiver de ser cumprida a obrigação;\nIII - o fundamento seja fato ocorrido ou ato praticado no Brasil.\nParágrafo único. Para o fim do disposto no inciso I, considera-se domiciliada no Brasil a pessoa jurídica estrangeira que nele tiver agência, filial ou sucursal."},"22":{"topicId":"OJ26-DPCI-CPC-03","texto":"Art. 22. Compete, ainda, à autoridade judiciária brasileira processar e julgar as ações:\nI - de alimentos, quando:\na) o credor tiver domicílio ou residência no Brasil;\nb) o réu mantiver vínculos no Brasil, tais como posse ou propriedade de bens, recebimento de renda ou obtenção de benefícios econômicos;\nII - decorrentes de relações de consumo, quando o consumidor tiver domicílio ou residência no Brasil;\nIII - em que as partes, expressa ou tacitamente, se submeterem à jurisdição nacional."},"23":{"topicId":"OJ26-DPCI-CPC-03","texto":"Art. 23. Compete à autoridade judiciária brasileira, com exclusão de qualquer outra:\nI - conhecer de ações relativas a imóveis situados no Brasil;\nII - em matéria de sucessão hereditária, proceder à confirmação de testamento particular e ao inventário e à partilha de bens situados no Brasil, ainda que o autor da herança seja de nacionalidade estrangeira ou tenha domicílio fora do território nacional;\nIII - em divórcio, separação judicial ou dissolução de união estável, proceder à partilha de bens situados no Brasil, ainda que o titular seja de nacionalidade estrangeira ou tenha domicílio fora do território nacional."},"24":{"topicId":"OJ26-DPCI-CPC-03","texto":"Art. 24. A ação proposta perante tribunal estrangeiro não induz litispendência e não obsta a que a autoridade judiciária brasileira conheça da mesma causa e das que lhe são conexas, ressalvadas as disposições em contrário de tratados internacionais e acordos bilaterais em vigor no Brasil.\nParágrafo único. A pendência de causa perante a jurisdição brasileira não impede a homologação de sentença judicial estrangeira quando exigida para produzir efeitos no Brasil."},"25":{"topicId":"OJ26-DPCI-CPC-03","texto":"Art. 25. Não compete à autoridade judiciária brasileira o processamento e o julgamento da ação quando houver cláusula de eleição de foro exclusivo estrangeiro em contrato internacional, arguida pelo réu na contestação.\n§ 1º Não se aplica o disposto no caput às hipóteses de competência internacional exclusiva previstas neste Capítulo.\n§ 2º Aplica-se à hipótese do caput o art. 63, §§ 1º a 4º."},"26":{"topicId":"OJ26-DPCI-CPC-03","texto":"Art. 26. A cooperação jurídica internacional será regida por tratado de que o Brasil faz parte e observará:\nI - o respeito às garantias do devido processo legal no Estado requerente;\nII - a igualdade de tratamento entre nacionais e estrangeiros, residentes ou não no Brasil, em relação ao acesso à justiça e à tramitação dos processos, assegurando-se assistência judiciária aos necessitados;\nIII - a publicidade processual, exceto nas hipóteses de sigilo previstas na legislação brasileira ou na do Estado requerente;\nIV - a existência de autoridade central para recepção e transmissão dos pedidos de cooperação;\nV - a espontaneidade na transmissão de informações a autoridades estrangeiras.\n§ 1º Na ausência de tratado, a cooperação jurídica internacional poderá realizar-se com base em reciprocidade, manifestada por via diplomática.\n§ 2º Não se exigirá a reciprocidade referida no § 1º para homologação de sentença estrangeira.\n§ 3º Na cooperação jurídica internacional não será admitida a prática de atos que contrariem ou que produzam resultados incompatíveis com as normas fundamentais que regem o Estado brasileiro.\n§ 4º O Ministério da Justiça exercerá as funções de autoridade central na ausência de designação específica."},"27":{"topicId":"OJ26-DPCI-CPC-03","texto":"Art. 27. A cooperação jurídica internacional terá por objeto:\nI - citação, intimação e notificação judicial e extrajudicial;\nII - colheita de provas e obtenção de informações;\nIII - homologação e cumprimento de decisão;\nIV - concessão de medida judicial de urgência;\nV - assistência jurídica internacional;\nVI - qualquer outra medida judicial ou extrajudicial não proibida pela lei brasileira."},"36":{"topicId":"OJ26-DPCI-CPC-04","texto":"Art. 36. O procedimento da carta rogatória perante o Superior Tribunal de Justiça é de jurisdição contenciosa e deve assegurar às partes as garantias do devido processo legal.\n§ 1º A defesa restringir-se-á à discussão quanto ao atendimento dos requisitos para que o pronunciamento judicial estrangeiro produza efeitos no Brasil.\n§ 2º Em qualquer hipótese, é vedada a revisão do mérito do pronunciamento judicial estrangeiro pela autoridade judiciária brasileira."},"42":{"topicId":"OJ26-DPCI-CPC-05","texto":"Art. 42. As causas cíveis serão processadas e decididas pelo juiz nos limites de sua competência, ressalvado às partes o direito de instituir juízo arbitral, na forma da lei."},"43":{"topicId":"OJ26-DPCI-CPC-05","texto":"Art. 43. Determina-se a competência no momento do registro ou da distribuição da petição inicial, sendo irrelevantes as modificações do estado de fato ou de direito ocorridas posteriormente, salvo quando suprimirem órgão judiciário ou alterarem a competência absoluta."},"44":{"topicId":"OJ26-DPCI-CPC-05","texto":"Art. 44. Obedecidos os limites estabelecidos pela Constituição Federal , a competência é determinada pelas normas previstas neste Código ou em legislação especial, pelas normas de organização judiciária e, ainda, no que couber, pelas constituições dos Estados."},"45":{"topicId":"OJ26-DPCI-CPC-05","texto":"Art. 45. Tramitando o processo perante outro juízo, os autos serão remetidos ao juízo federal competente se nele intervier a União, suas empresas públicas, entidades autárquicas e fundações, ou conselho de fiscalização de atividade profissional, na qualidade de parte ou de terceiro interveniente, exceto as ações:\nI - de recuperação judicial, falência, insolvência civil e acidente de trabalho;\nII - sujeitas à justiça eleitoral e à justiça do trabalho.\n§ 1º Os autos não serão remetidos se houver pedido cuja apreciação seja de competência do juízo perante o qual foi proposta a ação.\n§ 2º Na hipótese do § 1º, o juiz, ao não admitir a cumulação de pedidos em razão da incompetência para apreciar qualquer deles, não examinará o mérito daquele em que exista interesse da União, de suas entidades autárquicas ou de suas empresas públicas.\n§ 3º O juízo federal restituirá os autos ao juízo estadual sem suscitar conflito se o ente federal cuja presença ensejou a remessa for excluído do processo."},"46":{"topicId":"OJ26-DPCI-CPC-05","texto":"Art. 46. A ação fundada em direito pessoal ou em direito real sobre bens móveis será proposta, em regra, no foro de domicílio do réu.\n§ 1º Tendo mais de um domicílio, o réu será demandado no foro de qualquer deles.\n§ 2º Sendo incerto ou desconhecido o domicílio do réu, ele poderá ser demandado onde for encontrado ou no foro de domicílio do autor.\n§ 3º Quando o réu não tiver domicílio ou residência no Brasil, a ação será proposta no foro de domicílio do autor, e, se este também residir fora do Brasil, a ação será proposta em qualquer foro.\n§ 4º Havendo 2 (dois) ou mais réus com diferentes domicílios, serão demandados no foro de qualquer deles, à escolha do autor."},"47":{"topicId":"OJ26-DPCI-CPC-05","texto":"Art. 47. Para as ações fundadas em direito real sobre imóveis é competente o foro de situação da coisa.\n§ 1º O autor pode optar pelo foro de domicílio do réu ou pelo foro de eleição se o litígio não recair sobre direito de propriedade, vizinhança, servidão, divisão e demarcação de terras e de nunciação de obra nova.\n§ 2º A ação possessória imobiliária será proposta no foro de situação da coisa, cujo juízo tem competência absoluta."},"48":{"topicId":"OJ26-DPCI-CPC-05","texto":"Art. 48. O foro de domicílio do autor da herança, no Brasil, é o competente para o inventário, a partilha, a arrecadação, o cumprimento de disposições de última vontade, a impugnação ou anulação de partilha extrajudicial e para todas as ações em que o espólio for réu, ainda que o óbito tenha ocorrido no estrangeiro.\nParágrafo único. Se o autor da herança não possuía domicílio certo, é competente:\nI - o foro de situação dos bens imóveis;\nII - havendo bens imóveis em foros diferentes, qualquer destes;\nIII - não havendo bens imóveis, o foro do local de qualquer dos bens do espólio."},"49":{"topicId":"OJ26-DPCI-CPC-05","texto":"Art. 49. A ação em que o ausente for réu será proposta no foro de seu último domicílio, também competente para a arrecadação, o inventário, a partilha e o cumprimento de disposições testamentárias."},"50":{"topicId":"OJ26-DPCI-CPC-05","texto":"Art. 50. A ação em que o incapaz for réu será proposta no foro de domicílio de seu representante ou assistente."},"51":{"topicId":"OJ26-DPCI-CPC-05","texto":"Art. 51. É competente o foro de domicílio do réu para as causas em que seja autora a União.\nParágrafo único. Se a União for a demandada, a ação poderá ser proposta no foro de domicílio do autor, no de ocorrência do ato ou fato que originou a demanda, no de situação da coisa ou no Distrito Federal."},"52":{"topicId":"OJ26-DPCI-CPC-05","texto":"Art. 52. É competente o foro de domicílio do réu para as causas em que seja autor Estado ou o Distrito Federal."},"53":{"topicId":"OJ26-DPCI-CPC-05","texto":"Art. 53. É competente o foro:\nI - para a ação de divórcio, separação, anulação de casamento e reconhecimento ou dissolução de união estável:\na) de domicílio do guardião de filho incapaz;\nb) do último domicílio do casal, caso não haja filho incapaz;\nc) de domicílio do réu, se nenhuma das partes residir no antigo domicílio do casal;\nd) de domicílio da vítima de violência doméstica e familiar, nos termos da Lei nº 11.340, de 7 de agosto de 2006 (Lei Maria da Penha);\nII - de domicílio ou residência do alimentando, para a ação em que se pedem alimentos;\nIII - do lugar:\na) onde está a sede, para a ação em que for ré pessoa jurídica;\nb) onde se acha agência ou sucursal, quanto às obrigações que a pessoa jurídica contraiu;\nc) onde exerce suas atividades, para a ação em que for ré sociedade ou associação sem personalidade jurídica;\nd) onde a obrigação deve ser satisfeita, para a ação em que se lhe exigir o cumprimento;\ne) de residência do idoso, para a causa que verse sobre direito previsto no respectivo estatuto;\nf) da sede da serventia notarial ou de registro, para a ação de reparação de dano por ato praticado em razão do ofício;\nIV - do lugar do ato ou fato para a ação:\na) de reparação de dano;\nb) em que for réu administrador ou gestor de negócios alheios;\nV - de domicílio do autor ou do local do fato, para a ação de reparação de dano sofrido em razão de delito ou acidente de veículos, inclusive aeronaves."},"64":{"topicId":"OJ26-DPCI-CPC-06","texto":"Art. 64. A incompetência, absoluta ou relativa, será alegada como questão preliminar de contestação.\n§ 1º A incompetência absoluta pode ser alegada em qualquer tempo e grau de jurisdição e deve ser declarada de ofício.\n§ 2º Após manifestação da parte contrária, o juiz decidirá imediatamente a alegação de incompetência.\n§ 3º Caso a alegação de incompetência seja acolhida, os autos serão remetidos ao juízo competente.\n§ 4º Salvo decisão judicial em sentido contrário, conservar-se-ão os efeitos de decisão proferida pelo juízo incompetente até que outra seja proferida, se for o caso, pelo juízo competente."},"65":{"topicId":"OJ26-DPCI-CPC-06","texto":"Art. 65. Prorrogar-se-á a competência relativa se o réu não alegar a incompetência em preliminar de contestação.\nParágrafo único. A incompetência relativa pode ser alegada pelo Ministério Público nas causas em que atuar."},"66":{"topicId":"OJ26-DPCI-CPC-06","texto":"Art. 66. Há conflito de competência quando:\nI - 2 (dois) ou mais juízes se declaram competentes;\nII - 2 (dois) ou mais juízes se consideram incompetentes, atribuindo um ao outro a competência;\nIII - entre 2 (dois) ou mais juízes surge controvérsia acerca da reunião ou separação de processos.\nParágrafo único. O juiz que não acolher a competência declinada deverá suscitar o conflito, salvo se a atribuir a outro juízo."},"70":{"topicId":"OJ26-DPCI-CPC-07","texto":"Art. 70. Toda pessoa que se encontre no exercício de seus direitos tem capacidade para estar em juízo."},"71":{"topicId":"OJ26-DPCI-CPC-07","texto":"Art. 71. O incapaz será representado ou assistido por seus pais, por tutor ou por curador, na forma da lei."},"72":{"topicId":"OJ26-DPCI-CPC-07","texto":"Art. 72. O juiz nomeará curador especial ao:\nI - incapaz, se não tiver representante legal ou se os interesses deste colidirem com os daquele, enquanto durar a incapacidade;\nII - réu preso revel, bem como ao réu revel citado por edital ou com hora certa, enquanto não for constituído advogado.\nParágrafo único. A curatela especial será exercida pela Defensoria Pública, nos termos da lei."},"73":{"topicId":"OJ26-DPCI-CPC-07","texto":"Art. 73. O cônjuge necessitará do consentimento do outro para propor ação que verse sobre direito real imobiliário, salvo quando casados sob o regime de separação absoluta de bens.\n§ 1º Ambos os cônjuges serão necessariamente citados para a ação:\nI - que verse sobre direito real imobiliário, salvo quando casados sob o regime de separação absoluta de bens;\nII - resultante de fato que diga respeito a ambos os cônjuges ou de ato praticado por eles;\nIII - fundada em dívida contraída por um dos cônjuges a bem da família;\nIV - que tenha por objeto o reconhecimento, a constituição ou a extinção de ônus sobre imóvel de um ou de ambos os cônjuges.\n§ 2º Nas ações possessórias, a participação do cônjuge do autor ou do réu somente é indispensável nas hipóteses de composse ou de ato por ambos praticado.\n§ 3º Aplica-se o disposto neste artigo à união estável comprovada nos autos."},"74":{"topicId":"OJ26-DPCI-CPC-07","texto":"Art. 74. O consentimento previsto no art. 73 pode ser suprido judicialmente quando for negado por um dos cônjuges sem justo motivo, ou quando lhe seja impossível concedê-lo.\nParágrafo único. A falta de consentimento, quando necessário e não suprido pelo juiz, invalida o processo."},"75":{"topicId":"OJ26-DPCI-CPC-07","texto":"Art. 75. Serão representados em juízo, ativa e passivamente:\nI - a União, pela Advocacia-Geral da União, diretamente ou mediante órgão vinculado;\nII - o Estado e o Distrito Federal, por seus procuradores;\nIII - o Município, por seu prefeito, procurador ou Associação de Representação de Municípios, quando expressamente autorizada;\nIV - a autarquia e a fundação de direito público, por quem a lei do ente federado designar;\nV - a massa falida, pelo administrador judicial;\nVI - a herança jacente ou vacante, por seu curador;\nVII - o espólio, pelo inventariante;\nVIII - a pessoa jurídica, por quem os respectivos atos constitutivos designarem ou, não havendo essa designação, por seus diretores;\nIX - a sociedade e a associação irregulares e outros entes organizados sem personalidade jurídica, pela pessoa a quem couber a administração de seus bens;\nX - a pessoa jurídica estrangeira, pelo gerente, representante ou administrador de sua filial, agência ou sucursal aberta ou instalada no Brasil;\nXI - o condomínio, pelo administrador ou síndico.\n§ 1º Quando o inventariante for dativo, os sucessores do falecido serão intimados no processo no qual o espólio seja parte.\n§ 2º A sociedade ou associação sem personalidade jurídica não poderá opor a irregularidade de sua constituição quando demandada.\n§ 3º O gerente de filial ou agência presume-se autorizado pela pessoa jurídica estrangeira a receber citação para qualquer processo.\n§ 4º Os Estados e o Distrito Federal poderão ajustar compromisso recíproco para prática de ato processual por seus procuradores em favor de outro ente federado, mediante convênio firmado pelas respectivas procuradorias.\n§ 5º A representação judicial do Município pela Associação de Representação de Municípios somente poderá ocorrer em questões de interesse comum dos Municípios associados e dependerá de autorização do respectivo chefe do Poder Executivo municipal, com indicação específica do direito ou da obrigação a ser objeto das medidas judiciais."},"76":{"topicId":"OJ26-DPCI-CPC-07","texto":"Art. 76. Verificada a incapacidade processual ou a irregularidade da representação da parte, o juiz suspenderá o processo e designará prazo razoável para que seja sanado o vício.\n§ 1º Descumprida a determinação, caso o processo esteja na instância originária:\nI - o processo será extinto, se a providência couber ao autor;\nII - o réu será considerado revel, se a providência lhe couber;\nIII - o terceiro será considerado revel ou excluído do processo, dependendo do polo em que se encontre.\n§ 2º Descumprida a determinação em fase recursal perante tribunal de justiça, tribunal regional federal ou tribunal superior, o relator:\nI - não conhecerá do recurso, se a providência couber ao recorrente;\nII - determinará o desentranhamento das contrarrazões, se a providência couber ao recorrido."},"77":{"topicId":"OJ26-DPCI-CPC-07","texto":"Art. 77. Além de outros previstos neste Código, são deveres das partes, de seus procuradores e de todos aqueles que de qualquer forma participem do processo:\nI - expor os fatos em juízo conforme a verdade;\nII - não formular pretensão ou de apresentar defesa quando cientes de que são destituídas de fundamento;\nIII - não produzir provas e não praticar atos inúteis ou desnecessários à declaração ou à defesa do direito;\nIV - cumprir com exatidão as decisões jurisdicionais, de natureza provisória ou final, e não criar embaraços à sua efetivação;\nV - declinar, no primeiro momento que lhes couber falar nos autos, o endereço residencial ou profissional onde receberão intimações, atualizando essa informação sempre que ocorrer qualquer modificação temporária ou definitiva;\nVI - não praticar inovação ilegal no estado de fato de bem ou direito litigioso;\nVII - informar e manter atualizados seus dados cadastrais perante os órgãos do Poder Judiciário e, no caso do § 6º do art. 246 deste Código, da Administração Tributária, para recebimento de citações e intimações.\n§ 1º Nas hipóteses dos incisos IV e VI, o juiz advertirá qualquer das pessoas mencionadas no caput de que sua conduta poderá ser punida como ato atentatório à dignidade da justiça.\n§ 2º A violação ao disposto nos incisos IV e VI constitui ato atentatório à dignidade da justiça, devendo o juiz, sem prejuízo das sanções criminais, civis e processuais cabíveis, aplicar ao responsável multa de até vinte por cento do valor da causa, de acordo com a gravidade da conduta.\n§ 3º Não sendo paga no prazo a ser fixado pelo juiz, a multa prevista no § 2º será inscrita como dívida ativa da União ou do Estado após o trânsito em julgado da decisão que a fixou, e sua execução observará o procedimento da execução fiscal, revertendo-se aos fundos previstos no art. 97.\n§ 4º A multa estabelecida no § 2º poderá ser fixada independentemente da incidência das previstas nos arts. 523, § 1º, e 536, § 1º.\n§ 5º Quando o valor da causa for irrisório ou inestimável, a multa prevista no § 2º poderá ser fixada em até 10 (dez) vezes o valor do salário-mínimo.\n§ 6º Aos advogados públicos ou privados e aos membros da Defensoria Pública e do Ministério Público não se aplica o disposto nos §§ 2º a 5º, devendo eventual responsabilidade disciplinar ser apurada pelo respectivo órgão de classe ou corregedoria, ao qual o juiz oficiará.\n§ 7º Reconhecida violação ao disposto no inciso VI, o juiz determinará o restabelecimento do estado anterior, podendo, ainda, proibir a parte de falar nos autos até a purgação do atentado, sem prejuízo da aplicação do § 2º.\n§ 8º O representante judicial da parte não pode ser compelido a cumprir decisão em seu lugar."},"78":{"topicId":"OJ26-DPCI-CPC-07","texto":"Art. 78. É vedado às partes, a seus procuradores, aos juízes, aos membros do Ministério Público e da Defensoria Pública e a qualquer pessoa que participe do processo empregar expressões ofensivas nos escritos apresentados.\n§ 1º Quando expressões ou condutas ofensivas forem manifestadas oral ou presencialmente, o juiz advertirá o ofensor de que não as deve usar ou repetir, sob pena de lhe ser cassada a palavra.\n§ 2º De ofício ou a requerimento do ofendido, o juiz determinará que as expressões ofensivas sejam riscadas e, a requerimento do ofendido, determinará a expedição de certidão com inteiro teor das expressões ofensivas e a colocará à disposição da parte interessada."},"79":{"topicId":"OJ26-DPCI-CPC-07","texto":"Art. 79. Responde por perdas e danos aquele que litigar de má-fé como autor, réu ou interveniente."},"80":{"topicId":"OJ26-DPCI-CPC-07","texto":"Art. 80. Considera-se litigante de má-fé aquele que:\nI - deduzir pretensão ou defesa contra texto expresso de lei ou fato incontroverso;\nII - alterar a verdade dos fatos;\nIII - usar do processo para conseguir objetivo ilegal;\nIV - opuser resistência injustificada ao andamento do processo;\nV - proceder de modo temerário em qualquer incidente ou ato do processo;\nVI - provocar incidente manifestamente infundado;\nVII - interpuser recurso com intuito manifestamente protelatório."},"81":{"topicId":"OJ26-DPCI-CPC-07","texto":"Art. 81. De ofício ou a requerimento, o juiz condenará o litigante de má-fé a pagar multa, que deverá ser superior a um por cento e inferior a dez por cento do valor corrigido da causa, a indenizar a parte contrária pelos prejuízos que esta sofreu e a arcar com os honorários advocatícios e com todas as despesas que efetuou.\n§ 1º Quando forem 2 (dois) ou mais os litigantes de má-fé, o juiz condenará cada um na proporção de seu respectivo interesse na causa ou solidariamente aqueles que se coligaram para lesar a parte contrária.\n§ 2º Quando o valor da causa for irrisório ou inestimável, a multa poderá ser fixada em até 10 (dez) vezes o valor do salário-mínimo.\n§ 3º O valor da indenização será fixado pelo juiz ou, caso não seja possível mensurá-lo, liquidado por arbitramento ou pelo procedimento comum, nos próprios autos."},"83":{"topicId":"OJ26-DPCI-CPC-07","texto":"Art. 83. O autor, brasileiro ou estrangeiro, que residir fora do Brasil ou deixar de residir no país ao longo da tramitação de processo prestará caução suficiente ao pagamento das custas e dos honorários de advogado da parte contrária nas ações que propuser, se não tiver no Brasil bens imóveis que lhes assegurem o pagamento.\n§ 1º Não se exigirá a caução de que trata o caput:\nI - quando houver dispensa prevista em acordo ou tratado internacional de que o Brasil faz parte;\nII - na execução fundada em título extrajudicial e no cumprimento de sentença;\nIII - na reconvenção.\n§ 2º Verificando-se no trâmite do processo que se desfalcou a garantia, poderá o interessado exigir reforço da caução, justificando seu pedido com a indicação da depreciação do bem dado em garantia e a importância do reforço que pretende obter."},"84":{"topicId":"OJ26-DPCI-CPC-07","texto":"Art. 84. As despesas abrangem as custas dos atos do processo, a indenização de viagem, a remuneração do assistente técnico e a diária de testemunha."},"85":{"topicId":"OJ26-DPCI-CPC-07","texto":"Art. 85. A sentença condenará o vencido a pagar honorários ao advogado do vencedor.\n§ 1º São devidos honorários advocatícios na reconvenção, no cumprimento de sentença, provisório ou definitivo, na execução, resistida ou não, e nos recursos interpostos, cumulativamente.\n§ 2º Os honorários serão fixados entre o mínimo de dez e o máximo de vinte por cento sobre o valor da condenação, do proveito econômico obtido ou, não sendo possível mensurá-lo, sobre o valor atualizado da causa, atendidos:\nI - o grau de zelo do profissional;\nII - o lugar de prestação do serviço;\nIII - a natureza e a importância da causa;\nIV - o trabalho realizado pelo advogado e o tempo exigido para o seu serviço.\n§ 3º Nas causas em que a Fazenda Pública for parte, a fixação dos honorários observará os critérios estabelecidos nos incisos I a IV do § 2º e os seguintes percentuais:\nI - mínimo de dez e máximo de vinte por cento sobre o valor da condenação ou do proveito econômico obtido até 200 (duzentos) salários-mínimos;\nII - mínimo de oito e máximo de dez por cento sobre o valor da condenação ou do proveito econômico obtido acima de 200 (duzentos) salários-mínimos até 2.000 (dois mil) salários-mínimos;\nIII - mínimo de cinco e máximo de oito por cento sobre o valor da condenação ou do proveito econômico obtido acima de 2.000 (dois mil) salários-mínimos até 20.000 (vinte mil) salários-mínimos;\nIV - mínimo de três e máximo de cinco por cento sobre o valor da condenação ou do proveito econômico obtido acima de 20.000 (vinte mil) salários-mínimos até 100.000 (cem mil) salários-mínimos;\nV - mínimo de um e máximo de três por cento sobre o valor da condenação ou do proveito econômico obtido acima de 100.000 (cem mil) salários-mínimos.\n§ 4º Em qualquer das hipóteses do § 3º:\nI - os percentuais previstos nos incisos I a V devem ser aplicados desde logo, quando for líquida a sentença;\nII - não sendo líquida a sentença, a definição do percentual, nos termos previstos nos incisos I a V, somente ocorrerá quando liquidado o julgado;\nIII - não havendo condenação principal ou não sendo possível mensurar o proveito econômico obtido, a condenação em honorários dar-se-á sobre o valor atualizado da causa;\nIV - será considerado o salário-mínimo vigente quando prolatada sentença líquida ou o que estiver em vigor na data da decisão de liquidação.\n§ 5º Quando, conforme o caso, a condenação contra a Fazenda Pública ou o benefício econômico obtido pelo vencedor ou o valor da causa for superior ao valor previsto no inciso I do § 3º, a fixação do percentual de honorários deve observar a faixa inicial e, naquilo que a exceder, a faixa subsequente, e assim sucessivamente.\n§ 6º Os limites e critérios previstos nos §§ 2º e 3º aplicam-se independentemente de qual seja o conteúdo da decisão, inclusive aos casos de improcedência ou de sentença sem resolução de mérito.\n- Quando o valor da condenação ou do proveito econômico obtido ou o valor atualizado da causa for líquido ou liquidável, para fins de fixação dos honorários advocatícios, nos termos dos §§ 2º e 3º, é proibida a apreciação equitativa, salvo nas hipóteses expressamente previstas no § 8º deste artigo.\n§ 7º Não serão devidos honorários no cumprimento de sentença contra a Fazenda Pública que enseje expedição de precatório, desde que não tenha sido impugnada.\n§ 8º Nas causas em que for inestimável ou irrisório o proveito econômico ou, ainda, quando o valor da causa for muito baixo, o juiz fixará o valor dos honorários por apreciação equitativa, observando o disposto nos incisos do § 2º.\n- Na hipótese do § 8º deste artigo, para fins de fixação equitativa de honorários sucumbenciais, o juiz deverá observar os valores recomendados pelo Conselho Seccional da Ordem dos Advogados do Brasil a título de honorários advocatícios ou o limite mínimo de 10% (dez por cento) estabelecido no § 2º deste artigo, aplicando-se o que for maior.\n§ 9º Na ação de indenização por ato ilícito contra pessoa, o percentual de honorários incidirá sobre a soma das prestações vencidas acrescida de 12 (doze) prestações vincendas.\n§ 10. Nos casos de perda do objeto, os honorários serão devidos por quem deu causa ao processo.\n§ 11. O tribunal, ao julgar recurso, majorará os honorários fixados anteriormente levando em conta o trabalho adicional realizado em grau recursal, observando, conforme o caso, o disposto nos §§ 2º a 6º, sendo vedado ao tribunal, no cômputo geral da fixação de honorários devidos ao advogado do vencedor, ultrapassar os respectivos limites estabelecidos nos §§ 2º e 3º para a fase de conhecimento.\n§ 12. Os honorários referidos no § 11 são cumuláveis com multas e outras sanções processuais, inclusive as previstas no art. 77.\n§ 13. As verbas de sucumbência arbitradas em embargos à execução rejeitados ou julgados improcedentes e em fase de cumprimento de sentença serão acrescidas no valor do débito principal, para todos os efeitos legais.\n§ 14. Os honorários constituem direito do advogado e têm natureza alimentar, com os mesmos privilégios dos créditos oriundos da legislação do trabalho, sendo vedada a compensação em caso de sucumbência parcial.\n§ 15. O advogado pode requerer que o pagamento dos honorários que lhe caibam seja efetuado em favor da sociedade de advogados que integra na qualidade de sócio, aplicando-se à hipótese o disposto no § 14.\n§ 16. Quando os honorários forem fixados em quantia certa, os juros moratórios incidirão a partir da data do trânsito em julgado da decisão.\n§ 17. Os honorários serão devidos quando o advogado atuar em causa própria.\n§ 18. Caso a decisão transitada em julgado seja omissa quanto ao direito aos honorários ou ao seu valor, é cabível ação autônoma para sua definição e cobrança.\n§ 20. O disposto nos §§ 2º, 3º, 4º, 5º, 6º, 6º-A, 8º, 8º-A, 9º e 10 deste artigo aplica-se aos honorários fixados por arbitramento judicial."},"98":{"topicId":"OJ26-DPCI-CPC-08","texto":"Art. 98. A pessoa natural ou jurídica, brasileira ou estrangeira, com insuficiência de recursos para pagar as custas, as despesas processuais e os honorários advocatícios tem direito à gratuidade da justiça, na forma da lei.\n§ 1º A gratuidade da justiça compreende:\nI - as taxas ou as custas judiciais;\nII - os selos postais;\nIII - as despesas com publicação na imprensa oficial, dispensando-se a publicação em outros meios;\nIV - a indenização devida à testemunha que, quando empregada, receberá do empregador salário integral, como se em serviço estivesse;\nV - as despesas com a realização de exame de código genético - DNA e de outros exames considerados essenciais;\nVI - os honorários do advogado e do perito e a remuneração do intérprete ou do tradutor nomeado para apresentação de versão em português de documento redigido em língua estrangeira;\nVII - o custo com a elaboração de memória de cálculo, quando exigida para instauração da execução;\nVIII - os depósitos previstos em lei para interposição de recurso, para propositura de ação e para a prática de outros atos processuais inerentes ao exercício da ampla defesa e do contraditório;\nIX - os emolumentos devidos a notários ou registradores em decorrência da prática de registro, averbação ou qualquer outro ato notarial necessário à efetivação de decisão judicial ou à continuidade de processo judicial no qual o benefício tenha sido concedido.\n§ 2º A concessão de gratuidade não afasta a responsabilidade do beneficiário pelas despesas processuais e pelos honorários advocatícios decorrentes de sua sucumbência.\n§ 3º Vencido o beneficiário, as obrigações decorrentes de sua sucumbência ficarão sob condição suspensiva de exigibilidade e somente poderão ser executadas se, nos 5 (cinco) anos subsequentes ao trânsito em julgado da decisão que as certificou, o credor demonstrar que deixou de existir a situação de insuficiência de recursos que justificou a concessão de gratuidade, extinguindo-se, passado esse prazo, tais obrigações do beneficiário.\n§ 4º A concessão de gratuidade não afasta o dever de o beneficiário pagar, ao final, as multas processuais que lhe sejam impostas.\n§ 5º A gratuidade poderá ser concedida em relação a algum ou a todos os atos processuais, ou consistir na redução percentual de despesas processuais que o beneficiário tiver de adiantar no curso do procedimento.\n§ 6º Conforme o caso, o juiz poderá conceder direito ao parcelamento de despesas processuais que o beneficiário tiver de adiantar no curso do procedimento.\n§ 7º Aplica-se o disposto no art. 95, §§ 3º a 5º, ao custeio dos emolumentos previstos no § 1º, inciso IX, do presente artigo, observada a tabela e as condições da lei estadual ou distrital respectiva.\n§ 8º Na hipótese do § 1º, inciso IX, havendo dúvida fundada quanto ao preenchimento atual dos pressupostos para a concessão de gratuidade, o notário ou registrador, após praticar o ato, pode requerer, ao juízo competente para decidir questões notariais ou registrais, a revogação total ou parcial do benefício ou a sua substituição pelo parcelamento de que trata o § 6º deste artigo, caso em que o beneficiário será citado para, em 15 (quinze) dias, manifestar-se sobre esse requerimento."},"99":{"topicId":"OJ26-DPCI-CPC-08","texto":"Art. 99. O pedido de gratuidade da justiça pode ser formulado na petição inicial, na contestação, na petição para ingresso de terceiro no processo ou em recurso.\n§ 1º Se superveniente à primeira manifestação da parte na instância, o pedido poderá ser formulado por petição simples, nos autos do próprio processo, e não suspenderá seu curso.\n§ 2º O juiz somente poderá indeferir o pedido se houver nos autos elementos que evidenciem a falta dos pressupostos legais para a concessão de gratuidade, devendo, antes de indeferir o pedido, determinar à parte a comprovação do preenchimento dos referidos pressupostos.\n§ 3º Presume-se verdadeira a alegação de insuficiência deduzida exclusivamente por pessoa natural.\n§ 4º A assistência do requerente por advogado particular não impede a concessão de gratuidade da justiça.\n§ 5º Na hipótese do § 4º, o recurso que verse exclusivamente sobre valor de honorários de sucumbência fixados em favor do advogado de beneficiário estará sujeito a preparo, salvo se o próprio advogado demonstrar que tem direito à gratuidade.\n§ 6º O direito à gratuidade da justiça é pessoal, não se estendendo a litisconsorte ou a sucessor do beneficiário, salvo requerimento e deferimento expressos.\n§ 7º Requerida a concessão de gratuidade da justiça em recurso, o recorrente estará dispensado de comprovar o recolhimento do preparo, incumbindo ao relator, neste caso, apreciar o requerimento e, se indeferi-lo, fixar prazo para realização do recolhimento."},"100":{"topicId":"OJ26-DPCI-CPC-08","texto":"Art. 100. Deferido o pedido, a parte contrária poderá oferecer impugnação na contestação, na réplica, nas contrarrazões de recurso ou, nos casos de pedido superveniente ou formulado por terceiro, por meio de petição simples, a ser apresentada no prazo de 15 (quinze) dias, nos autos do próprio processo, sem suspensão de seu curso.\nParágrafo único. Revogado o benefício, a parte arcará com as despesas processuais que tiver deixado de adiantar e pagará, em caso de má-fé, até o décuplo de seu valor a título de multa, que será revertida em benefício da Fazenda Pública estadual ou federal e poderá ser inscrita em dívida ativa."},"101":{"topicId":"OJ26-DPCI-CPC-08","texto":"Art. 101. Contra a decisão que indeferir a gratuidade ou a que acolher pedido de sua revogação caberá agravo de instrumento, exceto quando a questão for resolvida na sentença, contra a qual caberá apelação.\n§ 1º O recorrente estará dispensado do recolhimento de custas até decisão do relator sobre a questão, preliminarmente ao julgamento do recurso.\n§ 2º Confirmada a denegação ou a revogação da gratuidade, o relator ou o órgão colegiado determinará ao recorrente o recolhimento das custas processuais, no prazo de 5 (cinco) dias, sob pena de não conhecimento do recurso."},"102":{"topicId":"OJ26-DPCI-CPC-08","texto":"Art. 102. Sobrevindo o trânsito em julgado de decisão que revoga a gratuidade, a parte deverá efetuar o recolhimento de todas as despesas de cujo adiantamento foi dispensada, inclusive as relativas ao recurso interposto, se houver, no prazo fixado pelo juiz, sem prejuízo de aplicação das sanções previstas em lei.\nParágrafo único. Não efetuado o recolhimento, o processo será extinto sem resolução de mérito, tratando-se do autor, e, nos demais casos, não poderá ser deferida a realização de nenhum ato ou diligência requerida pela parte enquanto não efetuado o depósito."},"110":{"topicId":"OJ26-DPCI-CPC-09","texto":"Art. 110. Ocorrendo a morte de qualquer das partes, dar-se-á a sucessão pelo seu espólio ou pelos seus sucessores, observado o disposto no art. 313, §§ 1º e 2º."},"111":{"topicId":"OJ26-DPCI-CPC-09","texto":"Art. 111. A parte que revogar o mandato outorgado a seu advogado constituirá, no mesmo ato, outro que assuma o patrocínio da causa.\nParágrafo único. Não sendo constituído novo procurador no prazo de 15 (quinze) dias, observar-se-á o disposto no art. 76."},"125":{"topicId":"OJ26-DPCI-CPC-10","texto":"Art. 125. É admissível a denunciação da lide, promovida por qualquer das partes:\nI - ao alienante imediato, no processo relativo à coisa cujo domínio foi transferido ao denunciante, a fim de que possa exercer os direitos que da evicção lhe resultam;\nII - àquele que estiver obrigado, por lei ou pelo contrato, a indenizar, em ação regressiva, o prejuízo de quem for vencido no processo.\n§ 1º O direito regressivo será exercido por ação autônoma quando a denunciação da lide for indeferida, deixar de ser promovida ou não for permitida.\n§ 2º Admite-se uma única denunciação sucessiva, promovida pelo denunciado, contra seu antecessor imediato na cadeia dominial ou quem seja responsável por indenizá-lo, não podendo o denunciado sucessivo promover nova denunciação, hipótese em que eventual direito de regresso será exercido por ação autônoma."},"126":{"topicId":"OJ26-DPCI-CPC-10","texto":"Art. 126. A citação do denunciado será requerida na petição inicial, se o denunciante for autor, ou na contestação, se o denunciante for réu, devendo ser realizada na forma e nos prazos previstos no art. 131."},"127":{"topicId":"OJ26-DPCI-CPC-10","texto":"Art. 127. Feita a denunciação pelo autor, o denunciado poderá assumir a posição de litisconsorte do denunciante e acrescentar novos argumentos à petição inicial, procedendo-se em seguida à citação do réu."},"128":{"topicId":"OJ26-DPCI-CPC-10","texto":"Art. 128. Feita a denunciação pelo réu:\nI - se o denunciado contestar o pedido formulado pelo autor, o processo prosseguirá tendo, na ação principal, em litisconsórcio, denunciante e denunciado;\nII - se o denunciado for revel, o denunciante pode deixar de prosseguir com sua defesa, eventualmente oferecida, e abster-se de recorrer, restringindo sua atuação à ação regressiva;\nIII - se o denunciado confessar os fatos alegados pelo autor na ação principal, o denunciante poderá prosseguir com sua defesa ou, aderindo a tal reconhecimento, pedir apenas a procedência da ação de regresso.\nParágrafo único. Procedente o pedido da ação principal, pode o autor, se for o caso, requerer o cumprimento da sentença também contra o denunciado, nos limites da condenação deste na ação regressiva."},"129":{"topicId":"OJ26-DPCI-CPC-10","texto":"Art. 129. Se o denunciante for vencido na ação principal, o juiz passará ao julgamento da denunciação da lide.\nParágrafo único. Se o denunciante for vencedor, a ação de denunciação não terá o seu pedido examinado, sem prejuízo da condenação do denunciante ao pagamento das verbas de sucumbência em favor do denunciado."},"130":{"topicId":"OJ26-DPCI-CPC-10","texto":"Art. 130. É admissível o chamamento ao processo, requerido pelo réu:\nI - do afiançado, na ação em que o fiador for réu;\nII - dos demais fiadores, na ação proposta contra um ou alguns deles;\nIII - dos demais devedores solidários, quando o credor exigir de um ou de alguns o pagamento da dívida comum."},"131":{"topicId":"OJ26-DPCI-CPC-10","texto":"Art. 131. A citação daqueles que devam figurar em litisconsórcio passivo será requerida pelo réu na contestação e deve ser promovida no prazo de 30 (trinta) dias, sob pena de ficar sem efeito o chamamento.\nParágrafo único. Se o chamado residir em outra comarca, seção ou subseção judiciárias, ou em lugar incerto, o prazo será de 2 (dois) meses."},"132":{"topicId":"OJ26-DPCI-CPC-10","texto":"Art. 132. A sentença de procedência valerá como título executivo em favor do réu que satisfizer a dívida, a fim de que possa exigi-la, por inteiro, do devedor principal, ou, de cada um dos codevedores, a sua quota, na proporção que lhes tocar."},"133":{"topicId":"OJ26-DPCI-CPC-10","texto":"Art. 133. O incidente de desconsideração da personalidade jurídica será instaurado a pedido da parte ou do Ministério Público, quando lhe couber intervir no processo.\n§ 1º O pedido de desconsideração da personalidade jurídica observará os pressupostos previstos em lei.\n§ 2º Aplica-se o disposto neste Capítulo à hipótese de desconsideração inversa da personalidade jurídica."},"134":{"topicId":"OJ26-DPCI-CPC-10","texto":"Art. 134. O incidente de desconsideração é cabível em todas as fases do processo de conhecimento, no cumprimento de sentença e na execução fundada em título executivo extrajudicial.\n§ 1º A instauração do incidente será imediatamente comunicada ao distribuidor para as anotações devidas.\n§ 2º Dispensa-se a instauração do incidente se a desconsideração da personalidade jurídica for requerida na petição inicial, hipótese em que será citado o sócio ou a pessoa jurídica.\n§ 3º A instauração do incidente suspenderá o processo, salvo na hipótese do § 2º.\n§ 4º O requerimento deve demonstrar o preenchimento dos pressupostos legais específicos para desconsideração da personalidade jurídica."},"135":{"topicId":"OJ26-DPCI-CPC-10","texto":"Art. 135. Instaurado o incidente, o sócio ou a pessoa jurídica será citado para manifestar-se e requerer as provas cabíveis no prazo de 15 (quinze) dias."},"139":{"topicId":"OJ26-DPCI-CPC-11","texto":"Art. 139. O juiz dirigirá o processo conforme as disposições deste Código, incumbindo-lhe:\nI - assegurar às partes igualdade de tratamento;\nII - velar pela duração razoável do processo;\nIII - prevenir ou reprimir qualquer ato contrário à dignidade da justiça e indeferir postulações meramente protelatórias;\nV - promover, a qualquer tempo, a autocomposição, preferencialmente com auxílio de conciliadores e mediadores judiciais;\nVI - dilatar os prazos processuais e alterar a ordem de produção dos meios de prova, adequando-os às necessidades do conflito de modo a conferir maior efetividade à tutela do direito;\nVII - exercer o poder de polícia, requisitando, quando necessário, força policial, além da segurança interna dos fóruns e tribunais;\nVIII - determinar, a qualquer tempo, o comparecimento pessoal das partes, para inquiri-las sobre os fatos da causa, hipótese em que não incidirá a pena de confesso;\nIX - determinar o suprimento de pressupostos processuais e o saneamento de outros vícios processuais;\nX - quando se deparar com diversas demandas individuais repetitivas, oficiar o Ministério Público, a Defensoria Pública e, na medida do possível, outros legitimados a que se referem o art. 5º da Lei nº 7.347, de 24 de julho de 1985 , e o art. 82 da Lei nº 8.078, de 11 de setembro de 1990 , para, se for o caso, promover a propositura da ação coletiva respectiva.\nParágrafo único. A dilação de prazos prevista no inciso VI somente pode ser determinada antes de encerrado o prazo regular."},"140":{"topicId":"OJ26-DPCI-CPC-11","texto":"Art. 140. O juiz não se exime de decidir sob a alegação de lacuna ou obscuridade do ordenamento jurídico.\nParágrafo único. O juiz só decidirá por equidade nos casos previstos em lei."},"141":{"topicId":"OJ26-DPCI-CPC-11","texto":"Art. 141. O juiz decidirá o mérito nos limites propostos pelas partes, sendo-lhe vedado conhecer de questões não suscitadas a cujo respeito a lei exige iniciativa da parte."},"142":{"topicId":"OJ26-DPCI-CPC-11","texto":"Art. 142. Convencendo-se, pelas circunstâncias, de que autor e réu se serviram do processo para praticar ato simulado ou conseguir fim vedado por lei, o juiz proferirá decisão que impeça os objetivos das partes, aplicando, de ofício, as penalidades da litigância de má-fé."},"143":{"topicId":"OJ26-DPCI-CPC-11","texto":"Art. 143. O juiz responderá, civil e regressivamente, por perdas e danos quando:\nI - no exercício de suas funções, proceder com dolo ou fraude;\nII - recusar, omitir ou retardar, sem justo motivo, providência que deva ordenar de ofício ou a requerimento da parte.\nParágrafo único. As hipóteses previstas no inciso II somente serão verificadas depois que a parte requerer ao juiz que determine a providência e o requerimento não for apreciado no prazo de 10 (dez) dias."},"149":{"topicId":"OJ26-DPCI-CPC-12","texto":"Art. 149. São auxiliares da Justiça, além de outros cujas atribuições sejam determinadas pelas normas de organização judiciária, o escrivão, o chefe de secretaria, o oficial de justiça, o perito, o depositário, o administrador, o intérprete, o tradutor, o mediador, o conciliador judicial, o partidor, o distribuidor, o contabilista e o regulador de avarias."},"150":{"topicId":"OJ26-DPCI-CPC-12","texto":"Art. 150. Em cada juízo haverá um ou mais ofícios de justiça, cujas atribuições serão determinadas pelas normas de organização judiciária."},"151":{"topicId":"OJ26-DPCI-CPC-12","texto":"Art. 151. Em cada comarca, seção ou subseção judiciária haverá, no mínimo, tantos oficiais de justiça quantos sejam os juízos."},"152":{"topicId":"OJ26-DPCI-CPC-12","texto":"Art. 152. Incumbe ao escrivão ou ao chefe de secretaria:\nI - redigir, na forma legal, os ofícios, os mandados, as cartas precatórias e os demais atos que pertençam ao seu ofício;\nII - efetivar as ordens judiciais, realizar citações e intimações, bem como praticar todos os demais atos que lhe forem atribuídos pelas normas de organização judiciária;\nIII - comparecer às audiências ou, não podendo fazê-lo, designar servidor para substituí-lo;\nIV - manter sob sua guarda e responsabilidade os autos, não permitindo que saiam do cartório, exceto:\na) quando tenham de seguir à conclusão do juiz;\nb) com vista a procurador, à Defensoria Pública, ao Ministério Público ou à Fazenda Pública;\nc) quando devam ser remetidos ao contabilista ou ao partidor;\nd) quando forem remetidos a outro juízo em razão da modificação da competência;\nV - fornecer certidão de qualquer ato ou termo do processo, independentemente de despacho, observadas as disposições referentes ao segredo de justiça;\nVI - praticar, de ofício, os atos meramente ordinatórios.\n§ 1º O juiz titular editará ato a fim de regulamentar a atribuição prevista no inciso VI.\n§ 2º No impedimento do escrivão ou chefe de secretaria, o juiz convocará substituto e, não o havendo, nomeará pessoa idônea para o ato."},"153":{"topicId":"OJ26-DPCI-CPC-12","texto":"Art. 153. O escrivão ou o chefe de secretaria atenderá, preferencialmente, à ordem cronológica de recebimento para publicação e efetivação dos pronunciamentos judiciais.\n§ 1º A lista de processos recebidos deverá ser disponibilizada, de forma permanente, para consulta pública.\n§ 2º Estão excluídos da regra do caput:\nI - os atos urgentes, assim reconhecidos pelo juiz no pronunciamento judicial a ser efetivado;\nII - as preferências legais.\n§ 3º Após elaboração de lista própria, respeitar-se-ão a ordem cronológica de recebimento entre os atos urgentes e as preferências legais.\n§ 4º A parte que se considerar preterida na ordem cronológica poderá reclamar, nos próprios autos, ao juiz do processo, que requisitará informações ao servidor, a serem prestadas no prazo de 2 (dois) dias.\n§ 5º Constatada a preterição, o juiz determinará o imediato cumprimento do ato e a instauração de processo administrativo disciplinar contra o servidor."},"154":{"topicId":"OJ26-DPCI-CPC-12","texto":"Art. 154. Incumbe ao oficial de justiça:\nI - fazer pessoalmente citações, prisões, penhoras, arrestos e demais diligências próprias do seu ofício, sempre que possível na presença de 2 (duas) testemunhas, certificando no mandado o ocorrido, com menção ao lugar, ao dia e à hora;\nII - executar as ordens do juiz a que estiver subordinado;\nIII - entregar o mandado em cartório após seu cumprimento;\nIV - auxiliar o juiz na manutenção da ordem;\nV - efetuar avaliações, quando for o caso;\nVI - certificar, em mandado, proposta de autocomposição apresentada por qualquer das partes, na ocasião de realização de ato de comunicação que lhe couber.\nParágrafo único. Certificada a proposta de autocomposição prevista no inciso VI, o juiz ordenará a intimação da parte contrária para manifestar-se, no prazo de 5 (cinco) dias, sem prejuízo do andamento regular do processo, entendendo-se o silêncio como recusa."},"155":{"topicId":"OJ26-DPCI-CPC-12","texto":"Art. 155. O escrivão, o chefe de secretaria e o oficial de justiça são responsáveis, civil e regressivamente, quando:\nI - sem justo motivo, se recusarem a cumprir no prazo os atos impostos pela lei ou pelo juiz a que estão subordinados;\nII - praticarem ato nulo com dolo ou culpa."},"159":{"topicId":"OJ26-DPCI-CPC-13","texto":"Art. 159. A guarda e a conservação de bens penhorados, arrestados, sequestrados ou arrecadados serão confiadas a depositário ou a administrador, não dispondo a lei de outro modo."},"160":{"topicId":"OJ26-DPCI-CPC-13","texto":"Art. 160. Por seu trabalho o depositário ou o administrador perceberá remuneração que o juiz fixará levando em conta a situação dos bens, ao tempo do serviço e às dificuldades de sua execução.\nParágrafo único. O juiz poderá nomear um ou mais prepostos por indicação do depositário ou do administrador."},"161":{"topicId":"OJ26-DPCI-CPC-13","texto":"Art. 161. O depositário ou o administrador responde pelos prejuízos que, por dolo ou culpa, causar à parte, perdendo a remuneração que lhe foi arbitrada, mas tem o direito a haver o que legitimamente despendeu no exercício do encargo.\nParágrafo único. O depositário infiel responde civilmente pelos prejuízos causados, sem prejuízo de sua responsabilidade penal e da imposição de sanção por ato atentatório à dignidade da justiça."},"176":{"topicId":"OJ26-DPCI-CPC-14","texto":"Art. 176. O Ministério Público atuará na defesa da ordem jurídica, do regime democrático e dos interesses e direitos sociais e individuais indisponíveis."},"177":{"topicId":"OJ26-DPCI-CPC-14","texto":"Art. 177. O Ministério Público exercerá o direito de ação em conformidade com suas atribuições constitucionais."},"178":{"topicId":"OJ26-DPCI-CPC-14","texto":"Art. 178. O Ministério Público será intimado para, no prazo de 30 (trinta) dias, intervir como fiscal da ordem jurídica nas hipóteses previstas em lei ou na Constituição Federal e nos processos que envolvam:\nI - interesse público ou social;\nII - interesse de incapaz;\nIII - litígios coletivos pela posse de terra rural ou urbana.\nParágrafo único. A participação da Fazenda Pública não configura, por si só, hipótese de intervenção do Ministério Público."},"179":{"topicId":"OJ26-DPCI-CPC-14","texto":"Art. 179. Nos casos de intervenção como fiscal da ordem jurídica, o Ministério Público:\nI - terá vista dos autos depois das partes, sendo intimado de todos os atos do processo;\nII - poderá produzir provas, requerer as medidas processuais pertinentes e recorrer."},"180":{"topicId":"OJ26-DPCI-CPC-14","texto":"Art. 180. O Ministério Público gozará de prazo em dobro para manifestar-se nos autos, que terá início a partir de sua intimação pessoal, nos termos do art. 183, § 1º.\n§ 1º Findo o prazo para manifestação do Ministério Público sem o oferecimento de parecer, o juiz requisitará os autos e dará andamento ao processo.\n§ 2º Não se aplica o benefício da contagem em dobro quando a lei estabelecer, de forma expressa, prazo próprio para o Ministério Público."},"181":{"topicId":"OJ26-DPCI-CPC-14","texto":"Art. 181. O membro do Ministério Público será civil e regressivamente responsável quando agir com dolo ou fraude no exercício de suas funções."},"182":{"topicId":"OJ26-DPCI-CPC-14","texto":"Art. 182. Incumbe à Advocacia Pública, na forma da lei, defender e promover os interesses públicos da União, dos Estados, do Distrito Federal e dos Municípios, por meio da representação judicial, em todos os âmbitos federativos, das pessoas jurídicas de direito público que integram a administração direta e indireta."},"183":{"topicId":"OJ26-DPCI-CPC-14","texto":"Art. 183. A União, os Estados, o Distrito Federal, os Municípios e suas respectivas autarquias e fundações de direito público gozarão de prazo em dobro para todas as suas manifestações processuais, cuja contagem terá início a partir da intimação pessoal.\n§ 1º A intimação pessoal far-se-á por carga, remessa ou meio eletrônico.\n§ 2º Não se aplica o benefício da contagem em dobro quando a lei estabelecer, de forma expressa, prazo próprio para o ente público."},"184":{"topicId":"OJ26-DPCI-CPC-14","texto":"Art. 184. O membro da Advocacia Pública será civil e regressivamente responsável quando agir com dolo ou fraude no exercício de suas funções."},"185":{"topicId":"OJ26-DPCI-CPC-14","texto":"Art. 185. A Defensoria Pública exercerá a orientação jurídica, a promoção dos direitos humanos e a defesa dos direitos individuais e coletivos dos necessitados, em todos os graus, de forma integral e gratuita."},"186":{"topicId":"OJ26-DPCI-CPC-14","texto":"Art. 186. A Defensoria Pública gozará de prazo em dobro para todas as suas manifestações processuais.\n§ 1º O prazo tem início com a intimação pessoal do defensor público, nos termos do art. 183, § 1º.\n§ 2º A requerimento da Defensoria Pública, o juiz determinará a intimação pessoal da parte patrocinada quando o ato processual depender de providência ou informação que somente por ela possa ser realizada ou prestada.\n§ 3º O disposto no caput aplica-se aos escritórios de prática jurídica das faculdades de Direito reconhecidas na forma da lei e às entidades que prestam assistência jurídica gratuita em razão de convênios firmados com a Defensoria Pública.\n§ 4º Não se aplica o benefício da contagem em dobro quando a lei estabelecer, de forma expressa, prazo próprio para a Defensoria Pública."},"187":{"topicId":"OJ26-DPCI-CPC-14","texto":"Art. 187. O membro da Defensoria Pública será civil e regressivamente responsável quando agir com dolo ou fraude no exercício de suas funções."},"188":{"topicId":"OJ26-DPCI-CPC-14","texto":"Art. 188. Os atos e os termos processuais independem de forma determinada, salvo quando a lei expressamente a exigir, considerando-se válidos os que, realizados de outro modo, lhe preencham a finalidade essencial."},"189":{"topicId":"OJ26-DPCI-CPC-14","texto":"Art. 189. Os atos processuais são públicos, todavia tramitam em segredo de justiça os processos:\nI - em que o exija o interesse público ou social;\nII - que versem sobre casamento, separação de corpos, divórcio, separação, união estável, filiação, alimentos e guarda de crianças e adolescentes;\nIII - em que constem dados protegidos pelo direito constitucional à intimidade;\nIV - que versem sobre arbitragem, inclusive sobre cumprimento de carta arbitral, desde que a confidencialidade estipulada na arbitragem seja comprovada perante o juízo.\n§ 1º O direito de consultar os autos de processo que tramite em segredo de justiça e de pedir certidões de seus atos é restrito às partes e aos seus procuradores.\n§ 2º O terceiro que demonstrar interesse jurídico pode requerer ao juiz certidão do dispositivo da sentença, bem como de inventário e de partilha resultantes de divórcio ou separação."},"190":{"topicId":"OJ26-DPCI-CPC-14","texto":"Art. 190. Versando o processo sobre direitos que admitam autocomposição, é lícito às partes plenamente capazes estipular mudanças no procedimento para ajustá-lo às especificidades da causa e convencionar sobre os seus ônus, poderes, faculdades e deveres processuais, antes ou durante o processo.\nParágrafo único. De ofício ou a requerimento, o juiz controlará a validade das convenções previstas neste artigo, recusando-lhes aplicação somente nos casos de nulidade ou de inserção abusiva em contrato de adesão ou em que alguma parte se encontre em manifesta situação de vulnerabilidade."},"191":{"topicId":"OJ26-DPCI-CPC-14","texto":"Art. 191. De comum acordo, o juiz e as partes podem fixa

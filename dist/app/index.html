juge, ascendente, descendente ou irmão."},"32":{"topicId":"OJ26-DPPE-CPP-01","texto":"Art. 32. Nos crimes de ação privada, o juiz, a requerimento da parte que comprovar a sua pobreza, nomeará advogado para promover a ação penal.\n§ 1º Considerar-se-á pobre a pessoa que não puder prover às despesas do processo, sem privar-se dos recursos indispensáveis ao próprio sustento ou da família.\n§ 2º Será prova suficiente de pobreza o atestado da autoridade policial em cuja circunscrição residir o ofendido."},"33":{"topicId":"OJ26-DPPE-CPP-01","texto":"Art. 33. Se o ofendido for menor de 18 anos, ou mentalmente enfermo, ou retardado mental, e não tiver representante legal, ou colidirem os interesses deste com os daquele, o direito de queixa poderá ser exercido por curador especial, nomeado, de ofício ou a requerimento do Ministério Público, pelo juiz competente para o processo penal."},"34":{"topicId":"OJ26-DPPE-CPP-01","texto":"Art. 34. Se o ofendido for menor de 21 e maior de 18 anos, o direito de queixa poderá ser exercido por ele ou por seu representante legal."},"36":{"topicId":"OJ26-DPPE-CPP-01","texto":"Art. 36. Se comparecer mais de uma pessoa com direito de queixa, terá preferência o cônjuge, e, em seguida, o parente mais próximo na ordem de enumeração constante do art. 31, podendo, entretanto, qualquer delas prosseguir na ação, caso o querelante desista da instância ou a abandone."},"37":{"topicId":"OJ26-DPPE-CPP-01","texto":"Art. 37. As fundações, associações ou sociedades legalmente constituídas poderão exercer a ação penal, devendo ser representadas por quem os respectivos contratos ou estatutos designarem ou, no silêncio destes, pelos seus diretores ou sócios-gerentes."},"38":{"topicId":"OJ26-DPPE-CPP-01","texto":"Art. 38. Salvo disposição em contrário, o ofendido, ou seu representante legal, decairá do direito de queixa ou de representação, se não o exercer dentro do prazo de seis meses, contado do dia em que vier a saber quem é o autor do crime, ou, no caso do art. 29, do dia em que se esgotar o prazo para o oferecimento da denúncia.\n§ 1º Verificar-se-á a decadência do direito de queixa ou representação, dentro do mesmo prazo, nos casos dos arts. 24, parágrafo único, e 31.\n§ 2º Nos crimes praticados no âmbito de violência doméstica e familiar contra a mulher, a ofendida decairá do direito de queixa ou de representação se não o exercer no prazo de 12 (doze) meses, contado do dia em que vier a saber quem é o autor do crime, ou, no caso do art. 29 deste Código, do dia em que se esgotar o prazo para o oferecimento de denúncia."},"39":{"topicId":"OJ26-DPPE-CPP-01","texto":"Art. 39. O direito de representação poderá ser exercido, pessoalmente ou por procurador com poderes especiais, mediante declaração, escrita ou oral, feita ao juiz, ao órgão do Ministério Público, ou à autoridade policial.\n§ 1º A representação feita oralmente ou por escrito, sem assinatura devidamente autenticada do ofendido, de seu representante legal ou procurador, será reduzida a termo, perante o juiz ou autoridade policial, presente o órgão do Ministério Público, quando a este houver sido dirigida.\n§ 2º A representação conterá todas as informações que possam servir à apuração do fato e da autoria.\n§ 3º Oferecida ou reduzida a termo a representação, a autoridade policial procederá a inquérito, ou, não sendo competente, remetê-lo-á à autoridade que o for.\n§ 4º A representação, quando feita ao juiz ou perante este reduzida a termo, será remetida à autoridade policial para que esta proceda a inquérito.\n§ 5º O órgão do Ministério Público dispensará o inquérito, se com a representação forem oferecidos elementos que o habilitem a promover a ação penal, e, neste caso, oferecerá a denúncia no prazo de quinze dias."},"40":{"topicId":"OJ26-DPPE-CPP-01","texto":"Art. 40. Quando, em autos ou papéis de que conhecerem, os juízes ou tribunais verificarem a existência de crime de ação pública, remeterão ao Ministério Público as cópias e os documentos necessários ao oferecimento da denúncia."},"41":{"topicId":"OJ26-DPPE-CPP-01","texto":"Art. 41. A denúncia ou queixa conterá a exposição do fato criminoso, com todas as suas circunstâncias, a qualificação do acusado ou esclarecimentos pelos quais se possa identificá-lo, a classificação do crime e, quando necessário, o rol das testemunhas."},"42":{"topicId":"OJ26-DPPE-CPP-01","texto":"Art. 42. O Ministério Público não poderá desistir da ação penal."},"61":{"topicId":"OJ26-DPPE-CPP-02","texto":"Art. 61. Em qualquer fase do processo, o juiz, se reconhecer extinta a punibilidade, deverá declará-lo de ofício.\nParágrafo único. No caso de requerimento do Ministério Público, do querelante ou do réu, o juiz mandará autuá-lo em apartado, ouvirá a parte contrária e, se o julgar conveniente, concederá o prazo de cinco dias para a prova, proferindo a decisão dentro de cinco dias ou reservando-se para apreciar a matéria na sentença final."},"62":{"topicId":"OJ26-DPPE-CPP-02","texto":"Art. 62. No caso de morte do acusado, o juiz somente à vista da certidão de óbito, e depois de ouvido o Ministério Público, declarará extinta a punibilidade."},"63":{"topicId":"OJ26-DPPE-CPP-02","texto":"Art. 63. Transitada em julgado a sentença condenatória, poderão promover-lhe a execução, no juízo cível, para o efeito da reparação do dano, o ofendido, seu representante legal ou seus herdeiros.\nParágrafo único. Transitada em julgado a sentença condenatória, a execução poderá ser efetuada pelo valor fixado nos termos do inciso IV do caput do art. 387 deste Código sem prejuízo da liquidação para a apuração do dano efetivamente sofrido."},"64":{"topicId":"OJ26-DPPE-CPP-02","texto":"Art. 64. Sem prejuízo do disposto no artigo anterior, a ação para ressarcimento do dano poderá ser proposta no juízo cível, contra o autor do crime e, se for caso, contra o responsável civil.\nParágrafo único. Intentada a ação penal, o juiz da ação civil poderá suspender o curso desta, até o julgamento definitivo daquela."},"66":{"topicId":"OJ26-DPPE-CPP-02","texto":"Art. 66. Não obstante a sentença absolutória no juízo criminal, a ação civil poderá ser proposta quando não tiver sido, categoricamente, reconhecida a inexistência material do fato."},"67":{"topicId":"OJ26-DPPE-CPP-02","texto":"Art. 67. Não impedirão igualmente a propositura da ação civil:\nI - o despacho de arquivamento do inquérito ou das peças de informação;\nII - a decisão que julgar extinta a punibilidade;\nIII - a sentença absolutória que decidir que o fato imputado não constitui crime."},"68":{"topicId":"OJ26-DPPE-CPP-02","texto":"Art. 68. Quando o titular do direito à reparação do dano for pobre (art. 32, §§ 1º e 2º), a execução da sentença condenatória (art. 63) ou a ação civil (art. 64) será promovida, a seu requerimento, pelo Ministério Público."},"69":{"topicId":"OJ26-DPPE-CPP-02","texto":"Art. 69. Determinará a competência jurisdicional:\nI - o lugar da infração:\nII - o domicílio ou residência do réu;\nIII - a natureza da infração;\nIV - a distribuição;\nV - a conexão ou continência;\nVI - a prevenção;\nVII - a prerrogativa de função."},"70":{"topicId":"OJ26-DPPE-CPP-02","texto":"Art. 70. A competência será, de regra, determinada pelo lugar em que se consumar a infração, ou, no caso de tentativa, pelo lugar em que for praticado o último ato de execução.\n§ 1º Se, iniciada a execução no território nacional, a infração se consumar fora dele, a competência será determinada pelo lugar em que tiver sido praticado, no Brasil, o último ato de execução.\n§ 2º Quando o último ato de execução for praticado fora do território nacional, será competente o juiz do lugar em que o crime, embora parcialmente, tenha produzido ou devia produzir seu resultado.\n§ 3º Quando incerto o limite territorial entre duas ou mais jurisdições, ou quando incerta a jurisdição por ter sido a infração consumada ou tentada nas divisas de duas ou mais jurisdições, a competência firmar-se-á pela prevenção.\n§ 4º Nos crimes previstos no art. 171 do Decreto-Lei nº 2.848, de 7 de dezembro de 1940 (Código Penal), quando praticados mediante depósito, mediante emissão de cheques sem suficiente provisão de fundos em poder do sacado ou com o pagamento frustrado ou mediante transferência de valores, a competência será definida pelo local do domicílio da vítima, e, em caso de pluralidade de vítimas, a competência firmar-se-á pela prevenção."},"71":{"topicId":"OJ26-DPPE-CPP-02","texto":"Art. 71. Tratando-se de infração continuada ou permanente, praticada em território de duas ou mais jurisdições, a competência firmar-se-á pela prevenção."},"72":{"topicId":"OJ26-DPPE-CPP-02","texto":"Art. 72. Não sendo conhecido o lugar da infração, a competência regular-se-á pelo domicílio ou residência do réu.\n§ 1º Se o réu tiver mais de uma residência, a competência firmar-se-á pela prevenção.\n§ 2º Se o réu não tiver residência certa ou for ignorado o seu paradeiro, será competente o juiz que primeiro tomar conhecimento do fato."},"73":{"topicId":"OJ26-DPPE-CPP-02","texto":"Art. 73. Nos casos de exclusiva ação privada, o querelante poderá preferir o foro do domicílio ou da residência do réu, ainda quando conhecido o lugar da infração."},"74":{"topicId":"OJ26-DPPE-CPP-02","texto":"Art. 74. A competência pela natureza da infração será regulada pelas leis de organização judiciária, salvo a competência privativa do Tribunal do Júri.\n§ 1º Compete ao Tribunal do Júri o julgamento dos crimes previstos nos arts. 121, §§ 1º e 2º, 122, parágrafo único, 123, 124, 125, 126 e 127 do Código Penal, consumados ou tentados.\n§ 2º Se, iniciado o processo perante um juiz, houver desclassificação para infração da competência de outro, a este será remetido o processo, salvo se mais graduada for a jurisdição do primeiro, que, em tal caso, terá sua competência prorrogada.\n§ 3º Se o juiz da pronúncia desclassificar a infração para outra atribuída à competência de juiz singular, observar-se-á o disposto no art. 410; mas, se a desclassificação for feita pelo próprio Tribunal do Júri, a seu presidente caberá proferir a sentença (art. 492, § 2º)."},"112":{"topicId":"OJ26-DPPE-CPP-03","texto":"Art. 112. O juiz, o órgão do Ministério Público, os serventuários ou funcionários de justiça e os peritos ou intérpretes abster-se-ão de servir no processo, quando houver incompatibilidade ou impedimento legal, que declararão nos autos. Se não se der a abstenção, a incompatibilidade ou impedimento poderá ser argüido pelas partes, seguindo-se o processo estabelecido para a exceção de suspeição."},"125":{"topicId":"OJ26-DPPE-CPP-04","texto":"Art. 125. Caberá o seqüestro dos bens imóveis, adquiridos pelo indiciado com os proventos da infração, ainda que já tenham sido transferidos a terceiro."},"126":{"topicId":"OJ26-DPPE-CPP-04","texto":"Art. 126. Para a decretação do seqüestro, bastará a existência de indícios veementes da proveniência ilícita dos bens."},"127":{"topicId":"OJ26-DPPE-CPP-04","texto":"Art. 127. O juiz, de ofício, a requerimento do Ministério Público ou do ofendido, ou mediante representação da autoridade policial, poderá ordenar o seqüestro, em qualquer fase do processo ou ainda antes de oferecida a denúncia ou queixa."},"128":{"topicId":"OJ26-DPPE-CPP-04","texto":"Art. 128. Realizado o seqüestro, o juiz ordenará a sua inscrição no Registro de Imóveis."},"129":{"topicId":"OJ26-DPPE-CPP-04","texto":"Art. 129. O seqüestro autuar-se-á em apartado e admitirá embargos de terceiro."},"130":{"topicId":"OJ26-DPPE-CPP-04","texto":"Art. 130. O seqüestro poderá, ainda, ser embargado:\nI - pelo acusado, sob o fundamento de não terem os bens sido adquiridos com os proventos da infração;\nII - pelo terceiro, a quem houverem os bens sido transferidos a título oneroso, sob o fundamento de tê-los adquirido de boa-fé.\nParágrafo único. Não poderá ser pronunciada decisão nesses embargos antes de passar em julgado a sentença condenatória."},"131":{"topicId":"OJ26-DPPE-CPP-04","texto":"Art. 131. O seqüestro será levantado:\nI - se a ação penal não for intentada no prazo de sessenta dias, contado da data em que ficar concluída a diligência;\nII - se o terceiro, a quem tiverem sido transferidos os bens, prestar caução que assegure a aplicação do disposto no art. 74, II, b , segunda parte, do Código Penal;\nIII - se for julgada extinta a punibilidade ou absolvido o réu, por sentença transitada em julgado."},"156":{"topicId":"OJ26-DPPE-CPP-05","texto":"Art. 156. A prova da alegação incumbirá a quem a fizer, sendo, porém, facultado ao juiz de ofício:\nI - ordenar, mesmo antes de iniciada a ação penal, a produção antecipada de provas consideradas urgentes e relevantes, observando a necessidade, adequação e proporcionalidade da medida;\nII - determinar, no curso da instrução, ou antes de proferir sentença, a realização de diligências para dirimir dúvida sobre ponto relevante."},"185":{"topicId":"OJ26-DPPE-CPP-06","texto":"Art. 185. O acusado que comparecer perante a autoridade judiciária, no curso do processo penal, será qualificado e interrogado na presença de seu defensor, constituído ou nomeado.\n§ 1º O interrogatório do réu preso será realizado, em sala própria, no estabelecimento em que estiver recolhido, desde que estejam garantidas a segurança do juiz, do membro do Ministério Público e dos auxiliares bem como a presença do defensor e a publicidade do ato.\n§ 2º Excepcionalmente, o juiz, por decisão fundamentada, de ofício ou a requerimento das partes, poderá realizar o interrogatório do réu preso por sistema de videoconferência ou outro recurso tecnológico de transmissão de sons e imagens em tempo real, desde que a medida seja necessária para atender a uma das seguintes finalidades:\nI - prevenir risco à segurança pública, quando exista fundada suspeita de que o preso integre organização criminosa ou de que, por outra razão, possa fugir durante o deslocamento;\nII - viabilizar a participação do réu no referido ato processual, quando haja relevante dificuldade para seu comparecimento em juízo, por enfermidade ou outra circunstância pessoal;\nIII - impedir a influência do réu no ânimo de testemunha ou da vítima, desde que não seja possível colher o depoimento destas por videoconferência, nos termos do art. 217 deste Código;\nIV - responder à gravíssima questão de ordem pública.\n§ 3º Da decisão que determinar a realização de interrogatório por videoconferência, as partes serão intimadas com 10 (dez) dias de antecedência.\n§ 4º Antes do interrogatório por videoconferência, o preso poderá acompanhar, pelo mesmo sistema tecnológico, a realização de todos os atos da audiência única de instrução e julgamento de que tratam os arts. 400, 411 e 531 deste Código.\n§ 5º Em qualquer modalidade de interrogatório, o juiz garantirá ao réu o direito de entrevista prévia e reservada com o seu defensor; se realizado por videoconferência, fica também garantido o acesso a canais telefônicos reservados para comunicação entre o defensor que esteja no presídio e o advogado presente na sala de audiência do Fórum, e entre este e o preso.\n§ 6º A sala reservada no estabelecimento prisional para a realização de atos processuais por sistema de videoconferência será fiscalizada pelos corregedores e pelo juiz de cada causa, como também pelo Ministério Público e pela Ordem dos Advogados do Brasil.\n§ 7º Será requisitada a apresentação do réu preso em juízo nas hipóteses em que o interrogatório não se realizar na forma prevista nos §§ 1º e 2º deste artigo.\n§ 8º Aplica-se o disposto nos §§ 2º, 3º, 4º e 5º deste artigo, no que couber, à realização de outros atos processuais que dependam da participação de pessoa que esteja presa, como acareação, reconhecimento de pessoas e coisas, e inquirição de testemunha ou tomada de declarações do ofendido.\n§ 9º Na hipótese do § 8º deste artigo, fica garantido o acompanhamento do ato processual pelo acusado e seu defensor.\n§ 10. Do interrogatório deverá constar a informação sobre a existência de filhos, respectivas idades e se possuem alguma deficiência e o nome e o contato de eventual responsável pelos cuidados dos filhos, indicado pela pessoa presa."},"202":{"topicId":"OJ26-DPPE-CPP-07","texto":"Art. 202. Toda pessoa poderá ser testemunha."},"203":{"topicId":"OJ26-DPPE-CPP-07","texto":"Art. 203. A testemunha fará, sob palavra de honra, a promessa de dizer a verdade do que souber e lhe for perguntado, devendo declarar seu nome, sua idade, seu estado e sua residência, sua profissão, lugar onde exerce sua atividade, se é parente, e em que grau, de alguma das partes, ou quais suas relações com qualquer delas, e relatar o que souber, explicando sempre as razões de sua ciência ou as circunstâncias pelas quais possa avaliar-se de sua credibilidade."},"204":{"topicId":"OJ26-DPPE-CPP-07","texto":"Art. 204. O depoimento será prestado oralmente, não sendo permitido à testemunha trazê-lo por escrito.\nParágrafo único. Não será vedada à testemunha, entretanto, breve consulta a apontamentos."},"218":{"topicId":"OJ26-DPPE-CPP-08","texto":"Art. 218. Se, regularmente intimada, a testemunha deixar de comparecer sem motivo justificado, o juiz poderá requisitar à autoridade policial a sua apresentação ou determinar seja conduzida por oficial de justiça, que poderá solicitar o auxílio da força pública."},"219":{"topicId":"OJ26-DPPE-CPP-08","texto":"Art. 219. O juiz poderá aplicar à testemunha faltosa a multa prevista no artigo 453, sem prejuízo do processo penal por crime de desobediência, e condená-la ao pagamento das custas da diligência."},"220":{"topicId":"OJ26-DPPE-CPP-08","texto":"Art. 220. As pessoas impossibilitadas, por enfermidade ou por velhice, de comparecer para depor, serão inquiridas onde estiverem."},"221":{"topicId":"OJ26-DPPE-CPP-08","texto":"Art. 221. O Presidente e o Vice-Presidente da República, os Senadores e Deputados Federais, os Ministros de Estado, os Governadores de Estado e Territórios, os Secretários de Estado, os Prefeitos do Distrito Federal e dos Municípios, os Deputados às Assembléias Legislativas Estaduais, os membros do Poder Judiciário, os Ministros e Juízes dos Tribunais de Contas da União, dos Estados, do Distrito Federal, bem como os do Tribunal Marítimo serão inquiridos em local, dia e hora previamente ajustados entre eles e o Juiz.\n§ 1º O Presidente e o Vice-Presidente da República, os Presidentes do Senado Federal, da Câmara dos Deputados e do Supremo Tribunal Federal poderão optar pela prestação de depoimento por escrito, caso em que as perguntas, formuladas pelas partes e deferidas pelo juiz, lhes serão transmitidas por ofício.\n§ 2º Os militares deverão ser requisitados à autoridade superior.\n§ 3º Aos funcionários públicos aplicar-se-á o disposto no artigo 218, devendo, porém, a expedição do mandado ser imediatamente comunicada ao chefe da repartição em que servirem, com indicação do dia e da hora marcados."},"222":{"topicId":"OJ26-DPPE-CPP-08","texto":"Art. 222. A testemunha que morar fora da jurisdição do juiz, será inquirida pelo juiz do lugar de sua residência, expedindo-se, para esse fim, carta precatória, com prazo razoável, intimadas as partes.\n§ 1º A expedição da precatória não suspenderá a instrução criminal.\n§ 2º Findo o prazo marcado, poderá realizar-se o julgamento, mas, a todo tempo, a precatória, uma vez devolvida, será junta aos autos.\n§ 3º Na hipótese prevista no caput deste artigo, a oitiva de testemunha poderá ser realizada por meio de videoconferência ou outro recurso tecnológico de transmissão de sons e imagens em tempo real, permitida a presença do defensor e podendo ser realizada, inclusive, durante a realização da audiência de instrução e julgamento."},"223":{"topicId":"OJ26-DPPE-CPP-08","texto":"Art. 223. Quando a testemunha não conhecer a língua nacional, será nomeado intérprete para traduzir as perguntas e respostas.\nParágrafo único. Tratando-se de mudo, surdo ou surdo-mudo, proceder-se-á na conformidade do art. 192."},"224":{"topicId":"OJ26-DPPE-CPP-08","texto":"Art. 224. As testemunhas comunicarão ao juiz, dentro de um ano, qualquer mudança de residência, sujeitando-se, pela simples omissão, às penas do não-comparecimento."},"225":{"topicId":"OJ26-DPPE-CPP-08","texto":"Art. 225. Se qualquer testemunha houver de ausentar-se, ou, por enfermidade ou por velhice, inspirar receio de que ao tempo da instrução criminal já não exista, o juiz poderá, de ofício ou a requerimento de qualquer das partes, tomar-lhe antecipadamente o depoimento."},"240":{"topicId":"OJ26-DPPE-CPP-09","texto":"Art. 240. A busca será domiciliar ou pessoal.\n§ 1º Proceder-se-á à busca domiciliar, quando fundadas razões a autorizarem, para:\na) prender criminosos;\nb) apreender coisas achadas ou obtidas por meios criminosos;\nc) apreender instrumentos de falsificação ou de contrafação e objetos falsificados ou contrafeitos;\nd) apreender armas e munições, instrumentos utilizados na prática de crime ou destinados a fim delituoso;\ne) descobrir objetos necessários à prova de infração ou à defesa do réu;\nf) apreender cartas, abertas ou não, destinadas ao acusado ou em seu poder, quando haja suspeita de que o conhecimento do seu conteúdo possa ser útil à elucidação do fato;\ng) apreender pessoas vítimas de crime;\nh) colher qualquer elemento de convicção.\n§ 2º Proceder-se-á à busca pessoal quando houver fundada suspeita de que alguém oculte consigo arma proibida ou objetos mencionados nas letras b a f e letra h do parágrafo anterior."},"241":{"topicId":"OJ26-DPPE-CPP-09","texto":"Art. 241. Quando a própria autoridade policial ou judiciária não a realizar pessoalmente, a busca domiciliar deverá ser precedida da expedição de mandado."},"242":{"topicId":"OJ26-DPPE-CPP-09","texto":"Art. 242. A busca poderá ser determinada de ofício ou a requerimento de qualquer das partes."},"243":{"topicId":"OJ26-DPPE-CPP-09","texto":"Art. 243. O mandado de busca deverá:\nI - indicar, o mais precisamente possível, a casa em que será realizada a diligência e o nome do respectivo proprietário ou morador; ou, no caso de busca pessoal, o nome da pessoa que terá de sofrê-la ou os sinais que a identifiquem;\nII - mencionar o motivo e os fins da diligência;\nIII - ser subscrito pelo escrivão e assinado pela autoridade que o fizer expedir.\n§ 1º Se houver ordem de prisão, constará do próprio texto do mandado de busca.\n§ 2º Não será permitida a apreensão de documento em poder do defensor do acusado, salvo quando constituir elemento do corpo de delito."},"244":{"topicId":"OJ26-DPPE-CPP-09","texto":"Art. 244. A busca pessoal independerá de mandado, no caso de prisão ou quando houver fundada suspeita de que a pessoa esteja na posse de arma proibida ou de objetos ou papéis que constituam corpo de delito, ou quando a medida for determinada no curso de busca domiciliar."},"245":{"topicId":"OJ26-DPPE-CPP-09","texto":"Art. 245. As buscas domiciliares serão executadas de dia, salvo se o morador consentir que se realizem à noite, e, antes de penetrarem na casa, os executores mostrarão e lerão o mandado ao morador, ou a quem o represente, intimando-o, em seguida, a abrir a porta.\n§ 1º Se a própria autoridade der a busca, declarará previamente sua qualidade e o objeto da diligência.\n§ 2º Em caso de desobediência, será arrombada a porta e forçada a entrada.\n§ 3º Recalcitrando o morador, será permitido o emprego de força contra coisas existentes no interior da casa, para o descobrimento do que se procura.\n§ 4º Observar-se-á o disposto nos §§ 2º e 3º, quando ausentes os moradores, devendo, neste caso, ser intimado a assistir à diligência qualquer vizinho, se houver e estiver presente.\n§ 5º Se é determinada a pessoa ou coisa que se vai procurar, o morador será intimado a mostrá-la.\n§ 6º Descoberta a pessoa ou coisa que se procura, será imediatamente apreendida e posta sob custódia da autoridade ou de seus agentes.\n§ 7º Finda a diligência, os executores lavrarão auto circunstanciado, assinando-o com duas testemunhas presenciais, sem prejuízo do disposto no § 4º."},"246":{"topicId":"OJ26-DPPE-CPP-09","texto":"Art. 246. Aplicar-se-á também o disposto no artigo anterior, quando se tiver de proceder a busca em compartimento habitado ou em aposento ocupado de habitação coletiva ou em compartimento não aberto ao público, onde alguém exercer profissão ou atividade."},"247":{"topicId":"OJ26-DPPE-CPP-09","texto":"Art. 247. Não sendo encontrada a pessoa ou coisa procurada, os motivos da diligência serão comunicados a quem tiver sofrido a busca, se o requerer."},"248":{"topicId":"OJ26-DPPE-CPP-09","texto":"Art. 248. Em casa habitada, a busca será feita de modo que não moleste os moradores mais do que o indispensável para o êxito da diligência."},"249":{"topicId":"OJ26-DPPE-CPP-09","texto":"Art. 249. A busca em mulher será feita por outra mulher, se não importar retardamento ou prejuízo da diligência."},"250":{"topicId":"OJ26-DPPE-CPP-09","texto":"Art. 250. A autoridade ou seus agentes poderão penetrar no território de jurisdição alheia, ainda que de outro Estado, quando, para o fim de apreensão, forem no seguimento de pessoa ou coisa, devendo apresentar-se à competente autoridade local, antes da diligência ou após, conforme a urgência desta.\n§ 1º Entender-se-á que a autoridade ou seus agentes vão em seguimento da pessoa ou coisa, quando:\na) tendo conhecimento direto de sua remoção ou transporte, a seguirem sem interrupção, embora depois a percam de vista;\nb) ainda que não a tenham avistado, mas sabendo, por informações fidedignas ou circunstâncias indiciárias, que está sendo removida ou transportada em determinada direção, forem ao seu encalço.\n§ 2º Se as autoridades locais tiverem fundadas razões para duvidar da legitimidade das pessoas que, nas referidas diligências, entrarem pelos seus distritos, ou da legalidade dos mandados que apresentarem, poderão exigir as provas dessa legitimidade, mas de modo que não se frustre a diligência."},"274":{"topicId":"OJ26-DPPE-CPP-10","texto":"Art. 274. As prescrições sobre suspeição dos juízes estendem-se aos serventuários e funcionários da justiça, no que lhes for aplicável."},"283":{"topicId":"OJ26-DPPE-CPP-11","texto":"Art. 283. Ninguém poderá ser preso senão em flagrante delito ou por ordem escrita e fundamentada da autoridade judiciária competente, em decorrência de prisão cautelar ou em virtude de condenação criminal transitada em julgado.\n§ 1º As medidas cautelares previstas neste Título não se aplicam à infração a que não for isolada, cumulativa ou alternativamente cominada pena privativa de liberdade.\n§ 2º A prisão poderá ser efetuada em qualquer dia e a qualquer hora, respeitadas as restrições relativas à inviolabilidade do domicílio."},"284":{"topicId":"OJ26-DPPE-CPP-11","texto":"Art. 284. Não será permitido o emprego de força, salvo a indispensável no caso de resistência ou de tentativa de fuga do preso."},"285":{"topicId":"OJ26-DPPE-CPP-11","texto":"Art. 285. A autoridade que ordenar a prisão fará expedir o respectivo mandado.\nParágrafo único. O mandado de prisão:\na) será lavrado pelo escrivão e assinado pela autoridade;\nb) designará a pessoa, que tiver de ser presa, por seu nome, alcunha ou sinais característicos;\nc) mencionará a infração penal que motivar a prisão;\nd) declarará o valor da fiança arbitrada, quando afiançável a infração;\ne) será dirigido a quem tiver qualidade para dar-lhe execução."},"286":{"topicId":"OJ26-DPPE-CPP-11","texto":"Art. 286. O mandado será passado em duplicata, e o executor entregará ao preso, logo depois da prisão, um dos exemplares com declaração do dia, hora e lugar da diligência. Da entrega deverá o preso passar recibo no outro exemplar; se recusar, não souber ou não puder escrever, o fato será mencionado em declaração, assinada por duas testemunhas."},"287":{"topicId":"OJ26-DPPE-CPP-11","texto":"Art. 287. Se a infração for inafiançável, a falta de exibição do mandado não obstará a prisão, e o preso, em tal caso, será imediatamente apresentado ao juiz que tiver expedido o mandado, para a realização de audiência de custódia."},"288":{"topicId":"OJ26-DPPE-CPP-11","texto":"Art. 288. Ninguém será recolhido à prisão, sem que seja exibido o mandado ao respectivo diretor ou carcereiro, a quem será entregue cópia assinada pelo executor ou apresentada a guia expedida pela autoridade competente, devendo ser passado recibo da entrega do preso, com declaração de dia e hora.\nParágrafo único. O recibo poderá ser passado no próprio exemplar do mandado, se este for o documento exibido."},"289":{"topicId":"OJ26-DPPE-CPP-11","texto":"Art. 289. Quando o acusado estiver no território nacional, fora da jurisdição do juiz processante, será deprecada a sua prisão, devendo constar da precatória o inteiro teor do mandado.\n§ 1º Havendo urgência, o juiz poderá requisitar a prisão por qualquer meio de comunicação, do qual deverá constar o motivo da prisão, bem como o valor da fiança se arbitrada.\n§ 2º A autoridade a quem se fizer a requisição tomará as precauções necessárias para averiguar a autenticidade da comunicação.\n§ 3º O juiz processante deverá providenciar a remoção do preso no prazo máximo de 30 (trinta) dias, contados da efetivação da medida."},"290":{"topicId":"OJ26-DPPE-CPP-11","texto":"Art. 290. Se o réu, sendo perseguido, passar ao território de outro município ou comarca, o executor poderá efetuar-lhe a prisão no lugar onde o alcançar, apresentando-o imediatamente à autoridade local, que, depois de lavrado, se for o caso, o auto de flagrante, providenciará para a remoção do preso.\n§ 1º Entender-se-á que o executor vai em perseguição do réu, quando:\na) tendo-o avistado, for perseguindo-o sem interrupção, embora depois o tenha perdido de vista;\nb) sabendo, por indícios ou informações fidedignas, que o réu tenha passado, há pouco tempo, em tal ou qual direção, pelo lugar em que o procure, for no seu encalço.\n§ 2º Quando as autoridades locais tiverem fundadas razões para duvidar da legitimidade da pessoa do executor ou da legalidade do mandado que apresentar, poderão pôr em custódia o réu, até que fique esclarecida a dúvida."},"291":{"topicId":"OJ26-DPPE-CPP-11","texto":"Art. 291. A prisão em virtude de mandado entender-se-á feita desde que o executor, fazendo-se conhecer do réu, lhe apresente o mandado e o intime a acompanhá-lo."},"292":{"topicId":"OJ26-DPPE-CPP-11","texto":"Art. 292. Se houver, ainda que por parte de terceiros, resistência à prisão em flagrante ou à determinada por autoridade competente, o executor e as pessoas que o auxiliarem poderão usar dos meios necessários para defender-se ou para vencer a resistência, do que tudo se lavrará auto subscrito também por duas testemunhas.\nParágrafo único. É vedado o uso de algemas em mulheres grávidas durante os atos médico-hospitalares preparatórios para a realização do parto e durante o trabalho de parto, bem como em mulheres durante o período de puerpério imediato."},"293":{"topicId":"OJ26-DPPE-CPP-11","texto":"Art. 293. Se o executor do mandado verificar, com segurança, que o réu entrou ou se encontra em alguma casa, o morador será intimado a entregá-lo, à vista da ordem de prisão. Se não for obedecido imediatamente, o executor convocará duas testemunhas e, sendo dia, entrará à força na casa, arrombando as portas, se preciso; sendo noite, o executor, depois da intimação ao morador, se não for atendido, fará guardar todas as saídas, tornando a casa incomunicável, e, logo que amanheça, arrombará as portas e efetuará a prisão.\nParágrafo único. O morador que se recusar a entregar o réu oculto em sua casa será levado à presença da autoridade, para que se proceda contra ele como for de direito."},"294":{"topicId":"OJ26-DPPE-CPP-11","texto":"Art. 294. No caso de prisão em flagrante, observar-se-á o disposto no artigo anterior, no que for aplicável."},"295":{"topicId":"OJ26-DPPE-CPP-11","texto":"Art. 295. Serão recolhidos a quartéis ou a prisão especial, à disposição da autoridade competente, quando sujeitos a prisão antes de condenação definitiva:\nI - os ministros de Estado;\nII - os governadores ou interventores de Estados e Territórios, o Prefeito do Distrito Federal, seus respectivos secretários, os prefeitos municipais, os vereadores e chefes de Polícia;\nIII - os membros do Parlamento Nacional, do Conselho de Economia Nacional e das Assembléias Legislativas dos Estados;\nIV - os cidadãos inscritos no \"Livro de Mérito\";\nV - os oficiais das Forças Armadas e os militares dos Estados, do Distrito Federal e dos Territórios;\nVI - os magistrados;\nVII - os diplomados por qualquer das faculdades superiores da República; (Inciso declarado não recepcionado pela Constituição Federal de 1988, em controle concentrado, pelo Supremo Tribunal Federal, pela ADPF nº 334, publicada no DOU de 10/4/2023)\nVIII - os ministros de confissão religiosa;\nIX - os ministros do Tribunal de Contas;\nX - os cidadãos que já tiverem exercido efetivamente a função de jurado, salvo quando excluídos da lista por motivo de incapacidade para o exercício daquela função;\nXI - os delegados de polícia e os guardas-civis dos Estados e Territórios, ativos ou inativos.\n§ 1º A prisão especial, prevista neste Código ou em outras leis, consiste exclusivamente no recolhimento em local distinto da prisão comum.\n§ 2º Não havendo estabelecimento específico para o preso especial, este será recolhido em cela distinta do mesmo estabelecimento.\n§ 3º A cela especial poderá consistir em alojamento coletivo, atendidos os requisitos de salubridade do ambiente, pela concorrência dos fatores de aeração, insolação e condicionamento térmico adequados à existência humana.\n§ 4º O preso especial não será transportado juntamente com o preso comum.\n§ 5º Os demais direitos e deveres do preso especial serão os mesmos do preso comum."},"296":{"topicId":"OJ26-DPPE-CPP-11","texto":"Art. 296. Os inferiores e praças de pré, onde for possível, serão recolhidos à prisão, em estabelecimentos militares, de acordo com os respectivos regulamentos."},"297":{"topicId":"OJ26-DPPE-CPP-11","texto":"Art. 297. Para o cumprimento de mandado expedido pela autoridade judiciária, a autoridade policial poderá expedir tantos outros quantos necessários às diligências, devendo neles ser fielmente reproduzido o teor do mandado original."},"299":{"topicId":"OJ26-DPPE-CPP-11","texto":"Art. 299. A captura poderá ser requisitada, à vista de mandado judicial, por qualquer meio de comunicação, tomadas pela autoridade, a quem se fizer a requisição, as precauções necessárias para averiguar a autenticidade desta."},"300":{"topicId":"OJ26-DPPE-CPP-11","texto":"Art. 300. As pessoas presas provisoriamente ficarão separadas das que já estiverem definitivamente condenadas, nos termos da lei de execução penal.\nParágrafo único. O militar preso em flagrante delito, após a lavratura dos procedimentos legais, será recolhido a quartel da instituição a que pertencer, onde ficará preso à disposição das autoridades competentes."},"301":{"topicId":"OJ26-DPPE-CPP-11","texto":"Art. 301. Qualquer do povo poderá e as autoridades policiais e seus agentes deverão prender quem quer que seja encontrado em flagrante delito."},"302":{"topicId":"OJ26-DPPE-CPP-11","texto":"Art. 302. Considera-se em flagrante delito quem:\nI - está cometendo a infração penal;\nII - acaba de cometê-la;\nIII - é perseguido, logo após, pela autoridade, pelo ofendido ou por qualquer pessoa, em situação que faça presumir ser autor da infração;\nIV - é encontrado, logo depois, com instrumentos, armas, objetos ou papéis que façam presumir ser ele autor da infração."},"303":{"topicId":"OJ26-DPPE-CPP-11","texto":"Art. 303. Nas infrações permanentes, entende-se o agente em flagrante delito enquanto não cessar a permanência."},"351":{"topicId":"OJ26-DPPE-CPP-12","texto":"Art. 351. A citação inicial far-se-á por mandado, quando o réu estiver no território sujeito à jurisdição do juiz que a houver ordenado."},"352":{"topicId":"OJ26-DPPE-CPP-12","texto":"Art. 352. O mandado de citação indicará:\nI - o nome do juiz;\nII - o nome do querelante nas ações iniciadas por queixa;\nIII - o nome do réu, ou, se for desconhecido, os seus sinais característicos;\nIV - a residência do réu, se for conhecida;\nV - o fim para que é feita a citação;\nVI - o juízo e o lugar, o dia e a hora em que o réu deverá comparecer;\nVII - a subscrição do escrivão e a rubrica do juiz."},"353":{"topicId":"OJ26-DPPE-CPP-12","texto":"Art. 353. Quando o réu estiver fora do território da jurisdição do juiz processante, será citado mediante precatória."},"354":{"topicId":"OJ26-DPPE-CPP-12","texto":"Art. 354. A precatória indicará:\nI - o juiz deprecado e o juiz deprecante;\nII - a sede da jurisdição de um e de outro;\nIII - o fim para que é feita a citação, com todas as especificações;\nIV - o juízo do lugar, o dia e a hora em que o réu deverá comparecer."},"355":{"topicId":"OJ26-DPPE-CPP-12","texto":"Art. 355. A precatória será devolvida ao juiz deprecante, independentemente de traslado, depois de lançado o \"cumpra-se\" e de feita a citação por mandado do juiz deprecado.\n§ 1º Verificado que o réu se encontra em território sujeito à jurisdição de outro juiz, a este remeterá o juiz deprecado os autos para efetivação da diligência, desde que haja tempo para fazer-se a citação.\n§ 2º Certificado pelo oficial de justiça que o réu se oculta para não ser citado, a precatória será imediatamente devolvida, para o fim previsto no art. 362."},"356":{"topicId":"OJ26-DPPE-CPP-12","texto":"Art. 356. Se houver urgência, a precatória, que conterá em resumo os requisitos enumerados no art. 354, poderá ser expedida por via telegráfica, depois de reconhecida a firma do juiz, o que a estação expedidora mencionará."},"357":{"topicId":"OJ26-DPPE-CPP-12","texto":"Art. 357. São requisitos da citação por mandado:\nI - leitura do mandado ao citando pelo oficial e entrega da contrafé, na qual se mencionarão dia e hora da citação;\nII - declaração do oficial, na certidão, da entrega da contrafé, e sua aceitação ou recusa."},"358":{"topicId":"OJ26-DPPE-CPP-12","texto":"Art. 358. A citação do militar far-se-á por intermédio do chefe do respectivo serviço."},"359":{"topicId":"OJ26-DPPE-CPP-12","texto":"Art. 359. O dia designado para funcionário público comparecer em juízo, como acusado, será notificado assim a ele como ao chefe de sua repartição."},"360":{"topicId":"OJ26-DPPE-CPP-12","texto":"Art. 360. Se o réu estiver preso, será pessoalmente citado."},"361":{"topicId":"OJ26-DPPE-CPP-12","texto":"Art. 361. Se o réu não for encontrado, será citado por edital, com o prazo de quinze dias."},"362":{"topicId":"OJ26-DPPE-CPP-12","texto":"Art. 362. Verificando que o réu se oculta para não ser citado, o oficial de justiça certificará a ocorrência e procederá à citação com hora certa, na forma estabelecida nos arts. 227 a 229 da Lei nº 5.869, de 11 de janeiro de 1973 - Código de Processo Civil.\nParágrafo único. Completada a citação com hora certa, se o acusado não comparecer, ser-lhe-á nomeado defensor dativo."},"363":{"topicId":"OJ26-DPPE-CPP-12","texto":"Art. 363. O processo terá completada a sua formação quando realizada a citação do acusado.\nI - (Revogado pela Lei nº 11.719, de 20/6/2008, publicada no DOU de 23/6/2008, em vigor 60 dias após a publicação)\nII - (Revogado pela Lei nº 11.719, de 20/6/2008, publicada no DOU de 23/6/2008, em vigor 60 dias após a publicação)\n§ 1º Não sendo encontrado o acusado, será procedida a citação por edital.\n§ 2º (VETADO na Lei nº 11.719, de 20/6/2008)\n§ 3º (VETADO na Lei nº 11.719, de 20/6/2008)\n§ 4º Comparecendo o acusado citado por edital, em qualquer tempo, o processo observará o disposto nos arts. 394 e seguintes deste Código."},"370":{"topicId":"OJ26-DPPE-CPP-13","texto":"Art. 370. Nas intimações dos acusados, das testemunhas e demais pessoas que devam tomar conhecimento de qualquer ato, será observado, no que for aplicável, o disposto no Capítulo anterior.\n§ 1º A intimação do defensor constituído, do advogado do querelante e do assistente far-se-á por publicação no órgão incumbido da publicidade dos atos judiciais da comarca, incluindo, sob pena de nulidade, o nome do acusado.\n§ 2º Caso não haja órgão de publicação dos atos judiciais na comarca, a intimação far-se-á diretamente pelo escrivão, por mandado, ou via postal com comprovante de recebimento, ou por qualquer outro meio idôneo.\n§ 3º A intimação pessoal, feita pelo escrivão, dispensará a aplicação a que alude o § 1º.\n§ 4º A intimação do Ministério Público e do defensor nomeado será pessoal."},"371":{"topicId":"OJ26-DPPE-CPP-13","texto":"Art. 371. Será admissível a intimação por despacho na petição em que for requerida, observado o disposto no art. 357."},"372":{"topicId":"OJ26-DPPE-CPP-13","texto":"Art. 372. Adiada, por qualquer motivo, a instrução criminal, o juiz marcará desde logo, na presença das partes e testemunhas, dia e hora para seu prosseguimento, do que se lavrará termo nos autos."},"396":{"topicId":"OJ26-DPPE-CPP-14","texto":"Art. 396. Nos procedimentos ordinário e sumário, oferecida a denúncia ou queixa, o juiz, se não a rejeitar liminarmente, recebê-la-á e ordenará a citação do acusado para responder à acusação, por escrito, no prazo de 10 (dez) dias.\nParágrafo único. No caso de citação por edital, o prazo para a defesa começará a fluir a partir do comparecimento pessoal do acusado ou do defensor constituído."},"406":{"topicId":"OJ26-DPPE-CPP-15","texto":"Art. 406. O juiz, ao receber a denúncia ou a queixa, ordenará a citação do acusado para responder a acusação, por escrito, no prazo de 10 (dez) dias.\n§ 1º O prazo previsto no caput deste artigo será contado a partir do efetivo cumprimento do mandado ou do comparecimento, em juízo, do acusado ou de defensor constituído, no caso de citação inválida ou por edital.\n§ 2º A acusação deverá arrolar testemunhas, até o máximo de 8 (oito), na denúncia ou na queixa.\n§ 3º Na resposta, o acusado poderá argüir preliminares e alegar tudo que interesse a sua defesa, oferecer documentos e justificações, especificar as provas pretendidas e arrolar testemunhas, até o máximo de 8 (oito), qualificando-as e requerendo sua intimação, quando necessário."},"436":{"topicId":"OJ26-DPPE-CPP-16","texto":"Art. 436. O serviço do júri é obrigatório. O alistamento compreenderá os cidadãos maiores de 18 (dezoito) anos de notória idoneidade.\n§ 1º Nenhum cidadão poderá ser excluído dos trabalhos do júri ou deixar de ser alistado em razão de cor ou etnia, raça, credo, sexo, profissão, classe social ou econômica, origem ou grau de instrução.\n§ 2º A recusa injustificada ao serviço do júri acarretará multa no valor de 1 (um) a 10 (dez) salários mínimos, a critério do juiz, de acordo com a condição econômica do jurado."},"437":{"topicId":"OJ26-DPPE-CPP-16","texto":"Art. 437. Estão isentos do serviço do júri:\nI - o Presidente da República e os Ministros de Estado;\nII - os Governadores e seus respectivos Secretários;\nIII - os membros do Congresso Nacional, das Assembléias Legislativas e das Câmaras Distrital e Municipais;\nIV - os Prefeitos Municipais;\nV - os Magistrados e membros do Ministério Público e da Defensoria Pública;\nVI - os servidores do Poder Judiciário, do Ministério Público e da Defensoria Pública;\nVII - as autoridades e os servidores da polícia e da segurança pública;\nVIII - os militares em serviço ativo;\nIX - os cidadãos maiores de 70 (setenta) anos que requeiram sua dispensa;\nX - aqueles que o requererem, demonstrando justo impedimento."},"438":{"topicId":"OJ26-DPPE-CPP-16","texto":"Art. 438. A recusa ao serviço do júri fundada em convicção religiosa, filosófica ou política importará no dever de prestar serviço alternativo, sob pena de suspensão dos direitos políticos, enquanto não prestar o serviço imposto.\n§ 1º Entende-se por serviço alternativo o exercício de atividades de caráter administrativo, assistencial, filantrópico ou mesmo produtivo, no Poder Judiciário, na Defensoria Pública, no Ministério Público ou em entidade conveniada para esses fins.\n§ 2º O juiz fixará o serviço alternativo atendendo aos princípios da proporcionalidade e da razoabilidade."},"439":{"topicId":"OJ26-DPPE-CPP-16","texto":"Art. 439. O exercício efetivo da função de jurado constituirá serviço público relevante e estabelecerá presunção de idoneidade moral."},"440":{"topicId":"OJ26-DPPE-CPP-16","texto":"Art. 440. Constitui também direito do jurado, na condição do art. 439 deste Código, preferência, em igualdade de condições, nas licitações públicas e no provimento, mediante concurso, de cargo ou função pública, bem como nos casos de promoção funcional ou remoção voluntária."},"441":{"topicId":"OJ26-DPPE-CPP-16","texto":"Art. 441. Nenhum desconto será feito nos vencimentos ou salário do jurado sorteado que comparecer à sessão do júri."},"442":{"topicId":"OJ26-DPPE-CPP-16","texto":"Art. 442. Ao jurado que, sem causa legítima, deixar de comparecer no dia marcado para a sessão ou retirar-se antes de ser dispensado pelo presidente será aplicada multa de 1 (um) a 10 (dez) salários mínimos, a critério do juiz, de acordo com a sua condição econômica."},"443":{"topicId":"OJ26-DPPE-CPP-16","texto":"Art. 443. Somente será aceita escusa fundada em motivo relevante devidamente comprovado e apresentada, ressalvadas as hipóteses de força maior, até o momento da chamada dos jurados."},"444":{"topicId":"OJ26-DPPE-CPP-16","texto":"Art. 444. O jurado somente será dispensado por decisão motivada do juiz presidente, consignada na ata dos trabalhos."},"445":{"topicId":"OJ26-DPPE-CPP-16","texto":"Art. 445. O jurado, no exercício da função ou a pretexto de exercê-la, será responsável criminalmente nos mesmos termos em que o são os juízes togados."},"446":{"topicId":"OJ26-DPPE-CPP-16","texto":"Art. 446. Aos suplentes, quando convocados, serão aplicáveis os dispositivos referentes às dispensas, faltas e escusas e à equiparação de responsabilidade penal prevista no art. 445 deste Código."},"485":{"topicId":"OJ26-DPPE-CPP-17","texto":"Art. 485. Não havendo dúvida a ser esclarecida, o juiz presidente, os jurados, o Ministério Público, o assistente, o querelante, o defensor do acusado, o escrivão e o oficial de justiça dirigir-se-ão à sala especial a fim de ser procedida a votação.\n§ 1º Na falta de sala especial, o juiz presidente determinará que o público se retire, permanecendo somente as pessoas mencionadas no caput deste artigo.\n§ 2º O juiz presidente advertirá as partes de que não será permitida qualquer intervenção que possa perturbar a livre manifestação do Conselho e fará retirar da sala quem se portar inconvenientemente."},"486":{"topicId":"OJ26-DPPE-CPP-17","texto":"Art. 486. Antes de proceder-se à votação de cada quesito, o juiz presidente mandará distribuir aos jurados pequenas cédulas, feitas de papel opaco e facilmente dobráveis, contendo 7 (sete) delas a palavra sim , 7 (sete) a palavra não ."},"487":{"topicId":"OJ26-DPPE-CPP-17","texto":"Art. 487. Para assegurar o sigilo do voto, o oficial de justiça recolherá em urnas separadas as cédulas correspondentes aos votos e as não utilizadas."},"513":{"topicId":"OJ26-DPPE-CPP-18","texto":"Art. 513. Nos crimes de responsabilidade dos funcionários públicos, cujo processo e julgamento competirão aos juízes de direito, a queixa ou a denúncia será instruída com documentos ou justificação que façam presumir a existência do delito ou com declaração fundamentada da impossibilidade de apresentação de qualquer dessas provas."},"514":{"topicId":"OJ26-DPPE-CPP-18","texto":"Art. 514. Nos crimes afiançáveis, estando a denúncia ou queixa em devida forma, o juiz mandará autuá-la e ordenará a notificação do acusado, para responder por escrito, dentro do prazo de quinze dias.\nParágrafo único. Se não for conhecida a residência do acusado, ou este se achar fora da jurisdição do juiz, ser-lhe-á nomeado defensor, a quem caberá apresentar a resposta preliminar."},"515":{"topicId":"OJ26-DPPE-CPP-18","texto":"Art. 515. No caso previsto no artigo anterior, durante o prazo concedido para a resposta, os autos permanecerão em cartório, onde poderão ser examinados pelo acusado ou por seu defensor.\nParágrafo único. A resposta poderá ser instruída com documentos e justificações."},"516":{"topicId":"OJ26-DPPE-CPP-18","texto":"Art. 516. O juiz rejeitará a queixa ou denúncia, em despacho fundamentado, se convencido, pela resposta do acusado ou do seu defensor, da inexistência do crime ou da improcedência da ação."},"517":{"topicId":"OJ26-DPPE-CPP-18","texto":"Art. 517. Recebida a denúncia ou a queixa, será o acusado citado, na forma estabelecida no Capítulo I do Título X do Livro I."},"518":{"topicId":"OJ26-DPPE-CPP-18","texto":"Art. 518. Na instrução criminal e nos demais termos do processo, observar-se-á o disposto nos Capítulos I e III, Título I, deste Livro."},"563":{"topicId":"OJ26-DPPE-CPP-19","texto":"Art. 563. Nenhum ato será declarado nulo, se da nulidade não resultar prejuízo para a acusação ou para a defesa."},"564":{"topicId":"OJ26-DPPE-CPP-19","texto":"Art. 564. A nulidade ocorrerá nos seguintes casos:\nI - por incompetência, suspeição ou suborno do juiz;\nII - por ilegitimidade de parte;\nIII - por falta das fórmulas ou dos termos seguintes:\na) a denúncia ou a queixa e a representação e, nos processos de contravenções penais, a portaria ou o auto de prisão em flagrante;\nb) o exame de corpo de delito nos crimes que deixam vestígios, ressalvado o disposto no art. 167;\nc) a nomeação de defensor ao réu presente, que o não tiver, ou ao ausente, e de curador ao menor de 21 anos;\nd) a intervenção do Ministério Público em todos os termos da ação por ele intentada e nos da intentada pela parte ofendida, quando se tratar de crime de ação pública;\ne) a citação do réu para ver-se processar, o seu interrogatório, quando presente, e os prazos concedidos à acusação e à defesa;\nf) a sentença de pronúncia, o libelo e a entrega da respectiva cópia, com o rol de testemunhas, nos processos perante o Tribunal do Júri;\ng) a intimação do réu para a sessão de julgamento, pelo Tribunal do Júri, quando a lei não permitir o julgamento à revelia;\nh) a intimação das testemunhas arroladas no libelo e na contrariedade, nos termos estabelecidos pela lei;\ni) a presença pelo menos de 15 jurados para a constituição do júri;\nj) o sorteio dos jurados do conselho de sentença em número legal e sua incomunicabilidade;\nk) os quesitos e as respectivas respostas;\nl) a acusação e a defesa, na sessão de julgamento;\nm) a sentença;\nn) o recurso de oficio, nos casos em que a lei o tenha estabelecido;\no) a intimação, nas condições estabelecidas pela lei, para ciência de sentenças e despachos de que caiba recurso;\np) no Supremo Tribunal Federal e nos Tribunais de Apelação, o quorum legal para o julgamento;\nIV - por omissão de formalidade que constitua elemento essencial do ato;\nV - em decorrência de decisão carente de fundamentação.\nParágrafo único. Ocorrerá ainda a nulidade, por deficiência dos quesitos ou das suas respostas, e contradição entre estas."},"565":{"topicId":"OJ26-DPPE-CPP-19","texto":"Art. 565. Nenhuma das partes poderá argüir nulidade a que haja dado causa, ou para que tenha concorrido, ou referente a formalidade cuja observância só à parte contrária interesse."},"566":{"topicId":"OJ26-DPPE-CPP-19","texto":"Art. 566. Não será declarada a nulidade de ato processual que não houver influído na apuração da verdade substancial ou na decisão da causa."},"567":{"topicId":"OJ26-DPPE-CPP-19","texto":"Art. 567. A incompetência do juízo anula somente os atos decisórios, devendo o processo, quando for declarada a nulidade, ser remetido ao juiz competente."},"568":{"topicId":"OJ26-DPPE-CPP-19","texto":"Art. 568. A nulidade por ilegitimidade do representante da parte poderá ser a todo tempo sanada, mediante ratificação dos atos processuais."},"569":{"topicId":"OJ26-DPPE-CPP-19","texto":"Art. 569. As omissões da denúncia ou da queixa, da representação, ou, nos processos das contravenções penais, da portaria ou do auto de prisão em flagrante, poderão ser supridas a todo o tempo, antes da sentença final."},"570":{"topicId":"OJ26-DPPE-CPP-19","texto":"Art. 570. A falta ou a nulidade da citação, da intimação ou notificação estará sanada, desde que o interessado compareça, antes de o ato consumar-se, embora declare que o faz para o único fim de argüi-la. O juiz ordenará, todavia, a suspensão ou o adiamento do ato, quando reconhecer que a irregularidade poderá prejudicar direito da parte."},"593":{"topicId":"OJ26-DPPE-CPP-20","texto":"Art. 593. Caberá apelação no prazo de cinco dias:\nI - das sentenças definitivas de condenação ou absolvição proferidas por Juiz singular;\nII - das decisões definitivas, ou com força de definitivas, proferidas por Juiz singular, nos casos não previstos no capítulo anterior;\nIII - das decisões do Tribunal do Júri, quando:\na) ocorrer nulidade posterior à pronúncia;\nb) for a sentença do Juiz Presidente contrária à lei expressa ou à decisão dos jurados;\nc) houver erro ou injustiça no tocante à aplicação da pena ou da medida de segurança;\nd) for a decisão dos jurados manifestamente contrária à prova dos autos.\n§ 1º Se a sentença do Juiz Presidente for contrária à lei expressa ou divergir das respostas dos jurados aos quesitos, o Tribunal ad quem fará a devida retificação.\n§ 2º Interposta a apelação com fundamento no nº III, letra c , deste artigo, o Tribunal ad quem , se lhe der provimento retificará a aplicação da pena ou da medida de segurança.\n§ 3º Se a apelação se fundar no nº III, letra d , deste artigo, e o Tribunal ad quem se convencer de que a decisão dos jurados é manifestamente contrária à prova dos autos, dar-lhe-á provimento para sujeitar o réu a novo julgamento; não se admite, porém, pelo mesmo motivo, segunda apelação.\n§ 4º Quando cabível a apelação, não poderá ser usado o recurso em sentido estrito, ainda que somente de parte da decisão se recorra."},"647":{"topicId":"OJ26-DPPE-CPP-21","texto":"Art. 647. Dar-se-á habeas corpus sempre que alguém sofrer ou se achar na iminência de sofrer violência ou coação ilegal na sua liberdade de ir e vir, salvo nos casos de punição disciplinar."},"648":{"topicId":"OJ26-DPPE-CPP-21","texto":"Art. 648. A coação considerar-se-á ilegal:\nI - quando não houver justa causa;\nII - quando alguém estiver preso por mais tempo do que determina a lei;\nIII - quando quem ordenar a coação não tiver competência para fazê-lo;\nIV - quando houver cessado o motivo que autorizou a coação;\nV - quando não for alguém admitido a prestar fiança, nos casos em que a lei a autoriza;\nVI - quando o processo for manifestamente nulo;\nVII - quando extinta a punibilidade."},"649":{"topicId":"OJ26-DPPE-CPP-21","texto":"Art. 649. O juiz ou o tribunal, dentro dos limites da sua jurisdição, fará passar imediatamente a ordem impetrada, nos casos em que tenha cabimento, seja qual for a autoridade coatora."},"650":{"topicId":"OJ26-DPPE-CPP-21","texto":"Art. 650. Competirá conhecer, originariamente, do pedido de habeas corpus :\nI - ao Supremo Tribunal Federal, nos casos previstos no art. 101, I, g , da Constituição;\nII - aos Tribunais de Apelação, sempre que os atos de violência ou coação forem atribuídos a governadores, ou interventores, dos Estados ou Territórios e ao prefeito do Distrito Federal, ou a seus secretários, ou aos chefes de Polícia. (Inciso retificado no DOU de 24/10/1941)\n§ 1º A competência do juiz cessará sempre que a violência ou coação provier de autoridade judiciária de igual ou superior jurisdição.\n§ 2º Não cabe o habeas corpus contra a prisão administrativa, atual ou iminente, dos responsáveis por dinheiro ou valor pertencente à Fazenda Pública, alcançados ou omissos em fazer o seu recolhimento nos prazos legais, salvo se o pedido for acompanhado de prova de quitação ou de depósito do alcance verificado, ou se a prisão exceder o prazo legal."},"651":{"topicId":"OJ26-DPPE-CPP-21","texto":"Art. 651. A concessão do habeas corpus não obstará, nem porá termo ao processo, desde que este não esteja em conflito com os fundamentos daquela."},"652":{"topicId":"OJ26-DPPE-CPP-21","texto":"Art. 652. Se o habeas corpus for concedido em virtude de nulidade do processo, este será renovado."},"653":{"topicId":"OJ26-DPPE-CPP-21","texto":"Art. 653. Ordenada a soltura do paciente em virtude de habeas corpus , será condenada nas custas a autoridade que, por má-fé ou evidente abuso de poder, tiver determinado a coação.\nParágrafo único. Neste caso, será remetida ao Ministério Público cópia das peças necessárias para ser promovida a responsabilidade da autoridade."},"654":{"topicId":"OJ26-DPPE-CPP-21","texto":"Art. 654. O habeas corpus poderá ser impetrado por qualquer pessoa, em seu favor ou de outrem, bem como pelo Ministério Público.\n§ 1º A petição de habeas corpus conterá:\na) o nome da pessoa que sofre ou está ameaçada de sofrer violência ou coação e o de quem exercer a violência, coação ou ameaça;\nb) a declaração da espécie de constrangimento ou, em caso de simples ameaça de coação, as razões em que funda o seu temor;\nc) a assinatura do impetrante, ou de alguém a seu rogo, quando não souber ou não puder escrever, e a designação das respectivas residências.\n§ 2º Os juízes e os tribunais têm competência para expedir de ofício ordem de habeas corpus , quando no curso de processo verificarem que alguém sofre ou está na iminência de sofrer coação ilegal."},"762":{"topicId":"OJ26-DPPE-CPP-22","texto":"Art. 762. A ordem de internação, expedida para executar-se medida de segurança detentiva, conterá:\nI - a qualificação do internando;\nII - o teor da decisão que tiver imposto a medida de segurança;\nIII - a data em que terminará o prazo mínimo da internação."},"763":{"topicId":"OJ26-DPPE-CPP-22","texto":"Art. 763. Se estiver solto o internando, expedir-se-á mandado de captura, que será cumprido por oficial de justiça ou por autoridade policial."},"792":{"topicId":"OJ26-DPPE-CPP-23","texto":"Art. 792. As audiências, sessões e os atos processuais serão, em regra, públicos e se realizarão nas sedes dos juízos e tribunais, com assistência dos escrivães, do secretário, do oficial de justiça que servir de porteiro, em dia e hora certos, ou previamente designados.\n§ 1º Se da publicidade da audiência, da sessão ou do ato processual, puder resultar escândalo, inconveniente grave ou perigo de perturbação da ordem, o juiz, ou o tribunal, câmara, ou turma, poderá, de ofício ou a requerimento da parte ou do Ministério Público, determinar que o ato seja realizado a portas fechadas, limitando o número de pessoas que possam estar presentes.\n§ 2º As audiências, as sessões e os atos processuais, em caso de necessidade, poderão realizar-se na residência do juiz, ou em outra casa por ele especialmente designada."},"798":{"topicId":"OJ26-DPPE-CPP-25","texto":"Art. 798. Todos os prazos correrão em cartório e serão contínuos e peremptórios, não se interrompendo por férias, domingo ou dia feriado.\n§ 1º Não se computará no prazo o dia do começo, incluindo-se, porém, o do vencimento.\n§ 2º A terminação dos prazos será certificada nos autos pelo escrivão; será, porém, considerado findo o prazo, ainda que omitida aquela formalidade, se feita a prova do dia em que começou a correr.\n§ 3º O prazo que terminar em domingo ou dia feriado considerar-se-á prorrogado até o dia útil imediato.\n§ 4º Não correrão os prazos, se houver impedimento do juiz, força maior, ou obstáculo judicial oposto pela parte contrária.\n§ 5º Salvo os casos expressos, os prazos correrão:\na) da intimação;\nb) da audiência ou sessão em que for proferida a decisão, se a ela estiver presente a parte;\nc) do dia em que a parte manifestar nos autos ciência inequívoca da sentença ou despacho."},"28-A":{"topicId":"OJ26-DPPE-CPP-01","texto":"Art. 28-A. Não sendo caso de arquivamento e tendo o investigado confessado formal e circunstancialmente a prática de infração penal sem violência ou grave ameaça e com pena mínima inferior a 4 (quatro) anos, o Ministério Público poderá propor acordo de não persecução penal, desde que necessário e suficiente para reprovação e prevenção do crime, mediante as seguintes condições ajustadas cumulativa e alternativamente:\nI - reparar o dano ou restituir a coisa à vítima, exceto na impossibilidade de fazê-lo;\nII - renunciar voluntariamente a bens e direitos indicados pelo Ministério Público como instrumentos, produto ou proveito do crime;\nIII - prestar serviço à comunidade ou a entidades públicas por período correspondente à pena mínima cominada ao delito diminuída de um a dois terços, em local a ser indicado pelo juízo da execução, na forma do art. 46 do Decreto-Lei nº 2.848, de 7 de dezembro de 1940 (Código Penal);\nIV - pagar prestação pecuniária, a ser estipulada nos termos do art. 45 do Decreto-Lei nº 2.848, de 7 de dezembro de 1940 (Código Penal), a entidade pública ou de interesse social, a ser indicada pelo juízo da execução, que tenha, preferencialmente, como função proteger bens jurídicos iguais ou semelhantes aos aparentemente lesados pelo delito; ou\nV - cumprir, por prazo determinado, outra condição indicada pelo Ministério Público, desde que proporcional e compatível com a infração penal imputada.\n§ 1º Para aferição da pena mínima cominada ao delito a que se refere o caput deste artigo, serão consideradas as causas de aumento e diminuição aplicáveis ao caso concreto.\n§ 2º O disposto no caput deste artigo não se aplica nas seguintes hipóteses:\nI - se for cabível transação penal de competência dos Juizados Especiais Criminais, nos termos da lei;\nII - se o investigado for reincidente ou se houver elementos probatórios que indiquem conduta criminal habitual, reiterada ou profissional, exceto se insignificantes as infrações penais pretéritas;\nIII - ter sido o agente beneficiado nos 5 (cinco) anos anteriores ao cometimento da infração, em acordo de não persecução penal, transação penal ou suspensão condicional do processo; e\nIV - nos crimes praticados no âmbito de violência doméstica ou familiar, ou praticados contra a mulher por razões da condição de sexo feminino, em favor do agressor.\n§ 3º O acordo de não persecução penal será formalizado por escrito e será firmado pelo membro do Ministério Público, pelo investigado e por seu defensor.\n§ 4º Para a homologação do acordo de não persecução penal, será realizada audiência na qual o juiz deverá verificar a sua voluntariedade, por meio da oitiva do investigado na presença do seu defensor, e sua legalidade.\n§ 5º Se o juiz considerar inadequadas, insuficientes ou abusivas as condições dispostas no acordo de não persecução penal, devolverá os autos ao Ministério Público para que seja reformulada a proposta de acordo, com concordância do investigado e seu defensor.\n§ 6º Homologado judicialmente o acordo de não persecução penal, o juiz devolverá os autos ao Ministério Público para que inicie sua execução perante o juízo de execução penal.\n§ 7º O juiz poderá recusar homologação à proposta que não atender aos requisitos legais ou quando não for realizada a adequação a que se refere o § 5º deste artigo.\n§ 8º Recusada a homologação, o juiz devolverá os autos ao Ministério Público para a análise da necessidade de complementação das investigações ou o oferecimento da denúncia.\n§ 9º A vítima será intimada da homologação do acordo de não persecução penal e de seu descumprimento.\n§ 10. Descumpridas quaisquer das condições estipuladas no acordo de não persecução penal, o Ministério Público deverá comunicar ao juízo, para fins de sua rescisão e posterior oferecimento de denúncia.\n§ 11. O descumprimento do acordo de não persecução penal pelo investigado também poderá ser utilizado pelo Ministério Público como justificativa para o eventual não oferecimento de suspensão condicional do processo.\n§ 12. A celebração e o cumprimento do acordo de não persecução penal não constarão de certidão de antecedentes criminais, exceto para os fins previstos no inciso III do § 2º deste artigo.\n§ 13. Cumprido integralmente o acordo de não persecução penal, o juízo competente decretará a extinção de punibilidade.\n§ 14. No caso de recusa, por parte do Ministério Público, em propor o acordo de não persecução penal, o investigado poderá requerer a remessa dos autos a órgão superior, na forma do art. 28 deste Código."},"222-A":{"topicId":"OJ26-DPPE-CPP-08","texto":"Art. 222-A. As cartas rogatórias só serão expedidas se demonstrada previamente a sua imprescindibilidade, arcando a parte requerente com os custos de envio.\nParágrafo único. Aplica-se às cartas rogatórias o disposto nos §§ 1º e 2º do art. 222 deste Código."},"289-A":{"topicId":"OJ26-DPPE-CPP-11","texto":"Art. 289-A. O juiz competente providenciará o imediato registro do mandado de prisão em banco de dados mantido pelo Conselho Nacional de Justiça para essa finalidade.\n§ 1º Qualquer agente policial poderá efetuar a prisão determinada no mandado de prisão registrado no Conselho Nacional de Justiça, ainda que fora da competência territorial do juiz que o expediu.\n§ 2º Qualquer agente policial poderá efetuar a prisão decretada, ainda que sem registro no Conselho Nacional de Justiça, adotando as precauções necessárias para averiguar a autenticidade do mandado e comunicando ao juiz que a decretou, devendo este providenciar, em seguida, o registro do mandado na forma do caput deste artigo.\n§ 3º A prisão será imediatamente comunicada ao juiz do local de cumprimento da medida o qual providenciará a certidão extraída do registro do Conselho Nacional de Justiça e informará ao juízo que a decretou.\n§ 4º O preso será informado de seus direitos, nos termos do inciso LXIII do art. 5º da Constituição Federal e, caso o autuado não informe o nome de seu advogado, será comunicado à Defensoria Pública.\n§ 5º Havendo dúvidas das autoridades locais sobre a legitimidade da pessoa do executor ou sobre a identidade do preso, aplica-se o disposto no § 2º do art. 290 deste Código.\n§ 6° O Conselho Nacional de Justiça regulamentará o registro do mandado de prisão a que se refere o caput deste artigo."},"300-A":{"topicId":"OJ26-DPPE-CPP-11","texto":"Art. 300-A. O investigado por crimes contra a dignidade sexual, quando preso cautelarmente, e o condenado pelos mesmos crimes deverão ser submetidos obrigatoriamente à identificação do perfil genético, mediante extração de DNA (ácido desoxirribonucleico), por técnica adequada e indolor, por ocasião do ingresso no estabelecimento prisional."},"396-A":{"topicId":"OJ26-DPPE-CPP-14","texto":"Art. 396-A. Na resposta, o acusado poderá argüir preliminares e alegar tudo o que interesse à sua defesa, oferecer documentos e justificações, especificar as provas pretendidas e arrolar testemunhas, qualificando-as e requerendo sua intimação, quando necessário.\n§ 1º A exceção será processada em apartado, nos termos dos arts. 95 a 112 deste Código.\n§ 2º Não apresentada a resposta no prazo legal, ou se o acusado, citado, não constituir defensor, o juiz nomeará defensor para oferecê-la, concedendo-lhe vista dos autos por 10 (dez) dias."},"647-A":{"topicId":"OJ26-DPPE-CPP-21","texto":"Art. 647-A. No âmbito de sua competência jurisdicional, qualquer autoridade judicial poderá expedir de ofício ordem de habeas corpus , individual ou coletivo, quando, no curso de qualquer processo judicial, verificar que, por violação ao ordenamento jurídico, alguém sofre ou se acha ameaçado de sofrer violência ou coação em sua liberdade de locomoção.\nParágrafo único. A ordem de habeas corpus poderá ser concedida de ofício pelo juiz ou pelo tribunal em processo de competência originária ou recursal, ainda que não conhecidos a ação ou o recurso em que veiculado o pedido de cessação de coação ilegal."},"798-A":{"topicId":"OJ26-DPPE-CPP-25","texto":"Art. 798-A. Suspende-se o curso do prazo processual nos dias compreendidos entre 20 de dezembro e 20 de janeiro, inclusive, salvo nos seguintes casos:\nI - que envolvam réus presos, nos processos vinculados a essas prisões;\nII - nos procedimentos regidos pela Lei nº 11.340, de 7 de agosto de 2006 (Lei Maria da Penha);\nIII - nas medidas consideradas urgentes, mediante despacho fundamentado do juízo competente.\nParágrafo único. Durante o período a que se refere o caput deste artigo, fica vedada a realização de audiências e de sessões de julgamento, salvo nas hipóteses dos incisos I, II e III do caput deste artigo."}}},"senado-cp-1940":{"id":"DIR-DPEN-CP","concordancia":true,"nome":"Código Penal","rotulo":"do Código Penal (Decreto-Lei 2.848/1940)","titulo":"Direito: Código Penal","disciplina":"DPEN","url":"https://normas.leg.br/api/public/normas?urn=urn:lex:br:federal:decreto.lei:1940-12-07;2848&&tipo_documento=maior-detalhe","consultado_em":"2026-11-21","sha256":"eff7aee257c19d724afe64d7d8120cdda9f5da784af3a26a3485f59e2cfb424e","observacao":"Texto compilado vigente, publicado pela fonte (salvo em 2026-09-23); não é reconstruído por data. A própria fonte informa atualização até data não informada: alterações posteriores a essa data podem não constar.","artigos":{"1":{"topicId":"OJ26-DPEN-CP-01","texto":"Art. 1º Não há crime sem lei anterior que o defina. Não há pena sem prévia cominação legal."},"2":{"topicId":"OJ26-DPEN-CP-01","texto":"Art. 2º Ninguém pode ser punido por fato que lei posterior deixa de considerar crime, cessando em virtude dela a execução e os efeitos penais da sentença condenatória.\nParágrafo único. A lei posterior, que de qualquer modo favorecer o agente, aplica-se aos fatos anteriores, ainda que decididos por sentença condenatória transitada em julgado."},"3":{"topicId":"OJ26-DPEN-CP-01","texto":"Art. 3º A lei excepcional ou temporária, embora decorrido o período de sua duração ou cessadas as circunstâncias que a determinaram, aplica-se ao fato praticado durante sua vigência."},"4":{"topicId":"OJ26-DPEN-CP-01","texto":"Art. 4º Considera-se praticado o crime no momento da ação ou omissão, ainda que outro seja o momento do resultado."},"5":{"topicId":"OJ26-DPEN-CP-01","texto":"Art. 5º Aplica-se a lei brasileira, sem prejuízo de convenções, tratados e regras de direito internacional, ao crime cometido no território nacional.\n§ 1º Para os efeitos penais, consideram-se como extensão do território nacional as embarcações e aeronaves brasileiras, de natureza pública ou a serviço do governo brasileiro, onde quer que se encontrem, bem como as aeronaves e as embarcações brasileiras, mercantes ou de propriedade privada, que se achem, respectivamente, no espaço aéreo correspondente ou em alto-mar.\n§ 2º É também aplicável a lei brasileira aos crimes praticados a bordo de aeronaves ou embarcações estrangeiras de propriedade privada, achando-se aquelas em pouso no território nacional ou em vôo no espaço aéreo correspondente, e estas em porto ou mar territorial do Brasil."},"6":{"topicId":"OJ26-DPEN-CP-01","texto":"Art. 6º Considera-se praticado o crime no lugar em que ocorreu a ação ou omissão, no todo ou em parte, bem como onde se produziu ou deveria produzir-se o resultado."},"7":{"topicId":"OJ26-DPEN-CP-01","texto":"Art. 7º Ficam sujeitos à lei brasileira, embora cometidos no estrangeiro:\nI - os crimes:\na) contra a vida ou a liberdade do Presidente da República;\nb) contra o patrimônio ou a fé pública da União, do Distrito Federal, de Estado, de Território, de Município, de empresa pública, sociedade de economia mista, autarquia ou fundação instituída pelo Poder Público;\nc) contra a administração pública, por quem está a seu serviço;\nd) de genocídio, quando o agente for brasileiro ou domiciliado no Brasil;\nII - os crimes:\na) que, por tratado ou convenção, o Brasil se obrigou a reprimir;\nb) praticados por brasileiro;\nc) praticados em aeronaves ou embarcações brasileiras, mercantes ou de propriedade privada, quando em território estrangeiro e aí não sejam julgados.\n§ 1º Nos casos do inciso I, o agente é punido segundo a lei brasileira, ainda que absolvido ou condenado no estrangeiro.\n§ 2º Nos casos do inciso II, a aplicação da lei brasileira depende do concurso das seguintes condições:\na) entrar o agente no território nacional;\nb) ser o fato punível também no país em que foi praticado;\nc) estar o crime incluído entre aqueles pelos quais a lei brasileira autoriza a extradição;\nd) não ter sido o agente absolvido no estrangeiro ou não ter aí cumprido a pena;\ne) não ter sido o agente perdoado no estrangeiro ou, por outro motivo, não estar extinta a punibilidade, segundo a lei mais favorável.\n§ 3º A lei brasileira aplica-se também ao crime cometido por estrangeiro contra brasileiro fora do Brasil, se, reunidas as condições previstas no parágrafo anterior:\na) não foi pedida ou foi negada a extradição;\nb) houve requisição do Ministro da Justiça."},"8":{"topicId":"OJ26-DPEN-CP-01","texto":"Art. 8º A pena cumprida no estrangeiro atenua a pena imposta no Brasil pelo mesmo crime, quando diversas, ou nela é computada, quando idênticas."},"9":{"topicId":"OJ26-DPEN-CP-01","texto":"Art. 9º A sentença estrangeira, quando a aplicação da lei brasileira produz na espécie as mesmas conseqüências, pode ser homologada no Brasil para:\nI - obrigar o condenado à reparação do dano, a restituições e a outros efeitos civis;\nII - sujeitá-lo à medida de segurança.\nParágrafo único. A homologação depende:\na) para os efeitos previstos no inciso I, de pedido da parte interessada;\nb) para os outros efeitos, da existência de tratado de extradição com o país de cuja autoridade judiciária emanou a sentença, ou, na falta de tratado, de requisição do Ministro da Justiça."},"10":{"topicId":"OJ26-DPEN-CP-01","texto":"Art. 10. O dia do começo inclui-se no cômputo do prazo. Contam-se os dias, os meses e os anos pelo calendário comum."},"11":{"topicId":"OJ26-DPEN-CP-01","texto":"Art. 11. Desprezam-se, nas penas privativas de liberdade e nas restritivas de direitos, as frações de dia, e, na pena de multa, as frações de cruzeiro."},"12":{"topicId":"OJ26-DPEN-CP-01","texto":"Art. 12. As regras gerais deste Código aplicam-se aos fatos incriminados por lei especial, se esta não dispuser de modo diverso."},"100":{"topicId":"OJ26-DPEN-CP-02","texto":"Art. 100. A ação penal é pública, salvo quando a lei expressamente a declara privativa do ofendido.\n§ 1º A ação pública é promovida pelo Ministério Público, dependendo, quando a lei o exige, de representação do ofendido ou de requisição do Ministro da Justiça.\n§ 2º A ação de iniciativa privada é promovida mediante queixa do ofendido ou de quem tenha qualidade para representá-lo.\n§ 3º A ação de iniciativa privada pode intentar-se nos crimes de ação pública, se o Ministério Público não oferece denúncia no prazo legal.\n§ 4º No caso de morte do ofendido ou de ter sido declarado ausente por decisão judicial, o direito de oferecer queixa ou de prosseguir na ação passa ao cônjuge, ascendente, descendente ou irmão."},"101":{"topicId":"OJ26-DPEN-CP-02","texto":"Art. 101. Quando a lei considera como elemento ou circunstâncias do tipo legal fatos que, por si mesmos, constituem crimes, cabe ação pública em relação àquele, desde que, em relação a qualquer destes, se deva proceder por iniciativa do Ministério Público."},"102":{"topicId":"OJ26-DPEN-CP-02","texto":"Art. 102. A representação será irretratável depois de oferecida a denúncia."},"103":{"topicId":"OJ26-DPEN-CP-02","texto":"Art. 103. Salvo disposição expressa em contrário, o ofendido decai do direito de queixa ou de representação se não o exerce dentro do prazo de seis meses, contado do dia em que veio a saber quem é o autor do crime, ou, no caso do § 3º do art. 100 deste Código, do dia em que se esgota o prazo para oferecimento da denúncia.\nParágrafo único. Nos crimes praticados no âmbito de violência doméstica e familiar contra a mulher, a ofendida decai do direito de queixa ou de representação se não o exerce no prazo de 12 (doze) meses, contado do dia em que veio a saber quem é o autor do crime, ou, no caso do § 3º do art. 100 deste Código, do dia em que se esgota o prazo para oferecimento da denúncia."},"104":{"topicId":"OJ26-DPEN-CP-02","texto":"Art. 104. O direito de queixa não pode ser exercido quando renunciado expressa ou tacitamente.\nParágrafo único. Importa renúncia tácita ao direito de queixa a prática de ato incompatível com a vontade de exercê-lo; não a implica, todavia, o fato de receber o ofendido a indenização do dano causado pelo crime."},"105":{"topicId":"OJ26-DPEN-CP-02","texto":"Art. 105. O perdão do ofendido, nos crimes em que somente se procede mediante queixa, obsta ao prosseguimento da ação."},"106":{"topicId":"OJ26-DPEN-CP-02","texto":"Art. 106. O perdão, no processo ou fora dele, expresso ou tácito:\nI - se concedido a qualquer dos querelados, a todos aproveita;\nII - se concedido por um dos ofendidos, não prejudica o direito dos outros;\nIII - se o querelado o recusa, não produz efeito.\n§ 1º Perdão tácito é o que resulta da prática de ato incompatível com a vontade de prosseguir na ação.\n§ 2º Não é admissível o perdão depois que passa em julgado a sentença condenatória."},"107":{"topicId":"OJ26-DPEN-CP-03","texto":"Art. 107. Extingue-se a punibilidade:\nI - pela morte do agente;\nII - pela anistia, graça ou indulto;\nIII - pela retroatividade de lei que não mais considera o fato como criminoso;\nIV - pela prescrição, decadência ou perempção;\nV - pela renúncia do direito de queixa ou pelo perdão aceito, nos crimes de ação privada;\nVI - pela retratação do agente, nos casos em que a lei a admite;\nVII - (Revogado pela Lei nº 11.106, de 28/3/2005)\nVIII - (Revogado pela Lei nº 11.106, de 28/3/2005)\nIX - pelo perdão judicial, nos casos previstos em lei."},"108":{"topicId":"OJ26-DPEN-CP-03","texto":"Art. 108. A extinção da punibilidade de crime que é pressuposto, elemento constitutivo ou circunstância agravante de outro não se estende a este. Nos crimes conexos, a extinção da punibilidade de um deles não impede, quanto aos outros, a agravação da pena resultante da conexão."},"109":{"topicId":"OJ26-DPEN-CP-03","texto":"Art. 109. A prescrição, antes de transitar em julgado a sentença final, salvo o disposto no § 1º do art. 110 deste Código, regula-se pelo máximo da pena privativa de liberdade cominada ao crime, verificando-se:\nI - em vinte anos, se o máximo da pena é superior a doze;\nII - em dezesseis anos, se o máximo da pena é superior a oito anos e não excede a doze;\nIII - em doze anos, se o máximo da pena é superior a quatro anos e não excede a oito;\nIV - em oito anos, se o máximo da pena é superior a dois anos e não excede a quatro;\nV - em quatro anos, se o máximo da pena é igual a um ano ou, sendo superior, não excede a dois;\nVI - em 3 (três) anos, se o máximo da pena é inferior a 1 (um) ano.\nParágrafo único. Aplicam-se às penas restritivas de direito os mesmos prazos previstos para as privativas de liberdade."},"110":{"topicId":"OJ26-DPEN-CP-03","texto":"Art. 110. A prescrição depois de transitar em julgado a sentença condenatória regula-se pela pena aplicada e verifica-se nos prazos fixados no artigo anterior, os quais se aumentam de um terço, se o condenado é reincidente.\n§ 1º A prescrição, depois da sentença condenatória com trânsito em julgado para a acusação ou depois de improvido seu recurso, regula-se pela pena aplicada, não podendo, em nenhuma hipótese, ter por termo inicial data anterior à da denúncia ou queixa .\n§ 2º (Revogado pela Lei nº 12.234, de 5/5/2010)"},"111":{"topicId":"OJ26-DPEN-CP-03","texto":"Art. 111. A prescrição, antes de transitar em julgado a sentença final, começa a correr:\nI - do dia em que o crime se consumou;\nII - no caso de tentativa, do dia em que cessou a atividade criminosa;\nIII - nos crimes permanentes, do dia em que cessou a permanência;\nIV - nos de bigamia e nos de falsificação ou alteração de assentamento do registro civil, da data em que o fato se tornou conhecido;\nV - nos crimes contra a dignidade sexual ou que envolvam violência contra a criança e o adolescente, previstos neste Código ou em legislação especial, da data em que a vítima completar 18 (dezoito) anos, salvo se a esse tempo já houver sido proposta a ação penal."},"112":{"topicId":"OJ26-DPEN-CP-03","texto":"Art. 11

nbiométrico, salvo exceções definidas pela Presidência do Tribunal de Justiça e\nobservada a regulamentação pertinente."},"47":{"topicId":"OJ26-LESP-NSCGJ-03","texto":"Art. 47. Os servidores dos ofícios de justiça deverão se adaptar\ncontinuamente às evoluções do sistema informatizado oficial, utilizando plenamente as\nfuncionalidades disponibilizadas para a realização dos atos pertinentes ao serviço\n(emissão de certidões, ofícios, mandados, cargas de autos etc.).\nParágrafo único. Para efeito de divisão do trabalho entre os escreventes\ntécnicos judiciários, oficiais de justiça e juízes, e outras providências necessárias à\nordem do serviço, o sistema informatizado atribuirá a cada processo distribuído um\nnúmero de controle interno da unidade judicial, sem prejuízo do número do processo\n(número do protocolo que seguirá série única)."},"49":{"topicId":"OJ26-LESP-NSCGJ-03","texto":"Art. 49. Os níveis de acesso às informações e o respectivo credenciamento\n(senha) dos funcionários, para operação do SAJ/PG, serão estabelecidos em\nexpediente interno pela Corregedoria Geral da Justiça, com a participação da Secretaria\nde Tecnologia da Informação - STI.\n§ 1º É vedado ao funcionário credenciado ceder a respectiva senha ou\npermitir que outrem, funcionário ou não, use-a para acessar indevidamente o sistema\ninformatizado.\n§ 2º Os escrivães judiciais comunicarão prontamente à STI as alterações no\nquadro funcional da unidade, para o processamento da revogação ou novo\ncredenciamento."},"105":{"topicId":"OJ26-LESP-NSCGJ-04","texto":"Art. 105. Os mandados de citação, intimação e demais atos a serem\ncumpridos pelos Oficiais de Justiça submetem-se às regras previstas no Capítulo VII\ndestas Normas de Serviço. 3\nParágrafo único. Os mandados e contramandados de prisão e alvarás de\nsoltura submetem-se às disposições constantes na Seção XII do Capítulo IV. 4"},"196":{"topicId":"OJ26-LESP-NSCGJ-05","texto":"Art. 196. Salvo motivada decisão jurisdicional em sentido contrário, o\nservidor praticará atos ordinatórios nas situações abaixo descritas:\n1\nProv. CG 17/2016.\n2\nProvs. CGJ 10/95 e 3/96.\n3\nProv. CG 17/2016.\n4\nProv. CG 17/2016.\n5\nProv. CG 17/2016.\n6\nProv. CG 17/2016.\n7\nProv. CGJ 3/96.\n8\nProv. CG 47/2015.\nI - constatada falta ou irregularidade na representação de qualquer das\npartes, providenciará a intimação necessária à regularização, com as advertências\nprevistas nos arts. 76 e 104 do Código de Processo Civil. O prazo será de 15 (quinze)\ndias, prorrogável por igual período por despacho do juiz;\nII - nos casos previstos em lei (CPC, art. 72), enquanto não disponibilizado\no módulo para indicação de advogado da Defensoria Pública, expedirá comunicação à\nDefensoria Pública ou à Ordem dos Advogados do Brasil para indicação de curador\nespecial. Inexistindo ordem judicial em sentido contrário, o indicado estará tacitamente\nnomeado e será intimado para apresentar sua manifestação;\nIII - constatada a falta ou a insuficiência das custas e despesas de ingresso,\nprovidenciará a intimação do autor, na pessoa de seu advogado, para recolhê-las no\nprazo de 15 (quinze) dias, sob pena de cancelamento da distribuição (CPC, art. 290);\nIV - constatada a falta ou a insuficiência de peças necessárias à instrução\ndo mandado/carta (por exemplo, insuficiência de cópias para citação inicial), ou do valor\npara as diligências do oficial de justiça ou expedição de carta, providenciará a intimação\ndo autor, na pessoa de seu advogado, para apresentar as peças ou recolher o valor\ndevido no prazo de 15 (quinze) dias, sob pena de extinção do processo, na forma do\nart. 485, IV, do Código de Processo Civil;\nV - devolvido o mandado ou a carta de citação com resultado negativo, o\nautor/exequente será intimado a se manifestar no prazo de 5 (cinco) dias. Fornecendo\na parte interessada o endereço ou meio necessário para o cumprimento da diligência, a\ncarta ou mandado será expedido independentemente de nova ordem judicial;\nVI - salvo determinação expressa do juízo deprecado em sentido contrário,\no cumprimento e devolução da carta precatória destinada à citação (em processo de\nconhecimento ou execução) ou intimação independem de despacho. Nos casos de\narresto ou penhora, transferência de valores, prisão, soltura, alteração de guarda,\nliberação de bens ou levantamento de constrição (penhora, arresto, caução, etc.), é\nnecessária prévia deliberação do juiz deprecado;\nVII - devolvida a carta precatória sem o efetivo cumprimento, providenciará\na intimação da parte interessada para se manifestar no prazo de 5 (cinco) dias.\nFornecido o endereço ou meio necessário para o cumprimento, a diligência será\ncumprida independentemente de nova ordem judicial;\nVIII - quando os autos estiverem com vista a advogado, em cartório,\ndecorrido o respectivo prazo, lavrará certidão e fará conclusão do feito, ou abrirá vista,\nsucessivamente, à parte contrária, conforme for o caso;\nIX - decorrido o prazo de 15 (quinze) dias, se outro não for o prazo legal ou\nfixado, sem que haja informação sobre o atendimento da requisição ou solicitação,\nhaverá de ser feita conclusão ao juiz para as providências cabíveis. Providenciado o\nrecolhimento das custas, poderão ser tomadas providências que dependam do acesso\ndireto da repartição ao sistema informatizado. Não serão solicitadas informações que\npossam ser acessadas diretamente pela repartição interessada.\nX - verificada a paralisação do processo por mais de 1 (um) ano por inércia\ndas partes, providenciará a intimação do interessado pelo Diário da Justiça Eletrônico.\nNão o fazendo, será intimado, pessoalmente, para dar andamento ao feito em 5 (cinco)\ndias, sob pena de extinção e consequente arquivamento do processo (CPC, art. 485, II\ne § 1º);\nXI - constatado que o autor não promoveu por mais de 30 (trinta) dias os\natos e diligências que lhe competem, o ofício de justiça providenciará a sua intimação\n1\nProv. CG 17/2016.\n2\nProv. CG 17/2016.\n3\nProv. CG 17/2016.\n4\nProv. CG 17/2016.\n5\nProv. CG 17/2016.\n6\nProv. CG 17/2016.\n7\nProv. CG 17/2016.\npelo Diário da Justiça Eletrônico. Mantida a inércia, o autor será intimado pessoalmente,\npor meio eletrônico, mandado ou carta, para suprir a omissão em 5 (cinco) dias , sob\npena de extinção e consequente arquivamento do processo (CPC, art. 485, III e § 1º);\nXII - findo o prazo de suspensão do processo de que trata o art. 313, § 4º,\ndo Código de Processo Civil, intimará a parte para promover o andamento do processo,\nsob pena de extinção;\nXIII - constatado que o réu, em sua contestação, alegou qualquer das\nmatérias enumeradas no art. 337 do Código de Processo Civil, ou apresentou\ndocumento novo, providenciará a intimação do autor para réplica no prazo de 15\n(quinze) dias, permitindo-lhe a produção de prova.\nXIV – Revogado.\nXV - designada perícia pelos órgãos públicos ou entidades conveniadas,\nprovidenciará a intimação das partes;\nXVI - com a juntada aos autos de laudos periciais, documentos ou outras\ninformações requisitadas pelo juízo, providenciará a intimação das partes para\nmanifestação, direta ou por meio dos seus assistentes técnicos;\nXVII – Revogado.\nXVIII – Revogado.\nXIX – Revogado.\nXX - constatada a necessidade de ordem de arrombamento e reforço\npolicial, o oficial de justiça, independentemente da devolução do mandado, apresentará\nao juízo requerimento em modelo padronizado. O requerimento, se deferido, servirá de\nrequisição da força policial e cópia dele será entranhada aos autos;\nXXI – do mandado de entrega de bens a depositário fará constar a seguinte\nadvertência: “Fica o depositário advertido de que o descumprimento da ordem judicial\npoderá implicar imposição de multa, busca e apreensão ou remoção de coisas , inclusive\ncom uso de força policial, sem prejuízo de outras medidas”;\nXXII - restando negativas as duas hastas públicas inicialmente designadas,\nintimará o exequente a se manifestar em 5 (cinco) dias. Requerida nova hasta, desde\nlogo designará mais uma data, salvo determinação em contrário;\nXXIII - após a apresentação do comprovante de cumprimento da obrigação\npelo devedor, intimará o exequente para se manifestar sobre o documento sob pena de\nextinção da execução na forma do artigo 924, III, do Código de Processo Civil; 11\nXXIV – Revogado.\nXXV - Nomeado perito especializado, transcorrido o prazo de 15 (quinze)\ndias para arguição de impedimento ou suspeição pela parte, indicação de assistente\ntécnico e apresentação de quesito, intimará o perito para apresentar em 5 (cinco) dias\nproposta de honorários;\nXXVI – Apresentada a proposta de honorários, intimará as partes para,\nquerendo, manifestar-se no prazo de 5 (cinco) dias, após o que o juiz arbitrará o valor.\nXXVII – Formalizada a penhora por qualquer dos meios legais, intimará o\n1\nProv. CG 17/2016.\n2\nProv. CG 17/2016.\n3\nProv. CG 17/2016.\n4\nProv. CG 17/2016.\n5\nProv. CG 17/2016.\n6\nProv. CG 17/2016.\n7\nProv. CG 17/2016.\n8\nProv. CG 17/2016.\n9\nProv. CG 17/2016.\n10\nProv. CG 17/2016.\n11\nProv. CG 17/2016.\n12\nProv. CG 17/2016.\n13\nProv. CG 17/2016.\n14\nProv. CG 17/2016.\nexecutado quando representado por advogado nos autos, via DJE.\nXXVIII – Recebido o recurso de apelação, intimará a parte contrária para, no\nprazo de 15 (quinze) dias, apresentar contrarrazões, remetendo os autos, em seguida,\nao Tribunal de Justiça de São Paulo para exercício do juízo de admissibilidade. Na\nhipótese de apelação interposta contra decisão de indeferimento da petição inicial (CPC,\nart. 330), de improcedência liminar do pedido (CPC, art. 332) e de extinção do feito sem\nresolução de mérito (CPC, art. 485) os autos serão remetidos ao juiz, que poderá\nretratar-se, e, caso não haja exercício de retratação, deve-se expedir o necessário para\ncitação do réu para responder ao recurso, devendo o autor apelante providenciar o\nnecessário para tanto;\nXXIX - Publicado edital do leilão, intimará a parte a proceder, pelo menos 5\n(cinco) dias antes da data designada para o ato, a atualização do débito, incluindo-se,\ntambém, despesas com os editais.\nSubseção III\nDa Remessa dos Autos ao Partidor"},"282":{"topicId":"OJ26-LESP-NSCGJ-06","texto":"Art. 282 - No Foro Central da Comarca da Capital funcionará o Ofício dos\nLeilões Públicos com a finalidade de realizar os leilões presenciais das varas centrais\nda Comarca da Capital. Os escreventes nele lotados apregoarão os leilões, apenas em\nsituações excepcionalíssimas, desde que o exequente não exerça o seu direito de\nindicação e haja impedimento legal para atuação de todos os leiloeiros públicos\ncredenciados.\n§ 1º Nas demais Comarcas e varas os leilões serão realizados por oficiais\nde justiça, apenas em situações excepcionalíssimas, desde que o exequente não exerça\no seu direito de indicação e haja impedimento legal para atuação de todos os leiloeiros\npúblicos credenciados, e sob fiscalização do juiz. 3\n§ 2º O leilão presencial será realizado, no Foro Central da Comarca da\nCapital, pelo Ofício da Portaria dos Auditórios e dos Leilões Presenciais, se outro local\nnão houver sido designado pelo juiz (CPC, art. 882, §3º).\n§ 3º A designação de leiloeiro público devidamente cadastrado no Portal dos\nAuxiliares (CPC, art. 883 e 884), caberá ao juiz, que poderá acolher indicação do\nexequente. 5\n§ 4º A estrutura física do Setor de Leilões Presenciais da Comarca da Capital\npoderá ser utilizada para a realização de leilões somente na hipótese de ser esse o lugar\ndesignado pelo Juiz (CPC, art. 884, inciso II)."},"310":{"topicId":"OJ26-LESP-NSCGJ-07","texto":"Art. 310. Em todos os mandados expedidos será anotado o número do\nrespectivo processo, dispensada a anotação do número de ordem da carga, se esta\ninformação constar do sistema informatizado do setor e estiver disponível para consulta\n1\nProv. CGJ 11/2002.\n2 Prov. CG 27/2016.\n3 Vide Prov. CSM 1676/2009 e Comunicado SAD nº 11/2010.\n4\nProvs. CGJ 11/2002 e 10/2009.\n5\nProvs. CGJ 11/2002 e 10/2009.\n6\nProvs. CGJ 11/2002 e 10/2009.\ne verificação correcional.\n§ 1º Será certificada nos autos a expedição e a feitura da carga do mandado\nao oficial de justiça, que assinará o livro respectivo. 2\n§ 2º Existindo seção designada para a feitura das cargas, será certificada\nnos autos tão-somente a expedição do mandado, remetendo-o logo em seguida à\nreferida seção, que velará pelo lançamento da assinatura do oficial de justiça no livro\npróprio.\n§ 3º No sistema informatizado serão anotados a data da distribuição do\nmandado ao oficial e o nome deste, para consulta e controle de prazos.\n§ 4º Ressalvados os mandados urgentes, em razão do volume do\nexpediente, por autorização e mediante controle do Juiz Corregedor Permanente,\npoderá ser adotado sistema de carga única, mensalmente.\n§ 5º Inexistindo prazo expressamente determinado na ordem judicial, os\nmandados serão cumpridos dentro de 45 (quarenta e cinco) dias, ressalvado prazo\nmenor genérico por determinação pelo Juiz Corregedor Permanente da SADM ou,\nonde não houver, do Ofício Judicial.\n§ 6º Nas 24 (vinte e quatro) horas que antecederem o vencimento do prazo\npara cumprimento do mandado, desde que não seja possível a ultimação da diligência,\ndeverá o oficial de justiça formular pedido de dilação, justificando os motivos da demora,\nvedada a devolução sem integral cumprimento, salvo expressa autorização judicial.\n§ 7º Devolvidos os mandados cumpridos, a baixa deverá ser imediatamente\nlançada no sistema informatizado, na presença do oficial de justiça, emitindo-se,\nprontamente, o relatório para conferência e assinatura do meirinho, dispensada a baixa\nmanual no livro de carga."},"315":{"topicId":"OJ26-LESP-NSCGJ-07","texto":"Art. 315. As certidões das diligências cumpridas por oficiais de justiça e os\nautos por eles lavrados devem ser apresentados com cópia.\n§ 1º Devolvido o mandado, as cópias que o acompanham serão anexadas\nà contracapa dos autos6, para aproveitamento em eventuais novos mandados.\n§ 2º O desentranhamento e aditamento de mandado poderá ser dispensado,\na critério do juiz, expedindo-se novo mandado, fornecendo, a parte, as peças\nnecessárias."},"410":{"topicId":"OJ26-LESP-NSCGJ-08","texto":"Art. 410. Os alvarás de soltura serão enviados à autoridade responsável pela\ncustódia obrigatoriamente por correio eletrônico institucional (e-mail) do ofício de\njustiça.\n§ 1º O ofício de justiça confirmará, por via telefônica, o recebimento do alvará\nde soltura pela autoridade destinatária e anotará, na via encartada aos autos, o nome e\no cargo de quem recepcionou a ordem, assim como a data e o horário da ligação. Caso\nnão obtida a confirmação, a circunstância será certificada nos autos, com juntada de\ncópia da mensagem eletrônica enviada à autoridade responsável pela custódia, e\nencaminhado o alvará de soltura para cumprimento por oficial de justiça em regime de\nplantão.\n§ 2º A remessa do alvará de soltura será feita sob a responsabilidade do\nescrivão judicial.\n§ 3º Se o preso estiver recolhido em estabelecimento de outra unidade da\nFederação, o alvará, endereçado ao juiz corregedor da cadeia ou presídio, será enviado\npor carta precatória, por correio eletrônico institucional (e-mail) ou aparelho de fac-\nsímile.\n§ 4º Tratando-se de réu ou condenado, em prisão preventiva, regime\nfechado ou semiaberto em cumprimento na modalidade domiciliar, o ofício de justiça\nexpedirá um mandado de intimação com a finalidade de entrega do alvará de soltura ao\nréu ou condenado, para cumprimento por oficial de justiça em regime de urgência,\nmediante certidão e colheita de assinatura do intimado, que terá efeito de cumprimento\ndo referido alvará.\n§ 5º Nos casos do §4°, salvo determinação judicial em outro sentido, no\nmandado de intimação deverá constar exclusivamente o endereço onde o réu ou\ncondenado estiver recolhido, dispensando o oficial de justiça de outras diligências para\nefetivação do ato e, não sendo localizado o réu ou condenado, deverá ser lavrada\ncertidão nesse sentido pelo oficial de justiça, devolvendo-se o mandado para ulterior\ndeliberação judicial."},"436":{"topicId":"OJ26-LESP-NSCGJ-09","texto":"Art. 436. Na precatória e no mandado de citação, expedidos para que o réu\nseja citado e apresente resposta à acusação, na forma do art. 396 do Código de\nProcesso Penal, constarão as seguintes advertências:\nI - a defesa escrita deverá ser realizada por advogado, na qual poderão ser\narguidas preliminares e invocadas todas as razões de defesa, oferecidos documentos e\njustificações, especificadas as provas pretendidas, bem como arroladas testemunhas\naté o limite legal;\nII – é dever do oficial de justiça perguntar ao acusado se o mesmo possui\ndefensor constituído, certificando-se nos autos;\nIII - em caso de afirmar não possuir advogado, será indagado se deseja a\nimediata atuação da Defensoria Pública, cujo endereço deverá lhe ser fornecido, bem\ncomo orientado de que a mesma deverá ser procurada pessoalmente ou por familiar,\npossibilitando a indicação de testemunhas. Sendo esta sua vontade,\nindependentemente da fluência do prazo de 10 (dez) dias, deverá ser aberta vista à\ndefensoria para os fins acima mencionados, ficando a mesma nomeada para todos os\natos do processo."},"439":{"topicId":"OJ26-LESP-NSCGJ-10","texto":"Art. 439. Quando não for possível o cumprimento remoto (art. 1.029,\nNSCGJ), as intimações de indiciado, réu ou condenado preso, que deva tomar\nconhecimento de qualquer ato processual, inclusive de sentença, serão feitas por oficial\nde justiça, diretamente no estabelecimento onde custodiado, dispensada a requisição\npara a formalização de tais atos em juízo.\n§ 1º O oficial de justiça levará o impresso contendo termo de recurso e de\nrenúncia ao direito de recorrer e consultará o réu sobre sua intenção, colhendo a\nassinatura no espaço próprio. Na sequência preencherá por completo o termo\ncorrespondente à opção do sentenciado e inutilizará a parcela do formulário rechaçada\npelo acusado.\n§ 2º Se o réu não souber escrever, será colhida sua impressão digital e\nassinará a rogo uma terceira pessoa, além de 2 (duas) testemunhas.\n§ 3º Os réus que estiverem internados em estabelecimentos situados fora\nda comarca serão intimados por meio de carta precatória.\n§ 4º Comparecendo o réu ou apenado em audiência, as intimações em\nrelação aos atos nela praticados serão realizadas na própria audiência."},"440":{"topicId":"OJ26-LESP-NSCGJ-10","texto":"Art. 440. Os mandados de intimação de vítimas ou testemunhas, quando\nestas derem conta de coação ou grave ameaça, após deferimento do juiz, serão\nelaborados em separado, individualizados.\nParágrafo único. Uma vez cumpridos, apenas serão juntadas aos autos as\ncertidões do oficial de justiça, nelas não sendo consignados os endereços e dados das\npessoas procuradas. Os originais dos mandados serão destruídos pelo escrivão\njudicial."},"994":{"topicId":"OJ26-LESP-NSCGJ-11","texto":"Art. 994. O presente Capítulo dispõe sobre as regras aplicáveis aos Oficiais\nde Justiça, à expedição, distribuição, cumprimento e ressarcimento dos mandados e\ndemais disposições atinentes ao funcionamento das Seções Administrativas de\nDistribuição de Mandados – SADMs. 5"},"995":{"topicId":"OJ26-LESP-NSCGJ-11","texto":"Art. 995. Para os fins deste Capítulo: 6\nI - Considera-se: 7\na) Diligência: atividade do Oficial de Justiça para o cumprimento dos atos\ndescritos no mandado, incluindo todas as idas e vindas, no mesmo endereço ou em\nendereços contíguos, lindeiros e referenciados, no mesmo dia ou em dias distintos; 8\nb) Valor da diligência: valor a ser depositado pela parte ou interessado nos\nmandados pagos para fins de ressarcimento do Oficial de Justiça de acordo com a\nnatureza do ato; 9\nc) Cota: valor a ser ressarcido ao Oficial de Justiça em razão do\ncumprimento do mandado, independentemente da quantidade de idas e vindas, do\nnúmero de atos e respectivo resultado de cada um deles; 10\nd) Cota paga: valor a ser ressarcido pelo Oficial de Justiça no cumprimento\nde mandados pagos, apurado a partir do valor da diligência, de acordo com a natureza\ndo ato, deduzido o valor dos custos administrativos; 11\ne) Cota gratuita: valor a ser ressarcido pelo Oficial de Justiça no\ncumprimento de mandados gratuitos, apurado a partir das verbas de rateio, por\nmandado ou lote de mandados de acordo com a natureza do ato, nos termos dos artigos\n1.044, 1.045 e 1.053, deduzido o valor da antecipação; 12\nf) Margeamento: cálculo da quantidade de cota(s) ou valor da(s) cota(s) de\nressarcimento pelo cumprimento de mandado ou lote de mandados por Oficial de\nJustiça; 13\ng) SADM: a unidade administrativa estruturada ou, onde não houver,\nunidade que utiliza o módulo \"Central de Mandados\" no sistema do Ofício de Justiça\npara o recebimento, distribuição e acompanhamento do cumprimento dos mandados. 14\nII - Classificam-se os mandados: 15\n1\nProv. CG 27/2023.\n2\nProv. CG 27/2023.\n3\nProv. CG 27/2023.\n4\nProv. CG 27/2023.\n5\nProv. CG 27/2023.\n6\nProv. CG 27/2023.\n7\nProv. CG 27/2023.\n8\nProv. CG 27/2023.\n9\nProv. CG 27/2023.\n10\nProv. CG 27/2023.\n11\nProv. CG 27/2023.\n12\nProv. CG 27/2023.\n13\nProv. CG 27/2023.\n14\nProv. CG 27/2023.\n15\nProv. CG 27/2023.\na) Conforme o meio em que expedidos, físicos (processos físicos) ou digitais\n(processos digitais); 1\nb) Conforme o prazo de cumprimento, em mandados de plantão, mandados\nurgentes, mandados de audiência e mandados comuns; 2\nc) Conforme a forma de ressarcimento, em mandados pagos em\nadiantamento, mandados pagos por mapa posterior (na forma do artigo 1.050) e\nmandados gratuitos e equiparados. 3\nIII – Classificam-se os atos: 4\na) Conforme a natureza, em atos com deslocamento ou atos sem\ndeslocamento (atos remotos ou realizados na própria sede do juízo), ou ato sem\ndeslocamento com possibilidade de conversão; 5\nb) Conforme o tempo de realização, em atos simples (um ou mais atos que\npodem ser praticados ao mesmo tempo, ainda que sejam realizados em dias distintos)\ne atos complexos (um ou mais atos com interregno de prazo legal ou judicial a ser\nobservado); 6\nc) Conforme o resultado (se houve ou não o atingimento da finalidade\nprocessual), em cumpridos (positivos, parcialmente cumpridos, negativos), ou não\ncumpridos (prejudicados e devolvidos por irregularidade)."},"996":{"topicId":"OJ26-LESP-NSCGJ-11","texto":"Art. 996. As dúvidas e divergências relativas à aplicação das disposições\ndeste Capítulo serão decididas pelo Juiz da causa ou pelo Juiz Corregedor da SADM,\nconforme ocorram dentro ou fora do âmbito do processo. 8\nParágrafo único - Nas decisões proferidas pelo Juiz Corregedor da SADM\nsobre questões fora do âmbito do processo caberá recurso sem efeito suspensivo para\na Corregedoria Geral da Justiça, em instrumento apartado, no prazo de 15 (quinze) dias.\n9\nSubseção I 10\nDos deveres dos Oficiais de Justiça 11"},"997":{"topicId":"OJ26-LESP-NSCGJ-11","texto":"Art. 997. São deveres do Oficial de Justiça: 12\nI - executar as ordens dos Juízes a que estiver subordinado, auxiliar o Juiz\nna manutenção da ordem e exercer as funções inerentes a seu cargo; 13\nII - agir com disciplina, observar as normas regulamentares e zelar pela\nutilização adequada dos bens e recursos públicos; 14\nIII – observar os prazos para recebimento, cumprimento e devolução dos\nmandados e demais atividades relacionadas à sua função; 15\n1\nProv. CG 27/2023.\n2\nProv. CG 27/2023.\n3\nProv. CG 27/2023.\n4\nProv. CG 27/2023.\n5\nProv. CG 27/2023.\n6\nProv. CG 27/2023.\n7\nProv. CG 27/2023.\n8\nProv. CG 27/2023.\n9\nProv. CG 27/2023.\n10\nProv. CG 27/2023.\n11\nProv. CG 27/2023.\n12\nProv. CG 27/2023.\n13\nProv. CG 27/2023.\n14\nProv. CG 27/2023.\n15\nProv. CG 27/2023.\nIV - cumprir pessoalmente o mandado que lhe for distribuído, envidando o\nmáximo de empenho para concluir a diligência; 1\nV- registrar de forma fidedigna os dados nas certidões que exarar, no\npreenchimento dos mapas e nos sistemas informatizados; 2\nVI – conferir a indicação do recolhimento e realizar o margeamento em\nconformidade com as normas expedidas pela Corregedoria Geral da Justiça e\nPresidência do Tribunal; 3\nVII - identificar-se quando do desempenho de suas funções mediante\napresentação de carteira funcional ou crachá, obrigatório em todas as diligências; 4\nVIII – registrar frequência na forma estabelecida pela Presidência do\nTribunal; 5\nIX – comparecer, presencialmente, uma vez por semana, ao Ofício ou SADM\nem que lotado e ali permanecer à disposição do juiz, quando e como escalado; 6\nX - permanecer à disposição do Juiz nos plantões, até o seu encerramento,\nquando escalado, e sempre que convocado; 7\nXI - acessar diariamente a caixa de mensagens eletrônicas institucional, pelo\nmenos uma vez ao dia, em expediente regular, e no início e no fim do expediente, se\nem plantão; 8\nXII - manter atualizados os seus dados cadastrais junto ao Tribunal de\nJustiça, principalmente o número do telefone celular e endereço, sob pena de\nresponsabilidade funcional. 9\n§ 1º É vedado ao Oficial de Justiça: 10\nI - o recebimento de qualquer numerário diretamente da parte; 11\nII – a passagem de mandado, de um para outro Oficial de Justiça,\ndiretamente, salvo ordem do Juiz do feito, cuja ocorrência será certificada nos autos; e12\nIII - a devolução de mandado sem cumprimento, a pedido de qualquer\ninteressado. 13\n§ 2º As escalas de comparecimento e o e-mail funcional ficarão à disposição\nde terceiros para consulta na SADM para agendamento de diligências que possam ou\ndevam acompanhar. 14\n§ 3º Os números de telefone celular dos Oficiais de Justiça constarão em rol\ne ficarão à disposição para consulta na SADM ou, onde não houver, no Ofício de Justiça.\n15\n§ 4º O Oficial de Justiça poderá recusar o repasse do número de seu\ntelefone celular a terceiros, caso em que deverá comparecer diariamente no Fórum, pelo\nperíodo mínimo de uma hora de permanência e em horário fixo dentro do expediente\nforense. 16\n1\nProv. CG 27/2023.\n2\nProv. CG 27/2023.\n3\nProv. CG 27/2023.\n4\nProv. CG 27/2023.\n5\nProv. CG 27/2023.\n6\nProv. CG 36/2024.\n7\nProv. CG 27/2023.\n8\nProv. CG 27/2023.\n9\nProv. CG 27/2023.\n10\nProv. CG 27/2023.\n11\nProv. CG 27/2023.\n12\nProv. CG 27/2023.\n13\nProv. CG 27/2023.\n14\nProv. CG 27/2023.\n15\nProv. CG 27/2023.\n16\nProv. CG 27/2023."},"998":{"topicId":"OJ26-LESP-NSCGJ-11","texto":"Art. 998. Sem prejuízo das modalidades de plantão previstas no Capítulo X\ndestas Normas de Serviço (plantões judiciários ordinários, especiais e extraordinários),\nque observarão o quanto nele disposto, o Oficial de Justiça cumprirá: 1\nI - plantão regular, destinado ao cumprimento de medidas urgentes em dias\nque houver expediente forense; 2\nII – plantão de Júri: destinado ao cumprimento de medidas que se fizerem\nnecessárias em Plenários de Júri. 3\n§ 1º A escala para atuação nos plantões previstos neste artigo será\norganizada mensalmente e aprovada pelo Juiz Corregedor Permanente da Unidade\nJudicial ou da SADM de acordo com as necessidades do serviço, observadas as\nseguintes regras: 4\nI - no plantão regular, deverá ser designado pelo menos um Oficial de Justiça\npara comparecimento presencialmente, facultado o cumprimento à distância quanto aos\ndemais Oficiais de Justiça designados, se necessário; 5\nII – no plantão de Júri, deverá ser designado um Oficial de Justiça\ndevidamente capacitado por plenário ou grupo de plenários, seguindo-se o critério de\nrevezamento, sendo vedada a designação de Oficial de Justiça exclusivamente para\nesta atuação específica. 6\n§ 2º Os Oficiais de Justiça em plantão deverão permanecer disponíveis até\no seu encerramento, observas as seguintes regras: 7\nI – em plantão regular, o Oficial de Justiça deverá permanecer disponível até\no término do horário do expediente, e, após este horário, desde que o Ofício de Justiça\ncomunique até 30 (trinta) minutos antes do encerramento que será encaminhado\nmandado depois desse horário para cumprimento naquele mesmo plantão; 8\nII – em plantão do Júri, o Oficial de Justiça deverá apresentar-se antes do\ninício previsto para a solenidade e permanecer disponível até o momento de seu\nencerramento, observada a probabilidade de alguns plenários estenderem-se para além\ndo horário normal de expediente. 9\n§ 3º Considera-se remetido no plantão regular ou no plantão especial\nseguinte, se durante o recesso, o mandado de plantão encaminhado após o horário de\nexpediente sem a comunicação prevista do disposto no inciso I do §2º deste artigo. 10\n§ 4º A escala mensal de plantão dos Oficiais de Justiça elaborada pela\nSADM será encaminhada às unidades judiciais, acompanhada dos números de\ntelefones atualizados. 11\n§ 5º É vedada a designação de Oficial de Justiça, exclusivamente ou em\nsistema de rodízio, para atuação no controle do acesso a gabinete de Juízes e a sala\nde audiências, bem como para coadjuvar o Juiz do feito na manutenção da ordem em\naudiências, ressalvada a determinação em processo específico, por decisão\nfundamentada. 12\n§ 6º A participação do Oficial de Justiça em audiência dependerá da\ncomunicação prévia ao funcionário responsável pela SADM da determinação judicial\nneste sentido, com prazo não inferior a 10 (dez) dias da data da audiência; 13\n1\nProv. CG 27/2023.\n2\nProv. CG 27/2023.\n3\nProv. CG 27/2023.\n4\nProv. CG 27/2023.\n5\nProv. CG 27/2023.\n6\nProv. CG 27/2023.\n7\nProv. CG 27/2023.\n8\nProv. CG 27/2023.\n9\nProv. CG 27/2023.\n10\nProv. CG 27/2023.\n11\nProv. CG 27/2023.\n12\nProv. CG 27/2023.\n13\nProv. CG 27/2023."},"999":{"topicId":"OJ26-LESP-NSCGJ-11","texto":"Art. 999. Antes de entrar em gozo de licença ou qualquer outro afastamento\npor prazo superior a 5 (cinco) dias, o Oficial de Justiça comunicará o Ofício ou à SADM\na que vinculado e todos os demais que acumular e devolverá todos os mandados em\nseu poder, observados os §§ 1º, 2º e 3º deste artigo. 1\n§ 1º Os Oficiais de Justiça não receberão mandados nos 15 (quinze) dias\nantecedentes às suas férias marcadas na escala e ao gozo de licença prêmio e horas\ncredoras (nas duas hipóteses pelo período ininterrupto equivalente ao bloco mínimo\npermitido para o gozo de férias). 2\n§ 2º No prazo do §1º, os Oficiais de Justiça cumprirão os mandados\nanteriormente recebidos, e só poderão entrar em férias ou em gozo de licença prêmio e\nhoras credoras sem nenhum mandado em mãos, vedada a baixa para redistribuição. 3\n§ 3º Se as férias marcadas em escala ou o gozo de licença prêmio e horas\ncredoras formarem com o recesso período ininterrupto de descanso, a distribuição dos\nmandados cessará nos 15 (quinze) dias que antecederem ao recesso. 4\n§ 4º Durante os prazos previstos nos §§1º, 2º e 3º os Oficiais de Justiça não\nserão escalados para plantões na forma do art. 998. 5\n§ 5º Na hipótese de cancelamento das férias ou afastamento, o Oficial de\nJustiça deverá cumprir dias adicionais de plantão equivalentes aos dias em que ficou\nsem distribuição. 6\nSubseção II 7\nDos prazos para recebimento e cumprimento dos mandados 8"},"1000":{"topicId":"OJ26-LESP-NSCGJ-11","texto":"Art. 1.000. Os mandados serão emitidos nos Ofícios de Justiça e remetidos\ncom as peças indispensáveis ao seu integral cumprimento e com GRD e comprovante\nde pagamento, se exigível. 9\n§ 1º Anotado no sistema informatizado, o mandado será remetido para a\nSADM ou módulo da SADM do ofício para verificação e distribuição entre os Oficiais de\nJustiça de acordo com a classificação, observadas as seguintes regras: 10\nI - os mandados classificados como plantão serão equitativamente\ndistribuídos entre os Oficiais de Justiça de plantão presencial e à distância,\nindependentemente do setor a que pertençam, no mesmo dia em que expedido, até o\ntérmino do expediente, ou após, observado o disposto no art. 998, §2º, inc. I destas\nNormas; 11\nII - os mandados classificados como urgentes, inclusive aqueles\nrelacionados a réus presos, serão equitativamente distribuídos entre os Oficiais de\nJustiça de acordo com os setores de atuação, no prazo de 24 (vinte e quatro) horas; 12\nIII – os mandados para cumprimento remoto em unidades prisionais ou de\ninternação, serão equitativamente distribuídos entre os Oficiais de Justiça do setor\n1\nProv. CG 27/2023.\n2\nProv. CG 27/2023.\n3\nProv. CG 27/2023.\n4\nProv. CG 27/2023.\n5\nProv. CG 27/2023.\n6\nProv. CG 27/2023.\n7\nProv. CG 27/2023.\n8\nProv. CG 27/2023.\n9\nProv. CG 27/2023.\n10\nProv. CG 27/2023.\n11\nProv. CG 27/2023.\n12\nProv. CG 27/2023.\nespecífico ou de acordo com os setores de atuação, no prazo de até 24 (vinte e quatro)\nhoras; 1\nIV – os mandados comuns, bem como aqueles sem prazo expressamente\ndeterminado na ordem judicial, serão equitativamente distribuídos entre os Oficiais de\nJustiça de acordo com os setores de atuação, no prazo de até 5 (cinco) dias. 2\n§ 2º Os mandados serão recebidos diariamente, e cumpridos pelos Oficiais\nde Justiça também de acordo com a sua classificação, observadas as seguintes regras:\n3\nI – os mandados classificados como plantão imediato, a que se referem o\nart. 440-A destas Normas de Serviço (intimação de vítima) e aqueles relacionados às\nmedidas protetivas de urgência decretadas, deverão ser cumpridos em 24 (vinte e\nquatro) horas, distribuídos em regime de plantão;\nII – Revogado.\nIII – os mandados para cumprimento remoto em unidades prisionais ou de\ninternação serão recebidos até o dia imediatamente seguinte ao da distribuição, para\nagendamento em 48 horas e cumprimento e devolução em até 7 (sete) dias úteis; 6\nIV – os mandados classificados como réu preso expedidos em processo de\nréu preso, deverão ser cumpridos dentro de 3 (três) dias, salvo determinação contrária\ndo Juiz do feito; 7\nV – os mandados comuns serão recebidos no dia imediatamente seguinte\nao da distribuição, para cumprimento e devolução em até 45 (quarenta e cinco) dias\ncorridos, salvo prazo inferior estabelecido na decisão judicial e que deverá constar\nexpressamente do mandado; 8\nVI – os mandados classificados como audiência, referente a processos com\naudiência designada deverão ser cumpridos nos prazos dos §§ 3º e 4º deste artigo. 9\nVII – os mandados classificados como urgentes, em razão de determinação\njudicial, deverão ser cumpridos no prazo de 5 (cinco) dias, ressalvado prazo inferior\nexpressamente justificado e fixado pelo Juiz do feito ou estabelecido em Comunicado\nda Corregedoria Geral da Justiça ou Presidência.\n§ 3º Os mandados destinados à intimação para audiência de conciliação ou\nde mediação prevista no art. 334 do Código de Processo Civil deverão ser cumpridos e\ndevolvidos até 20 (vinte) dias úteis antes da data designada. 11\n§ 4º Os mandados destinados à intimação para qualquer outra audiência\ndeverão ser cumpridos e devolvidos até 10 (dez) dias úteis antes da data designada,\nsalvo determinação contrária do Juiz do feito. 12\n§ 5º Decorridos os prazos para recebimento previstos no §2º, considera-se\niniciado o prazo para cumprimento ainda que o Oficial de Justiça não tenha retirado o\nmandado físico na unidade ou procedido ao seu recebimento no sistema informatizado.\n13\n1\nProv. CG 27/2023.\n2\nProv. CG 27/2023.\n3\nProv. CG 27/2023.\n4\nProv. CG 48/2025.\n5\nProv. CG 48/2025.\n6\nProv. CG 27/2023.\n7\nProv. CG 27/2023.\n8\nProv. CG 27/2023.\n9\nProv. CG 27/2023.\n10\nProv. CG 48/2025.\n11\nProv. CG 27/2023.\n12\nProv. CG 27/2023.\n13\nProv. CG 27/2023."},"1001":{"topicId":"OJ26-LESP-NSCGJ-11","texto":"Art. 1.001. Vencido o prazo, o Oficial de Justiça devolverá o mandado ao\ncartório, certificando os motivos da demora ou do descumprimento. 1\n§ 1º Se necessária prorrogação de prazo para cumprimento do mandado, o\nOficial de Justiça, sem o devolver, submeterá ao Juiz do feito requerimento justificado\nem modelo padronizado com 48 (quarenta e oito) horas de antecedência, sob pena de\nnão conhecimento. 2\n§ 2º Também sob a mesma pena, o requerimento obrigatoriamente conterá\ninformação do funcionário responsável pela SADM sobre a data da distribuição ou\ndistribuições anteriores, qualquer que seja o Oficial de Justiça, e eventuais prorrogações\nde prazo antes concedidas. 3\n§ 3º Se deferida a prorrogação, no mesmo dia o Oficial de Justiça a\ndemonstrará à SADM para anotações no sistema informatizado e no expediente de\ncobrança. Se indeferida a prorrogação ou se não conhecido o requerimento, o mandado\nserá cumprido no prazo restante em curso. 4\n§ 4º Na hipótese de mandado compartilhado, o requerimento justificado em\nmodelo padronizado será enviado a partir do e-mail institucional do Oficial de Justiça\npara o do Ofício de Justiça expedidor do mandado, com cópia para a SADM de sua\nlotação. Com a resposta positiva do Ofício de Justiça, a SADM anotará no sistema o\nprazo de prorrogação. 5\n§ 5º O mandado só poderá ficar retido com o Oficial de Justiça, além do\nprazo, mediante autorização escrita do juiz do feito. 6"},"1002":{"topicId":"OJ26-LESP-NSCGJ-11","texto":"Art. 1.002. O funcionário responsável pela SADM ou do Ofício de Justiça\nfará a cobrança de mandados com prazos excedidos para cumprimento a cada 30\n(trinta) dias, ressalvado o prazo menor genérico por determinação pelo Juiz Corregedor\nPermanente da SADM ou, onde não houver, do Ofício de Justiça. 7\n§ 1º Se necessária prorrogação de prazo para cumprimento do mandado, o\nOficial de Justiça procederá na forma do art. 1.001 destas Normas de Serviço,\ncomunicando eventual pedido, deferimento ou indeferimento, se já apreciado, ao\nfuncionário responsável. 8\n§ 2º Decorrido o prazo máximo de 48 (quarenta e oito) horas para devolução\ndo mandado, após cobrança, sem atendimento, o atraso será comunicado ao Juiz\nCorregedor Permanente, em expediente próprio, para as providências cabíveis, tais\ncomo busca e apreensão, redistribuição e instauração de procedimento disciplinar. 9\n§ 3º As providências do § 2º serão adotadas sem prejuízo da comunicação\ndevida ao Juiz responsável pelo processo, caso este não seja o Juiz Corregedor\nPermanente. 10\nSubseção III 11\nDa organização das SADMs e dos Oficiais de Justiça 12\n1\nProv. CG 27/2023.\n2\nProv. CG 27/2023.\n3\nProv. CG 27/2023.\n4\nProv. CG 27/2023.\n5\nProv. CG 27/2023.\n6\nProv. CG 27/2023.\n7\nProv. CG 27/2023.\n8\nProv. CG 27/2023.\n9\nProv. CG 27/2023.\n10\nProv. CG 27/2023.\n11\nProv. CG 27/2023.\n12\nProv. CG 27/2023."},"1003":{"topicId":"OJ26-LESP-NSCGJ-11","texto":"Art. 1.003. Para os fins das presentes Normas de Serviço e demais normas\neditadas pela Corregedoria Geral da Justiça, considera-se SADM tanto a unidade\nadministrativa própria quanto o setor interno das Unidades Judiciais encarregados das\natribuições dos Oficiais de Justiça. 1\nParágrafo único - A constituição da SADM em unidade administrativa própria\nseguirá os critérios definidos pela Presidência. 2"},"1004":{"topicId":"OJ26-LESP-NSCGJ-11","texto":"Art. 1.004. A SADM, quando constituída em unidade administrativa, manterá\nos seguintes livros e classificadores obrigatórios: 3\nI – livro de visitas e correições; 4\nII – livro de registro de portarias e ordens de serviço, com índice; 5\nIII – livro de registro de feitos administrativos; 6\nIV – livro de registro de sentenças da Corregedoria Permanente; 7\nV – livro protocolo de autos e papéis em geral; 8\nVI – livro de carga manual de mandados em caso de contingência do\nsistema informatizado; 9\nVII – classificador para cópias de ofícios expedidos; 10\nVIII – classificador para ofícios recebidos; 11\nIX – classificador para GRD (guias de recolhimento de diligências de Oficial\nde Justiça). 12\nParágrafo único - nos locais onde a SADM não estiver estruturada, poderão\nser utilizados os livros do próprio Ofício que sirvam para a mesma finalidade. 13"},"1005":{"topicId":"OJ26-LESP-NSCGJ-11","texto":"Art. 1.005. O Juiz Corregedor Permanente da SADM responderá pela função\ncorrecional da SADM e servidores e Oficiais de Justiça a ela vinculados, cabendo\nespecial atenção a: 14\nI – organização, funcionamento e eficiência da SADM como um todo; 15\nII – presteza, produtividade e cumprimento de prazos nas atividades\nrelacionadas ao cumprimento de mandados; 16\nIII - conferência das certidões, mapas e outros documentos necessários para\nressarcimento de diligências em mandados pagos e gratuitos; 17\nIV – assiduidade, disciplina e demais condutas dos servidores e Oficiais de\nJustiça e correspondentes sanções disciplinares. 18\n§ 1º Na hipótese de acumulação e plantão, os Juízes Corregedores\nPermanentes exercerão função correcional em relação às atividades realizadas em\ncada SADM, cabendo ao Juiz Corregedor da SADM da lotação originária a apuração de\ninfrações e aplicação de sanções disciplinares, para o que deverá ser oficiado. 19\n1\nProv. CG 27/2023.\n2\nProv. CG 27/2023.\n3\nProv. CG 27/2023.\n4\nProv. CG 27/2023.\n5\nProv. CG 27/2023.\n6\nProv. CG 27/2023.\n7\nProv. CG 27/2023.\n8\nProv. CG 27/2023.\n9\nProv. CG 27/2023.\n10\nProv. CG 27/2023.\n11\nProv. CG 27/2023.\n12\nProv. CG 27/2023.\n13\nProv. CG 27/2023.\n14\nProv. CG 27/2023.\n15\nProv. CG 27/2023.\n16\nProv. CG 27/2023.\n17\nProv. CG 27/2023.\n18\nProv. CG 27/2023.\n19\nProv. CG 27/2023.\n§ 2º Nos plantões judiciários ordinários, especiais e extraordinários (Capítulo\nX destas Normas de Serviço), caberá ao Magistrado plantonista a adoção das\nprovidências urgentes, como a busca e apreensão e redistribuição do mandado,\noficiando-se ao Juiz Corregedor Permanente da lotação originária para apuração de\ninfrações e aplicação de sanções disciplinares, se o caso. 1"},"1006":{"topicId":"OJ26-LESP-NSCGJ-11","texto":"Art. 1.006. Além de outras funções que o respectivo Juiz Corregedor\nPermanente lhe atribuir, compete ao servidor responsável pela SADM: 2\nI - conferir, sem prejuízo da responsabilidade do Oficial de Justiça e do\nOficial encarregado, a exatidão, a autenticidade, a veracidade e a adequação a regras\nde mapas, certidões e documentos necessários para ressarcimento de diligências em\nmandados pagos e gratuitos; 3\nII - fiscalizar a tempestividade das tarefas dos Oficiais de Justiça e cobrar\nmandados com prazos excedidos, procedendo na forma do art. 1.002 destas Normas;\n4\nIII - controlar a assiduidade e a vida funcional de Oficiais de Justiça e\nfuncionários designados para a SADM; 5\nIV - organizar mensalmente escala de plantão de Oficiais de Justiça de\nacordo com as necessidades do serviço; 6\nV - acessar o e-mail institucional diariamente. 7\nParágrafo único - Nos plantões judiciários ordinários, especiais e\nextraordinários (Capítulo X destas Normas de Serviço), caberá ao responsável pelo\nplantão adotar as providências de conferência do mapa e envio à SADM em que lotado\no Oficial de Justiça. Caberá à SADM o lançamento dos dados nos sistemas SMG e SGF.\n8"},"1007":{"topicId":"OJ26-LESP-NSCGJ-11","texto":"Art. 1.007. Os Oficiais de Justiça serão distribuídos em setores por CEP\n(código de endereçamento postal), por bairros ou outro critério razoável, observado o\ndisposto nestas Normas e nas determinações do Conselho Superior da Magistratura. 9\n§ 1º A distribuição dos setores deverá observar, no mínimo, as seguintes\nconfigurações: 10\nI – parte urbana: 1 (um) setor para cada bairro ou conjunto de bairros\ncontíguos, vila e/ou vilarejos, além de 1 (um) setor para cada assentamento, fazenda\ne/ou outra situação que demande atenção especial dos Oficiais de Justiça; 11\nII – parte rural: 1 (um) setor para cada bairro ou conjunto de bairros\ncontíguos, vila e/ou vilarejos, além de 1 (um) setor para cada assentamento, fazenda\ne/ou outra situação que demande atenção especial dos Oficiais de Justiça; 12\nIII – nas localidades com CEP único, sem prejuízo das configurações dos\nitens I e II, deve ser criada a Zona Única e somente nesta deverá ser vinculado o CEP,\nobservadas as orientações veiculadas por Comunicado. 13\n1\nProv. CG 27/2023.\n2\nProv. CG 27/2023.\n3\nProv. CG 27/2023.\n4\nProv. CG 27/2023.\n5\nProv. CG 27/2023.\n6\nProv. CG 27/2023.\n7\nProv. CG 27/2023.\n8\nProv. CG 27/2023.\n9\nProv. CG 27/2023.\n10\nProv. CG 27/2023.\n11\nProv. CG 27/2023.\n12\nProv. CG 27/2023.\n13\nProv. CG 27/2023.\n§ 2º Sem prejuízo do disposto no caput e §1º, deste artigo, deverão ser\ncriados setores especiais, sem vinculação de CEP: 1\nI - para o cumprimento de mandados remotos, com ou sem possibilidade de\nconversão; 2\nII - para o cumprimento de mandados da Fazenda Pública Estadual na\nhipótese de haver Oficiais de Justiça exclusivos (Lei nº 1.906/78) e para a Fazenda\nPública Municipal na hipótese de haver Oficiais de Justiça ad hoc; 3\nIII - para penitenciárias, presídios (ou centros de progressão penitenciária),\ncadeias públicas (ou centros de detenção provisória); 4\nIV – para municípios integrantes de Comarca contígua ou agrupada e para\nmunícipios cujo território esteja sob a jurisdição de Comarca ou Foro. 5\n§ 3º Ressalvada as hipóteses previstas neste artigo e determinação\nexpressa em contrário desta Corregedoria Geral da Justiça ou do Conselho Superior da\nMagistratura, é vedada distribuição de mandados por tipo de ato, matéria ou unidade\njudicial de origem. 6"},"1008":{"topicId":"OJ26-LESP-NSCGJ-11","texto":"Art. 1.008. Para cada setor será designado pelo menos um Oficial de Justiça,\npodendo haver mais de um, segundo a necessidade do serviço, ou mais de uma vaga\npara o mesmo Oficial de Justiça por setor, de modo a equilibrar a distribuição no total\nde mandados. 7\n§ 1º O Juiz Corregedor Permanente da SADM poderá remanejar Oficiais de\nJustiça de setores de atuação para atender à necessidade do serviço ou possibilitar\nrodízio periódico, quando o caso. 8\n§ 2º É vedada alteração de setor, área ou região de atuação de Oficial de\nJustiça sem prévia autorização do Juiz Corregedor Permanente da SADM que, dentro\ndo possível, seguirá critério do revezamento. 9"},"1009":{"topicId":"OJ26-LESP-NSCGJ-11","texto":"Art. 1.009. Os leilões serão realizados apenas em situações\nexcepcionalíssimas, desde que o exequente não exerça o seu direito de indicação e\nhaja impedimento legal para atuação de todos os leiloeiros públicos credenciados,\nsegundo escala previamente elaborada pelos Oficiais de Justiça plantonistas, sob a\nfiscalização do Juiz de Direito do feito. 10\n§ 1º Os Ofícios de Justiça encaminharão à SADM, até o vigésimo dia de\ncada mês, pauta com dias e horários de leilões designados para o mês seguinte e, pelos\ne-mails das unidades, comunicarão eventual sustação, antes da data designada, para\nas necessárias anotações. 11\n§ 2º Processos com leilões judiciais públicos designados deverão ser\nencaminhados à SADM com um dia útil de antecedência, até às 12h30min, mediante\ncarga e termo de remessa. 12\n§ 3º Recebidos os autos, a SADM elaborará pauta diária de leilões judiciais,\nque conterá somente data, horário e número do processo. 13\n1\nProv. CG 27/2023.\n2\nProv. CG 27/2023.\n3\nProv. CG 27/2023.\n4 Prov. CG 27/2023.\n5 Prov. CG 27/2023.\n6 Prov. CG 27/2023.\n7 Prov. CG 27/2023.\n8 Prov. CG 27/2023.\n9 Prov. CG 27/2023.\n10 Prov. CG 27/2023.\n11 Prov. CG 27/2023.\n12\nProv. CG 27/2023.\n13 Prov. CG 27/2023.\n§ 4º Se houver processos de mais de uma vara com hastas designadas para\no mesmo dia e horário, as hastas serão realizadas de acordo com a ordem numérica,\nindependentemente do ano de distribuição ou vara de origem. 1\n§ 5º Os incidentes relativos aos leilões serão decididos pelo Juiz do feito. 2\n§ 6º A lavratura de autos competirá ao Ofício de Justiça de origem do\nprocesso e caberá ao Oficial de Justiça a lavratura de súmula. 3"},"1010":{"topicId":"OJ26-LESP-NSCGJ-11","texto":"Art. 1.010. O compartilhamento de mandados digitais entre SADMs deste\nTribunal, quando existente, determina sua distribuição para a SADM que compreenda o\nsetor do local de cumprimento da diligência, ainda que pertencente a outra Comarca ou\nForo do Estado de São Paulo. 4\n§ 1º O compartilhamento independe de decisão judicial que assim autorize,\ndispensando a expedição de carta precatória para todas as matérias e atos, salvo em\nrelação a: 5\nI - mandados de processos físicos; 6\nII - mandados de cumprimento remoto; 7\nIII - mandados para intimação de vítima ou testemunha protegida, físicos ou\n8\ndigitais;\nIV – outros mandados de atos que demandem providências no âmbito do\nJuízo deprecado, como, por exemplo, audiência (nas hipóteses ainda autorizadas),\nperícia com nomeação de perito local, penhora de faturamento, com nomeação de\nadministrador local, intervenção de setores técnicos. 9\n§ 2º Na configuração do compartilhamento serão observadas as seguintes\n10\nregras:\nI - a atribuição de setores territoriais por divisão de CEPs da Comarca da\nCapital para cada SADM será feita pela Corregedoria Geral da Justiça; 11\nII - as SADMs deverão vincular todos os CEPs de sua atribuição setorial a\nzona, conforme organização interna, sendo vedada a vinculação de um mesmo CEP a\nmais de uma zona; 12\nIII - periodicamente, e sempre que solicitado por unidade judicial, as SADMs\ndeverão conferir o cadastro das zonas, incluindo CEPs que não estiverem vinculados a\nzona alguma. 13\n§ 3º A partir da implantação da Central de Mandados Compartilhada, os\nOficiais de Justiça serão competentes para: 14\nI - o cumprimento de mandados compartilhados nas zonas a que estiverem\nvinculados, bem como para os mandados para cumprimento remoto; 15\nII – o cumprimento de mandados físicos e para os demais casos em que o\ncompartilhamento tenha sido vedado pelas normas ou por decisão judicial, nos limites\nda Resolução OE 742/2016. 16\n1 Prov. CG 27/2023.\n2 Prov. CG 27/2023.\n3 Prov. CG 27/2023.\n4\nProv. CG 27/2023.\n5\nProv. CG 27/2023.\n6\nProv. CG 27/2023.\n7\nProv. CG 27/2023.\n8\nProv. CG 27/2023.\n9\nProv. CG 27/2023.\n10\nProv. CG 27/2023.\n11\nProv. CG 27/2023.\n12\nProv. CG 27/2023.\n13\nProv. CG 27/2023.\n14\nProv. CG 27/2023.\n15\nProv. CG 27/2023.\n16\nProv. CG 27/2023.\n§ 4º O recolhimento das despesas de condução será efetuado por meio de\nguia própria (GRD – guia de recolhimento de diligências), para crédito em conta aberta\nna agência ou posto bancário, da comarca ou fórum, a que distribuído o feito\ncorrespondente. 1\n§ 5º Os mapas individuais de diligências pagas e gratuitas serão\nconfeccionados e apresentados na SADM de lotação do Oficial de Justiça, com\nencaminhamento para o crédito na conta bancária do Oficial de Justiça. 2\n§ 6º Para os mandados positivos digitalizados, nos quais tenham sido\ncolhidas as respectivas notas de ciente (art. 1.258, § 4º, NSCGJ), provenientes de\nOfícios Judiciais de outros fóruns, e devolvidos pelos Oficiais de Justiça, a SADM os\nenviará, a cada 90 (noventa) dias, para a SADM vinculada à Comarca ou Foro Regional\nda unidade judiciária expedidora, para entrega à serventia respectiva. 3\n§ 7º Para os mandados provenientes de Ofícios Judiciais do próprio Fórum,\na SADM os devolverá na forma do art. 1.000, NSCGJ. Os mandados sem assinatura\nqualquer serão descartados pelo Oficial de Justiça (art. 1.015, § 5º, NSCGJ). 4\nSeção II 5\nDa expedição dos mandados pelos Ofícios Judiciais 6"},"1011":{"topicId":"OJ26-LESP-NSCGJ-11","texto":"Art. 1.011. Constarão de todos os mandados expedidos, na forma desta\nseção: 7\nI - o número do processo e a unidade judicial de origem; 8\nII – o ato ou todos os atos a serem praticados, ainda que em momentos\ndistintos; 9\nIII – o endereço principal e eventuais endereços contíguos ou lindeiros,\nassim considerados os endereços que não distarem entre si mais de 200 (duzentos)\nmetros, em linha reta. 10\nIV – o destinatário ou conjunto de destinatários, ainda que não relacionados\nentre si, localizados no mesmo endereço ou em endereços contíguos ou lindeiros,\nobservado o inciso II do §4º do art. 1.012; 11\nV – a indicação do estabelecimento prisional ou de internação e todos os\nmeios disponíveis para contato, nos mandados remotos; 12\nVI – a classificação do mandado quanto ao prazo\n(plantão/urgente/comum/audiência, remoto) e o prazo exato para cumprimento, quando\ndistinto dos prazos padronizados por estas Normas; 13\nVII - a forma de ressarcimento (mandados pagos em adiantamento,\nmandados pagos por mapa e mandados gratuitos ou equiparados) e, em relação aos\nmandados pagos por adiantamento, o número e valor da GRD; 14\n1\nProv. CG 27/2023.\n2\nProv. CG 27/2023.\n3\nProv. CG 27/2023.\n4\nProv. CG 27/2023.\n5\nProv. CG 27/2023.\n6\nProv. CG 27/2023.\n7\nProv. CG 27/2023.\n8\nProv. CG 27/2023.\n9\nProv. CG 27/2023.\n10 Incluído pelo Prov. CG 27/2023 e alterado pelo Prov. CG 01/2024.\n11\nProv. CG 27/2023.\n12\nProv. CG 27/2023.\n13\nProv. CG 27/2023.\n14\nProv. CG 27/2023.\nVIII - o seguinte texto, ao pé do instrumento: “É vedado ao Oficial de Justiça\no recebimento de qualquer numerário diretamente da parte. A identificação do Oficial de\nJustiça, no desempenho de suas funções, será feita mediante apresentação de carteira\nfuncional, obrigatória em todas as diligências.”; 1\nIX - número do mandado com o código de barras. 2\n§ 1º - Os atos judiciais que sirvam como mandados, cartas precatórias e\nalvarás, se não contiverem o código de barras, deverão ser remetidos com “folha de\nrosto” extraída do sistema informatizado. 3\n§ 2º - Nos casos indicados no §1º do presente artigo, a anotação de ciente\ndo destinatário deverá ser colhida na determinação judicial que serviu de mandado. 4"},"1012":{"topicId":"OJ26-LESP-NSCGJ-11","texto":"Art. 1.012. Nos mandados para cumprimento de atos com deslocamento,\nserá expedido um mandado para a prática de todos os atos em relação a um mesmo\ndestinatário em um mesmo endereço ou em endereços contíguos ou lindeiros,\nobservadas as regras e exceções estabelecidas nestas Normas de Serviço; 5\n§ 1º É vedada a expedição de mais de um mandado para atos subsequentes\nrelacionados ao mesmo endereço, ainda que entre os atos haja prazo legal ou fixado\npelo Juiz que demande o cumprimento em várias diligências, salvo se a soma dos\nprazos ultrapassar o prazo total para cumprimento do mandado. 6\n§ 2º Os endereços contíguos ou lindeiros são indicados no bojo do mesmo\nmandado, sem prejuízo do agrupamento pelo mesmo sistema, sendo considerado, em\nqualquer caso, um único mandado para fins de margeamento, independentemente do\nnúmero de atos ou destinatários no mesmo endereço ou em endereços contíguos ou\nlindeiros. 7\n§ 3º Havendo mais de um endereço não contíguo ou lindeiro indicado nos\nautos: 8\nI – salvo decisão judicial fundamentada em contrário, será expedido apenas\num mandado por vez; 9\nII – no momento do peticionamento, a parte deverá indicar os endereços\nlindeiros e contíguos ou indicar a ordem de preferência na expedição de cada mandado;\n10\nIII – o pedido de expedição de mais de um mandado concomitantemente\ndeverá ser justificado e acompanhado da comprovação do recolhimento da GRD para\ncada mandado; 11\nIV - os demais mandados serão expedidos sucessivamente, na ordem de\npreferência indicada ou, não havendo, conforme o critério fixado pelo Juízo; 12\nV – deferida a expedição de mais de um mandado concomitantemente,\nhavendo notícia de cumprimento em qualquer um dos mandados, o Ofício de Justiça\ndeverá imediatamente solicitar a devolução dos demais independentemente de\ncumprimento. 13\n1\nProv. CG 27/2023.\n2\nProv. CG 27/2023.\n3\nProv. CG 27/2023.\n4\nProv. CG 27/2023.\n5 Prov. CG 27/2023.\n6\nProv. CG 27/2023.\n7\nProv. CG 27/2023.\n8\nProv. CG 27/2023.\n9\nProv. CG 27/2023.\n10\nProv. CG 27/2023.\n11\nProv. CG 27/2023.\n12\nProv. CG 27/2023.\n13\nProv. CG 27/2023.\n§ 4º Na hipótese de o mesmo ato ou conjunto de atos a ser realizado\nenvolver mais de um destinatário localizado no mesmo endereço ou em endereços\ncontíguos ou lindeiros, caberá ao Ofício de Justiça, alternativamente: 1\nI – expedir um mandado por destinatário, que deverão ser agrupados para\ncumprimento e margeamento único; 2 ou\nII - incluir manualmente no bojo do mandado os demais destinatários, desde\nque seu encaminhamento não dependa de senha. 3\n§ 5º Salvo nas hipóteses de gratuidade ou cumprimento de medidas de\nurgência, assim determinadas pelo Juiz, ou nos casos autorizados nestas Normas de\nServiço, nenhum mandado será expedido sem a juntada no processo judicial da GRD,\ncom a comprovação do recolhimento do valor devido – autenticação mecânica ou\ncomprovante de pagamento fornecido pelo banco recebedor. 4\n§ 6º Os mandados nas ações de execução de título extrajudicial serão\nexpedidos apenas para fins de citação, salvo pedido expresso do exequente para que\na tentativa de penhora de bens livres ocorra imediatamente após o decurso do prazo de\npagamento, hipótese em que não será processado o pedido de bloqueio pela via\neletrônica antes da certificação do cumprimento de todos os atos do mandado. 5"},"1013":{"topicId":"OJ26-LESP-NSCGJ-11","texto":"Art. 1.013. Nos mandados para cumprimento de atos sem deslocamento, ou\ncom possibilidade de conversão, será expedido um mandado para a prática de todos os\natos remotos em relação a um mesmo destinatário com todos os contatos disponíveis\nno feito, observadas as regras e exceções estabelecidas nestas Normas de Serviço. 6\n§ 1º Serão expedidos para cumprimento do ato pela via remota: 7\nI – citações, intimações e notificações em unidades prisionais; 8\nII – citações, intimações e notificações em unidades de internação; 9\nIII – intimação da vítima de violência doméstica, nos casos em que esta\ntenha indicado telefone ou aplicativo de mensagem para fins de comunicação. 10\n§ 2º Ainda que não tenha sido expressamente determinado para\ncumprimento pela via remota, permite-se a intimação da vítima por meio de telefone\nfixo, celular, WhatsApp ou e-mail, desde que haja anuência no momento da lavratura do\nboletim de ocorrência ou da apresentação do requerimento, com os dados necessários,\ngarantido seu absoluto sigilo. 11\n§ 3º Nos demais casos, a avaliação da viabilidade da realização do ato pela\nvia remota caberá exclusivamente ao Juiz da causa. 12"},"1014":{"topicId":"OJ26-LESP-NSCGJ-11","texto":"Art. 1.014. Os mandados serão classificados pelo Ofício de Justiça,\nconforme a decisão do Juiz da causa, observadas as seguintes regras: 13\n§ 1º - Em relação aos prazos, serão automaticamente classificados como: 14\nI – comum, os mandados sem prazo definido no mandado; 15\n1\nProv. CG 27/2023.\n2\nProv. CG 27/2023.\n3\nProv. CG 27/2023.\n4\nProv. CG 27/2023.\n5\nProv. CG 27/2023.\n6\nProv. CG 27/2023.\n7\nProv. CG 27/2023.\n8\nProv. CG 27/2023.\n9\nProv. CG 27/2023.\n10\nProv. CG 27/2023.\n11\nProv. CG 27/2023.\n12\nProv. CG 27/2023.\n13\nProv. CG 27/2023.\n14\nProv. CG 27/2023.\n15\nProv. CG 27/2023.\nII – plantão imediato, os mandados referentes ao art. 440-A (intimação de\nvítima) bem como os referentes às medidas protetivas de urgência decretadas e\nequivalentes, previstos no inciso I, do § 2º, do art. 1.000, destas Normas de Serviço; 1\nIII – Revogado;\nIV – urgente, os mandados com determinação judicial; 3\nV – audiência, todos os mandados com audiência marcada; 4\nVI – réu preso (3 dias), todos mandados expedidos em processo de réu\npreso, independente da parte a ser diligenciada; 5\nVII – remoto Réu Preso (7 dias), os mandados referentes a réus presos ou\nmenores internados. 6\n§ 2º Ressalvadas as hipóteses do §1º, é vedada a classificação de mandado\ncomo plantão ou urgente sem decisão judicial fundamentada. 7\n§ 3º Tão somente a designação de audiência não justifica a classificação\ncomo plantão ou urgente. Excepcionalmente, contudo, decisão judicial expressa e\nfundamentada poderá admitir tal classificação, especialmente quando o adiamento da\nprática do ato processual puder causar prejuízo excessivo ao regular andamento do\nfeito.\n§ 4º Os mandados classificados em desconformidade com o disposto nestas\nNormas de Serviço poderão ser reclassificados pela SADM de ofício ou a pedido do\nOficial de Justiça que o receber. 9"},"1015":{"topicId":"OJ26-LESP-NSCGJ-11","texto":"Art. 1.015. Devidamente instruídos, os mandados serão encaminhados para\ndistribuição à SADM ou módulo próprio por meio do sistema informatizado, observadas\nas regras de compartilhamento: 10\nI – os mandados de processos digitais deverão ser emitidos selecionando-\nse a zona correspondente ao CEP do mandado; na emissão do mandado, o sistema\nidentificará a zona correspondente; caso a identificação automática não ocorra, a\nunidade judicial deverá solicitar à SADM competente pelo cumprimento a vinculação do\nCEP a uma zona; 11\nII - os mandados de processos físicos e para cumprimento remoto, bem\ncomo em relação aqueles cujo compartilhamento tenha sido vedado pelas normas ou\ndecisão judicial serão emitidos selecionando-se a zona específica que será informada\npela SADM local. 12\n§ 1º Salvo em relação aos mandados classificados como de plantão ou\nurgentes por força da fundamentação constante da decisão que determinou sua\nexpedição, os mandados deverão ser remetidos com antecedência suficiente para que\nseja possível distribui-los para os Oficiais de Justiça e estes possam cumpri-los nos\nprazos fixados. 13\n§ 2º Salvo outro prazo fixado em lei, os mandados de intimação para a\nparticipação em audiências observarão o prazo mínimo de 7 (sete) dias úteis. 14\n1\nProv. CG 48/2025.\n2\nProv. CG 48/2025.\n3\nProv. CG 27/2023.\n4\nProv. CG 27/2023.\n5\nProv. CG 27/2023.\n6\nProv. CG 27/2023.\n7\nProv. CG 27/2023.\n8\nProv. CG 48/2025.\n9\nProv. CG 27/2023.\n10\nProv. CG 27/2023.\n11\nProv. CG 27/2023.\n12\nProv. CG 27/2023.\n13\nProv. CG 27/2023.\n14\nProv. CG 27/2023.\n§ 3º Os mandados expedidos fora do sistema pelos Ofícios de Justiça\nusuários do SAJ (por exemplo, em feitos eleitorais e administrativos e em casos de\ncontingência) deverão ser remetidos por e-mail para a SADM, sob registro e assinatura\nno livro de protocolo de autos e papéis, a qual os cadastrará como “mandados\nexcepcionais – outros locais”. 1\n§ 4º Desde que observado o disposto no inc. I do §2º do art. 998, o mandado\nemitido em plantão e não recepcionado pela SADM até o término do expediente será\nentregue pela Unidade Judicial por e-mail diretamente ao Oficial de Justiça de plantão,\ncom regularização da distribuição pela SADM no dia útil seguinte ou por ocasião da\ndevolução do mandado. 2\n§ 5º Os mandados que não atenderem às disposições destas Normas de\nServiço poderão ser devolvidos pela SADM ou pelo Oficial de Justiça a que for\ndistribuído para que seja expedido novo mandado ou quantos mandados forem\nnecessários. 3"},"1016":{"topicId":"OJ26-LESP-NSCGJ-11","texto":"Art. 1.016. Somente poderão ser aditados os mandados enquanto ainda\nestiverem em posse do Oficial de Justiça e até o cumprimento do objeto do aditamento.\n4\n§ 1º Os aditamentos a mandados serão comunicados, sem devolução, por\ncorreio eletrônico (e-mail) à SADM com cópia ao próprio Oficial de Justiça. 5\n§ 2º Uma vez cumprido o mandado pelo Oficial de Justiça, é incabível o\naditamento, sendo necessária a expedição de novo mandado e, quando for o caso,\ncomprovação do recolhimento de nova GRD. 6"},"1017":{"topicId":"OJ26-LESP-NSCGJ-11","texto":"Art. 1.017. Mensalmente, o escrivão relacionará os mandados em poder dos\nOficiais de Justiça, além dos prazos legais ou fixados, comunicando ao Juiz Corregedor\nPermanente, para as providências cabíveis. 7\n§ 1º Compete ao dirigente do Ofício de Justiça, por intermédio do e-mail\ninstitucional da unidade, comunicar imediatamente à SADM, ou diretamente ao Oficial\nde Justiça, quando vinculado ao próprio Ofício, a necessidade de recolhimento de\nmandados já remetidos, encarregando-se esta de devolvê-los à origem. 8\n§ 2º Os pedidos de devolução ou cobrança de mandados compartilhados\ndeverão ser encaminhados para o e-mail institucional da SADM onde está o mandado.\n9\nSeção III 10\nDo processamento dos mandados nas SADMs 11"},"1018":{"topicId":"OJ26-LESP-NSCGJ-11","texto":"Art. 1.018. Após a anotação no sistema informatizado, os mandados serão\nrecebidos pela SADM ou módulo de SADM para verificação, distribuição e carga. 12\n1\nProv. CG 27/2023.\n2\nProv. CG 27/2023.\n3\nProv. CG 27/2023.\n4\nProv. CG 27/2023.\n5\nProv. CG 27/2023.\n6\nProv. CG 27/2023.\n7\nProv. CG 27/2023.\n8\nProv. CG 27/2023.\n9\nProv. CG 27/2023.\n10\nProv. CG 27/2023.\n11\nProv. CG 27/2023.\n12\nProv. CG 27/2023.\nParágrafo único - Os mandados deverão ser remetidos de forma a facilitar a\nidentificação da classificação, do zoneamento e da data de audiência cadastrada na\npauta. 1"},"1019":{"topicId":"OJ26-LESP-NSCGJ-11","texto":"Art. 1.019. Antes da distribuição, a SADM deverá verificar se o mandado\nestá de acordo com as formalidades legais e regulamentares e se está devidamente\ninstruído. 2\nI – observada qualquer irregularidade, a SADM solicitará correção ao Ofício\nde Justiça de origem e justificará no sistema informatizado o motivo da devolução,\nconforme orientações veiculadas por Comunicado; 3\nII - tratando-se de mandado de plantão, a irregularidade será corrigida pela\nprópria SADM, se viável a medida, independentemente de devolução ao Ofício de\norigem; 4\nIII – os mandados compartilhados cujo endereço pertença a outra SADM\nserão devolvidos ao Ofício de Justiça ou retransmitidos diretamente, nos casos de\nplantão ou urgência; 5\nIV – os mandados em conformidade serão distribuídos de acordo com as\nregras e prazos aplicáveis à sua classificação. 6\n§ 1º Onde instaladas como unidade autônoma, todas as remessas de\nmandados serão feitas exclusivamente pela SADM, vedada a remessa pelos Ofícios\nJudiciais diretamente aos Oficiais de Justiça, salvo o disposto no §4º do art. 1.015. 7\n§ 2º É vedada a indicação de Oficial de Justiça pela parte ou por seu\nprocurador, bem como a prática de se atribuírem todos os mandados do dia,\nindependentemente da classificação, ao Oficial de Justiça de plantão. 8\n§ 3º Os mandados relativos a pessoas protegidas pelo Provimento CG nº\n32/2000 serão direcionados para Oficial plantonista que, contudo, não precisará cumpri-\nlo de imediato, salvo ordem diversa do juiz do feito. 9\n§ 4º A SADM deverá providenciar carga em livro próprio dos mandados\nexpedidos fora do sistema, com rigoroso controle no equilíbrio das distribuições aos\nOficiais de Justiça. 10\n§ 5º Para a redistribuição do mandado haverá baixa e nova carga ou\ntransferência para outro Oficial no caso de impossibilidade de certificação do Oficial,\ncom respectivos registros do motivo no sistema informatizado. 11"},"1020":{"topicId":"OJ26-LESP-NSCGJ-11","texto":"Art. 1020. Serão agrupados pelo sistema, quando possível, ou, ainda, no\nmomento da distribuição pela SADM e no recebimento pelo Oficial de Justiça: 12\nI - os mandados emitidos em processos com gratuidade para cumprimento\nem endereços lindeiros ou contíguos, ainda que relacionados a processos e\ndirecionados a pessoas distintas; 13\nII – os mandados relacionados ao mesmo setor/zona, tais como: 14\n1\nProv. CG 27/2023.\n2\nProv. CG 27/2023.\n3\nProv. CG 27/2023.\n4\nProv. CG 27/2023.\n5\nProv. CG 27/2023.\n6\nProv. CG 27/2023.\n7\nProv. CG 27/2023.\n8\nProv. CG 27/2023.\n9\nProv. CG 27/2023.\n10\nProv. CG 27/2023.\n11\nProv. CG 27/2023.\n12\nProv. CG 27/2023.\n13\nProv. CG 27/2023.\n14\nProv. CG 27/2023.\na) os mandados oriundos de um mesmo processo ou processos conexos ou\napensados; 1\nb) os mandados oriundos de ações distintas, propostas pelo mesmo autor,\nou autores em litisconsórcio, contra o mesmo réu, ou mesmos réus em litisconsórcio; 2\nc) os mandados oriundos de mesma ação, ou em ações distintas de mesma\nnatureza, propostas pela mesma pessoa jurídica de direito público, contra um ou mais\nréus, em litisconsórcio ou não (execuções fiscais). 3\nIII – os mandados direcionados ao mesmo estabelecimento prisional ou de\ninternação, tais como: 4\na) mandados provenientes de processos distintos contra o mesmo preso ou\ninternado; 5\nb) mandados expedidos contra mais de um preso ou internado pelo mesmo\nprocesso; 6\nc) mandados oriundos de processos distintos e contra presos ou internados\ntambém diferentes. 7\nParágrafo único - O Juiz Corregedor Permanente baixará ordens de serviço\na fim de estabelecer critérios para o agrupamento de mandados nas hipóteses previstas\nneste artigo. 8"},"1021":{"topicId":"OJ26-LESP-NSCGJ-11","texto":"Art. 1.021. Tão logo o Oficial de Justiça devolva o mandado, a SADM\nverificará a regularidade do seu cumprimento, se emitidos certidões e documentos\ncorrelatos, se lançadas as informações correspondentes no sistema informatizado e se\ncorreto o número de atos margeados. 9\n§ 1º Constatada irregularidade no cumprimento do mandado, a SADM fará\na devolução deste para a fila do Oficial de Justiça, que o restituirá em 48 (quarenta e\noito) horas, devidamente regularizado. 10\n§ 2º Depois de conferidos, não sendo o caso de devolução, na forma do §1º,\nos mandados serão restituídos pelas SADMs aos Ofícios de Justiça de origem no prazo\nmáximo de 5 (cinco) dias, com exceção dos mandados para cumprimento urgente ou\nem plantão, que serão imediatamente baixados e encaminhados à origem. 11\n§ 3º Certidões, termos e autos serão impressos em tantas vias quantas\nnecessárias para juntada a autos não eletrônicos e para o ressarcimento devido. 12"},"1022":{"topicId":"OJ26-LESP-NSCGJ-11","texto":"Art. 1.022. O funcionário responsável pela SADM fará a cobrança de\nmandados com prazos excedidos para cumprimento a cada 30 (trinta) dias, ressalvado\nprazo menor genérico por determinação do Juiz Corregedor Permanente da SADM ou,\nonde não houver, do Ofício de Justiça. 13\nSeção IV 14\n1\nProv. CG 27/2023.\n2\nProv. CG 27/2023.\n3\nProv. CG 27/2023.\n4\nProv. CG 27/2023.\n5\nProv. CG 27/2023.\n6\nProv. CG 27/2023.\n7\nProv. CG 27/2023.\n8\nProv. CG 27/2023.\n9\nProv. CG 27/2023.\n10\nProv. CG 27/2023.\n11\nProv. CG 27/2023.\n12\nProv. CG 27/2023.\n13\nProv. CG 27/2023.\n14\nProv. CG 27/2023.\nDo cumprimento dos mandados pelos Oficiais de Justiça 1"},"1023":{"topicId":"OJ26-LESP-NSCGJ-11","texto":"Art. 1.023. Ao receber eletrônica ou fisicamente em carga, o Oficial de\nJustiça deverá verificar se o mandado está dentro dos limites de seu setor de atuação\ne se contém os documentos necessários ao seu cumprimento, bem como se o valor foi\ncorretamente recolhido e é suficiente para a prática do ato ordenado; 2\n§ 1º Se constatar irregularidades, dentro de 24 (vinte e quatro) horas, o\nOficial de Justiça poderá devolver o mandado. Depois desse prazo, salvo irregularidade\ninsanável, não poderá o oficial devolver o mandado sem o devido cumprimento. 3\n§ 2º Se necessários dois ou mais Oficiais de Justiça para cumprimento da\nordem judicial considerada complexa ou perigosa, o sorteado poderá solicitar que o\noutro Oficial de Justiça seja designado pelo responsável pela SADM, que o fará\npreferencialmente com Oficial do mesmo setor. Neste caso, todos serão ressarcidos\nfrente ao ato ou atos realizados. 4\n§ 3º No caso de mandados pagos, salvo nas hipóteses de cumprimento de\nmedidas de urgência, assim determinadas pelo Juiz, nas expressamente autorizadas\nnestas Normas de Serviço, ausente ou insuficiente o depósito, o Oficial de Justiça\ndevolverá para complementação pelo interessado, indicando, desde logo, o valor a ser\ncomplementado e o critério utilizado para cálculo. 5"},"1024":{"topicId":"OJ26-LESP-NSCGJ-11","texto":"Art. 1.024. O Oficial deverá cumprir todos os atos do mandado, ainda que\nem momentos distintos, no endereço principal e nos endereços lindeiros. 6\n§ 1º Na hipótese de arresto ou penhora, o Oficial de Justiça realizará as\ndiligências subsequentes como a intimação e avaliação, se possível. 7\n§ 2º Se couber ordem de arrombamento ou reforço policial, o Oficial de\nJustiça, sem devolver o mandado, submeterá ao Juiz do feito requerimento em modelo\npadronizado. 8\n§ 3º Na hipótese do § 2º, o requerimento, se deferido, servirá de requisição\nda força policial e/ou de ordem de arrombamento e cópia dele será entranhada aos\nautos ou digitalizada para inserção em autos inteiramente eletrônicos. 9"},"1025":{"topicId":"OJ26-LESP-NSCGJ-11","texto":"Art. 1.025. O interessado deverá prover diretamente os meios ou oferecer\ndepósito das despesas em caso de transporte e depósito de bens e outras necessárias\nao cumprimento de mandados, sem prejuízo daquelas relativas à condução. 10\n§ 1º Quando o interessado prover diretamente os meios para o cumprimento\ndo mandado, deverá desde logo especificá-los, indicando dia, hora e local em que estará\nà disposição, sendo seu ônus entrar em contato com a SADM ou o Oficial de Justiça; 11\n§ 2º Deixando de prover diretamente, o interessado deverá oferecer\ndepósito do valor indicado pelo Oficial de Justiça nos autos, em conta judicial, no prazo\nde 5 (cinco) dias, a partir do qual começará a contagem do prazo para cumprimento do\nmandado. 12\n1\nProv. CG 27/2023.\n2\nProv. CG 27/2023.\n3\nProv. CG 27/2023.\n4\nProv. CG 27/2023.\n5\nProv. CG 27/2023.\n6\nProv. CG 27/2023.\n7\nProv. CG 27/2023.\n8\nProv. CG 27/2023.\n9\nProv. CG 27/2023.\n10\nProv. CG 27/2023.\n11\nProv. CG 27/2023.\n12\nProv. CG 27/2023.\n§ 3º Vencido o prazo referido no §2º deste artigo, o Oficial de Justiça o\ndevolverá, certificando a ocorrência. 1"},"1026":{"topicId":"OJ26-LESP-NSCGJ-11","texto":"Art. 1.026. O Oficial de Justiça, ao proceder às citações, intimações e\nnotificações, exigirá a exibição do documento de identidade do citando, anotando nos\nautos os respectivos números, em especial o número de inscrição no Cadastro de\nPessoas Físicas. 2\n§ 1º Nas citações de pessoas jurídicas ou sociedades sem personalidade\njurídica, serão observados os incisos VIII e IX do art. 75 do Código de Processo Civil. 3\n§ 2º Nas citações por hora certa, o oficial de Justiça certificará os dias e\nhorários em que o réu foi procurado, descrevendo todos os fatos e circunstâncias que\nespertaram a suspeita de ocultação e fazendo a citação, de preferência, em pessoa da\nfamília. 4\n§ 3º Nos condomínios edilícios ou nos loteamentos com controle de acesso,\nserá válida a intimação a que se refere o § 2º feita a funcionário da portaria responsável\npelo recebimento de correspondência. 5\n§ 4º Nas ações de despejo, verificando que se trata de imóvel de habitação\ncoletiva multifamiliar, o Oficial de Justiça dará ciência a todos os ocupantes do imóvel,\nque serão identificados, e certificará a respeito. 6\n§ 5º Nas ações possessórias em que figure no polo passivo grande número\nde pessoas, o Oficial de Justiça deverá efetuar a citação pessoal dos ocupantes que\nforem encontrados no local, exaurindo-se a diligência com relação aos que não foram\nencontrados para citação, certificando-se. 7\n§ 6º Quando o ato exigir a investidura de depositário de bens, o Oficial de\nJustiça constará do auto ou certidão o número do documento de identidade e da\ninscrição no Cadastro de Pessoa Física - CPF do depositário. 8"},"1027":{"topicId":"OJ26-LESP-NSCGJ-11","texto":"Art. 1.027. O Oficial de Justiça deverá cumprir diligência em outro endereço,\nobtido por indicação no local da diligência, independentemente de devolução ou\naditamento do mandado, desde que no seu setor/zona de atuação. 10\n§ 1º Caso o endereço referenciado pertença a outro setor/zona, o Oficial de\nJustiça devolverá o mandado certificando o novo endereço, quem o informou e a\ncircunstância de pertencer a outro setor/zona. 11\n§ 2º Na hipótese do § 1º deste artigo, a parte será intimada para manifestar\nse deseja a expedição de novo mandado direcionado ao endereço referenciado,\nrecolhendo novas despesas de deslocamento, se o caso. 12"},"1028":{"topicId":"OJ26-LESP-NSCGJ-11","texto":"Art. 1.028. O cumprimento de atos no território das Comarcas localizadas\nnos Estados vizinhos observará o disposto no “Protocolo de Cooperação” celebrado. 13\n1\nProv. CG 27/2023.\n2\nProv. CG 27/2023.\n3\nProv. CG 27/2023.\n4\nProv. CG 27/2023.\n5\nProv. CG 27/2023.\n6\nProv. CG 27/2023.\n7\nProv. CG 27/2023.\n8\nProv. CG 27/2023.\n9\nProv. CG 27/2023.\n10\nProv. CG 27/2023.\n11\nProv. CG 27/2023.\n12\nProv. CG 27/2023.\n13\nProv. CG 27/2023.\n§ 1º O Oficial de Justiça, munido de um ofício de apresentação, dirigir-se-á\nao Fórum local, onde os funcionários do Ofício de Justiça subordinados ao Juiz Diretor\ndo Fórum lhe fornecerão todas as informações solicitadas, especialmente a respeito da\nlocalização e dos meios de acesso ao local designado para cumprimento do ato. 1\n§ 2º O reembolso das despesas de condução dos atos cumpridos na forma\ndeste artigo observará as mesmas regras dos demais atos praticados nas Comarcas e\nForos do Estado de São Paulo. 2"},"1029":{"topicId":"OJ26-LESP-NSCGJ-11","texto":"Art. 1.029. No cumprimento remoto de mandados em unidades prisionais ou\nde internação será observado o que segue: 3\nI – o Oficial de Justiça fará o agendamento no prazo de 48 (quarenta e oito)\nhoras após o recebimento, na forma de Comunicado específico; o cumprimento do ato\ndeverá ser efetivado em até 07 (sete) dias úteis. 4\nII – em caso de agendamento em prazo superior a 15 (quinze) dias úteis a\npartir do contato, o Oficial de Justiça certificará nos autos com anexação da resposta da\nunidade, podendo o Juiz do feito aguardar a data ou converter o cumprimento do\nmandado em presencial, por decisão nos autos, comunicando à SADM ou, onde não\nhouver, ao responsável pela Central de Mandados;\nIII - na hipótese de conversão do cumprimento remoto em presencial a ser\nefetivado em Comarca diversa, não contígua, o mandado será redistribuído à\nSADM competente para a região onde localizado o estabelecimento prisional\nou de internação de adolescentes infratores;\nIV – a conversão do cumprimento remoto em presencial será informada pelo\nOficial de Justiça à Unidade Prisional ou de Internação na mesma forma do\nagendamento, para a liberação da data. 7\nParágrafo único - É vedado o cumprimento presencial de mandado remoto\nem unidade prisional ou de internação sem a estrita observância do disposto neste\nparágrafo e, se houver o cumprimento, não dará ensejo a qualquer ressarcimento. 8"},"1030":{"topicId":"OJ26-LESP-NSCGJ-11","texto":"Art. 1.030. O Oficial de Justiça, ao efetuar qualquer ato de cientificação\npresencial, como citação, intimação ou notificação, colherá a nota de ciente do\ncientificando. 2\n§ 1º No caso de o cientificando não exarar sua nota de ciente, deverá\ncertificar pormenorizadamente tal ocorrência no mandado, incluída a descrição física\nsucinta de quem se recusou. 3\n§ 2º Nos atos de cientificação virtual o Oficial de Justiça certificará o meio\nutilizado, colhendo-se a impressão da tela ou outro meio de comprovação, se possível.\n4"},"1031":{"topicId":"OJ26-LESP-NSCGJ-11","texto":"Art. 1.031. Salvo expressa autorização judicial, é defeso ao Oficial de Justiça\ndevolver mandado sem cumprimento e sem esgotar os meios ao seu alcance para\nintegral cumprimento, não se admitindo como escusa o término de prazo. 5\n§ 1º - Antes do Oficial de Justiça certificar a impossibilidade da prática do\nato, esgotará todos os meios de concretização, especificando na certidão as diligências\nefetuadas. 6\n§ 2º - Na hipótese de o endereço ser localizado, mas a pessoa procurada\nnão se encontrar no local, considera-se o esgotamento após duas tentativas de procura,\nsalvo se houver informações claras de que o réu não poderá mais ser encontrado no\nreferido endereço, o que deverá ser certificado nos autos. 7\nSeção V 8\nDa certificação e devolução dos mandados 9"},"1032":{"topicId":"OJ26-LESP-NSCGJ-11","texto":"Art. 1.032. Cumprido o mandado, o Oficial de Justiça utilizará o sistema\ninformatizado para informar o resultado obtido e emitir certidão e, quando o caso, auto\nou termo, imprimindo-os e anexando-os ao respectivo mandado, observado o § 3º do\nart. 1.021. 10\n§ 1º A impressão é dispensada em relação a processos com autos\neletrônicos. 11\n§ 2º Quando houver mais de um ato determinado no mandado, e entre um\ne outro houver interregno superior a 05 (cinco) dias úteis, transcorrido ou a transcorrer\ndurante o cumprimento, o Ofi

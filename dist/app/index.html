cial de Justiça sem devolução lavrará no sistema certidão\nintermediária sobre o quanto já praticado em 24 (vinte e quatro) horas, mantido em seu\n1\nProv. CG 26/2026.\n2\nProv. CG 27/2023.\n3\nProv. CG 27/2023.\n4\nProv. CG 27/2023.\n5\nProv. CG 27/2023.\n6\nProv. CG 27/2023.\n7\nProv. CG 27/2023.\n8\nProv. CG 27/2023.\n9\nProv. CG 27/2023.\n10\nProv. CG 27/2023.\n11\nProv. CG 27/2023.\npoder o mandado para prática do ato seguinte, ressalvada cobrança sem cumprimento\npelo Juiz do feito. 1\n§ 3º Caso o Oficial cumpra o mandado em endereço nele não constante,\ndentro do seu setor (art. 1.028), deverá inseri-lo no sistema e na certidão em campo\napropriado definido pelo Juiz Corregedor Permanente da SADM. 2"},"1033":{"topicId":"OJ26-LESP-NSCGJ-11","texto":"Art. 1.033. Na certidão, o Oficial de Justiça deverá fazer constar: 3\nI – o resultado da diligência; 4\nII – a pessoa diligenciada; 5\nIII - o(s) endereço(s) diligenciado(s); 6\nIV – o(s) ato(s) praticado(s); 7\nV – a data e horário da diligência, em especial se for diversa da data da\ncertidão; 8\nVI – o cumprimento concomitante de outros atos ou mandados em\nendereços contíguos ou lindeiros; 9\nVII - no caso de o endereço ser diverso ao do mandado, fazer menção se o\nendereço diligenciado foi obtido através de aditamento, ou no caso de indicação, fazer\nconstar onde recebeu a informação. 10\nVIII – no cumprimento de mandados remotos, que se valeu de seus próprios\nmeios; 11\nIX - o número da GRD e valor utilizado em mandados pagos ou a quantidade\nde cotas em mandados gratuitos; 12\nX - em casos da necessidade de retificar/complementar certidões ou\nredistribuir mandados, deve constar na certidão a respectiva especificidade em negrito\ne caixa alta; 13\nXI – certificar, em mandado, proposta de autocomposição apresentada por\nqualquer das partes, na ocasião, de realização de ato de comunicação que lhe couber\nconforme o resultado (se houve ou não o atingimento da finalidade processual), em\ncumpridos (positivos, parcialmente positivos, negativos), não cumpridos (prejudicados\ne devolvidos por irregularidade). 14\nParágrafo único - O Oficial de Justiça deverá observar os seguintes\nparâmetros para a classificação da situação das diligências: 15\nI – cumprido: 16\na) ato positivo: quando todos os atos previstos no mandado forem\ncumpridos; 17\nb) cumprido parcialmente: quando o Oficial de Justiça praticar atos com\nresultados diferenciados e pelo menos um deles for cumprido de forma conclusiva; 18\n1\nProv. CG 27/2023.\n2\nProv. CG 27/2023.\n3\nProv. CG 27/2023.\n4\nProv. CG 27/2023.\n5\nProv. CG 27/2023.\n6\nProv. CG 27/2023.\n7\nProv. CG 27/2023.\n8\nProv. CG 27/2023.\n9\nProv. CG 27/2023.\n10\nProv. CG 27/2023.\n11\nProv. CG 27/2023.\n12\nProv. CG 27/2023.\n13\nProv. CG 27/2023.\n14\nProv. CG 27/2023.\n15\nProv. CG 27/2023.\n16\nProv. CG 27/2023.\n17\nProv. CG 27/2023.\n18\nProv. CG 27/2023.\nc) ato negativo: quando a ordem judicial não for frutífera em razão de a\npessoa ou de o bem não ter sido encontrado, depois de reiteradas tentativas. 1\nII – não cumprido: 2\na) quando a parte deixar de fornecer os meios necessários ao seu\ncumprimento; 3\nb) quando houver solicitação de devolução por parte da serventia ou do\nMagistrado; 4\nc) quando o mandado não contiver os elementos ou não observar os prazos\nindicados nestas Normas; 5 e\nd) quando houver necessidade de redistribuição do mandado pelo fato de o\nOficial de Justiça tê-lo recebido equivocadamente. 6\nIII - irregular: 7\na) quando o mandado não contiver os elementos ou não observar os prazos\nindicados nestas Normas; 8 e\nb) quando houver necessidade de redistribuição do mandado pelo fato de o\nOficial de Justiça tê-lo recebido equivocadamente. 9"},"1034":{"topicId":"OJ26-LESP-NSCGJ-11","texto":"Art. 1.034. Devolvido o mandado com a respectiva certidão, os dados serão\ncadastrados pelo Ofício de Justiça no sistema informatizado próprio, observando-se as\ndisposições constantes do Capítulo III, Seção V, Subseção III, destas Normas. 10\n§ 1º Quando a citação ou intimação for realizada por Oficial de Justiça, ao\nreceber o mandado positivo digitalizado pelo Oficial de Justiça, o Ofício de Justiça\nprocederá à sua liberação nos autos juntamente com a certidão do Oficial de Justiça,\npor este assinada eletronicamente, momento a partir do qual se considera juntado o\nmandado aos autos digitais, para fins de contagem de prazo (artigo 231 do Código de\nProcesso Civil). 11\n§ 2º No caso de mandado descartado e não digitalizado, caberá ao Ofício\nde Justiça a liberação da certidão do Oficial de Justiça, por este assinada\neletronicamente, e a prática do ato ordinatório pertinente. 12\nSeção VI 13\nDo ressarcimento nos mandados 14"},"1035":{"topicId":"OJ26-LESP-NSCGJ-11","texto":"Art. 1.035. As despesas dos Oficiais de Justiça no cumprimento dos\nmandados serão reembolsadas por cotas, apuradas por mandado cumprido ou por lotes\nde mandados cumpridos, na forma desta seção e subseções. 15\n§ 1º Observado o disposto no art. 995 destas Normas, considera-se: 16\n1\nProv. CG 27/2023.\n2\nProv. CG 27/2023.\n3\nProv. CG 27/2023.\n4\nProv. CG 27/2023.\n5\nProv. CG 27/2023.\n6\nProv. CG 27/2023.\n7\nProv. CG 27/2023.\n8\nProv. CG 27/2023.\n9\nProv. CG 27/2023.\n10\nProv. CG 27/2023.\n11\nProv. CG 27/2023.\n12\nProv. CG 27/2023.\n13\nProv. CG 27/2023.\n14\nProv. CG 27/2023.\n15\nProv. CG 27/2023.\n16\nProv. CG 27/2023.\nI – cota paga com deslocamento: valor do reembolso dos Oficiais de Justiça\nno cumprimento de mandados pagos, relativo a atos com deslocamento, apurado a\npartir do valor da diligência, deduzidos os custos administrativos; 1\nII – cota paga sem deslocamento: valor do reembolso dos Oficiais de Justiça\nno cumprimento de mandados pagos, relativo a atos remotos ou na sede do Juiz,\napurado a partir do valor da diligência, deduzidos os custos administrativos; 2\nIII – cota gratuita: valor do reembolso dos Oficiais de Justiça no cumprimento\nde mandados gratuitos ou equiparados, por mandado ou lote de mandados, apurado\nem rateio, deduzidos os valores de antecipação. 3\n§ 2º O valor a ser ressarcido ao Oficial de Justiça observará o disposto nesta\nseção independentemente da distância, quantidade de idas e vindas, do número de atos\ne respectiva situação, positivo, parcialmente ou negativo de cada um deles. 4\n§ 3º Caso haja a designação de dois ou mais Oficiais de Justiça para o\ncumprimento de um mandado ou determinados atos de um mandado, cada Oficial de\nJustiça deverá ser ressarcido separadamente. 5\n§ 4º Considera-se não cumprido, para fins de ressarcimento de despesas, o\nato que infringir os requisitos estabelecidos neste Capítulo. 6"},"1036":{"topicId":"OJ26-LESP-NSCGJ-11","texto":"Art. 1.036. Nos mandados relativos a atos com deslocamento, o\ncumprimento de cada mandado dará direito a uma cota paga ou gratuita, de acordo com\na forma de ressarcimento do mandado, independentemente do número de atos e\ndiligências em cada um deles, inclusive se realizadas em dias distintos, encerrando-se\no agrupamento para fins de ressarcimento na data da diligência do efetivo cumprimento\ndo mandado.\n§ 1º Como exceção à regra prevista no caput, ainda que sejam vários os\nmandados, será considerado um único mandado para fins de ressarcimento e dará\nensejo a uma única cota de ressarcimento: 8\nI – os mandados de atos subsequentes relacionados ao mesmo endereço,\nainda que entre os atos haja prazo legal ou fixado pelo Juiz que demande o cumprimento\nem várias diligências, salvo se a soma dos prazos ultrapassar o prazo total para\ncumprimento do mandado, de acordo com a sua classificação; 9\nII - todos os mandados em posse do Oficial de Justiça, independentemente\nda data do recebimento, para cumprimento em endereços lindeiros ou contíguos, ainda\nque relacionados a processos e direcionados a pessoas distintas; 10\nIII – na hipótese de conversão para cumprimento pessoal, todos os\nmandados relacionados a uma mesma unidade prisional ou de internação, ainda que\nrelacionados a processos e réus distintos. 11\n§ 2º Se, durante a diligência para cumprimento dos mandados, o Oficial de\nJustiça verificar uma das hipóteses do §1º, deverá considerá-las para fins de\nmargeamento um único mandado. 12\n1\nProv. CG 27/2023.\n2\nProv. CG 27/2023.\n3\nProv. CG 27/2023.\n4\nProv. CG 27/2023.\n5\nProv. CG 27/2023.\n6\nProv. CG 27/2023.\n7\nProv. CG 03/2026.\n8\nProv. CG 27/2023.\n9\nProv. CG 27/2023.\n10\nProv. CG 27/2023.\n11\nProv. CG 27/2023.\n12\nProv. CG 27/2023.\n§ 3º Além da cota relativa ao próprio mandado, ensejará a remuneração\nadicional por lotes, dos valores oriundos do rateio, na forma dos arts. 1.052 e 1.053\ndestas Normas.\nI - Revogado; e\nII - Revogado.\n§ 4º Consideram-se incluídos no valor da cota de ressarcimento os\npagamentos de passagens, em veículo público ou particular, por pedágio-rodoviário ou\nde travessia em balsa/ferry-boat, vedado qualquer reembolso adicional.\n§ 5º É vedado o agrupamento entre mandados gratuitos e mandados\npagos."},"1037":{"topicId":"OJ26-LESP-NSCGJ-11","texto":"Art. 1.037. Nos mandados para cumprimento de atos sem deslocamento,\nou com possibilidade de conversão, ou na própria sede do Juízo: 6\nI – nos mandados pagos, o ressarcimento será apurado por mandado\ncumprido, a partir do valor da diligência remota, deduzidas as despesas (uma cota paga\nsem deslocamento por mandado); 7\nII – nos mandados gratuitos, o cumprimento de cada lote de 10 (dez)\nmandados com os meios do próprio Oficial dará ensejo ao ressarcimento de uma cota\n(uma cota gratuita para cada dez mandados). 8\nParágrafo único - Observará a forma de ressarcimento previsto no caput o\nmandado com deslocamento que tenha sido cumprido de forma remota, na forma do\ndisposto no §2º do art. 1.013. 9"},"1038":{"topicId":"OJ26-LESP-NSCGJ-11","texto":"Art. 1.038. As dúvidas e divergências serão decididas pelo Juiz da causa ou\npelo Juiz Corregedor, conforme ocorram dentro ou fora do âmbito do processo, com\nrecurso sem efeito suspensivo para a Corregedoria Geral da Justiça, em instrumento\napartado, no prazo de 15 (quinze) dias. 10"},"1039":{"topicId":"OJ26-LESP-NSCGJ-11","texto":"Art. 1.039. As diligências praticadas em cumprimento de mandados da\nJustiça Eleitoral serão reembolsadas pelo Tribunal Regional Eleitoral, não podendo ser\nincluídas nos mapas mensais de ressarcimento de diligências gratuitas da Justiça\nEstadual (Comunicado CG nº 753/2009). 11\nSubseção I 12\nDos mandados pagos 13"},"1040":{"topicId":"OJ26-LESP-NSCGJ-11","texto":"Art. 1.040. Nos mandados pagos, na Capital e no Interior, a parte ou\ninteressado deverá depositar os seguintes valores de diligência: 14\n1\nProv. CG 03/2026.\n2\nProv. CG 03/2026.\n3\nProv. CG 03/2026.\n4\nProv. CG 03/2026.\n5\nProv. CG 03/2026.\n6\nProv. CG 27/2023.\n7\nProv. CG 27/2023.\n8\nProv. CG 27/2023.\n9\nProv. CG 27/2023.\n10\nProv. CG 27/2023.\n11\nProv. CG 27/2023.\n12\nProv. CG 27/2023.\n13\nProv. CG 27/2023.\n14\nProv. CG 27/2023.\nI – nos mandados com deslocamento, independentemente de atos a serem\npraticados no mesmo endereço ou em endereços contíguos ou lindeiros (art. 1.020),\nainda que o resultado de um ou mais atos seja negativo, equivalente a 03 (três) UFESPs;\n1\nII – nos mandados exclusivamente remotos ou na própria sede do Juízo,\nequivalente a 01 (uma) UFESP; 2\nIII – nos mandados inicialmente remotos, verificada a necessidade de\nconversão para mandado com deslocamento, será necessária a complementação da\ndiferença entre os valores previstos nos incisos I e II. 3\n§ 1º Os novos valores, decorrentes do reajustamento da UFESP, não se\naplicarão aos depósitos antes efetuados, ainda que o correspondente mandado não\ntenha sido expedido ou cumprido.\n§ 2º Do valor da diligência, 5% (cinco por cento) da arrecadação será\ndestinado ao custeio das despesas administrativas, inclusive impressão; o restante -\n95% (noventa e cinco por cento) - corresponderá à cota de ressarcimento do Oficial de\nJustiça (com ou sem deslocamento).\n§ 3º O percentual acima, de 5% (cinco por cento), será transferido ao Fundo\nEspecial de Despesas do Tribunal de Justiça - FEDTJ quando do pagamento dos\nmapas; o remanescente - 95% (noventa e cinco por cento) - será depositado na conta\ndo Oficial de Justiça no Banco do Brasil S/A.\n§ 4º Quando o interessado oferecer condução ao Oficial de Justiça, deverá,\ndesde logo, indicar dia, hora e local em que a condução estará à disposição, não\nhavendo nesta hipótese recolhimento do valor das despesas. 7"},"1041":{"topicId":"OJ26-LESP-NSCGJ-11","texto":"Art. 1.041. O recolhimento das despesas destinadas ao cumprimento de\ndiligências pelos Oficiais de Justiça será efetuado por meio de GRD, cujo preenchimento\ndeverá ser feito no sítio eletrônico do Banco do Brasil na internet. 8\n§ 1º A parte ou interessado deverão fazer constar da GRD: 9\nI – valor recolhido; 10\nII - conta corrente do depósito; 11\nIII - nome do depositante e das partes (autor e réu); 12\nIV – Comarca ou fórum onde ajuizado o feito ou distribuída a carta\nprecatória; 13\nV - número do processo e unidade judicial, quando conhecidos. 14\n§ 2º O boleto de pagamento será gerado a partir da GRD em 4 (quatro) vias:\na 1ª (primeira) será destinada à parte, a 2ª (segunda) entranhada nos autos, a 3ª\n(terceira) e 4ª (quarta) anexadas ao mandado. 15\n1\nProv. CG 27/2023.\n2\nProv. CG 27/2023.\n3\nProv. CG 27/2023.\n4\nProv. CG 27/2023.\n5\nProv. CG 03/2026.\n6\nProv. CG 03/2026.\n7\nProv. CG 27/2023.\n8\nProv. CG 27/2023.\n9\nProv. CG 27/2023.\n10\nProv. CG 27/2023.\n11\nProv. CG 27/2023.\n12\nProv. CG 27/2023.\n13\nProv. CG 27/2023.\n14\nProv. CG 27/2023.\n15\nProv. CG 27/2023.\n§ 3º O interessado poderá efetuar o pagamento do boleto em qualquer\nestabelecimento da rede bancária, através de internet banking ou outra forma autorizada\nnas presentes Normas de Serviço ou pela Presidência do Tribunal. 1\n§ 4º O depositante apresentará 3 (três) vias do boleto ao Ofício de Justiça\ne, caso o recolhimento não esteja autenticado mecanicamente, anexará a cada uma das\nvias o devido comprovante de pagamento, fornecido pelo atendente de caixa, terminal\nde autoatendimento ou internet banking. 2\n§ 5º Nos processos físicos, observado o disposto no §4º deste artigo, se o\nestabelecimento bancário fornecer apenas um comprovante de pagamento (filipeta),\ncaberá ao interessado extrair cópias para anexar às outras duas vias do boleto. 3\n§ 6º Na hipótese de carta precatória itinerante, e não se tratando de\nComarcas pertencentes ao compartilhamento de mandados eletrônicos, em que a conta\nbancária de depósito da GRD seja diversa daquela a que atrelado o Oficial de Justiça\napto a recebê-la, o Ofício de Justiça ou a SADM que realizar a diligência deverá, antes\nda devolução ao Juízo Deprecante, oficiar ao Ofício de Justiça ou SADM da Comarca\nonde feito o depósito para solicitar a transferência do valor em vista do ressarcimento\nao Oficial de Justiça. 4\n§ 7º Depósitos realizados de forma contrária ao previsto neste artigo,\ndeverão ser rejeitados, intimando-se o interessado a proceder novo depósito. 5"},"1042":{"topicId":"OJ26-LESP-NSCGJ-11","texto":"Art. 1.042. A relação de mandados pagos a serem ressarcidos será\nelaborada pelo Oficial de Justiça, preenchida de forma integral em todos os campos\npróprios (nome do Oficial, nº da matrícula e CPF, nº do processo, nº de atos realizados\ne das respectivas cotas de ressarcimento, nº da conta corrente, nº da guia e valor),\nassinada pelo Escrivão Judicial ou responsável da SADM e pelo Juiz Corregedor. 6\n§ 1º Uma das vias da GRD ou do boleto bancário da GRD, entregue ao\nOficial de Justiça, ficará com o próprio Oficial de Justiça e outra será devolvida com a\nrelação de mandados, para ser arquivada em classificador próprio, juntamente com a\nrelação prevista no caput deste artigo. 7\n§ 2º As guias ou boletos bancários de recolhimento de diligências do Oficial\nde Justiça, a relação de mandados e a cópia da autorização de crédito, referentes ao §\n5º deste artigo, serão conservados pela SADM e pelo Oficial de Justiça pelo prazo\nmínimo de dois anos contados do arquivamento, após o qual poderão ser inutilizadas. 8\n§ 3º Para os casos de compartilhamento de mandados eletrônicos, os\nmapas totalizadores de mandados pagos deverão ser preenchidos, via sistema SGF,\nem formulário padrão, com informação das quantidades totais de atos e valores de cada\nOficial, e enviados à Secretaria de Orçamento e Finanças (SOF), nas datas estipuladas\nem calendário anual a ser oportunamente divulgado no Diário da Justiça Eletrônico; 9\n§ 4º Caso não haja divulgação do cronograma previsto no §3º deste artigo,\nserá considerado o válido para o último mês, com ajuste das datas para o próximo dia\nútil subsequente quando não houver expediente. 10\n§ 5º Para o pagamento de mandados pagos de unidades que não estejam\nna central compartilhada, o escrivão ou o servidor responsável pela SADM remeterá ao\nestabelecimento bancário, no dia 20 (vinte) de cada mês, ou no primeiro dia útil\n1\nProv. CG 27/2023.\n2\nProv. CG 27/2023.\n3\nProv. CG 27/2023.\n4\nProv. CG 27/2023.\n5\nProv. CG 27/2023.\n6\nProv. CG 27/2023.\n7\nProv. CG 27/2023.\n8\nProv. CG 27/2023.\n9\nProv. CG 27/2023.\n10\nProv. CG 27/2023.\nsubsequente, relação correspondente aos mandados devolvidos no período anterior,\nconforme modelo próprio. 1\n§ 6º Excepcionalmente, no mês de dezembro de cada ano, em virtude do\nrecesso forense, a relação mencionada no §5º será enviada ao estabelecimento\nbancário no último dia útil do ano antes do recesso. 2\n§ 7º O atraso no encaminhamento das relações previstas nos §§ 3º e 5º por\nperíodo superior a 02 (dois) meses posteriores àquele correspondente ao mês do\ncumprimento do ato, ainda que acompanhado da necessária justificativa, implicará no\nindeferimento do pedido de ressarcimento. 3"},"1043":{"topicId":"OJ26-LESP-NSCGJ-11","texto":"Art. 1.043. A restituição de valores de diligência indevidamente recolhidos\nou de valor superior ao necessário poderá ser solicitada até a expedição do mandado,\nobservará as seguintes regras: 4\nI - para processos não distribuídos, o requerimento será feito diretamente ao\nJuiz Corregedor da SADM da Comarca a que dirigido o depósito, quando existir, ou, na\ninexistência, ao Juiz Diretor do Fórum: 5\na) o requerimento deverá indicar Agência/Cód. cedente, Data Emissão, Data\ndo Pagamento, Pagador, Número do Depósito, Nome do Autor, Nome do Réu, com a\nqualificação completa da pessoa autorizada a receber (RG, CPF, nome completo) e será\napresentado pelo depositante ou seu procurador, juntamente com as vias originais da\nGuia de Recolhimento de Diligência, a via original e uma cópia do comprovante de\npagamento (filipeta) e a comprovação da não distribuição da ação (certidão negativa de\ndistribuição); 6\nb) o servidor responsável pela SADM, ou a Unidade Judicial a que estiver\nvinculado o Juiz Diretor do Fórum, quando o caso, providenciará a expedição do alvará\nde levantamento (GRD processo não distribuído), nele constando todos os dados da\nGuia de Recolhimento de Diligência (agência/cód. cedente, data emissão, pagador,\nnúmero do depósito, nome do autor, nome do réu), com a qualificação completa da\npessoa autorizada a receber (RG, CPF, nome completo). 7\nc) o alvará de levantamento (GRD processo não distribuído) será instruído\ncom duas vias da guia de recolhimento de diligências, do comprovante de pagamento\n(filipeta) e da procuração, quando o caso, e será entregue, mediante recibo, ao\ndepositante ou seu procurador. 8\nd) a terceira via da guia de recolhimento de diligências e a cópia do\ncomprovante de pagamento (filipeta) serão anexadas à cópia do alvará de levantamento\n(GRD processo não distribuído) para arquivamento em classificador próprio, com\nindexador por ordem alfabética ou por número da guia de recolhimento de diligência, a\nfim de se evitar fraudes ou duplicidade no pagamento; 9\ne) para os casos de compartilhamento de mandados eletrônicos (deverá ser\nemitido um ofício, em modelo institucional específico (‘GRD processo não distribuído’),\nque será encaminhado pela SADM por e-mail institucional, para a Secretaria de\nOrçamento e Finanças (e-mail grd_restituicao@tjsp.jus.br) que providenciará o\nlevantamento do valor. 10\nII – para processos já distribuídos, a restituição do depósito de diligência de\nOficial de Justiça deverá ser solicitada ao Juiz responsável pela demanda judicial e,\n1\nProv. CG 27/2023.\n2\nProv. CG 27/2023.\n3\nProv. CG 27/2023.\n4\nProv. CG 27/2023.\n5\nProv. CG 27/2023.\n6\nProv. CG 27/2023.\n7\nProv. CG 27/2023.\n8\nProv. CG 27/2023.\n9\nProv. CG 27/2023.\n10\nProv. CG 27/2023.\ndeferida a restituição, a Unidade Judicial emitirá o ofício “506499 - ofício – levantamento\nde valores – guia diligência – Oficial de Justiça”, que será encaminhado do e-mail da\nUnidade Judicial para o e-mail grd_restituicao@tjsp.jus.br. 1\n§ 1º - O pedido de restituição de valores poderá ocorrer até a data da\nexpedição do mandado ou, não havendo a emissão, dentro do prazo de cinco (5) anos,\ncontado a partir da data do recolhimento da GRD.\n§ 2º Na hipótese de não expedição do mandado, o valor poderá ser\nreaproveitado no mesmo processo ou levantado pela parte ou interessado, observado\no disposto no inc. II do caput deste artigo. 3\n§ 3º Outras informações referentes à restituição de valores estão disponíveis\nno Comunicado CG nº 1.158/2021. 4\n§ 4º Os custos administrativos previstos no art. 1.040, §2º serão\nconsiderados deduzidos no momento do recolhimento e não integrarão eventual pedido\nde restituição, sendo processados nos termos do §3º do art. 1.040. 5\n§ 5º Não serão processados pedidos de restituição cujo valor seja inferior\nao valor dos custos administrativos. 6\nSubseção II 7\nDos mandados gratuitos 8"},"1044":{"topicId":"OJ26-LESP-NSCGJ-11","texto":"Art. 1.044. São considerados mandados gratuitos para fins de ressarcimento\ndo Oficial de Justiça, os mandados expedidos: 9\nI – em favor de interessado que seja beneficiário de gratuidade de Justiça\nou na hipótese em que for deferido pelo Juiz o diferimento do recolhimento; 10\nII - de ofício, por ordem judicial, e a requerimento do Ministério Público,\nquando o Juiz decidir que o custeio não deverá ser adiantado pelo autor, na forma do\nart. 82, §1º do Código de Processo Civil; 11\nIII – nos processos referidos no artigo 5°, incisos I a IV, da Lei Estadual\n11.608/03, salvo se o deferimento do benefício de diferimento excepcionar as despesas\nalém da taxa judiciária; 12\nIV - nas ações abrangidas pelo art. 219 da Lei 8.069/90 (Estatuto da Criança\ne do Adolescente); 13\nV - Nos processos do Juizado Especial; 14\nParágrafo único - A classificação do mandado como gratuito para fins de\nressarcimento: 15\nI – na hipótese do inc. V não afasta o dever de recolhimento em preparo por\nocasião de eventual recurso inominado; 16\n1\nProv. CG 27/2023.\n2\nProv. CG 20/2024.\n3\nProv. CG 27/2023.\n4\nProv. CG 27/2023.\n5\nProv. CG 27/2023.\n6\nProv. CG 27/2023.\n7\nProv. CG 27/2023.\n8\nProv. CG 27/2023.\n9\nProv. CG 27/2023.\n10\nProv. CG 27/2023.\n11\nProv. CG 27/2023.\n12\nProv. CG 27/2023.\n13\nProv. CG 27/2023.\n14\nProv. CG 27/2023.\n15\nProv. CG 27/2023.\n16\nProv. CG 27/2023.\nII – na hipótese dos incisos I e II não afasta o dever de pagamento do\nequivalente pela parte vencida, salvo se esta também for beneficiária de gratuidade. 1"},"1045":{"topicId":"OJ26-LESP-NSCGJ-11","texto":"Art. 1.045. Nos mandados gratuitos, o valor de cada cota corresponderá ao\nresultado da divisão do montante de 80% (oitenta por cento) da verba destinada a esse\nfim específico pelo número de cotas de ressarcimento dos atos ordenados em\nmandados gratuitos, devolvidos durante o mês pelos Oficiais de Justiça de todo o\nEstado. 2\n§ 1º Para fins de antecipação do valor necessário ao custeio das despesas\nde condução com diligências gratuitas, 20% (vinte por cento) do montante da\narrecadação serão igualmente divididos entre os Oficiais de Justiça que tenham\ncumprido, no mês anterior, mandados gratuitos. 3\n§ 2º Suprimido. 4\n§ 3º Suprimido. 5\n§ 4º O valor da cota dos mandados gratuitos não poderá ser superior ao\nvalor da cota destinada ao ressarcimento dos mandados pagos com deslocamento,\nhipótese em que os valores de arrecadação que levariam ao excedente serão\nregistrados para inclusão no rateio nos meses subsequentes. 6"},"1046":{"topicId":"OJ26-LESP-NSCGJ-11","texto":"Art. 1.046. Para o ressarcimento previsto no §1º do art. 1.045, o escrivão ou\nservidor responsável da SADM encaminhará à DICOGE, até o 8º (oitavo) dia útil de cada\nmês, pelo Sistema de Mandados Gratuitos – SMG, a relação/certidão completa dos\nOficiais de Justiça que tenham mandados cumpridos no mês. 7\n§ 1º Da relação prevista no caput deste artigo constará a quantidade de\nmandados e das respectivas cotas para fins de ressarcimento, bem como o mês em que\nocorreu o cumprimento do mandado, sendo vedado o lançamento, na mesma\nrelação/certidão, de cotas relativas a mandados cumpridos em meses diferentes. 8\n§ 2º Não serão incluídas no cálculo do mês referido no art. 1.045 as relações\nque não derem entrada na DICOGE, no prazo contido no caput deste artigo. O atraso\nno encaminhamento das relações por período superior a 02 (dois) meses anteriores\nàquele correspondente ao mês do ressarcimento, ainda que acompanhado da\nnecessária justificativa, implicará no indeferimento do pedido de ressarcimento. 9"},"1047":{"topicId":"OJ26-LESP-NSCGJ-11","texto":"Art. 1.047. Em cada vara ou setor haverá 1 (um) Oficial de Justiça, escolhido\npelos demais, que, sem prejuízo de suas funções, preencherá os mapas mensais\nindividuais de mandados gratuitos, utilizando-se das informações passadas pelo\ninteressado, assinando-os juntamente com o escrivão judicial ou servidor responsável\nda SADM. 10\n§ 1º O Escrivão ou servidor responsável da SADM, após a devida\nconferência, especialmente da quantidade de mandados e das respectivas cotas de\nressarcimento, certificará a autenticidade e a veracidade do conteúdo (dados oriundos\ndos mandados relacionados e correspondentes certidões), e colherá, na sequência,\nvisto do Juiz Corregedor Permanente. 11\n1\nProv. CG 27/2023.\n2\nProv. CG 27/2023.\n3\nProv. CG 27/2023.\n4\nIncluído pelo Prov. CG 27/2023 e suprimido pelo Prov. CG 01/2024\n5\nIncluído pelo Prov. CG 27/2023 e suprimido pelo Prov. CG 01/2024\n6\nProv. CG 27/2023.\n7\nProv. CG 27/2023.\n8\nProv. CG 27/2023.\n9\nProv. CG 27/2023.\n10\nProv. CG 27/2023.\n11\nProv. CG 27/2023.\n§ 2º Os mapas de mandados gratuitos deverão ser entregues, mediante\nrecibo em via própria, ao funcionário responsável pela SADM no 1º (primeiro) dia útil do\nmês subsequente ao mês de referência para conferência e encaminhamento em tempo\nhábil ao setor competente por meio do aplicativo SMG – Sistema de Mandados\nGratuitos. 1\n§ 3º Mapas com rasuras, irregularidades ou incompletudes serão restituídos\npara retificação e subsequente reapresentação. 2\n§ 4º Os mapas mensais individuais de mandados gratuitos deverão\npermanecer arquivados na unidade, após certificação de sua autenticidade e veracidade\nquanto ao seu conteúdo (dados oriundos dos mandados e respectivas certidões),\ndurante o prazo de 2 (dois) anos, após o qual poderão ser inutilizados. 3\n§ 5º Havendo necessidade de examinar os atos praticados, a Corregedoria\nGeral da Justiça poderá exigir dos Oficiais de Justiça a remessa do mapa original\narquivado em cartório, bem como de cópias dos mandados nele relacionados e das\ncorrespondentes certidões, observadas as seguintes disposições: 4\nI - a exigência será encaminhada por ofício ao Juiz Corregedor Permanente,\nque deverá comunicar, com brevidade, à Corregedoria Geral da Justiça, a data da\nciência aos Oficiais de Justiça e ao Escrivão Judicial. 5\nII - decorridos 60 (sessenta) dias da data da ciência, sem que tenham sido\nremetidos os documentos, por desídia do Oficial de Justiça, o pedido de ressarcimento\nserá automaticamente indeferido, sem prejuízo da continuidade da apuração\nadministrativa. 6\nIII - as cópias dos mandados e certidões relativas a processos que na data\nda exigência estiverem fora de cartório, com prazo superior ao fixado no parágrafo\nanterior, poderão ser substituídas por certidão do Escrivão Judicial, que dará fé da\nimpossibilidade de serem remetidas pelo interessado. 7\nSubseção III 8\nDo regime facultativo dos mandados das Fazendas 9"},"1048":{"topicId":"OJ26-LESP-NSCGJ-11","texto":"Art. 1.048. Os mandados expedidos no interesse das Fazendas Públicas\nobservarão as regras dos mandados pagos, salvo em relação aos regimes facultativos\nprevistos nesta seção, aplicáveis aos casos indicados em relação aos entes optantes\nque cumprirem todos os requisitos para sua implantação. 10"},"1049":{"topicId":"OJ26-LESP-NSCGJ-11","texto":"Art. 1.049. O regime facultativo geral será aplicável aos mandados\nexpedidos em processo de qualquer natureza, no interesse da Fazenda Federal, da\nFazenda do Estado de São Paulo e das Fazendas dos Municípios localizados na mesma\nComarca do processo e do endereço a ser diligenciado. 11\n§ 1º O regime facultativo implica a possibilidade de efetuar o recolhimento\ndos valores de diligência previstos no art. 1.041 destas Normas de Serviço depois de\nentregue ao seu representante, especialmente indicado, a relação mensal dos\n1\nProv. CG 27/2023.\n2\nProv. CG 27/2023.\n3\nProv. CG 27/2023.\n4\nProv. CG 27/2023.\n5\nProv. CG 27/2023.\n6\nProv. CG 27/2023.\n7\nProv. CG 27/2023.\n8\nProv. CG 27/2023.\n9\nProv. CG 27/2023.\n10\nProv. CG 27/2023.\n11\nProv. CG 27/2023.\nmandados (modelo próprio) e cópias das certidões do respectivo cumprimento,\nobservado o disposto no art. 1.042 destas Normas.\n§ 2º O ente fazendário deverá indicar um único endereço para o envio dos\nmapas, sendo vedada a imposição à Unidade Judicial ou Oficial de Justiça a triagem\npara envio a endereços diversos conforme a matéria tratada no mandado. 2\n§ 3º O pagamento pelo ente fazendário da soma do valor das diligências\ndeverá ocorrer em duas parcelas, 5% (cinco por cento) do valor total ao Fundo Especial\nde Despesas do Tribunal de Justiça - FEDTJ e os 95% (noventa e cinco por cento)\nrestantes ao Oficial de Justiça que deu cumprimento à diligência, cabendo ao ente\nadministrativo, nesta hipótese, o controle.\n§ 4º O ente fazendário terá vista dos mapas mensais. Eventuais\nimpugnações ofertadas pelo ente fazendário e acolhidas pelo Juízo serão compensadas\nno mapa posterior ou, não sendo possível, devolução direta pelo Oficial de Justiça, sob\npena de processo administrativo e inscrição em dívida ativa. 4\n§ 5º A comprovação do pagamento deverá ser comunicada à SADM ou\nOfício de Justiça, que deverá manter o arquivo pelo prazo de 2 (dois) anos, após o qual\npoderão ser inutilizados, aplicando-se, nesta hipótese, o disposto no § 2º do art. 74. As\ndúvidas serão apreciadas e decididas pelo Juiz Corregedor Permanente. 5\n§ 6º A aplicação do regime especial previsto neste artigo poderá ser\ncancelada em caso de descumprimento das normas do regime ou deliberação do Juiz\nCorregedor Permanente, a ser submetida à Corregedoria, hipótese em que somente\nserão expedidos mandados mediante a prévia comprovação da GRD no respectivo feito.\n6\n§ 7º No caso descrito no § 5º, o pagamento em atraso sofrerá multa\nmoratória de 0,33% ao dia, a ser pago juntamente com o principal em conta própria do\nTribunal de Justiça de São Paulo. 7"},"1050":{"topicId":"OJ26-LESP-NSCGJ-11","texto":"Art. 1.050. Nos mandados expedidos na Vara de Execução Fiscal da\nFazenda da Capital do Estado de São Paulo, serão aplicadas as seguintes regras: 8\nI - a Fazenda da Capital do Estado de São Paulo, após peticionar nos autos\ndo respectivo processo de execução fiscal solicitando a diligência, encaminhará no mês\nseguinte a relação de processos que deseja a efetiva expedição dos mandados,\nprovidenciando, desde logo, o depósito do valor equivalente; 9\nII - na hipótese do § 1º, a unidade providenciará a expedição dos mandados\naos processos constantes da relação para que sejam cumpridos, operando-se o\nressarcimento a partir do valor depositado na mesma forma dos mandados pagos; 10\nIII - ao deixar de indicar processos, a Fazenda da Capital do Estado de São\nPaulo explicitará sua desistência em relação ao pedido anteriormente formulado e\nconcordância com o arquivamento do feito, na forma do art. 40 da Lei 6.830/80,\nindependentemente de qualquer outra intimação; 11\nIV - após a devida conferência dos mapas, os pagamentos das cotas de\nressarcimento observarão as mesmas regras dos mandados pagos, observando,\nsempre, o limite do valor depositado para o respectivo ente. 12\n1\nProv. CG 03/2026.\n2\nProv. CG 27/2023.\n3\nProv. CG 03/2026.\n4\nProv. CG 27/2023.\n5\nProv. CG 27/2023.\n6\nProv. CG 27/2023.\n7\nProv. CG 27/2023.\n8\nProv. CG 27/2023.\n9\nProv. CG 27/2023.\n10\nProv. CG 27/2023.\n11\nProv. CG 27/2023.\n12\nProv. CG 27/2023.\n§ 1º A Fazenda da Capital do Estado de São Paulo terá vista dos mapas\nmensais. Eventuais impugnações ofertadas pela Fazenda da Capital do Estado de São\nPaulo e acolhidas pelo Juízo serão compensadas no mapa posterior ou, não sendo\npossível, devolução direta pelo Oficial de Justiça, sob pena de processo administrativo\ne inscrição em dívida ativa. 1\n§ 2º Sem prejuízo de demais encargos e cominações estabelecidas pela\nPresidência, a aplicação do regime especial previsto neste artigo poderá ser cancelada\nem caso de descumprimento das normas do regime ou deliberação do Juiz Corregedor\nPermanente, a ser submetida à Corregedoria, hipótese em que somente serão\nexpedidos mandados mediante a prévia comprovação da GRD no respectivo feito. 2"},"1051":{"topicId":"OJ26-LESP-NSCGJ-11","texto":"Art. 1.051. Em caso de mandado de interesse das Fazendas de outros\nEstados e de Municípios não localizados na Comarca em que tramitar o processo, será\nobservado, exclusivamente, o disposto nos art. 1.040 a 1.043. 3\nSubseção IV 4\nDo ressarcimento adicional 5"},"1052":{"topicId":"OJ26-LESP-NSCGJ-11","texto":"Art. 1.052. Além da cota do mandado, haverá ressarcimento adicional por\nlotes, dos valores do rateio, independentemente da quilometragem, distância, raio ou\nperímetro percorrido, nas seguintes hipóteses:\nI - mandados cumpridos, com deslocamento, em plantões ordinários,\nespeciais e extraordinários (art. 1.127, incs. I, II e III);\nII - mandados cumpridos, com deslocamento, em acumulação em Comarca\ndiversa, por Oficial de Justiça com designação vigente, por determinação da\nPresidência.\nIII – Suprimido.\nParágrafo único - O ressarcimento adicional não altera o valor da diligência\na ser pago pela parte ou interessado nos mandados pagos.\n§ 1º Suprimido;\n§ 2º Suprimido.\nI – Suprimido;\nII – Suprimido;\nIII – Suprimido;\nIV – Suprimido;\nV – Suprimido;\n1\nProv. CG 27/2023.\n2\nProv. CG 27/2023.\n3\nProv. CG 27/2023.\n4\nProv. CG 27/2023.\n5\nProv. CG 27/2023.\n6\nProv. CG 03/2026.\n7\nProv. CG 03/2026.\n8\nProv. CG 27/2023.\n9\nProv. CG 03/2026.\n10\nProv. CG 03/2026.\n11\nProv. CG 03/2026.\n12\nProv. CG 03/2026.\n13\nProv. CG 03/2026.\n14\nProv. CG 03/2026.\n15\nProv. CG 03/2026.\n16\nProv. CG 03/2026.\n17\nProv. CG 03/2026.\nVI – Suprimido;\nVII – Suprimido;\n§ 3º Suprimido."},"1053":{"topicId":"OJ26-LESP-NSCGJ-11","texto":"Art. 1.053. O lançamento do ressarcimento adicional de que trata o art. 1.052\ndeve ser feito somente no mapa de mandados gratuitos, de acordo com as seguintes\nregras:\nI – No mapa:\na) do plantão ordinário, especial ou extraordinário, em relação ao\nressarcimento adicional pelo cumprimento de mandados nos respectivos plantões,\nsendo vedado o lançamento da cota adicional na certidão do Oficial de Justiça;\nb) no mapa da SADM de destino, em relação ao ressarcimento adicional\npelo cumprimento de mandados em acumulação em Comarca diversa;\nc) Suprimido.\nII – Para o ressarcimento adicional se observará:\na) Nos plantões indicados (art. 1.052, I), o lançamento será por dia isolado\nde plantão, sendo 01 (uma) cota quando cumpridos até 05 (cinco) mandados e 02 (duas)\ncotas quando cumpridos 06 (seis) ou mais mandados, limitadas a 02 (duas) cotas\nadicionais por cada dia de plantão. Não haverá ressarcimento adicional para plantões\nregulares (dias úteis) e de Júri;\nb) Nas acumulações em Comarca diversa (art. 1.052, II), 01 (uma) cota\nadicional para cada grupo de 05 (cinco) mandados cumpridos no mês, com\narredondamento a maior para fração.\nIII - caso o Oficial de Justiça cumpra mandados em Unidades Judiciais\ndiversas na mesma Comarca, como por exemplo, Ofícios Judiciais de Varas e Juizados\nEspeciais nos locais em que não instaladas as SADMs, deve lançar em só um dos\nmapas o ressarcimento adicional, sujeito às penalidades em caso de mais de um\nlançamento no mesmo período;\n§1º Poderá o Juiz Corregedor da SADM, que receber o Oficial de Justiça\npara prestar serviços cumulativos:\nI - exigir a apresentação de outras informações e/ou documentos que\nentenda relevantes para análise do pedido ou a fim de facilitar o procedimento de\nconferência ao Chefe da Seção responsável e demais servidores, assim como propiciar\nmeios para fiscalização efetiva; 14\nII - escalar o Oficial de Justiça para participar de plantão, preferencialmente\nà distância, nos dias em que ocorra o efetivo deslocamento para cumprimento de\nmandados, nos termos do artigo 1.053 NSCGJ; se coincidir a escala com a Comarca de\norigem, esta terá preferência, devendo ser comunicada a incompatibilidade de data com\nantecedência mínima de 05 (cinco) dias ao Juiz Corregedor Permanente da SADM de\nacumulação.\n1\nProv. CG 03/2026.\n2\nProv. CG 03/2026.\n3\nProv. CG 03/2026.\n4\nProv. CG 03/2026.\n5\nProv. CG 03/2026.\n6\nProv. CG 03/2026.\n7\nProv. CG 03/2026.\n8\nProv. CG 03/2026.\n9\nProv. CG 03/2026.\n10\nProv. CG 03/2026.\n11\nProv. CG 03/2026.\n12\nProv. CG 27/2023.\n13\nProv. CG 03/2026.\n14\nProv. CG 03/2026.\n15\nProv. CG 03/2026.\nIII - Suprimido.\na) Suprimido;\nb) Suprimido.\n§ 2º A presente disciplina não se aplica a questões relativas a remoções,\ntransferências ou relotações de Oficiais de Justiça e administrativa da E. Presidência do\nTJSP.\n§ 3º Em caso de irregularidade em margeamentos e demais regras\nestabelecidas nesta subseção, a Corregedoria Permanente da Comarca de origem do\nOficial de Justiça deverá ser comunicada."},"1137":{"topicId":"OJ26-LESP-NSCGJ-12","texto":"Art. 1.137. Todos os documentos expedidos que devam ser cumpridos por\noficial de justiça serão registrados no módulo da central de mandados e devolvidos para\no cartório do plantão após seu cumprimento (carga e baixa). 4\n§ 1º Ressalvado prazo diferenciado fixado pelo juiz do feito, os mandados\ncumpridos que não forem devolvidos no mesmo dia serão entregues nas primeiras horas\ndo dia subsequente para regularização pelo responsável pelo plantão do dia da\ndevolução. 5\n§ 2º Os mandados cumpridos que não forem devolvidos durante o plantão\nserão entregues nas primeiras horas do dia útil subsequente para regularização pelo\nresponsável do plantão do dia da expedição. 6\n§ 3º O funcionário responsável pelo plantão deverá controlar e cobrar os\ndocumentos pendentes de devolução pelo oficial de justiça, repassando a informação\nao funcionário responsável pelo plantão do dia seguinte, se o caso. 7\n§ 4º Decorrido o prazo sem atendimento, o atraso será comunicado pelo\nresponsável do plantão ao Chefe da SADM do Foro onde atua o oficial de justiça, via\nmensagem eletrônica, que submeterá ao juiz corregedor permanente, em expediente\npróprio, para as providências cabíveis, tais como busca e apreensão e instauração de\nprocedimento disciplinar. Excepcionalmente, o magistrado responsável pelo plantão\ntambém poderá adotar as medidas cautelares administrativas que entender pertinentes.\n8"},"1138":{"topicId":"OJ26-LESP-NSCGJ-12","texto":"Art. 1.138. Os alvarás de soltura expedidos em véspera de plantão, quando\nnão for possível a confirmação do recebimento pela autoridade destinatária nos termos\ndo art. 410 destas Normas de Serviço, serão encaminhados em 2 (duas) vias ao\nresponsável pelo plantão, que passará recibo e fará o protocolo e anotação na relação\nde expedientes recebidos. 9\nParágrafo único. Os alvarás de soltura, assinados pelo juiz expedidor, serão\nencaminhados pelo juiz do plantão judiciário, à autoridade que os deve cumprir."},"1139":{"topicId":"OJ26-LESP-NSCGJ-12","texto":"Art. 1.139. Os alvarás de soltura serão entregues em 2 (duas) vias ao oficial\nde justiça de plantão que os encaminhará ao estabelecimento prisional ou ao distrito\npolicial para cumprimento. 10\nParágrafo único. Os alvarás de soltura que não tenham sido expedidos pelos\nplantonistas deverão ser relacionados, consignando-se tal ocorrência e o nome do oficial\nde justiça responsável pelo seu encaminhamento.\n1\nProv. CG 28/2019.\n2\nProv. CG 28/2019.\n3\nProv. CG 28/2019.\n4\nProv. CG 28/2019.\n5\nProv. CG 28/2019.\n6\nProv. CG 28/2019.\n7\nProv. CG 28/2019.\n8\nProv. CSM 2731/2023.\n9\nProv. CG 28/2019.\n10\nProv. CG 28/2019.\n11\nProv. CG 47/2015."},"1245":{"topicId":"OJ26-LESP-NSCGJ-13","texto":"Art. 1.245. Nos processos eletrônicos, as cartas e os mandados de citação\nconterão senha que viabilize o acesso à íntegra dos autos digitais pela internet.\n§ 1º Não dispondo a Lei ou estas Normas de Serviço de modo diverso, a\ncitação, a intimação e a notificação pelo Correio serão efetuadas por meio da Carta AR\nDigital Unipaginada.\n§ 2º É vedado, salvo determinação judicial em sentido contrário, o\nencaminhamento de cópia da petição inicial em papel, cabendo ao ofício de justiça sua\nimpressão, mediante o recolhimento, quando o caso, do valor referente ao custo de\nreprodução da peça processual.\n§ 3º Tratando-se de processos criminais ou de apuração de ato infracional,\no mandado de citação deverá ser instruído com cópia, respectivamente, da denúncia\nou representação.\n§ 4º Nas hipóteses de cumprimento remoto de ordens judiciais de\ncomunicações em geral, como citação, intimação ou notificação, para Unidades\nPrisionais ou de Internação, poderá o Juiz do feito, a seu critério, dispensar a expedição\nde mandado para que a ordem judicial seja cumprida diretamente pelo Ofício Judicial,\ncertificados os atos por serventuário com fé pública."},"1247":{"topicId":"OJ26-LESP-NSCGJ-13","texto":"Art. 1.247. Na impossibilidade do uso do meio eletrônico, a citação,\nintimação, notificação e atos cartorários urgentes serão praticados segundo os meios\nordinários."},"436-A":{"topicId":"OJ26-LESP-NSCGJ-09","texto":"Art. 436-A. Havendo disponibilidade de equipamentos eletrônicos e de\nfuncionários aptos a operá-los, tanto nas dependências dos fóruns do Estado de São\nPaulo, como nas unidades prisionais, a citação e a intimação de réu preso deverá ser\nrealizada por videoconferência, observados os arts. 122, § 3º e 1.029 destas NSCGJ.\nParágrafo único. Na citação e intimação por videoconferência deverão ser\nrigorosamente observadas as formalidades previstas no Código de Processo Penal,\nbem como nas Normas de Serviço da Corregedoria Geral da Justiça para a confecção,\ndistribuição e cumprimento dos mandados.\n§2º - Revogado.\nSeção XIV\nDas Intimações"},"440-A":{"topicId":"OJ26-LESP-NSCGJ-10","texto":"Art. 440-A. A ofendida deverá ser imediatamente comunicada da decisão\nque deferir ou indeferir pedido de prisão cautelar ou de imposição de medida protetiva\nde urgência, bem como da alteração da natureza da prisão e do ingresso e saída do\nagressor do estabelecimento prisional, facultada a utilização do procedimento previsto\n1\nProvs. CGJ 14/93 e 2/2001.\n2\nProv. CSM 875/04, Prot. CG 32.952/04 e Prov. CGJ 11/2009.\n3\nProv. CGJ 11/2009.\n4\nProv. CGJ 11/2009.\n5\nProv. CG 33/2024.\n6\nProv. CGJ 5/2000.\n7\nProv. CGJ 15/86.\n8\nCPP, art. 353.\n9\nRes. CNJ 108/2010.\n10\nProv. CGJ 32/2000.\n11\nProv. CGJ 32/2000.\nno art. 1.245, §4º, NSCGJ.\nParágrafo único: Permite-se a intimação da vítima por meio de telefone fixo,\ncelular, WhatsApp ou e-mail, desde que haja anuência daquela, no momento da\nlavratura do boletim de ocorrência ou da apresentação do requerimento, com o\nfornecimento dos dados necessários, garantido seu absoluto sigilo; no mesmo ato a\nvítima será informada dos canais adequados e disponíveis para a comunicação do\ndescumprimento das medidas protetivas de urgência.\nSeção XV\nDas Cartas Precatórias"},"1026-A":{"topicId":"OJ26-LESP-NSCGJ-11","texto":"Art. 1.026-A. Suprimido."},"1029-A":{"topicId":"OJ26-LESP-NSCGJ-11","texto":"Art. 1.029-A. - No cumprimento remoto de mandados em unidades prisionais\nou de internação, o Oficial de Justiça registrará o ato por meio de captura de tela.\n§ 1º - A captura de tela com registro do ato deverá ser inserida nos autos\npelo Oficial de Justiça, juntamente com a certidão do cumprimento do mandado, sendo\ndispensada a juntada do documento assinado pela pessoa custodiada ou adolescente\ninternado.\n§ 2º - A via assinada pela pessoa destinatária permanecerá arquivada em\nseu prontuário na unidade prisional ou de internação, para disponibilização em caso de\neventual requisição pela autoridade judiciária.\n§ 3º - Na hipótese de o ato ter sido cumprido em relação à pessoa presa, o\ntempo de guarda do documento referido no parágrafo anterior obedecerá ao disposto\nna Resolução SAP nº 89, de 11 de julho de 2017, e na Resolução SAP nº 104, de 22 de\njulho de 2019, observadas eventuais normas que venham a substituí-las.\n1\nProv. CG 27/2023.\n2\nProv. CG 27/2023.\n3\nProv. CG 27/2023.\n4\nProv. CG 27/2023.\n5\nProv. CG 27/2026.\n6\nProv. CG 11/2024.\n7\nProv. CG 27/2023.\n8\nProv. CG 27/2023.\n9\nProv. CG 26/2026.\n10\nProv. CG 26/2026.\n11\nProv. CG 26/2026.\n12\nProv. CG 26/2026.\n§ 4º - Na hipótese de o ato ter sido cumprido em relação à adolescente\ninternado, o tempo de guarda do documento referido no § 2º deste artigo obedecerá ao\ndisposto no Comunicado ATI CADA nº 001/2025, da Comissão de Avaliação de\nDocumentos e Acesso da Fundação CASA, e nas Portarias Normativas nº 454/2024 e\nnº 471/2024, da Presidência da Fundação CASA, observadas eventuais normas que\nvenham a substituí-las."}}},"senado-cc-2002":{"id":"DIR-DCIV-CC","concordancia":true,"nome":"Código Civil","rotulo":"do Código Civil (Lei 10.406/2002)","titulo":"Direito: Código Civil","disciplina":"DCIV","url":"https://normas.leg.br/api/public/normas?urn=urn:lex:br:federal:lei:2002-01-10;10406&&tipo_documento=maior-detalhe","consultado_em":"2026-11-21","sha256":"7c86657111d2b5af13a4645bd0443c65e3d59b8e3dbad63abd191ab8a85c9ac1","observacao":"Texto consolidado do Senado reconstruído na data de referência do edital (14/10/2026). A própria fonte informa atualização até 2024-06-28: alterações posteriores a essa data podem não constar.","artigos":{"1":{"topicId":"OJ26-DCIV-CC-01","texto":"Art. 1º Toda pessoa é capaz de direitos e deveres na ordem civil."},"2":{"topicId":"OJ26-DCIV-CC-01","texto":"Art. 2º A personalidade civil da pessoa começa do nascimento com vida; mas a lei põe a salvo, desde a concepção, os direitos do nascituro."},"3":{"topicId":"OJ26-DCIV-CC-01","texto":"Art. 3º São absolutamente incapazes de exercer pessoalmente os atos da vida civil os menores de 16 (dezesseis) anos."},"4":{"topicId":"OJ26-DCIV-CC-01","texto":"Art. 4º São incapazes, relativamente a certos atos ou à maneira de os exercer:\nI - os maiores de dezesseis e menores de dezoito anos;\nII - os ébrios habituais e os viciados em tóxico;\nIII - aqueles que, por causa transitória ou permanente, não puderem exprimir sua vontade;\nIV - os pródigos.\nParágrafo único. A capacidade dos indígenas será regulada por legislação especial."},"5":{"topicId":"OJ26-DCIV-CC-01","texto":"Art. 5º A menoridade cessa aos dezoito anos completos, quando a pessoa fica habilitada à prática de todos os atos da vida civil.\nParágrafo único. Cessará, para os menores, a incapacidade:\nI - pela concessão dos pais, ou de um deles na falta do outro, mediante instrumento público, independentemente de homologação judicial, ou por sentença do juiz, ouvido o tutor, se o menor tiver dezesseis anos completos;\nII - pelo casamento;\nIII - pelo exercício de emprego público efetivo;\nIV - pela colação de grau em curso de ensino superior;\nV - pelo estabelecimento civil ou comercial, ou pela existência de relação de emprego, desde que, em função deles, o menor com dezesseis anos completos tenha economia própria."},"6":{"topicId":"OJ26-DCIV-CC-01","texto":"Art. 6º A existência da pessoa natural termina com a morte; presume-se esta, quanto aos ausentes, nos casos em que a lei autoriza a abertura de sucessão definitiva."},"7":{"topicId":"OJ26-DCIV-CC-01","texto":"Art. 7º Pode ser declarada a morte presumida, sem decretação de ausência:\nI - se for extremamente provável a morte de quem estava em perigo de vida;\nII - se alguém, desaparecido em campanha ou feito prisioneiro, não for encontrado até dois anos após o término da guerra.\nParágrafo único. A declaração da morte presumida, nesses casos, somente poderá ser requerida depois de esgotadas as buscas e averiguações, devendo a sentença fixar a data provável do falecimento."},"8":{"topicId":"OJ26-DCIV-CC-01","texto":"Art. 8º Se dois ou mais indivíduos falecerem na mesma ocasião, não se podendo averiguar se algum dos comorientes precedeu aos outros, presumir-se-ão simultaneamente mortos."},"9":{"topicId":"OJ26-DCIV-CC-01","texto":"Art. 9º Serão registrados em registro público:\nI - os nascimentos, casamentos e óbitos;\nII - a emancipação por outorga dos pais ou por sentença do juiz;\nIII - a interdição por incapacidade absoluta ou relativa;\nIV - a sentença declaratória de ausência e de morte presumida."},"10":{"topicId":"OJ26-DCIV-CC-01","texto":"Art. 10. Far-se-á averbação em registro público:\nI - das sentenças que decretarem a nulidade ou anulação do casamento, o divórcio, a separação judicial e o restabelecimento da sociedade conjugal;\nII - dos atos judiciais ou extrajudiciais que declararem ou reconhecerem a filiação;"},"11":{"topicId":"OJ26-DCIV-CC-01","texto":"Art. 11. Com exceção dos casos previstos em lei, os direitos da personalidade são intransmissíveis e irrenunciáveis, não podendo o seu exercício sofrer limitação voluntária."},"12":{"topicId":"OJ26-DCIV-CC-01","texto":"Art. 12. Pode-se exigir que cesse a ameaça, ou a lesão, a direito da personalidade, e reclamar perdas e danos, sem prejuízo de outras sanções previstas em lei.\nParágrafo único. Em se tratando de morto, terá legitimação para requerer a medida prevista neste artigo o cônjuge sobrevivente, ou qualquer parente em linha reta, ou colateral até o quarto grau."},"13":{"topicId":"OJ26-DCIV-CC-01","texto":"Art. 13. Salvo por exigência médica, é defeso o ato de disposição do próprio corpo, quando importar diminuição permanente da integridade física, ou contrariar os bons costumes.\nParágrafo único. O ato previsto neste artigo será admitido para fins de transplante, na forma estabelecida em lei especial."},"14":{"topicId":"OJ26-DCIV-CC-01","texto":"Art. 14. É válida, com objetivo científico, ou altruístico, a disposição gratuita do próprio corpo, no todo ou em parte, para depois da morte.\nParágrafo único. O ato de disposição pode ser livremente revogado a qualquer tempo."},"15":{"topicId":"OJ26-DCIV-CC-01","texto":"Art. 15. Ninguém pode ser constrangido a submeter-se, com risco de vida, a tratamento médico ou a intervenção cirúrgica."},"16":{"topicId":"OJ26-DCIV-CC-01","texto":"Art. 16. Toda pessoa tem direito ao nome, nele compreendidos o prenome e o sobrenome."},"17":{"topicId":"OJ26-DCIV-CC-01","texto":"Art. 17. O nome da pessoa não pode ser empregado por outrem em publicações ou representações que a exponham ao desprezo público, ainda quando não haja intenção difamatória."},"18":{"topicId":"OJ26-DCIV-CC-01","texto":"Art. 18. Sem autorização, não se pode usar o nome alheio em propaganda comercial."},"19":{"topicId":"OJ26-DCIV-CC-01","texto":"Art. 19. O pseudônimo adotado para atividades lícitas goza da proteção que se dá ao nome."},"20":{"topicId":"OJ26-DCIV-CC-01","texto":"Art. 20.\nParágrafo único. Em se tratando de morto ou de ausente, são partes legítimas para requerer essa proteção o cônjuge, os ascendentes ou os descendentes."},"22":{"topicId":"OJ26-DCIV-CC-01","texto":"Art. 22. Desaparecendo uma pessoa do seu domicílio sem dela haver notícia, se não houver deixado representante ou procurador a quem caiba administrar-lhe os bens, o juiz, a requerimento de qualquer interessado ou do Ministério Público, declarará a ausência, e nomear-lhe-á curador."},"23":{"topicId":"OJ26-DCIV-CC-01","texto":"Art. 23. Também se declarará a ausência, e se nomeará curador, quando o ausente deixar mandatário que não queira ou não possa exercer ou continuar o mandato, ou se os seus poderes forem insuficientes."},"24":{"topicId":"OJ26-DCIV-CC-01","texto":"Art. 24. O juiz, que nomear o curador, fixar-lhe-á os poderes e obrigações, conforme as circunstâncias, observando, no que for aplicável, o disposto a respeito dos tutores e curadores."},"25":{"topicId":"OJ26-DCIV-CC-01","texto":"Art. 25. O cônjuge do ausente, sempre que não esteja separado judicialmente, ou de fato por mais de dois anos antes da declaração da ausência, será o seu legítimo curador.\n§ 1º Em falta do cônjuge, a curadoria dos bens do ausente incumbe aos pais ou aos descendentes, nesta ordem, não havendo impedimento que os iniba de exercer o cargo.\n§ 2º Entre os descendentes, os mais próximos precedem os mais remotos.\n§ 3º Na falta das pessoas mencionadas, compete ao juiz a escolha do curador."},"40":{"topicId":"OJ26-DCIV-CC-02","texto":"Art. 40. As pessoas jurídicas são de direito público, interno ou externo, e de direito privado."},"41":{"topicId":"OJ26-DCIV-CC-02","texto":"Art. 41. São pessoas jurídicas de direito público interno:\nI - a União;\nII - os Estados, o Distrito Federal e os Territórios;\nIII - os Municípios;\nIV - as autarquias, inclusive as associações públicas;\nV - as demais entidades de caráter público criadas por lei.\nParágrafo único. Salvo disposição em contrário, as pessoas jurídicas de direito público, a que se tenha dado estrutura de direito privado, regem-se, no que couber, quanto ao seu funcionamento, pelas normas deste Código."},"42":{"topicId":"OJ26-DCIV-CC-02","texto":"Art. 42. São pessoas jurídicas de direito público externo os Estados estrangeiros e todas as pessoas que forem regidas pelo direito internacional público."},"43":{"topicId":"OJ26-DCIV-CC-02","texto":"Art. 43. As pessoas jurídicas de direito público interno são civilmente responsáveis por atos dos seus agentes que nessa qualidade causem danos a terceiros, ressalvado direito regressivo contra os causadores do dano, se houver, por parte destes, culpa ou dolo."},"45":{"topicId":"OJ26-DCIV-CC-02","texto":"Art. 45. Começa a existência legal das pessoas jurídicas de direito privado com a inscrição do ato constitutivo no respectivo registro, precedida, quando necessário, de autorização ou aprovação do Poder Executivo, averbando-se no registro todas as alterações por que passar o ato constitutivo.\nParágrafo único. Decai em três anos o direito de anular a constituição das pessoas jurídicas de direito privado, por defeito do ato respectivo, contado o prazo da publicação de sua inscrição no registro."},"49":{"topicId":"OJ26-DCIV-CC-03","texto":"Art. 49. Se a administração da pessoa jurídica vier a faltar, o juiz, a requerimento de qualquer interessado, nomear-lhe-á administrador provisório."},"50":{"topicId":"OJ26-DCIV-CC-03","texto":"Art. 50. Em caso de abuso da personalidade jurídica, caracterizado pelo desvio de finalidade ou pela confusão patrimonial, pode o juiz, a requerimento da parte, ou do Ministério Público quando lhe couber intervir no processo, desconsiderá-la para que os efeitos de certas e determinadas relações de obrigações sejam estendidos aos bens particulares de administradores ou de sócios da pessoa jurídica beneficiados direta ou indiretamente pelo abuso.\n§ 1º Para os fins do disposto neste artigo, desvio de finalidade é a utilização da pessoa jurídica com o propósito de lesar credores e para a prática de atos ilícitos de qualquer natureza.\n§ 2º Entende-se por confusão patrimonial a ausência de separação de fato entre os patrimônios, caracterizada por:\nI - cumprimento repetitivo pela sociedade de obrigações do sócio ou do administrador ou vice-versa;\nII - transferência de ativos ou de passivos sem efetivas contraprestações, exceto os de valor proporcionalmente insignificante; e\nIII - outros atos de descumprimento da autonomia patrimonial.\n§ 3º O disposto no caput e nos §§ 1º e 2º deste artigo também se aplica à extensão das obrigações de sócios ou de administradores à pessoa jurídica.\n§ 4º A mera existência de grupo econômico sem a presença dos requisitos de que trata o caput deste artigo não autoriza a desconsideração da personalidade da pessoa jurídica.\n§ 5º Não constitui desvio de finalidade a mera expansão ou a alteração da finalidade original da atividade econômica específica da pessoa jurídica."},"53":{"topicId":"OJ26-DCIV-CC-04","texto":"Art. 53. Constituem-se as associações pela união de pessoas que se organizem para fins não econômicos.\nParágrafo único. Não há, entre os associados, direitos e obrigações recíprocos."},"62":{"topicId":"OJ26-DCIV-CC-05","texto":"Art. 62. Para criar uma fundação, o seu instituidor fará, por escritura pública ou testamento, dotação especial de bens livres, especificando o fim a que se destina, e declarando, se quiser, a maneira de administrá-la.\nParágrafo único. A fundação somente poderá constituir-se para fins de:\nI - assistência social;\nII - cultura, defesa e conservação do patrimônio histórico e artístico;\nIII - educação;\nIV - saúde;\nV - segurança alimentar e nutricional;\nVI - defesa, preservação e conservação do meio ambiente e promoção do desenvolvimento sustentável;\nVII - pesquisa científica, desenvolvimento de tecnologias alternativas, modernização de sistemas de gestão, produção e divulgação de informações e conhecimentos técnicos e científicos;\nVIII - promoção da ética, da cidadania, da democracia e dos direitos humanos;\nIX - atividades religiosas; e\nX - (VETADO)."},"70":{"topicId":"OJ26-DCIV-CC-06","texto":"Art. 70. O domicílio da pessoa natural é o lugar onde ela estabelece a sua residência com ânimo definitivo."},"71":{"topicId":"OJ26-DCIV-CC-06","texto":"Art. 71. Se, porém, a pessoa natural tiver diversas residências, onde, alternadamente, viva, considerar-se-á domicílio seu qualquer delas."},"72":{"topicId":"OJ26-DCIV-CC-06","texto":"Art. 72. É também domicílio da pessoa natural, quanto às relações concernentes à profissão, o lugar onde esta é exercida.\nParágrafo único. Se a pessoa exercitar profissão em lugares diversos, cada um deles constituirá domicílio para as relações que lhe corresponderem."},"73":{"topicId":"OJ26-DCIV-CC-06","texto":"Art. 73. Ter-se-á por domicílio da pessoa natural, que não tenha residência habitual, o lugar onde for encontrada."},"74":{"topicId":"OJ26-DCIV-CC-06","texto":"Art. 74. Muda-se o domicílio, transferindo a residência, com a intenção manifesta de o mudar.\nParágrafo único. A prova da intenção resultará do que declarar a pessoa às municipalidades dos lugares, que deixa, e para onde vai, ou, se tais declarações não fizer, da própria mudança, com as circunstâncias que a acompanharem."},"75":{"topicId":"OJ26-DCIV-CC-06","texto":"Art. 75. Quanto às pessoas jurídicas, o domicílio é:\nI - da União, o Distrito Federal;\nII - dos Estados e Territórios, as respectivas capitais;\nIII - do Município, o lugar onde funcione a administração municipal;\nIV - das demais pessoas jurídicas, o lugar onde funcionarem as respectivas diretorias e administrações, ou onde elegerem domicílio especial no seu estatuto ou atos constitutivos.\n§ 1º Tendo a pessoa jurídica diversos estabelecimentos em lugares diferentes, cada um deles será considerado domicílio para os atos nele praticados.\n§ 2º Se a administração, ou diretoria, tiver a sede no estrangeiro, haver-se-á por domicílio da pessoa jurídica, no tocante às obrigações contraídas por cada uma das suas agências, o lugar do estabelecimento, sito no Brasil, a que ela corresponder."},"76":{"topicId":"OJ26-DCIV-CC-06","texto":"Art. 76. Têm domicílio necessário o incapaz, o servidor público, o militar, o marítimo e o preso.\nParágrafo único. O domicílio do incapaz é o do seu representante ou assistente; o do servidor público, o lugar em que exercer permanentemente suas funções; o do militar, onde servir, e, sendo da Marinha ou da Aeronáutica, a sede do comando a que se encontrar imediatamente subordinado; o do marítimo, onde o navio estiver matriculado; e o do preso, o lugar em que cumprir a sentença."},"77":{"topicId":"OJ26-DCIV-CC-06","texto":"Art. 77. O agente diplomático do Brasil, que, citado no estrangeiro, alegar extraterritorialidade sem designar onde tem, no país, o seu domicílio, poderá ser demandado no Distrito Federal ou no último ponto do território brasileiro onde o teve."},"78":{"topicId":"OJ26-DCIV-CC-06","texto":"Art. 78. Nos contratos escritos, poderão os contratantes especificar domicílio onde se exercitem e cumpram os direitos e obrigações deles resultantes."},"79":{"topicId":"OJ26-DCIV-CC-06","texto":"Art. 79. São bens imóveis o solo e tudo quanto se lhe incorporar natural ou artificialmente."},"80":{"topicId":"OJ26-DCIV-CC-06","texto":"Art. 80. Consideram-se imóveis para os efeitos legais:\nI - os direitos reais sobre imóveis e as ações que os asseguram;\nII - o direito à sucessão aberta."},"81":{"topicId":"OJ26-DCIV-CC-06","texto":"Art. 81. Não perdem o caráter de imóveis:\nI - as edificações que, separadas do solo, mas conservando a sua unidade, forem removidas para outro local;\nII - os materiais provisoriamente separados de um prédio, para nele se reempregarem."},"82":{"topicId":"OJ26-DCIV-CC-06","texto":"Art. 82. São móveis os bens suscetíveis de movimento próprio, ou de remoção por força alheia, sem alteração da substância ou da destinação econômico-social."},"83":{"topicId":"OJ26-DCIV-CC-06","texto":"Art. 83. Consideram-se móveis para os efeitos legais:\nI - as energias que tenham valor econômico;\nII - os direitos reais sobre objetos móveis e as ações correspondentes;\nIII - os direitos pessoais de caráter patrimonial e respectivas ações."},"84":{"topicId":"OJ26-DCIV-CC-06","texto":"Art. 84. Os materiais destinados a alguma construção, enquanto não forem empregados, conservam sua qualidade de móveis; readquirem essa qualidade os provenientes da demolição de algum prédio."},"85":{"topicId":"OJ26-DCIV-CC-06","texto":"Art. 85. São fungíveis os móveis que podem substituir-se por outros da mesma espécie, qualidade e quantidade."},"86":{"topicId":"OJ26-DCIV-CC-06","texto":"Art. 86. São consumíveis os bens móveis cujo uso importa destruição imediata da própria substância, sendo também considerados tais os destinados à alienação."},"87":{"topicId":"OJ26-DCIV-CC-06","texto":"Art. 87. Bens divisíveis são os que se podem fracionar sem alteração na sua substância, diminuição considerável de valor, ou prejuízo do uso a que se destinam."},"88":{"topicId":"OJ26-DCIV-CC-06","texto":"Art. 88. Os bens naturalmente divisíveis podem tornar-se indivisíveis por determinação da lei ou por vontade das partes."},"89":{"topicId":"OJ26-DCIV-CC-06","texto":"Art. 89. São singulares os bens que, embora reunidos, se consideram de per si, independentemente dos demais."},"90":{"topicId":"OJ26-DCIV-CC-06","texto":"Art. 90. Constitui universalidade de fato a pluralidade de bens singulares que, pertinentes à mesma pessoa, tenham destinação unitária.\nParágrafo único. Os bens que formam essa universalidade podem ser objeto de relações jurídicas próprias."},"91":{"topicId":"OJ26-DCIV-CC-06","texto":"Art. 91. Constitui universalidade de direito o complexo de relações jurídicas, de uma pessoa, dotadas de valor econômico."},"92":{"topicId":"OJ26-DCIV-CC-06","texto":"Art. 92. Principal é o bem que existe sobre si, abstrata ou concretamente; acessório, aquele cuja existência supõe a do principal."},"93":{"topicId":"OJ26-DCIV-CC-06","texto":"Art. 93. São pertenças os bens que, não constituindo partes integrantes, se destinam, de modo duradouro, ao uso, ao serviço ou ao aformoseamento de outro."},"94":{"topicId":"OJ26-DCIV-CC-06","texto":"Art. 94. Os negócios jurídicos que dizem respeito ao bem principal não abrangem as pertenças, salvo se o contrário resultar da lei, da manifestação de vontade, ou das circunstâncias do caso."},"95":{"topicId":"OJ26-DCIV-CC-06","texto":"Art. 95. Apesar de ainda não separados do bem principal, os frutos e produtos podem ser objeto de negócio jurídico."},"96":{"topicId":"OJ26-DCIV-CC-06","texto":"Art. 96. As benfeitorias podem ser voluptuárias, úteis ou necessárias.\n§ 1º São voluptuárias as de mero deleite ou recreio, que não aumentam o uso habitual do bem, ainda que o tornem mais agradável ou sejam de elevado valor.\n§ 2º São úteis as que aumentam ou facilitam o uso do bem.\n§ 3º São necessárias as que têm por fim conservar o bem ou evitar que se deteriore."},"97":{"topicId":"OJ26-DCIV-CC-06","texto":"Art. 97. Não se consideram benfeitorias os melhoramentos ou acréscimos sobrevindos ao bem sem a intervenção do proprietário, possuidor ou detentor."},"98":{"topicId":"OJ26-DCIV-CC-06","texto":"Art. 98. São públicos os bens do domínio nacional pertencentes às pessoas jurídicas de direito público interno; todos os outros são particulares, seja qual for a pessoa a que pertencerem."},"99":{"topicId":"OJ26-DCIV-CC-06","texto":"Art. 99. São bens públicos:\nI - os de uso comum do povo, tais como rios, mares, estradas, ruas e praças;\nII - os de uso especial, tais como edifícios ou terrenos destinados a serviço ou estabelecimento da administração federal, estadual, territorial ou municipal, inclusive os de suas autarquias;\nIII - os dominicais, que constituem o patrimônio das pessoas jurídicas de direito público, como objeto de direito pessoal, ou real, de cada uma dessas entidades.\nParágrafo único. Não dispondo a lei em contrário, consideram-se dominicais os bens pertencentes às pessoas jurídicas de direito público a que se tenha dado estrutura de direito privado."},"100":{"topicId":"OJ26-DCIV-CC-06","texto":"Art. 100. Os bens públicos de uso comum do povo e os de uso especial são inalienáveis, enquanto conservarem a sua qualificação, na forma que a lei determinar."},"101":{"topicId":"OJ26-DCIV-CC-06","texto":"Art. 101. Os bens públicos dominicais podem ser alienados, observadas as exigências da lei."},"102":{"topicId":"OJ26-DCIV-CC-06","texto":"Art. 102. Os bens públicos não estão sujeitos a usucapião."},"103":{"topicId":"OJ26-DCIV-CC-06","texto":"Art. 103. O uso comum dos bens públicos pode ser gratuito ou retribuído, conforme for estabelecido legalmente pela entidade a cuja administração pertencerem."},"115":{"topicId":"OJ26-DCIV-CC-07","texto":"Art. 115. Os poderes de representação conferem-se por lei ou pelo interessado."},"116":{"topicId":"OJ26-DCIV-CC-07","texto":"Art. 116. A manifestação de vontade pelo representante, nos limites de seus poderes, produz efeitos em relação ao representado."},"117":{"topicId":"OJ26-DCIV-CC-07","texto":"Art. 117. Salvo se o permitir a lei ou o representado, é anulável o negócio jurídico que o representante, no seu interesse ou por conta de outrem, celebrar consigo mesmo.\nParágrafo único. Para esse efeito, tem-se como celebrado pelo representante o negócio realizado por aquele em quem os poderes houverem sido subestabelecidos."},"118":{"topicId":"OJ26-DCIV-CC-07","texto":"Art. 118. O representante é obrigado a provar às pessoas, com quem tratar em nome do representado, a sua qualidade e a extensão de seus poderes, sob pena de, não o fazendo, responder pelos atos que a estes excederem."},"119":{"topicId":"OJ26-DCIV-CC-07","texto":"Art. 119. É anulável o negócio concluído pelo representante em conflito de interesses com o representado, se tal fato era ou devia ser do conhecimento de quem com aquele tratou.\nParágrafo único. É de cento e oitenta dias, a contar da conclusão do negócio ou da cessação da incapacidade, o prazo de decadência para pleitear-se a anulação prevista neste artigo."},"120":{"topicId":"OJ26-DCIV-CC-07","texto":"Art. 120. Os requisitos e os efeitos da representação legal são os estabelecidos nas normas respectivas; os da representação voluntária são os da Parte Especial deste Código."},"138":{"topicId":"OJ26-DCIV-CC-08","texto":"Art. 138. São anuláveis os negócios jurídicos, quando as declarações de vontade emanarem de erro substancial que poderia ser percebido por pessoa de diligência normal, em face das circunstâncias do negócio."},"139":{"topicId":"OJ26-DCIV-CC-08","texto":"Art. 139. O erro é substancial quando:\nI - interessa à natureza do negócio, ao objeto principal da declaração, ou a alguma das qualidades a ele essenciais;\nII - concerne à identidade ou à qualidade essencial da pessoa a quem se refira a declaração de vontade, desde que tenha influído nesta de modo relevante;\nIII - sendo de direito e não implicando recusa à aplicação da lei, for o motivo único ou principal do negócio jurídico."},"140":{"topicId":"OJ26-DCIV-CC-08","texto":"Art. 140. O falso motivo só vicia a declaração de vontade quando expresso como razão determinante."},"141":{"topicId":"OJ26-DCIV-CC-08","texto":"Art. 141. A transmissão errônea da vontade por meios interpostos é anulável nos mesmos casos em que o é a declaração direta."},"142":{"topicId":"OJ26-DCIV-CC-08","texto":"Art. 142. O erro de indicação da pessoa ou da coisa, a que se referir a declaração de vontade, não viciará o negócio quando, por seu contexto e pelas circunstâncias, se puder identificar a coisa ou pessoa cogitada."},"143":{"topicId":"OJ26-DCIV-CC-08","texto":"Art. 143. O erro de cálculo apenas autoriza a retificação da declaração de vontade."},"144":{"topicId":"OJ26-DCIV-CC-08","texto":"Art. 144. O erro não prejudica a validade do negócio jurídico quando a pessoa, a quem a manifestação de vontade se dirige, se oferecer para executá-la na conformidade da vontade real do manifestante."},"145":{"topicId":"OJ26-DCIV-CC-08","texto":"Art. 145. São os negócios jurídicos anuláveis por dolo, quando este for a sua causa."},"146":{"topicId":"OJ26-DCIV-CC-08","texto":"Art. 146. O dolo acidental só obriga à satisfação das perdas e danos, e é acidental quando, a seu despeito, o negócio seria realizado, embora por outro modo."},"147":{"topicId":"OJ26-DCIV-CC-08","texto":"Art. 147. Nos negócios jurídicos bilaterais, o silêncio intencional de uma das partes a respeito de fato ou qualidade que a outra parte haja ignorado, constitui omissão dolosa, provando-se que sem ela o negócio não se teria celebrado."},"148":{"topicId":"OJ26-DCIV-CC-08","texto":"Art. 148. Pode também ser anulado o negócio jurídico por dolo de terceiro, se a parte a quem aproveite dele tivesse ou devesse ter conhecimento; em caso contrário, ainda que subsista o negócio jurídico, o terceiro responderá por todas as perdas e danos da parte a quem ludibriou."},"149":{"topicId":"OJ26-DCIV-CC-08","texto":"Art. 149. O dolo do representante legal de uma das partes só obriga o representado a responder civilmente até a importância do proveito que teve; se, porém, o dolo for do representante convencional, o representado responderá solidariamente com ele por perdas e danos."},"150":{"topicId":"OJ26-DCIV-CC-08","texto":"Art. 150. Se ambas as partes procederem com dolo, nenhuma pode alegá-lo para anular o negócio, ou reclamar indenização."},"151":{"topicId":"OJ26-DCIV-CC-08","texto":"Art. 151. A coação, para viciar a declaração da vontade, há de ser tal que incuta ao paciente fundado temor de dano iminente e considerável à sua pessoa, à sua família, ou aos seus bens.\nParágrafo único. Se disser respeito a pessoa não pertencente à família do paciente, o juiz, com base nas circunstâncias, decidirá se houve coação."},"152":{"topicId":"OJ26-DCIV-CC-08","texto":"Art. 152. No apreciar a coação, ter-se-ão em conta o sexo, a idade, a condição, a saúde, o temperamento do paciente e todas as demais circunstâncias que possam influir na gravidade dela."},"153":{"topicId":"OJ26-DCIV-CC-08","texto":"Art. 153. Não se considera coação a ameaça do exercício normal de um direito, nem o simples temor reverencial."},"154":{"topicId":"OJ26-DCIV-CC-08","texto":"Art. 154. Vicia o negócio jurídico a coação exercida por terceiro, se dela tivesse ou devesse ter conhecimento a parte a que aproveite, e esta responderá solidariamente com aquele por perdas e danos."},"155":{"topicId":"OJ26-DCIV-CC-08","texto":"Art. 155. Subsistirá o negócio jurídico, se a coação decorrer de terceiro, sem que a parte a que aproveite dela tivesse ou devesse ter conhecimento; mas o autor da coação responderá por todas as perdas e danos que houver causado ao coacto."},"156":{"topicId":"OJ26-DCIV-CC-08","texto":"Art. 156. Configura-se o estado de perigo quando alguém, premido da necessidade de salvar-se, ou a pessoa de sua família, de grave dano conhecido pela outra parte, assume obrigação excessivamente onerosa.\nParágrafo único. Tratando-se de pessoa não pertencente à família do declarante, o juiz decidirá segundo as circunstâncias."},"157":{"topicId":"OJ26-DCIV-CC-08","texto":"Art. 157. Ocorre a lesão quando uma pessoa, sob premente necessidade, ou por inexperiência, se obriga a prestação manifestamente desproporcional ao valor da prestação oposta.\n§ 1º Aprecia-se a desproporção das prestações segundo os valores vigentes ao tempo em que foi celebrado o negócio jurídico.\n§ 2º Não se decretará a anulação do negócio, se for oferecido suplemento suficiente, ou se a parte favorecida concordar com a redução do proveito."},"158":{"topicId":"OJ26-DCIV-CC-08","texto":"Art. 158. Os negócios de transmissão gratuita de bens ou remissão de dívida, se os praticar o devedor já insolvente, ou por eles reduzido à insolvência, ainda quando o ignore, poderão ser anulados pelos credores quirografários, como lesivos dos seus direitos.\n§ 1º Igual direito assiste aos credores cuja garantia se tornar insuficiente.\n§ 2º Só os credores que já o eram ao tempo daqueles atos podem pleitear a anulação deles."},"159":{"topicId":"OJ26-DCIV-CC-08","texto":"Art. 159. Serão igualmente anuláveis os contratos onerosos do devedor insolvente, quando a insolvência for notória, ou houver motivo para ser conhecida do outro contratante."},"166":{"topicId":"OJ26-DCIV-CC-09","texto":"Art. 166. É nulo o negócio jurídico quando:\nI - celebrado por pessoa absolutamente incapaz;\nII - for ilícito, impossível ou indeterminável o seu objeto;\nIII - o motivo determinante, comum a ambas as partes, for ilícito;\nIV - não revestir a forma prescrita em lei;\nV - for preterida alguma solenidade que a lei considere essencial para a sua validade;\nVI - tiver por objetivo fraudar lei imperativa;\nVII - a lei taxativamente o declarar nulo, ou proibir-lhe a prática, sem cominar sanção."},"167":{"topicId":"OJ26-DCIV-CC-09","texto":"Art. 167. É nulo o negócio jurídico simulado, mas subsistirá o que se dissimulou, se válido for na substância e na forma.\n§ 1º Haverá simulação nos negócios jurídicos quando:\nI - aparentarem conferir ou transmitir direitos a pessoas diversas daquelas às quais realmente se conferem, ou transmitem;\nII - contiverem declaração, confissão, condição ou cláusula não verdadeira;\nIII - os instrumentos particulares forem antedatados, ou pós-datados.\n§ 2º Ressalvam-se os direitos de terceiros de boa-fé em face dos contraentes do negócio jurídico simulado."},"168":{"topicId":"OJ26-DCIV-CC-09","texto":"Art. 168. As nulidades dos artigos antecedentes podem ser alegadas por qualquer interessado, ou pelo Ministério Público, quando lhe couber intervir.\nParágrafo único. As nulidades devem ser pronunciadas pelo juiz, quando conhecer do negócio jurídico ou dos seus efeitos e as encontrar provadas, não lhe sendo permitido supri-las, ainda que a requerimento das partes."},"169":{"topicId":"OJ26-DCIV-CC-09","texto":"Art. 169. O negócio jurídico nulo não é suscetível de confirmação, nem convalesce pelo decurso do tempo."},"170":{"topicId":"OJ26-DCIV-CC-09","texto":"Art. 170. Se, porém, o negócio jurídico nulo contiver os requisitos de outro, subsistirá este quando o fim a que visavam as partes permitir supor que o teriam querido, se houvessem previsto a nulidade."},"171":{"topicId":"OJ26-DCIV-CC-09","texto":"Art. 171. Além dos casos expressamente declarados na lei, é anulável o negócio jurídico:\nI - por incapacidade relativa do agente;\nII - por vício resultante de erro, dolo, coação, estado de perigo, lesão ou fraude contra credores."},"172":{"topicId":"OJ26-DCIV-CC-09","texto":"Art. 172. O negócio anulável pode ser confirmado pelas partes, salvo direito de terceiro."},"173":{"topicId":"OJ26-DCIV-CC-09","texto":"Art. 173. O ato de confirmação deve conter a substância do negócio celebrado e a vontade expressa de mantê-lo."},"174":{"topicId":"OJ26-DCIV-CC-09","texto":"Art. 174. É escusada a confirmação expressa, quando o negócio já foi cumprido em parte pelo devedor, ciente do vício que o inquinava."},"175":{"topicId":"OJ26-DCIV-CC-09","texto":"Art. 175. A confirmação expressa, ou a execução voluntária de negócio anulável, nos termos dos arts. 172 a 174, importa a extinção de todas as ações, ou exceções, de que contra ele dispusesse o devedor."},"176":{"topicId":"OJ26-DCIV-CC-09","texto":"Art. 176. Quando a anulabilidade do ato resultar da falta de autorização de terceiro, será validado se este a der posteriormente."},"177":{"topicId":"OJ26-DCIV-CC-09","texto":"Art. 177. A anulabilidade não tem efeito antes de julgada por sentença, nem se pronuncia de ofício; só os interessados a podem alegar, e aproveita exclusivamente aos que a alegarem, salvo o caso de solidariedade ou indivisibilidade."},"178":{"topicId":"OJ26-DCIV-CC-09","texto":"Art. 178. É de quatro anos o prazo de decadência para pleitear-se a anulação do negócio jurídico, contado:\nI - no caso de coação, do dia em que ela cessar;\nII - no de erro, dolo, fraude contra credores, estado de perigo ou lesão, do dia em que se realizou o negócio jurídico;\nIII - no de atos de incapazes, do dia em que cessar a incapacidade."},"179":{"topicId":"OJ26-DCIV-CC-09","texto":"Art. 179. Quando a lei dispuser que determinado ato é anulável, sem estabelecer prazo para pleitear-se a anulação, será este de dois anos, a contar da data da conclusão do ato."},"180":{"topicId":"OJ26-DCIV-CC-09","texto":"Art. 180. O menor, entre dezesseis e dezoito anos, não pode, para eximir-se de uma obrigação, invocar a sua idade se dolosamente a ocultou quando inquirido pela outra parte, ou se, no ato de obrigar-se, declarou-se maior."},"181":{"topicId":"OJ26-DCIV-CC-09","texto":"Art. 181. Ninguém pode reclamar o que, por uma obrigação anulada, pagou a um incapaz, se não provar que reverteu em proveito dele a importância paga."},"182":{"topicId":"OJ26-DCIV-CC-09","texto":"Art. 182. Anulado o negócio jurídico, restituir-se-ão as partes ao estado em que antes dele se achavam, e, não sendo possível restituí-las, serão indenizadas com o equivalente."},"183":{"topicId":"OJ26-DCIV-CC-09","texto":"Art. 183. A invalidade do instrumento não induz a do negócio jurídico sempre que este puder provar-se por outro meio."},"184":{"topicId":"OJ26-DCIV-CC-09","texto":"Art. 184. Respeitada a intenção das partes, a invalidade parcial de um negócio jurídico não o prejudicará na parte válida, se esta for separável; a invalidade da obrigação principal implica a das obrigações acessórias, mas a destas não induz a da obrigação principal."},"185":{"topicId":"OJ26-DCIV-CC-09","texto":"Art. 185. Aos atos jurídicos lícitos, que não sejam negócios jurídicos, aplicam-se, no que couber, as disposições do Título anterior."},"187":{"topicId":"OJ26-DCIV-CC-09","texto":"Art. 187. Também comete ato ilícito o titular de um direito que, ao exercê-lo, excede manifestamente os limites impostos pelo s

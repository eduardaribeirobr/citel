 citação far-se-á:\nI - por correspondência, com aviso de recebimento em mão própria;\nII - tratando-se de pessoa jurídica ou firma individual, mediante entrega ao encarregado da recepção, que será obrigatoriamente identificado;\nIII - sendo necessário, por oficial de justiça, independentemente de mandado ou carta precatória.\n§ 1º A citação conterá cópia do pedido inicial, dia e hora para comparecimento do citando e advertência de que, não comparecendo este, considerar-se-ão verdadeiras as alegações iniciais, e será proferido julgamento, de plano.\n§ 2º Não se fará citação por edital.\n§ 3º O comparecimento espontâneo suprirá a falta ou nulidade da citação."},"19":{"topicId":"OJ26-DPCI-L9099-04","texto":"Art. 19. As intimações serão feitas na forma prevista para citação, ou por qualquer outro meio idôneo de comunicação.\n§ 1º Dos atos praticados na audiência, considerar-se-ão desde logo cientes as partes.\n§ 2º As partes comunicarão ao juízo as mudanças de endereço ocorridas no curso do processo, reputando-se eficazes as intimações enviadas ao local anteriormente indicado, na ausência da comunicação."},"60":{"topicId":"OJ26-DPPE-L9099-03","texto":"Art. 60. O Juizado Especial Criminal, provido por juízes togados ou togados e leigos, tem competência para a conciliação, o julgamento e a execução das infrações penais de menor potencial ofensivo, respeitadas as regras de conexão e continência.\nParágrafo único. Na reunião de processos, perante o juízo comum ou o tribunal do júri, decorrentes da aplicação das regras de conexão e continência, observa r -se-ão os institutos da transação penal e da composição dos danos civis."},"61":{"topicId":"OJ26-DPPE-L9099-03","texto":"Art. 61. Consideram-se infrações penais de menor potencial ofensivo, para os efeitos desta Lei, as contravenções penais e os crimes a que a lei comine pena máxima não superior a 2 (dois) anos, cumulada ou não com multa."},"62":{"topicId":"OJ26-DPPE-L9099-03","texto":"Art. 62. O processo perante o Juizado Especial orientar-se-á pelos critérios da oralidade, simplicidade, informalidade, economia processual e celeridade, objetivando, sempre que possível, a reparação dos danos sofridos pela vítima e a aplicação de p ena não privativa de liberdade."},"66":{"topicId":"OJ26-DPPE-L9099-04","texto":"Art. 66. A citação será pessoal e far-se-á no próprio Juizado, sempre que possível, ou por mandado.\nParágrafo único. Não encontrado o acusado para ser citado, o Juiz encaminhará as peças existentes ao Juízo comum para adoção do procedimento previsto em lei."},"67":{"topicId":"OJ26-DPPE-L9099-04","texto":"Art. 67. A intimação far-se-á por correspondência, com aviso de recebimento pessoal ou, tratando-se de pessoa jurídica ou firma individual, mediante entrega ao encarregado da recepção, que será obrigatoriamente identificado, ou, sendo necessário, por oficial de justiça, independentemente de mandado ou carta precatória, ou ainda por qualquer meio idôneo de comunicação.\nParágrafo único. Dos atos praticados em audiência considerar-se-ão desde logo cientes as partes, os interessados e defensores."},"68":{"topicId":"OJ26-DPPE-L9099-04","texto":"Art. 68. Do ato de intimação do autor do fato e do mandado de citação do acusado, constará a necessidade de seu comparecimento acompanhado de advogado, com a advertência de que, na sua falta, ser-lhe-á designado defensor público."}}},"senado-lei-6830-1980":{"id":"DIR-LESP-L6830","concordancia":true,"nome":"Lei n.º 6.830/1980","rotulo":"da Lei 6.830/1980 (Execução Fiscal)","titulo":"Direito: Lei 6.830/1980 (Execução Fiscal)","disciplina":"LESP","url":"https://normas.leg.br/api/public/normas?urn=urn:lex:br:federal:lei:1980-09-22;6830&&tipo_documento=maior-detalhe","consultado_em":"2026-11-21","sha256":"39abfaebefb5f5798812c09066757658af9a48c3d9ea786bf7add4d44f726640","observacao":"Texto compilado vigente, publicado pela fonte (salvo em 2023-12-26); não é reconstruído por data. A própria fonte informa atualização até data não informada: alterações posteriores a essa data podem não constar.","artigos":{"1":{"topicId":"OJ26-LESP-L6830-01","texto":"Art. 1º A execução judicial para cobrança da Dívida Ativa da União, dos Estados, do Distrito Federal, dos Municípios e respectivas autarquias será regida por esta Lei e, subsidiariamente, pelo Código de Processo Civil."},"2":{"topicId":"OJ26-LESP-L6830-02","texto":"Art. 2º Constitui Dívida Ativa da Fazenda Pública aquela definida como tributária ou não tributária na Lei nº 4.320, de 17 de março de 1964, com as alterações posteriores, que estatui normas gerais de direito financeiro para elaboração e controle dos orçamentos e balanços da União, dos Estados, dos Municípios e do Distrito Federal.\n§ 1º Qualquer valor, cuja cobrança seja atribuída por lei às entidades de que trata o art. 1º, será considerado Dívida Ativa da Fazenda Pública.\n§ 2º A Dívida Ativa da Fazenda Pública, compreendendo a tributária e a não tributária, abrange atualização monetária, juros e multa de mora e demais encargos previstos em lei ou contrato.\n§ 3º A inscrição, que se constitui no ato de controle administrativo da legalidade, será feita pelo órgão competente para apurar a liquidez e certeza do crédito e suspenderá a prescrição, para todos os efeitos de direito, por 180 dias, ou até a distribuição da execução fiscal, se esta ocorrer antes de findo aquele prazo.\n§ 4º A Dívida Ativa da União será a apurada e inscrita na Procuradoria da Fazenda Nacional.\n§ 5º O Termo de Inscrição de Dívida Ativa deverá conter:\nI - o nome do devedor, dos co-responsáveis e, sempre que conhecido, o domicílio ou residência de um e de outros;\nII - o valor originário da dívida, bem como o termo inicial e a forma de calcular os juros de mora e demais encargos previstos em lei ou contrato;\nIII - a origem, a natureza e o fundamento legal ou contratual da dívida;\nIV - a indicação, se for o caso, de estar a dívida sujeita à atualização monetária, bem como o respectivo fundamento legal e o termo inicial para o cálculo;\nV - a data e o número da inscrição, no Registro de Dívida Ativa; e\nVI - o número do processo administrativo ou do auto de infração, se neles estiver apurado o valor da dívida.\n§ 6º A Certidão de Dívida Ativa conterá os mesmos elementos do Termo de Inscrição e será autenticada pela autoridade competente.\n§ 7º O Termo de Inscrição e a Certidão de Dívida Ativa poderão ser preparados e numerados por processo manual, mecânico ou eletrônico.\n§ 8º Até a decisão de primeira instância, a Certidão de Dívida Ativa poderá ser emendada ou substituída, assegurada ao executado a devolução do prazo para embargos.\n§ 9º O prazo para a cobrança das contribuições previdenciárias continua a ser o estabelecido no art. 144 da Lei nº 3.807, de 26 de agosto de 1960."},"7":{"topicId":"OJ26-LESP-L6830-03","texto":"Art. 7º O despacho do Juiz que deferir a inicial importa em ordem para:\nI - citação, pelas sucessivas modalidades previstas no art. 8º;\nII - penhora, se não for paga a dívida, nem garantida a execução, por meio de depósito, fiança ou seguro garantia;\nIII - arresto, se o executado não tiver domicílio ou dele se ocultar;\nIV - registro da penhora ou do arresto, independentemente do pagamento de custas ou outras despesas, observado o disposto no art. 14; e\nV - avaliação dos bens penhorados ou arrestados."},"8":{"topicId":"OJ26-LESP-L6830-04","texto":"Art. 8º O executado será citado para, no prazo de 5 (cinco) dias, pagar a dívida com os juros e multa de mora e encargos indicados na Certidão de Dívida Ativa, ou garantir a execução, observadas as seguintes normas:\nI - a citação será feita pelo correio, com aviso de recepção, se a Fazenda Pública não a requerer por outra forma;\nII - a citação pelo correio considera-se feita na data da entrega da carta no endereço do executado, ou, se a data for omitida, no aviso de recepção, 10 (dez) dias após a entrega da carta à agência postal;\nIII - se o aviso de recepção não retornar no prazo de 15 (quinze) dias da entrega da carta à agência postal, a citação será feita por Oficial de Justiça ou por edital;\nIV - o edital de citação será afixado na sede do Juízo, publicado uma só vez no órgão oficial, gratuitamente, como expediente judiciário, com o prazo de 30 (trinta) dias, e conterá, apenas, a indicação da exeqüente, o nome do devedor e dos co-responsáveis, a quantia devida, a natureza da dívida, a data e o número da inscrição no Registro da Dívida Ativa, o prazo e o endereço da sede do Juízo.\n§ 1º O executado ausente do País será citado por edital, com prazo de 60 (sessenta) dias.\n§ 2º O despacho do Juiz, que ordenar a citação, interrompe a prescrição."},"11":{"topicId":"OJ26-LESP-L6830-05","texto":"Art. 11. A penhora ou arresto de bens obedecerá à seguinte ordem:\nI - dinheiro;\nII - título da dívida pública, bem como título de crédito, que tenham cotação em bolsa;\nIII - pedras e metais preciosos;\nIV - imóveis;\nV - navios e aeronaves;\nVI - veículos;\nVII - móveis ou semoventes; e\nVIII - direitos e ações.\n§ 1º Excepcionalmente, a penhora poderá recair sobre estabelecimento comercial, industrial ou agrícola, bem como em plantações ou edifícios em construção.\n§ 2º A penhora efetuada em dinheiro será convertida no depósito de que trata o inciso I do art. 9º.\n§ 3º O Juiz ordenará a remoção do bem penhorado para depósito judicial, particular ou da Fazenda Pública exeqüente, sempre que esta o requerer, em qualquer fase do processo."},"37":{"topicId":"OJ26-LESP-L6830-06","texto":"Art. 37. O Auxiliar de Justiça que, por ação ou omissão, culposa ou dolosa, prejudicar a execução, será responsabilizado, civil, penal e administrativamente.\nParágrafo único. O Oficial de Justiça deverá efetuar, em 10 (dez) dias, as diligências que lhe forem ordenadas, salvo motivo de força maior devidamente justificado perante o Juízo."}}},"senado-lei-8429-1992":{"id":"DIR-DADM-L8429","concordancia":true,"nome":"Lei de Improbidade Administrativa (Lei n.º 8.429/92)","rotulo":"da Lei de Improbidade Administrativa (Lei 8.429/1992)","titulo":"Direito: Lei 8.429/1992 (Improbidade Administrativa)","disciplina":"DADM","url":"https://normas.leg.br/api/public/normas?urn=urn:lex:br:federal:lei:1992-06-02;8429&&tipo_documento=maior-detalhe","consultado_em":"2026-11-21","sha256":"cdf65416a33ce8555a733654afbc75f69a55bd294ff156380c415a007ebb4459","observacao":"Texto compilado vigente, publicado pela fonte (salvo em 2022-09-05); não é reconstruído por data. A própria fonte informa atualização até data não informada: alterações posteriores a essa data podem não constar.","artigos":{"9":{"topicId":"OJ26-DADM-L8429-01","texto":"Art. 9º Constitui ato de improbidade administrativa importando em enriquecimento ilícito auferir, mediante a prática de ato doloso, qualquer tipo de vantagem patrimonial indevida em razão do exercício de cargo, de mandato, de função, de emprego ou de atividade nas entidades referidas no art. 1º desta Lei, e notadamente:\nI - receber, para si ou para outrem, dinheiro, bem móvel ou imóvel, ou qualquer outra vantagem econômica, direta ou indireta, a título de comissão, percentagem, gratificação ou presente de quem tenha interesse, direto ou indireto, que possa ser atingido ou amparado por ação ou omissão decorrente das atribuições do agente público;\nII - perceber vantagem econômica, direta ou indireta, para facilitar a aquisição, permuta ou locação de bem móvel ou imóvel, ou a contratação de serviços pelas entidades referidas no art. 1º por preço superior ao valor de mercado;\nIII - perceber vantagem econômica, direta ou indireta, para facilitar a alienação, permuta ou locação de bem público ou o fornecimento de serviço por ente estatal por preço inferior ao valor de mercado;\nIV - utilizar, em obra ou serviço particular, qualquer bem móvel, de propriedade ou à disposição de qualquer das entidades referidas no art. 1º desta Lei, bem como o trabalho de servidores, de empregados ou de terceiros contratados por essas entidades; ( Incis o com redação dada pela Lei nº 14.230, de 25/10/2021)\nV - receber vantagem econômica de qualquer natureza, direta ou indireta, para tolerar a exploração ou a prática de jogos de azar, de lenocínio, de narcotráfico, de contrabando, de usura ou de qualquer outra atividade ilícita, ou aceitar promessa de tal vantagem;\nVI - receber vantagem econômica de qualquer natureza, direta ou indireta, para fazer declaração falsa sobre qualquer dado técnico que envolva obras públicas ou qualquer outro serviço ou sobre quantidade, peso, medida, qualidade ou característica de mercadorias ou bens fornecidos a qualquer das entidades referidas no art. 1º desta Lei; ( Incis o com redação dada pela Lei nº 14.230, de 25/10/2021)\nVII - adquirir, para si ou para outrem, no exercício de mandato, de cargo, de emprego ou de função pública, e em razão deles, bens de qualquer natureza, decorrentes dos atos descritos no caput deste artigo, cujo valor seja desproporcional à evolução do patrimônio ou à renda do agente público, assegurada a demonstração pelo agente da licitude da origem dessa evolução; ( Incis o com redação dada pela Lei nº 14.230, de 25/10/2021)\nVIII - aceitar emprego, comissão ou exercer atividade de consultoria ou assessoramento para pessoa física ou jurídica que tenha interesse suscetível de ser atingido ou amparado por ação ou omissão decorrente das atribuições do agente público, durante a atividade;\nIX - perceber vantagem econômica para intermediar a liberação ou aplicação de verba pública de qualquer natureza;\nX - receber vantagem econômica de qualquer natureza, direta ou indiretamente, para omitir ato de ofício, providência ou declaração a que esteja obrigado;\nXI - incorporar, por qualquer forma, ao seu patrimônio bens, rendas, verbas ou valores integrantes do acervo patrimonial das entidades mencionadas no art. 1º desta Lei;\nXII - usar, em proveito próprio, bens, rendas, verbas ou valores integrantes do acervo patrimonial das entidades mencionadas no art. 1º desta Lei."}}},"senado-lindb-1942":{"id":"DIR-DCIV-LINDB","concordancia":true,"nome":"Decreto-Lei n.º 4.657/1942","rotulo":"da Lei de Introdução às Normas do Direito Brasileiro (Decreto-Lei 4.657/1942)","titulo":"Direito: LINDB (Decreto-Lei 4.657/1942)","disciplina":"DCIV","url":"https://normas.leg.br/api/public/normas?urn=urn:lex:br:federal:decreto.lei:1942-09-04;4657&&tipo_documento=maior-detalhe","consultado_em":"2026-11-21","sha256":"e2e4d115d909e4219360e93672c570b80085525b5a5960a844091d32bd5166e6","observacao":"Texto compilado vigente, publicado pela fonte (salvo em 2021-01-15); não é reconstruído por data. A própria fonte informa atualização até data não informada: alterações posteriores a essa data podem não constar.","artigos":{"1":{"topicId":"OJ26-DCIV-LINDB-01","texto":"Art. 1º Salvo disposição contrária, a lei começa a vigorar em todo o país quarenta e cinco dias depois de oficialmente publicada.\n§ 1º Nos Estados estrangeiros, a obrigatoriedade da lei brasileira, quando admitida, se inicia três meses depois de oficialmente publicada. ( Vide Lei nº 5.338, de 16/10/1967)\n§ 2º (Revogado pela Lei nº 12.036, de 1/10/2009)\n§ 3º Se, antes de entrar a lei em vigor, ocorrer nova publicação de seu texto, destinada a correção, o prazo deste artigo e dos parágrafos anteriores começará a correr da nova publicação.\n§ 4º As correções a texto de lei já em vigor consideram-se lei nova."},"2":{"topicId":"OJ26-DCIV-LINDB-01","texto":"Art. 2º Não se destinando à vigência temporária, a lei terá vigor até que outra a modifique ou revogue.\n§ 1º A lei posterior revoga a anterior quando expressamente o declare, quando seja com ela incompatível ou quando regule inteiramente a matéria de que tratava a lei anterior.\n§ 2º A lei nova, que estabeleça disposições gerais ou especiais a par das já existentes, não revoga nem modifica a lei anterior.\n§ 3º Salvo disposição em contrário, a lei revogada não se restaura por ter a lei revogadora perdido a vigência."},"3":{"topicId":"OJ26-DCIV-LINDB-01","texto":"Art. 3º Ninguém se escusa de cumprir a lei, alegando que não a conhece."},"4":{"topicId":"OJ26-DCIV-LINDB-01","texto":"Art. 4º Quando a lei for omissa, o juiz decidirá o caso de acordo com a analogia, os costumes e os princípios gerais de direito."},"5":{"topicId":"OJ26-DCIV-LINDB-01","texto":"Art. 5º Na aplicação da lei, o juiz atenderá aos fins sociais a que ela se dirige e às exigências do bem comum."},"6":{"topicId":"OJ26-DCIV-LINDB-01","texto":"Art. 6º A Lei em vigor terá efeito imediato e geral, respeitados o ato jurídico perfeito, o direito adquirido e a coisa julgada.\n§ 1º Reputa-se ato jurídico perfeito o já consumado segundo a lei vigente ao tempo em que se efetuou.\n§ 2º Consideram-se adquiridos assim os direitos que o seu titular, ou alguém por ele, possa exercer, como aqueles cujo começo do exercício tenha termo prefixo, ou condição pre-estabelecida inalterável, a arbítrio de outrem.\n§ 3º Chama-se coisa julgada ou caso julgado a decisão judicial de que já não caiba recurso."},"7":{"topicId":"OJ26-DCIV-LINDB-01","texto":"Art. 7º A lei do país em que domiciliada a pessoa determina as regras sobre o começo e o fim da personalidade, o nome, a capacidade e os direitos de família.\n§ 1º Realizando-se o casamento no Brasil, será aplicada a lei brasileira quanto aos impedimentos dirimentes e às formalidades da celebração.\n§ 2º O casamento de estrangeiros poderá celebrar-se perante autoridades diplomáticas ou consulares do país de ambos os nubentes.\n§ 3º Tendo os nubentes domicílio diverso, regerá os casos de invalidade do matrimônio a lei do primeiro domicílio conjugal.\n§ 4º O regime de bens, legal ou convencional, obedece à lei do país em que tiverem os nubentes domicílio, e, se este for diverso, à do primeiro domicílio conjugal.\n§ 5º O estrangeiro casado, que se naturalizar brasileiro, pode, mediante expressa anuência de seu cônjuge, requerer ao juiz, no ato de entrega do decreto de naturalização, se apostile ao mesmo a adoção do regime de comunhão parcial de bens, respeitados os direitos de terceiros e dada esta adoção ao competente registro.\n§ 6º O divórcio realizado no estrangeiro, se um ou ambos os cônjuges forem brasileiros, só será reconhecido no Brasil depois de 1 (um) ano da data da sentença, salvo se houver sido antecedida de separação judicial por igual prazo, caso em que a homologação produzirá efeito imediato, obedecidas as condições estabelecidas para a eficácia das sentenças estrangeiras no país. O Superior Tribunal de Justiça, na forma de seu regimento interno, poderá reexaminar, a requerimento do interessado, decisões já proferidas em pedidos de homologação de sentenças estrangeiras de divórcio de brasileiros, a fim de que passem a produzir todos os efeitos legais.\n§ 7º Salvo o caso de abandono, o domicílio do chefe da família estende-se ao outro cônjuge e aos filhos não emancipados, e o do tutor ou curador aos incapazes sob sua guarda.\n§ 8º Quando a pessoa não tiver domicílio, considerar-se-á domiciliada no lugar de sua residência ou naquele em que se encontre."},"8":{"topicId":"OJ26-DCIV-LINDB-01","texto":"Art. 8º Para qualificar os bens e regular as relações a eles concernentes, aplicar-se-á a lei do país em que estiverem situados.\n§ 1º Aplicar-se-á a lei do país em que for domiciliado o proprietário, quanto aos bens moveis que ele trouxer ou se destinarem a transporte para outros lugares.\n§ 2º O penhor regula-se pela lei do domicílio que tiver a pessoa, em cuja posse se encontre a coisa apenhada."},"9":{"topicId":"OJ26-DCIV-LINDB-01","texto":"Art. 9 o Para qualificar e reger as obrigações, aplicar-se-á a lei do país em que se constituírem.\n§ 1º Destinando-se a obrigação a ser executada no Brasil e dependendo de forma essencial, será esta observada, admitidas as peculiaridades da lei estrangeira quanto aos requisitos extrínsecos do ato.\n§ 2º A obrigação resultante do contrato reputa-se constituida no lugar em que residir o proponente."},"10":{"topicId":"OJ26-DCIV-LINDB-01","texto":"Art. 10. A sucessão por morte ou por ausência obedece à lei do país em que domiciliado o defunto ou o desaparecido, qualquer que seja a natureza e a situação dos bens.\n§ 1º A sucessão de bens de estrangeiros, situados no País, será regulada pela lei brasileira em benefício do cônjuge ou dos filhos brasileiros, ou de quem os represente, sempre que não lhes seja mais favorável a lei pessoal do de cujus .\n§ 2º A lei do domicílio do herdeiro ou legatário regula a capacidade para suceder."},"11":{"topicId":"OJ26-DCIV-LINDB-01","texto":"Art. 11. As organizações destinadas a fins de interesse coletivo, como as sociedades e as fundações, obedecem à lei do Estado em que se constituirem.\n§ 1º Não poderão, entretanto. ter no Brasil filiais, agências ou estabelecimentos antes de serem os atos constitutivos aprovados pelo Governo brasileiro, ficando sujeitas à lei brasileira.\n§ 2º Os Governos estrangeiros, bem como as organizações de qualquer natureza, que eles tenham constituido, dirijam ou hajam investido de funções públicas, não poderão adquirir no Brasil bens imóveis ou susceptiveis de desapropriação.\n§ 3º Os Governos estrangeiros podem adquirir a propriedade dos prédios necessários à sede dos representantes diplomáticos ou dos agentes consulares."},"12":{"topicId":"OJ26-DCIV-LINDB-01","texto":"Art. 12. É competente a autoridade judiciária brasileira, quando for o réu domiciliado no Brasil ou aqui tiver de ser cumprida a obrigação.\n§ 1º Só à .autoridade judiciária brasileira compete conhecer das ações, relativas a imóveis situados no Brasil.\n§ 2º A autoridade judiciária brasileira cumprirá, concedido o exequatur e segundo a forma estabelecida pele lei brasileira, as diligências deprecadas por autoridade estrangeira competente, observando a lei desta, quanto ao objeto das diligências."},"13":{"topicId":"OJ26-DCIV-LINDB-01","texto":"Art. 13. A prova dos fatos ocorridos em país estrangeiro rege-se pela lei que nele vigorar, quanto ao ônus e aos meios de produzir-se, não admitindo os tribunais brasileiros provas que a lei brasileira desconheça."},"14":{"topicId":"OJ26-DCIV-LINDB-01","texto":"Art. 14. Não conhecendo a lei estrangeira, poderá o juiz exigir de quem a invoca prova do texto e da vigência."},"15":{"topicId":"OJ26-DCIV-LINDB-01","texto":"Art. 15. Será executada no Brasil a sentença proferida no estrangeiro, que reuna os seguintes requisitos:\na) haver sido proferida por juiz competente;\nb) terem sido os partes citadas ou haver-se legalmente verificado à revelia;\nc) ter passado em julgado e estar revestida das formalidades necessárias para a execução no lugar em que foi proferida;\nd) estar traduzida por intérprete autorizado;\ne) ter sido homologada pelo Supremo Tribunal Federal.\nParágrafo único. (Revogado pela Lei nº 12.036, de 1/10/2009)"},"16":{"topicId":"OJ26-DCIV-LINDB-01","texto":"Art. 16. Quando, nos termos dos artigos precedentes, se houver de aplicar a lei estrangeira, ter-se-á em vista a disposição desta, sem considerar-se qualquer remissão por ela feita a outra lei."},"17":{"topicId":"OJ26-DCIV-LINDB-01","texto":"Art. 17. As leis, atos e sentenças de outro país, bem como quaisquer declarações de vontade, não terão eficácia no Brasil, quando ofenderem a soberania nacional, a ordem pública e os bons costumes."},"18":{"topicId":"OJ26-DCIV-LINDB-01","texto":"Art. 18. Tratando-se de brasileiros, são competentes as autoridades consulares brasileiras para lhes celebrar o casamento e os mais atos de Registro Civil e de tabelionato, inclusive o registro de nascimento e de óbito dos filhos de brasileiro ou brasileira nascido no país da sede do Consulado. ( “Caput” do a rtigo com redação dada pela Lei nº 3.238, de 1/8/1957)\n§ 1º As autoridades consulares brasileiras também poderão celebrar a separação consensual e o divórcio consensual de brasileiros, não havendo filhos menores ou incapazes do casal e observados os requisitos legais quanto aos prazos, devendo constar da respectiva escritura pública as disposições relativas à descrição e à partilha dos bens comuns e à pensão alimentícia e, ainda, ao acordo quanto à retomada pelo cônjuge de seu nome de solteiro ou à manutenção do nome adotado quando se deu o casamento. ( Parágrafo acrescido pela Lei nº 12.874, de 29/10/2013 , publicada no DOU de 30/10/2013, em vigor 120 dias após a publicação )\n§ 2º É indispensável a assistência de advogado, devidamente constituído, que se dará mediante a subscrição de petição, juntamente com ambas as partes, ou com apenas uma delas, caso a outra constitua advogado próprio, não se fazendo necessário que a assinatura do advogado conste da escritura pública. ( Parágrafo acrescido pela Lei nº 12.874, de 29/10/2013, publicada no DOU de 30/10/2013, em vigor 120 dias após a publicação )"},"19":{"topicId":"OJ26-DCIV-LINDB-01","texto":"Art. 19. Reputam-se válidos todos os atos indicados no artigo anterior e celebrados pelos cônsules brasileiros na vigência do Decreto-Lei nº 4.657, de 4 de setembro de 1942, desde que satisfaçam todos os requisitos legais.\nParágrafo único. No caso em que a celebração desses atos tiver sido recusada pelas autoridades consulares, com fundamento no artigo 18 do mesmo Decreto-Lei, ao interessado é facultado renovar o pedido dentro em 90 (noventa) dias contados da data da publicação desta Lei."},"20":{"topicId":"OJ26-DCIV-LINDB-01","texto":"Art. 20. Nas esferas administrativa, controladora e judicial, não se decidirá com base em valores jurídicos abstratos sem que sejam consideradas as consequências práticas da decisão.\nParágrafo único. A motivação demonstrará a necessidade e a adequação da medida imposta ou da invalidação de ato, contrato, ajuste, processo ou norma administrativa, inclusive em f ace das possíveis alternativas."},"21":{"topicId":"OJ26-DCIV-LINDB-01","texto":"Art. 21. A decisão que, nas esferas administrativa, controladora ou judicial, decretar a invalidação de ato, contrato, ajuste, processo ou norma administrativa deverá indicar de modo expresso suas consequências jurídicas e administrativas.\nParágrafo único. A decisão a que se refere o caput deste artigo deverá, quando for o caso, indicar as condições para que a regularização ocorra de modo proporcional e equânime e sem prejuízo aos interesses gerais, não se podendo impor aos sujeitos atingidos ônus ou perdas que, em função das peculiaridades do caso, sejam anormais ou excessivos."},"22":{"topicId":"OJ26-DCIV-LINDB-01","texto":"Art. 22. Na interpretação de normas sobre gestão pública, serão considerados os obstáculos e as dificuldades reais do gestor e as exigências das políticas públicas a seu cargo, sem prejuízo dos direitos dos administrados.\n§ 1º Em decisão sobre regularidade de conduta ou validade de ato, contrato, ajuste, processo ou norma administrativa, serão consideradas as circunstâncias práticas que houverem imposto, limitado ou condicionado a ação do agente.\n§ 2º Na aplicação de sanções, serão consideradas a natureza e a gravidade da infração cometida, os danos que dela provierem para a administração pública, as circunstâncias agravantes ou atenuantes e os antecedentes do agente.\n§ 3º As sanções aplicadas ao agente serão levadas em conta na dosimetria das demais sanções de mesma natureza e relativas ao mesmo fato."},"23":{"topicId":"OJ26-DCIV-LINDB-01","texto":"Art. 23. A decisão administrativa, controladora ou judicial que estabelecer interpretação ou orientação nova sobre norma de conteúdo indeterminado, impondo novo dever ou novo condicionamento de direito, deverá prever regime de transição quando indispensável para que o novo dever ou condicionamento de direito seja cumprido de modo proporcional, equânime e eficiente e sem prejuízo aos interesses gerais.\nParágrafo único. (VETADO)."},"24":{"topicId":"OJ26-DCIV-LINDB-01","texto":"Art. 24. A revisão, nas esferas administrativa, controladora ou judicial, quanto à validade de ato, contrato, ajuste, processo ou norma administrativa cuja produção já se houver completado levará em conta as orientações gerais da época, sendo vedado que, com base em mudança posterior de orientação geral, se declarem inválidas situações plenamente constituídas.\nParágrafo único. Consideram-se orientações gerais as interpretações e especificações contidas em atos públicos de caráter geral ou em jurisprudência judicial ou administrativa majoritária, e ainda as adotadas por prática administrativa reiterada e de amplo conhecimento público."},"25":{"topicId":"OJ26-DCIV-LINDB-01","texto":"Art. 25. (VETADO na Lei nº 13.655, de 25/4/2018 )"},"26":{"topicId":"OJ26-DCIV-LINDB-01","texto":"Art. 26. Para eliminar irregularidade, incerteza jurídica ou situação contenciosa na aplicação do direito público, inclusive no caso de expedição de licença, a autoridade administrativa poderá, após oitiva do órgão jurídico e, quando for o caso, após realização de consulta pública, e presentes razões de relevante interesse geral, celebrar compromisso com os interessados, observada a legislação aplicável, o qual só produzirá efeitos a partir de sua publicação oficial.\n§ 1º O compromisso referido no caput deste artigo:\nI - buscará solução jurídica proporcional, equânime, eficiente e compatível com os interesses gerais;\nII - (VETADO);\nIII - não poderá conferir desoneração permanente de dever ou condicionamento de direito reconhecidos por orientação geral;\nIV - deverá prever com clareza as obrigações das partes, o prazo para seu cumprimento e as sanções aplicáveis em caso de descumprimento.\n§ 2º (VETADO)."},"27":{"topicId":"OJ26-DCIV-LINDB-01","texto":"Art. 27. A decisão do processo, nas esferas administrativa, controladora ou judicial, poderá impor compensação por benefícios indevidos ou prejuízos anormais ou injustos resultantes do processo ou da conduta dos envolvidos.\n§ 1º A decisão sobre a compensação será motivada, ouvidas previamente as partes sobre seu cabimento, sua forma e, se for o caso, seu valor.\n§ 2º Para prevenir ou regular a compensação, poderá ser celebrado compromisso processual entre os envolvidos."},"29":{"topicId":"OJ26-DCIV-LINDB-01","texto":"Art. 29. Em qualquer órgão ou Poder, a edição de atos normativos por autoridade administrativa, salvo os de mera organização interna, poderá ser precedida de consulta pública para manifestação de interessados, preferencialmente por meio eletrônico, a qual será considerada na decisão.\n§ 1º A convocação conterá a minuta do ato normativo e fixará o prazo e demais condições da consulta pública, observadas as normas legais e regulamentares específicas, se houver.\n§ 2º (VETADO)."},"30":{"topicId":"OJ26-DCIV-LINDB-01","texto":"Art. 30. As autoridades públicas devem atuar para aumentar a segurança jurídica na aplicação das normas, inclusive por meio de regulamentos, súmulas administrativas e respostas a consultas.\nParágrafo único. Os instrumentos previstos no caput deste artigo terão caráter vinculante em relação ao órgão ou entidade a que se destinam, até ulterior revisão.\nRio de Janeiro, 4 de setembro de 1942, 121º da Independência e 54º da República."}}},"cnj-res-354-2020":{"id":"DIR-LESP-CNJ354","concordancia":true,"nome":"Resolução CNJ n.º 354/2020","rotulo":"da Resolução CNJ 354/2020 (cumprimento digital de ato processual e de ordem judicial)","titulo":"Direito: Resolução CNJ 354/2020","disciplina":"LESP","url":"https://atos.cnj.jus.br/files/compilado2018222026050869fe450e4e3a9.pdf","consultado_em":"2026-11-21","sha256":"aa27ed176f5b35b4629d3881b0dae40a6213d21c2a86fee19e52ceab7c79d1b9","observacao":"Texto COMPILADO oficial publicado pelo CNJ (atos.cnj.jus.br), que incorpora as Resoluções 481/2022, 508/2023 e 679/2026, conforme o cabeçalho do próprio PDF. O título do PDF traz a data 18/11/2020 e a página do ato no portal traz 19/11/2020; a divergência foi apenas registrada, não resolvida. Os parágrafos e incisos não foram separados por artigo além do que o texto extraído do PDF permite.","artigos":{"1":{"topicId":"OJ26-LESP-CNJ354-01","texto":"Art. 1o Esta Resolução regulamenta a realização de audiências e sessões\npor videoconferência e telepresenciais e a comunicação de atos processuais por meio\neletrônico nas unidades jurisdicionais de primeira e segunda instâncias da Justiça dos\nEstados, Federal, Trabalhista, Militar e Eleitoral, bem como nos Tribunais Superiores, à\nexceção do Supremo Tribunal Federal."},"8":{"topicId":"OJ26-LESP-CNJ354-02","texto":"Art. 8o Nos casos em que cabível a citação e a intimação pelo correio, por\noficial de justiça ou pelo escrivão ou chefe de secretaria, o ato poderá ser cumprido por\nmeio eletrônico que assegure ter o destinatário do ato tomado conhecimento do seu\nconteúdo.\nParágrafo único. As citações e intimações por meio eletrônico serão\nrealizadas na forma da lei (art. 246, V, do CPC, combinado com art. 6o e 9o da Lei no\n11.419/2006), não se lhes aplicando o disposto nesta Resolução."},"9":{"topicId":"OJ26-LESP-CNJ354-02","texto":"Art. 9o As partes e os terceiros interessados informarão, por ocasião da\nprimeira intervenção nos autos, endereços eletrônicos para receber notificações e\nintimações, mantendo-os atualizados durante todo o processo.\nParágrafo único. Aquele que requerer a citação ou intimação deverá\nfornecer, além dos dados de qualificação, os dados necessários para comunicação\neletrônica por aplicativos de mensagens, redes sociais e correspondência eletrônica (e-\nmail), salvo impossibilidade de fazê-lo."},"10":{"topicId":"OJ26-LESP-CNJ354-02","texto":"Art. 10. O cumprimento da citação e da intimação por meio eletrônico será\ndocumentado por:\nI – comprovante do envio e do recebimento da comunicação processual,\ncom os respectivos dia e hora de ocorrência; ou\nII – certidão detalhada de como o destinatário foi identificado e tomou\nconhecimento do teor da comunicação.\n§ 1o O cumprimento das citações e das intimações por meio eletrônico\npoderá ser realizado pela secretaria do juízo ou pelos oficiais de justiça.\n§ 2o Salvo ocultação, é vedado o cumprimento eletrônico de atos\nprocessuais por meio de mensagens públicas."}}}},"topi     tempoMedioMs: comTempo.length ? comTempo.reduce((s, e) => s + e.ms, 0) / comTempo.length : null,
    acertosComDuvida: respostas.filter((e) => e.correct && e.conf !== 'seguro').length,
    errosComCerteza: respostas.filter((e) => !e.correct && e.conf === 'seguro').length,
    porTopico,
  };
}

function estatisticas(eventos, hojeIdx, tz) {
  const fuso = tz === undefined ? TZ : tz;
  const resp = soRespostas(eventos);
  const hoje = resp.filter((e) => Progresso.diaIdx(e.ts, fuso) === hojeIdx);
  return { total: resumo(resp), hoje: resumo(hoje) };
}

/** Evento de resposta no formato do histórico. */
function eventoResposta(q, indiceEscolhido, conf, ms) {
  const escolhida = q.alternativas[indiceEscolhido];
  return {
    topicId: q.topicId, questionId: q.id, correct: !!escolhida.correta, conf,
    resposta: escolhida.letra, gabarito: q.gabarito, ms: Math.max(0, Math.round(ms)), nivel: q.nivel, templateId: q.templateId,

}
const eventoMotivo = (eventoResp, motivo) => ({ tipo: 'motivo', ref: eventoResp.id, topicId: eventoResp.topicId, questionId: eventoResp.questionId, correct: false, motivo });

const CATEGORIAS_PROBLEMA = Object.freeze({ enunciado: 'Enunciado errado ou confuso', gabarito: 'O gabarito parece errado', explicacao: 'A explicação está errada', outro: 'Outro problema' });

const eventoProblema = (eventoResp, categoria, nota) => ({ tipo: 'problema', ref: eventoResp.id, topicId: eventoResp.topicId, questionId: eventoResp.questionId, correct: false,
  categoria: CATEGORIAS_PROBLEMA[categoria] ? categoria : 'outro', nota: String(nota || '').slice(0, 300) });
const problemasReportados = (eventos) => eventos.filter((e) => e.tipo === 'problema').sort((a, b) => b.ts - a.ts);

const API = { CATEGORIAS_PROBLEMA, eventoProblema, problemasReportados, TIPOS_AUXILIARES, INTERVALOS, CREDITO, MOTIVOS, paraMotor, soRespostas, templateDe, cartoes, revisoesVencidas, nivelSugerido, montarSessao, cadernoErros, resumo, estatisticas, eventoResposta, eventoMotivo };

if (typeof globalThis !== 'undefined') globalThis.Aprendizagem = API;

})();

      mod.append(h('div', { class: 'item', 'data-modelo': m.id },
        h('div', { class: 'row' }, h('div', { class: 't', text: m.titulo }), m.aposentado ? chip('info', 'aposentado') : fraco ? chip('warn', 'pouca variação') : null),
        h('div', { class: 'm' }, m.validas + ' de ' + m.geradas + ' conferidas · ' + m.id),
        h('div', { class: 'm' }, 'Variações distintas por nível (1→5): ' + vars)));
    });
    card.append(mod,
      v.variacao_baixa.length ? h('p', { class: 'note', id: 'texto-variacao' }, v.variacao_baixa.length + ' combinações de modelo e nível têm menos de ' + v.limite_variacao_baixa + ' variações (' + v.variacao_baixa.map(function (x) { return x.modelo.split('-').slice(0, 2).join('-') + ' nível ' + x.nivel; }).join('; ') + '). Nelas, as questões se repetem mais; o app usa o nível vizinho antes de repetir.') : null,
      h('ul', { class: 'limpa' }, v.limites.map(function (l) { return h('li', { text: l }); })));
    return card;
  }
  var ACENTOS = { minimo: 'mínimo', nomeacao: 'nomeação', retificacao: 'retificação', inscricoes: 'inscrições', remuneracao: 'remuneração', atribuicoes: 'atribuições', duracao: 'duração', periodo: 'período', habilitacao: 'habilitação', legislacao: 'legislação', carater: 'caráter', eliminatoria: 'eliminatória', classificatorio: 'classificatório', revisao: 'revisão', portugues: 'português', unica: 'única', criterios: 'critérios', ate: 'até', nao: 'não', excluido: 'excluído', identificacao: 'identificação', bloco3: 'bloco 3', dejesp: 'DEJESP', cj: 'CJ', referencia: 'referência' };
  function cardRegras() {
    var r = S.aux.regras;
    var card = h('section', { class: 'card', id: 'card-regras' }, h('h2', null, 'Regras do edital'));
    if (!r) { card.append(h('p', { class: 'note' }, 'Carregando…')); return card; }
    if (r === 'erro') { card.append(h('p', { class: 'note' }, 'Regras indisponíveis agora (sem conexão ou arquivo ausente).')); return card; }
    card.append(h('p', { class: 'note' }, r.fatos.length + ' regras conferidas no PDF oficial, cada uma com a página e o trecho. Consultado em ' + r.consultado_em.split('-').reverse().join('/') + '. Em caso de dúvida, vale o edital.'));
    var det = h('details', { id: 'regras-lista' }, h('summary', null, 'Ver as regras'));
    var nomeArq = { edital: 'edital', retificacao: 'retificação' };
    r.fatos.forEach(function (f) {
      var rotulo = f.id.split('_').map(function (w) { return ACENTOS[w] || w; }).join(' '); rotulo = rotulo.charAt(0).toUpperCase() + rotulo.slice(1);
      det.append(h('div', { class: 'item' }, h('div', { class: 't' }, h('b', null, rotulo + ': '), String(f.valor)), h('div', { class: 'm' }, (nomeArq[f.arquivo] || f.arquivo) + ', p. ' + f.pagina + ' — “' + curto(String(f.citacao), 220) + '”')));
    });
    card.append(det);
    return card;
  }

  // ---------- backup ----------
  async function exportar() {
    try {
      var texto = await Backup.criarBackup(S.store.exportar(), { dispositivo: plataforma() });
      var hoje = new Date().toISOString().slice(0, 10);
      var r = await S.dl.save({ filename: 'preparo-tjsp-' + hoje + '.json', data: texto });
      toast(r.status === 'saved' ? 'Backup entregue ao aparelho.' : 'Backup: ' + r.status);
    } catch (e) { toast(e && e.code === 'declined' ? 'Exportação cancelada.' : 'Não foi possível exportar: ' + ((e && (e.code || e.message)) || e)); }
  }
  function lerArquivo(f) {
    if (f.text) return f.text();
    return new Promise(function (res, rej) { var r = new FileReader(); r.onload = function () { res(String(r.result)); }; r.onerror = function () { rej(r.error); }; r.readAsText(f); });
  }
  async function importarArquivo(input) {
    var f = input.files && input.files[0];
    if (!f) return;
    try {
      var v = await Backup.verificarBackup(await lerArquivo(f));
      if (!v.ok) { S.importacao = { erro: v.motivo }; }
      else { S.importacao = { backup: v.backup, plano: Backup.planejarImportacao(S.store.exportar(), v.backup.dados) }; }
    } catch (e) { S.importacao = { erro: 'não foi possível ler o arquivo: ' + ((e && e.message) || e) }; }
    render();
  }
  function painelImportacao() {
    var im = S.importacao;
    if (im.erro) return h('div', { class: 'item', id: 'painel-importacao' }, chip('bad', 'Backup recusado'), h('div', { class: 't', text: im.erro }), h('div', { class: 'acoes' }, h('button', { class: 'sec peq', onclick: function () { S.importacao = null; render(); } }, 'Fechar')));
    var p = im.plano, rot = { eventos: 'respostas', sessoes: 'sessões', marcacoes: 'marcações', revisoes: 'revisões', cancelamentos: 'cancelamentos' };
    var novos = Object.keys(rot).map(function (k) { return p.relatorio.novos[k] ? p.relatorio.novos[k] + ' ' + rot[k] : null; }).filter(Boolean);
    var confl = Object.keys(rot).reduce(function (s, k) { return s + p.relatorio.conflitos[k].length; }, 0);
    return h('div', { class: 'item', id: 'painel-importacao' },
      chip(p.tipo === 'NADA NOVO' ? 'info' : p.tipo === 'COM CONFLITOS' ? 'warn' : 'ok', 'Backup íntegro: ' + p.tipo.toLowerCase()),
      h('div', { class: 't' }, 'Criado em ' + im.backup.criadoEm.slice(0, 10) + (im.backup.dispositivo ? ' (' + im.backup.dispositivo + ')' : '') + '. ' + (novos.length ? 'Traria: ' + novos.join(', ') + '.' : 'Não traria nada novo.')),
      confl ? h('div', { class: 'm' }, confl + ' registro(s) com o mesmo id e conteúdo diferente: o que você já tem é mantido.') : null,
      h('div', { class: 'acoes' },
        h('button', { id: 'btn-confirmar-importacao', disabled: p.totalNovos === 0 && !(im.backup.dados.config && im.backup.dados.config.atualizadoEm), onclick: function () {
          var r = S.store.adicionarItens(p.resultado); S.importacao = null; toast('Importado: ' + (r.eventos + r.sessoes + r.marcacoes + r.revisoes + r.cancelamentos + r.estudadosLegados) + ' registro(s).'); render();
        } }, 'Juntar ao meu histórico'),
        h('button', { class: 'sec', onclick: function () { S.importacao = null; render(); } }, 'Cancelar')));
  }
  async function verificarGravacao() {
    var b = $('btn-verificar'); b.disabled = true; $('texto-verificacao').textContent = 'Testando…';
    var r = await S.store.verificar();
    $('texto-verificacao').textContent = r.ok ? 'Gravação, leitura e remoção funcionaram (' + r.ms + ' ms).' : 'Falhou: ' + r.motivo;
    b.disabled = false;
  }

  // ---------- navegação e renderização ----------
  function abaDoHash() { var a = (location.hash || '').slice(1); return ABAS.indexOf(a) >= 0 ? a : 'hoje'; }
  function render() {
    var v = $('view');
    document.querySelectorAll('nav.abas a').forEach(function (a) { if (a.dataset.aba === S.aba) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    if (S.erroCarga) {
      v.replaceChildren(h('section', { class: 'card erro-bloco' }, h('h2', null, 'Não foi possível carregar'), h('p', { class: 'note' }, 'O histórico não foi lido do banco de dados (' + (S.erroCarga.code || S.erroCarga.message || 'erro') + '). Nada foi alterado. Tente de novo.'), h('div', { class: 'acoes' }, h('button', { id: 'btn-tentar', onclick: function () { S.erroCarga = null; iniciar(); } }, 'Tentar de novo'))));
      atualizarStatus(); return;
    }
    if (!S.matriz) return;
    var c = calcular();
    var nodes = [];
    if (S.semBanco) nodes.push(h('section', { class: 'card erro-bloco', id: 'aviso-sem-banco' }, h('h2', null, 'Sem banco de dados'), h('p', { class: 'note' }, 'Esta visualização não tem acesso ao banco de dados da plataforma ou à sua identidade, então nada pode ser salvo. Abra o documento logada(o), pelo aplicativo ou navegador. Você ainda pode consultar o edital.')));
    if (S.aba === 'hoje') nodes = nodes.concat(viewHoje(c));
    else if (S.aba === 'questoes') nodes = nodes.concat(viewQuestoes(c));
    else if (S.aba === 'painel') nodes = nodes.concat(viewPainel(c));
    else if (S.aba === 'edital') nodes = nodes.concat(viewEdital(c));
    else nodes = nodes.concat(viewMais(c));
    v.replaceChildren.apply(v, nodes);
    atualizarStatus();
    document.body.dataset.pronto = '1';
  }
  function irParaAba() { S.aba = abaDoHash(); render(); window.scrollTo(0, 0); }

  async function usar(nome) {
    try {
      if (!window.claude || !window.claude.use) return null;
      return await Promise.race([window.claude.use(nome), new Promise(function (r) { setTimeout(function () { r(null); }, 10000); })]);
    } catch (e) { return null; }
  }
  function comTempo(p, ms) { return new Promise(function (res, rej) { var t = setTimeout(function () { rej({ code: 'tempo_esgotado', message: 'tempo esgotado' }); }, ms); p.then(function (v) { clearTimeout(t); res(v); }, function (e) { clearTimeout(t); rej(e); }); }); }

  async function iniciar() {
    S.aba = abaDoHash();
    try {
      if (!S.matriz) { var resp = await fetch('matriz-edital.json'); if (!resp.ok) throw new Error('HTTP ' + resp.status); S.matriz = await resp.json(); indexar(); }
    } catch (e) { $('view').replaceChildren(h('section', { class: 'card erro-bloco' }, h('p', { class: 'note' }, 'Não foi possível carregar o edital (' + ((e && e.message) || e) + ').'))); return; }
    carregarAux();
    var db = await usar('db'); var user = await usar('user'); S.dl = await usar('downloads');
    S.uid = user ? await user.id() : null;
    if (!db || !S.uid) { S.semBanco = true; render(); return; }
    S.store = Store.criarStore({ db: db, uid: S.uid, storage: LS });
    S.store.onStatus(atualizarStatus);
    try { await comTempo(S.store.carregar(), 20000); } catch (e) { S.store = null; S.erroCarga = e; render(); return; }
    render();
  }

  window.addEventListener('hashchange', irParaAba);
  document.addEventListener('visibilitychange', function () {
    if (!S.store) return;
    if (document.visibilityState === 'hidden') S.store.flush();
    else S.store.sincronizar().then(function () { var a = document.activeElement; if (!a || a === document.body) render(); }, function () { /* sem conexão: tenta na próxima vez */ });
  });
  window.addEventListener('pagehide', function () { if (S.store) S.store.flush(); });
  setInterval(atualizarCronometro, 1000);
  iniciar();
})();
</script>

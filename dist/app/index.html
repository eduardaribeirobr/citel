/* Layout: uma coluna, cartões empilhados, barra de abas fixa embaixo (Hoje, Questões, Painel, Edital, Mais), pensado para o celular. */

  --warn: #7a4b00; --warn-bg: #fbeed2;

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1511; --panel: #17201b; --fg: #e8eee9; --muted: #9db0a5; --line: #2b3a31;
    --accent: #5fc79f; --accent-fg: #0c1510; --accent-soft: #1d3329;
    --ok: #86dfae; --ok-bg: #16301f; --warn: #f1c978; --warn-bg: #352a0d; --bad: #ffa196; --bad-bg: #3a1b18;
    --info: #b9c9bf; --info-bg: #222d26;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1511; --panel: #17201b; --fg: #e8eee9; --muted: #9db0a5; --line: #2b3a31;
  --accent: #5fc79f; --accent-fg: #0c1510; --accent-soft: #1d3329;
  --ok: #86dfae; --ok-bg: #16301f; --warn: #f1c978; --warn-bg: #352a0d; --bad: #ffa196; --bad-bg: #3a1b18;
  --info: #b9c9bf; --info-bg: #222d26;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--sans);
  padding-left: max(16px, env(safe-area-inset-left, 0px));

}

.wrap { max-width: 720px; margin: 0 auto; }

  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg);
  display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0 10px; border-bottom: 1px solid var(--line);
}
header.topo h1 { font-size: 1.05rem; margin: 0; letter-spacing: .01em; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.card h2 { margin: 0; font-size: .75rem; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.card h3 { margin: 0; font-size: 1rem; }
.big { font: 500 2rem/1.1 var(--mono); letter-spacing: -.01em; }
.big small { font-size: .95rem; color: var(--muted); font-weight: 400; }
.note { color: var(--muted); font-size: .85rem; margin: 0; overflow-wrap: anywhere; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-width: 0; }
.row > :first-child { min-width: 0; }
.stack { display: grid; gap: 8px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.kpi { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 4px; min-width: 0; }
.kpi .v { font: 500 1.35rem/1.15 var(--mono); }

.chip.ok { color: var(--ok); background: var(--ok-bg); } .chip.warn { color: var(--warn); background: var(--warn-bg); }
.chip.bad { color: var(--bad); background: var(--bad-bg); } .chip.info { color: var(--info); background: var(--info-bg); }

button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.chart .area .col { flex: 1; display: flex; align-items: flex-end; height: 100%; min-width: 0; }
.chart .area .col i { display: block; width: 100%; background: var(--accent); border-radius: 3px 3px 0 0; }

.chart .rotulos span { flex: 1; text-align: center; font: 400 .62rem var(--mono); color: var(--muted); min-width: 0; }
details { border-top: 1px solid var(--line); padding: 8px 0; }
details > summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
details > summary::-webkit-details-marker { display: none; }
details.disc { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); padding: 12px 14px; }
.topico { display: grid; gap: 6px; padding: 10px 0; border-top: 1px solid var(--line); }
.topico .cab { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; min-width: 0; }
.topico .tit { overflow-wrap: anywhere; min-width: 0; }
.topico .det { font-size: .82rem; color: var(--muted); display: grid; gap: 4px; overflow-wrap: anywhere; }
.estudado-sim { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
nav.abas {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: var(--panel); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(5, 1fr);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
}
nav.abas a { text-align: center; text-decoration: none; color: var(--muted); font-weight: 600; font-size: .78rem; padding: 10px 2px; border-radius: 9px; min-height: 44px; display: grid; place-items: center; }
nav.abas a[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 10px; font-size: .88rem; z-index: 30; max-width: min(92vw, 520px); }
.erro-bloco { border-color: var(--bad); }
.timer { font: 500 1.8rem/1 var(--mono); }
pre.mono { white-space: pre-wrap; overflow-wrap: anywhere; font: 400 .78rem/1.5 var(--mono); margin: 0; }
ul.limpa { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.enun { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 1.02rem; line-height: 1.55; margin: 0; }
.alts { display: grid; gap: 8px; }
button.alt, button.conf, .motivos button { background: var(--panel); color: var(--fg); border: 1px solid var(--line); font-weight: 500; text-align: left; }
button.alt { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; padding: 10px 12px; min-height: 48px; line-height: 1.4; }
button.alt .l { font: 600 .95rem var(--mono); color: var(--accent); }
button.alt .corpo { display: grid; gap: 4px; min-width: 0; overflow-wrap: anywhere; }
button.alt .com { font-size: .82rem; color: var(--muted); font-weight: 400; }
button.alt[aria-pressed="true"], button.conf[aria-pressed="true"], .motivos button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
button.alt.certa { border-color: var(--ok); background: var(--ok-bg); box-shadow: inset 0 0 0 1px var(--ok); }
button.alt.errada { border-color: var(--bad); background: var(--bad-bg); box-shadow: inset 0 0 0 1px var(--bad); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
button.conf { text-align: center; font-size: .84rem; padding: 0 6px; }
.motivos { display: grid; gap: 8px; }
.explic { display: grid; gap: 8px; padding: 12px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); }
.explic p { margin: 0; overflow-wrap: anywhere; }
#q-feedback { scroll-margin-top: 64px; }

  <header class="topo">

    <span id="status" class="chip info" role="status" aria-live="polite">Carregando…</span>

  <a href="#hoje" data-aba="hoje">Hoje</a>
  <a href="#questoes" data-aba="questoes">Questões</a>

<script>
(function () {
'use strict';
/*
 * Motor de progresso, domínio e ritmo diário.
 *
 * Funções puras: não alteram a entrada, não leem relógio nem armazenamento.
 * Tudo o que é critério pedagógico está em PADRAO e pode ser ajustado.
 * Nada aqui prevê resultado de prova: mede o cumprimento dos critérios do plano.
 *
 * Entrada de calcularProgresso(entrada, opcoes):
 *   topicos:  [{ id, complexidade (1-5) | esforcoMin, peso? }]   (da matriz do edital)
 *   eventos:  [{ topicId, questionId, ts, correct, conf? }]      (respostas; conf: seguro|duvida|chute)
 *   sessoes:  [{ ts, min, topicId? }]                             (tempo de estudo)
 *   estudados:[topicId]                                           (teoria marcada como estudada)
 *   agora, dataProva: milissegundos (epoch)
 *   revisoesVencidas: número de revisões em atraso
 */

const PADRAO = Object.freeze({
  tzOffsetMin: -180,            // America/Sao_Paulo (sem horário de verão desde 2019)
  minQuestoesDistintas: 10,     // variedade mínima para considerar o tópico exercitado
  janelaDesempenho: 10,         // últimas N questões distintas entram no desempenho
  metaDesempenho: 0.8,          // critério pedagógico ajustável, não é previsão
  minParaFragil: 5,             // questões distintas mínimas para classificar como frágil
  limiteFragil: 0.6,            // desempenho ponderado abaixo disso = frágil
  diasRetencao: 7,              // acerto confiável N dias depois do 1º contato com o tópico
  pesosEtapas: Object.freeze({ estudo: 0.25, exercicio: 0.25, desempenho: 0.30, retencao: 0.20 }),
  credito: Object.freeze({ seguro: 1, duvida: 0.5, chute: 0.25 }),
  esforcoBaseMin: Object.freeze({ 1: 30, 2: 60, 3: 90, 4: 130, 5: 180 }), // estimativa inicial, recalibrada
  minPorRevisao: 1.5,
  reservaFinalDias: 14,         // últimos dias reservados a simulados e revisão final
  diasPorSemana: 6,             // um dia de descanso por semana
  disponivelMinDia: 60,
  limiteApertado: 1.25,
  janelaRitmoDias: 7,
  minDiasParaRitmo: 3,
  minTopicosParaCalibrar: 3,
  multiplicadorMin: 0.5,
  multiplicadorMax: 2,
});

const MS_DIA = 86400000;
const EPS = 1e-9;
const num = (x) => typeof x === 'number' && Number.isFinite(x);
const clamp01 = (x) => Math.max(0, Math.min(1, x));

function diaIdx(ts, tz) { return Math.floor((ts + tz * 60000) / MS_DIA); }
function idxParaISO(idx) { return new Date(idx * MS_DIA).toISOString().slice(0, 10); }

function montarConfig(opcoes) {
  const o = opcoes || {};
  const cfg = Object.assign({}, PADRAO, o, {
    pesosEtapas: Object.assign({}, PADRAO.pesosEtapas, o.pesosEtapas),
    credito: Object.assign({}, PADRAO.credito, o.credito),
    esforcoBaseMin: Object.assign({}, PADRAO.esforcoBaseMin, o.esforcoBaseMin),
  });
  const soma = Object.values(cfg.pesosEtapas).reduce((a, b) => a + b, 0);
  if (Math.abs(soma - 1) > 1e-6) throw new TypeError('pesosEtapas deve somar 1 (soma atual: ' + soma + ')');
  for (const k of ['diasPorSemana', 'disponivelMinDia', 'janelaRitmoDias', 'minQuestoesDistintas', 'janelaDesempenho']) {
    if (!num(cfg[k]) || cfg[k] <= 0) throw new TypeError('opção inválida: ' + k);
  }
  if (cfg.diasPorSemana > 7) throw new TypeError('diasPorSemana não pode passar de 7');
  return cfg;
}

function creditoResposta(e, cfg) {
  if (!e.correct) return 0;
  const c = cfg.credito[e.conf];
  return num(c) ? c : cfg.credito.duvida; // acerto sem confiança informada não vale como acerto seguro
}

function avaliarTopico(estudado, evs, cfg) {
  const porQuestao = new Map();
  let primeiroDia = Infinity;
  for (const e of evs) {
    const atual = porQuestao.get(e.questionId);
    if (!atual || e.ts > atual.ts) porQuestao.set(e.questionId, e);
    const d = diaIdx(e.ts, cfg.tzOffsetMin);
    if (d < primeiroDia) primeiroDia = d;
  }
  const n = porQuestao.size;
  const janela = Array.from(porQuestao.values()).sort((a, b) => b.ts - a.ts).slice(0, cfg.janelaDesempenho);
  const acc = janela.length ? janela.reduce((s, e) => s + creditoResposta(e, cfg), 0) / janela.length : 0;
  const retencao = evs.some((e) => e.correct && creditoResposta(e, cfg) >= 0.5
    && diaIdx(e.ts, cfg.tzOffsetMin) - primeiroDia >= cfg.diasRetencao) ? 1 : 0;
  const comp = {
    estudo: estudado ? 1 : 0,
    exercicio: clamp01(n / cfg.minQuestoesDistintas),
    desempenho: n ? clamp01(acc / cfg.metaDesempenho) * clamp01(janela.length / cfg.janelaDesempenho) : 0,
    retencao,
  };
  const w = cfg.pesosEtapas;
  const progresso = clamp01(w.estudo * comp.estudo + w.exercicio * comp.exercicio
    + w.desempenho * comp.desempenho + w.retencao * comp.retencao);
  const dominio = comp.estudo >= 1 - EPS && comp.exercicio >= 1 - EPS
    && comp.desempenho >= 1 - EPS && comp.retencao >= 1 - EPS;
  let estado;
  if (n === 0 && !estudado) estado = 'NÃO INICIADO';
  else if (n >= cfg.minParaFragil && acc < cfg.limiteFragil) estado = 'FRÁGIL';
  else if (dominio) estado = 'DOMÍNIO PROVISÓRIO';
  else if (progresso >= 0.5) estado = 'EM CONSOLIDAÇÃO';
  else estado = 'EM APRENDIZAGEM';
  return { progresso, estado, componentes: comp, questoesDistintas: n, desempenhoPonderado: acc };
}

function validar(entrada) {
  if (!entrada || typeof entrada !== 'object') throw new TypeError('entrada ausente');
  if (!Array.isArray(entrada.topicos) || entrada.topicos.length === 0) throw new TypeError('topicos deve ser uma lista não vazia');
  if (!num(entrada.agora)) throw new TypeError('agora inválido');
  if (!num(entrada.dataProva)) throw new TypeError('dataProva inválida');
  const ids = new Set();
  for (const t of entrada.topicos) {
    if (!t || typeof t.id !== 'string' || !t.id) throw new TypeError('tópico sem id');
    if (ids.has(t.id)) throw new TypeError('id de tópico repetido: ' + t.id);
    ids.add(t.id);
  }
  const r = entrada.revisoesVencidas;
  if (r !== undefined && (!num(r) || r < 0)) throw new TypeError('revisoesVencidas inválido');
}

function mediana(v) {
  const s = v.slice().sort((a, b) => a - b);
  const m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}

function calcularProgresso(entrada, opcoes) {
  const cfg = montarConfig(opcoes);
  validar(entrada);
  const { topicos, agora, dataProva } = entrada;
  const eventos = entrada.eventos || [];
  const sessoes = entrada.sessoes || [];
  const estudados = new Set(entrada.estudados || []);
  const revisoesVencidas = entrada.revisoesVencidas || 0;

  const conhecidos = new Map(topicos.map((t) => [t.id, t]));
  const evPorTopico = new Map(topicos.map((t) => [t.id, []]));
  const descartes = { eventosInvalidos: 0, eventosFuturos: 0, sessoesInvalidas: 0 };

  for (const e of eventos) {
    const ok = e && conhecidos.has(e.topicId) && typeof e.questionId === 'string' && e.questionId
      && num(e.ts) && typeof e.correct === 'boolean';
    if (!ok) { descartes.eventosInvalidos++; continue; }
    if (e.ts > agora) { descartes.eventosFuturos++; continue; }
    evPorTopico.get(e.topicId).push(e);
  }
  const sessoesValidas = [];
  const minPorTopico = new Map();
  for (const s of sessoes) {
    if (!s || !num(s.ts) || !num(s.min) || s.min <= 0 || s.ts > agora) { descartes.sessoesInvalidas++; continue; }
    sessoesValidas.push(s);
    if (s.topicId && conhecidos.has(s.topicId)) minPorTopico.set(s.topicId, (minPorTopico.get(s.topicId) || 0) + s.min);
  }

  const porTopico = [];
  for (const t of topicos) {
    const base = num(t.esforcoMin) && t.esforcoMin > 0 ? t.esforcoMin : cfg.esforcoBaseMin[t.complexidade];
    if (!num(base)) throw new TypeError('tópico ' + t.id + ' sem complexidade (1-5) nem esforcoMin');
    const a = avaliarTopico(estudados.has(t.id), evPorTopico.get(t.id), cfg);
    porTopico.push(Object.assign({ id: t.id, esforcoBaseMin: base }, a));
  }

  // Calibração: compara o tempo real dos tópicos já dominados com a estimativa.
  const razoes = porTopico
    .filter((t) => t.estado === 'DOMÍNIO PROVISÓRIO' && (minPorTopico.get(t.id) || 0) > 0)
    .map((t) => minPorTopico.get(t.id) / t.esforcoBaseMin);
  const calibrado = razoes.length >= cfg.minTopicosParaCalibrar;
  const multiplicador = calibrado
    ? Math.max(cfg.multiplicadorMin, Math.min(cfg.multiplicadorMax, mediana(razoes))) : 1;

  const somaBase = porTopico.reduce((s, t) => s + t.esforcoBaseMin, 0);
  const feitoBase = porTopico.reduce((s, t) => s + t.progresso * t.esforcoBaseMin, 0);
  const percentualGeral = clamp01(feitoBase / somaBase);
  const totalMin = somaBase * multiplicador;
  const feitoMin = feitoBase * multiplicador;
  const revisaoMin = revisoesVencidas * cfg.minPorRevisao;
  const restanteMin = Math.max(0, totalMin - feitoMin) + revisaoMin;

  const contagem = { 'NÃO INICIADO': 0, 'EM APRENDIZAGEM': 0, 'FRÁGIL': 0, 'EM CONSOLIDAÇÃO': 0, 'DOMÍNIO PROVISÓRIO': 0 };
  for (const t of porTopico) contagem[t.estado]++;
  const dominados = contagem['DOMÍNIO PROVISÓRIO'];

  // Prazo
  const hojeIdx = diaIdx(agora, cfg.tzOffsetMin);
  const provaIdx = diaIdx(dataProva, cfg.tzOffsetMin);
  const prazoIdx = provaIdx - cfg.reservaFinalDias;
  const diasCalendario = Math.max(0, prazoIdx - hojeIdx + 1);
  const diasEstudo = diasCalendario * cfg.diasPorSemana / 7;

  let situacao, necessarioMinDia;
  if (restanteMin <= EPS) { situacao = 'CONCLUÍDO'; necessarioMinDia = 0; }
  else if (diasEstudo <= 0) { situacao = 'PRAZO ESGOTADO'; necessarioMinDia = null; }
  else {
    necessarioMinDia = restanteMin / diasEstudo;
    const r = necessarioMinDia / cfg.disponivelMinDia;
    situacao = r <= 1 + EPS ? 'DENTRO DA CAPACIDADE' : r <= cfg.limiteApertado + EPS ? 'APERTADO' : 'ACIMA DA CAPACIDADE';
  }
  const faltaMinDia = necessarioMinDia === null ? null : Math.max(0, necessarioMinDia - cfg.disponivelMinDia);

  // Projeção se você mantiver exatamente o tempo disponível informado
  const minDisponiveis = cfg.disponivelMinDia * diasEstudo;
  const projecaoCobertura = totalMin > 0
    ? clamp01((feitoMin + Math.max(0, minDisponiveis - revisaoMin)) / totalMin) : 1;

  // Ritmo observado nos últimos N dias
  const dias = new Set();
  let min7 = 0;
  for (const s of sessoesValidas) {

      alternativas: todas.map((a, i) => ({ letra: LETRAS[i], texto: corrigirPlural(a.texto), valor: a.valor, correta: a.correta, comentario: corrigirPlural(a.comentario) })),
      gabarito: LETRAS[gabaritoIdx], gabaritoIdx,

      origem: g.origem || 'inédita', fonte: g.fonte || 'Verificação computacional por dois métodos independentes', confianca: g.confianca || 'B', valor: g.correta.valor, params: g.params,
    };

/** Verificações obrigatórias. Devolve {ok, erros}. Só questão com ok === true pode ser apresentada. */
function validarQuestao(q) {
  const erros = [];
  const t = CATALOGO.find((x) => x.id === q.templateId);
  if (!t) return { ok: false, erros: ['modelo desconhecido'] };
  if (!Array.isArray(q.alternativas) || q.alternativas.length !== 5) erros.push('deve ter 5 alternativas');
  else {
    if (new Set(q.alternativas.map((a) => norm(a.texto))).size !== 5) erros.push('alternativas repetidas');
    if (q.alternativas.filter((a) => a.correta).length !== 1) erros.push('deve haver exatamente uma alternativa correta');
    if (!(q.gabaritoIdx >= 0 && q.alternativas[q.gabaritoIdx] && q.alternativas[q.gabaritoIdx].correta)) erros.push('gabarito não aponta a alternativa correta');
    if (q.gabarito !== LETRAS[q.gabaritoIdx]) erros.push('letra do gabarito inconsistente');
    for (const a of q.alternativas) if (!a.comentario || a.comentario.length < 12) erros.push('alternativa ' + a.letra + ' sem comentário');
    const certa = q.alternativas.find((a) => a.correta);
    let indep;
    try { indep = t.resolver(q.params); } catch (e) { indep = undefined; erros.push('o segundo método falhou: ' + e.message); }
    if (indep !== undefined) {
      if (!iguais(indep, q.valor)) erros.push('o segundo método discorda da resposta (' + indep + ' ≠ ' + q.valor + ')');
      if (certa && !iguais(indep, certa.valor)) erros.push('a alternativa correta não tem o valor do segundo método');
      for (const a of q.alternativas) if (!a.correta && iguais(indep, a.valor)) erros.push('alternativa errada ' + a.letra + ' tem o valor da resposta (gabarito ambíguo)');
    }
  }
  if (!q.enunciado || q.enunciado.length < 10 || q.enunciado.length > 1200) erros.push('enunciado fora do tamanho esperado');
  if (!q.explicacao || q.explicacao.length < 30) erros.push('explicação ausente ou curta');
  if (!q.pegadinha || q.pegadinha.length < 15) erros.push('pegadinha ausente');
  return { ok: erros.length === 0, erros };
}

/** Gera uma questão válida a partir de uma semente-base (se a semente falhar, tenta as seguintes). */
function gerarValida(templateId, sementeBase, nivel) {
  for (let i = 0; i < 40; i++) {
    try {
      const q = gerarQuestao(templateId, sementeBase + i, nivel);
      if (validarQuestao(q).ok) return q;
    } catch (e) { /* tenta a próxima semente */ }
  }
  throw new Error('nenhuma questão válida para ' + templateId + ' a partir de ' + sementeBase);
}

// ---------- MAT-02: MMC e MDC ----------
Q.CATALOGO.push({

    const lista = xs.slice(0, -1).join(', ') + ' e ' + xs[xs.length - 1];

      expl = `Quando coincidem de novo é o menor múltiplo comum. Fatorando: ${xs.map((x) => x + ' = ' + fatores(x)).join('; ')}. O MMC usa cada fator com o maior expoente e vale ${ok}.`;
      pega = 'Coincidir de novo é MMC (menor múltiplo comum). MDC responde a perguntas de divisão em partes iguais sem sobra.';
      erros = [num(rd, 'calculou o MDC em vez do MMC'), num(xs.reduce((a, b) => a * b, 1), 'multiplicou os números (produto não é o menor múltiplo comum)'), num(xs.reduce((a, b) => a + b, 0), 'somou os números'),
        num(Math.max(...xs), 'tomou o maior dos números'), num(Math.min(...xs), 'tomou o menor dos números')];
      if (tres) erros.push(num(mmc(xs[0], xs[1]), 'calculou o MMC de apenas dois dos números'));
    } else {
      ok = rd;
      enunciado = tres ? `Três cordas medem ${lista} metros e serão cortadas em pedaços de mesmo comprimento, o maior possível, sem sobras. Qual é o comprimento, em metros, de cada pedaço?`

      expl = `Dividir em partes iguais, a maior possível e sem sobra, é o máximo divisor comum. Fatorando: ${xs.map((x) => x + ' = ' + fatores(x)).join('; ')}. O MDC usa só os fatores comuns, com o menor expoente, e vale ${ok}.`;
      pega = 'Maior pedaço igual e sem sobra é MDC. O MMC cresce (é múltiplo); o MDC divide (é divisor de todos).';
      erros = [num(rm, 'calculou o MMC em vez do MDC'), num(xs.reduce((a, b) => a * b, 1), 'multiplicou os números'), num(xs.reduce((a, b) => a + b, 0), 'somou os números'),

// ---------- MAT-03: razão e proporção ----------
Q.CATALOGO.push({
  id: 'MAT-03-PROPORCAO', topicId: 'OJ26-MAT-03', disciplina: 'MAT', titulo: 'Razão e proporção',
  gerar(r, n) {
    const m = n <= 2 ? 2 : 3;
    const partes = m === 2 ? [r.int(1, 5), r.int(2, 7)] : [r.int(1, 4), r.int(2, 6), r.int(3, 8)];
    const S = partes.reduce((a, b) => a + b, 0);
    const k = r.int(2, 12) * 10;
    const V = k * S;
    const t = r.int(0, m - 1);
    const socios = r.embaralhar(NOMES).slice(0, m);
    const ok = partes[t] * k;
    const enunciado = `${socios.slice(0, -1).join(', ')} e ${socios[m - 1]} abriram uma sociedade com investimentos nas proporções ${partes.join(' : ')}, respectivamente. O lucro foi de ${brl(V)}, dividido na mesma proporção. Quanto coube a ${socios[t]}?`;
    const erros = [num(V / m, 'dividiu o lucro igualmente entre os sócios', brl), num(V / partes[t], 'dividiu o lucro total pela razão do sócio', brl), num(V * partes[t] / (S - partes[t]), 'dividiu pela soma das partes dos OUTROS sócios', brl)];
    partes.forEach((p, j) => { if (j !== t) erros.push(num(p * k, `calculou a parte de ${socios[j]}, e não a de ${socios[t]}`, brl)); });
    return {
      enunciado, correta: { texto: brl(ok), valor: ok }, erros,
      explicacao: `Some as partes da razão: ${partes.join(' + ')} = ${S}. Cada parte vale ${brl(V)} ÷ ${S} = ${brl(k)}. ${socios[t]} tem ${partes[t]} partes: ${partes[t]} × ${brl(k)} = ${brl(ok)}.`,
      pegadinha: 'Em partilha proporcional, divide-se o total pela SOMA das partes (valor de cada parte) e depois multiplica-se pela parte de quem se pergunta.',
      params: { partes, V, t }, comentarioCorreta: `${partes[t]} partes de ${brl(k)}.`,
    };
  },
  resolver(p) {
    const S = p.partes.reduce((a, b) => a + b, 0);
    for (let kk = 1; kk <= p.V; kk++) if (kk * S === p.V) return p.partes[p.t] * kk;
    throw new Error('sem solução');
  },
});

      const inv = [...pesos].reverse();
      erros = [num(gs.reduce((a, b) => a + b, 0) / gs.length, 'calculou a média simples, ignorando os pesos'), num(soma, 'não dividiu pela soma dos pesos'), num(gs.reduce((a, b, i) => a + b * inv[i], 0) / sp, 'trocou a ordem dos pesos'),

// =====================================================================================================
// RLOG-05: diagramas lógicos (substitui RLOG-02-CONJUNTOS, aposentado)
// =====================================================================================================
// RLOG-02 aceitava premissas que obrigam um conjunto a ser VAZIO (ex.: "Nenhum A é B" e "Todo B é A"), e a resposta
// decorria só "por vazio". Aqui exige-se que existam configurações em que os TRÊS conjuntos tenham elementos e que a
// resposta certa e a não decorrência das erradas valham também nelas.
const antigoConjuntos = Q.CATALOGO.find((t) => t.id === 'RLOG-02-CONJUNTOS');
const regiaoTem = (m, g) => ((m >> (g - 1)) & 1) === 1;
function valeRegioes(m, st) {
  let sp = false; let snp = false;
  for (let g = 1; g <= 7; g++) if (regiaoTem(m, g)) { const noS = (g >> st.s) & 1; const noP = (g >> st.p) & 1; if (noS && noP) sp = true; if (noS && !noP) snp = true; }
  if (st.t === 'A') return !snp; if (st.t === 'E') return !sp; if (st.t === 'I') return sp;
  return snp;
}
const tresNaoVazios = (m) => [0, 1, 2].every((s) => { for (let g = 1; g <= 7; g++) if (regiaoTem(m, g) && ((g >> s) & 1)) return true; return false; });

Q.CATALOGO.push({
  id: 'RLOG-05-DIAGRAMAS', topicId: 'OJ26-RLOG-01', disciplina: 'RLOG', titulo: 'Raciocínio lógico: diagramas lógicos (conjuntos)',
  gerar(r, n) {
    for (let tent = 0; tent < 80; tent++) {
      const sub = Q.criarRng(r.int(1, 2147483646));
      let q; try { q = antigoConjuntos.gerar(sub, n); } catch (e) { continue; }
      const { premissas, correta, candidatas } = q.params;
      const todos = []; const nv = [];
      for (let m = 0; m < 128; m++) if (premissas.every((p) => valeRegioes(m, p))) { todos.push(m); if (tresNaoVazios(m)) nv.push(m); }
      if (!nv.length) continue;
      if (!nv.every((m) => valeRegioes(m, correta))) continue;
      if (!candidatas.every((c) => nv.some((m) => !valeRegioes(m, c)))) continue;
      const troca = (t) => t.split(`${todos.length} configurações`).join(`${nv.length} configurações`);
      q.explicacao = troca(q.explicacao) + ' Só se consideram configurações em que os três conjuntos têm elementos.'; q.comentarioCorreta = troca(q.comentarioCorreta);
      q.params = Object.assign({}, q.params, { naoVazio: true });
      return q;
    }
    throw new Error('não foi possível montar premissas com conjuntos não vazios e uma única conclusão necessária');
  },
  resolver(p) {
    const valor = antigoConjuntos.resolver(p);       // 5 indivíduos, semântica por elementos
    const vale = (ind, st) => {
      const noS = (g) => ((g >> st.s) & 1) === 1; const noP = (g) => ((g >> st.p) & 1) === 1;
      if (st.t === 'A') return ind.every((g) => !noS(g) || noP(g));
      if (st.t === 'E') return ind.every((g) => !(noS(g) && noP(g)));
      if (st.t === 'I') return ind.some((g) => noS(g) && noP(g));
      return ind.some((g) => noS(g) && !noP(g));
    };
    const nv = [];
    for (let i = 0; i < 8 ** 5; i++) {
      const ind = []; let x = i; for (let k = 0; k < 5; k++) { ind.push(x % 8); x = Math.floor(x / 8); }
      if (![0, 1, 2].every((s) => ind.some((g) => ((g >> s) & 1) === 1))) continue;
      if (p.premissas.every((pr) => vale(ind, pr))) nv.push(ind);
    }
    if (!nv.length) throw new Error('as premissas obrigam algum conjunto a ser vazio');
    if (!nv.every((ind) => vale(ind, p.correta))) throw new Error('a correta não decorre com os conjuntos não vazios');
    for (const c of p.candidatas) if (nv.every((ind) => vale(ind, c))) throw new Error('uma errada decorre quando os conjuntos não são vazios (ambíguo)');
    return valor;
  },
});

// =====================================================================================================
// Lógica proposicional: linguagem restrita, sem ambiguidade em português
//   literal            "O prazo terminou" / "O prazo não terminou"
//   cláusula           literal | literal e literal (e literal) | literal ou literal (ou literal)   (conectivo único)
//   fórmula            cláusula | Se cláusula, então cláusula
// =====================================================================================================
const ATOMOS = [
  ['O prazo terminou', 'O prazo não terminou'], ['O réu foi citado', 'O réu não foi citado'],
  ['A audiência foi realizada', 'A audiência não foi realizada'], ['O mandado foi cumprido', 'O mandado não foi cumprido'],
  ['A sentença foi publicada', 'A sentença não foi publicada'], ['O processo está concluso', 'O processo não está concluso'],
  ['Há testemunhas presentes', 'Não há testemunhas presentes'], ['O oficial chegou cedo', 'O oficial não chegou cedo'],
  ['A porta estava aberta', 'A porta não estava aberta'], ['O documento foi assinado', 'O documento não foi assinado'],

const lit = (i, neg) => ({ k: 'lit', i, neg: !!neg });
const nao = (l) => lit(l.i, !l.neg);
const E_ = (...xs) => ({ k: 'and', xs });
const OU = (...xs) => ({ k: 'or', xs });
const SE = (a, b) => ({ k: 'imp', a, b });

function ev(f, v) {
  switch (f.k) {
    case 'lit': return f.neg ? !v[f.i] : v[f.i];
    case 'and': return f.xs.every((x) => ev(x, v));
    case 'or': return f.xs.some((x) => ev(x, v));
    default: return !ev(f.a, v) || ev(f.b, v);
  }
}
const linhasVF = (k) => { const L = []; for (let r = 0; r < (1 << k); r++) { const v = []; for (let i = 0; i < k; i++) v.push(((r >> (k - 1 - i)) & 1) === 0); L.push(v); } return L; };
const assinatura = (f, k) => linhasVF(k).map((v) => (ev(f, v) ? '1' : '0')).join('');
const complemento = (s) => s.split('').map((c) => (c === '1' ? '0' : '1')).join('');

/** Segundo método: cada fórmula vira uma máscara de bits (um bit por linha da tabela-verdade) e usa operações de bit. */
function mascara(f, k) {
  const n = 1 << k; const cheio = (1 << n) - 1;
  const base = (i) => { let m = 0; for (let r = 0; r < n; r++) if (((r >> (k - 1 - i)) & 1) === 0) m |= (1 << r); return m; };
  const go = (g) => {
    if (g.k === 'lit') return g.neg ? (~base(g.i) & cheio) : base(g.i);
    if (g.k === 'and') return g.xs.map(go).reduce((a, b) => a & b, cheio);
    if (g.k === 'or') return g.xs.map(go).reduce((a, b) => a | b, 0);
    return (~go(g.a) | go(g.b)) & cheio;
  };
  return go(f);
}
const assinaturaMascara = (m, k) => { let s = ''; for (let r = 0; r < (1 << k); r++) s += ((m >> r) & 1) ? '1' : '0'; return s; };

const baixa = (s) => s.charAt(0).toLowerCase() + s.slice(1);
function textoLit(l, at) { return at[l.i][l.neg ? 1 : 0]; }
function textoClausula(c, at) {
  if (c.k === 'lit') return textoLit(c, at);
  return c.xs.map((x, j) => (j === 0 ? textoLit(x, at) : baixa(textoLit(x, at)))).join(c.k === 'and' ? ' e ' : ' ou ');
}
function texto(f, at) {
  if (f.k === 'imp') return `Se ${baixa(textoClausula(f.a, at))}, então ${baixa(textoClausula(f.b, at))}.`;
  return textoClausula(f, at) + '.';
}
const aspas = (s) => `“${s}”`;
const juntar = (xs) => (xs.length <= 1 ? xs.join('') : xs.slice(0, -1).join(', ') + ' e ' + xs[xs.length - 1]);
/** "“O prazo terminou” é verdadeira e “O réu foi citado” é falsa" */
function descrever(v, at) { return juntar(v.map((x, i) => `${aspas(at[i][0])} é ${x ? 'verdadeira' : 'falsa'}`)); }
/** Por que a fórmula tem esse valor na situação v (sempre derivado da avaliação, nunca escrito à mão). */
function porque(f, v, at) {
  const val = ev(f, v);
  const nomeLit = (l) => aspas(textoLit(l, at));
  if (f.k === 'lit') return `${nomeLit(f)} é ${val ? 'verdadeira' : 'falsa'}`;
  if (f.k === 'and') return val ? 'todas as partes são verdadeiras' : `a parte ${nomeLit(f.xs.find((x) => !ev(x, v)))} é falsa`;
  if (f.k === 'or') return val ? `a parte ${nomeLit(f.xs.find((x) => ev(x, v)))} é verdadeira` : 'todas as partes são falsas';
  const A = ev(f.a, v); const C = ev(f.b, v);
  if (!val) return 'o antecedente é verdadeiro e o consequente é falso, único caso em que uma condicional é falsa';
  return A ? 'antecedente e consequente são verdadeiros' : 'o antecedente é falso, e uma condicional com antecedente falso é verdadeira' + (C ? '' : ' (mesmo com consequente falso)');
}
function primeiraDiferenca(a, b, k) {  // primeira linha em que duas assinaturas diferem
  for (let r = 0; r < a.length; r++) if (a[r] !== b[r]) return { r, v: linhasVF(k)[r], a: a[r] === '1', b: b[r] === '1' };
  return null;
}

/** Todas as fórmulas "curtas" sobre k átomos: literais, e/ou de dois literais, condicionais entre dois literais. */
function universo(k) {
  const L = []; for (let i = 0; i < k; i++) { L.push(lit(i, false)); L.push(lit(i, true)); }
  const out = L.slice();
  for (let i = 0; i < k; i++) for (let j = 0; j < k; j++) {
    if (i === j) continue;
    for (const nb of [false, true]) for (const na of [false, true]) {
      const a = lit(i, na); const b = lit(j, nb);
      out.push(SE(a, b));
      if (i < j) { out.push(E_(a, b)); out.push(OU(a, b)); }
    }

  return out;
}

function formulaAleatoria(r, k) {
  // legibilidade: no máximo 2 literais por lado da condicional e átomos distintos entre antecedente e consequente
  const clausula = (ids) => {
    const ls = ids.map((i) => lit(i, r.int(0, 1) === 1));
    if (ls.length === 1) return ls[0];
    return r.int(0, 1) === 1 ? E_(...ls) : OU(...ls);
  };
  const embaralhados = r.embaralhar([...Array(k).keys()]);
  if (r.int(0, 2) === 0) return clausula(embaralhados.slice(0, r.int(2, k)));
  const tamA = r.int(1, 2); const tamB = r.int(1, Math.min(2, k - tamA));

}

// =====================================================================================================
// RLOG-06: estruturas lógicas
// =====================================================================================================
function sortearAtomos(r, k) { return r.embaralhar(ATOMOS).slice(0, k); }
const trocarConectivo = (S) => (S.k === 'and' ? OU(...S.xs) : E_(...S.xs));

function gerarNegacao(r, n) {
  const at = sortearAtomos(r, 2);
  const sinal = n === 1 ? [false, false] : [r.int(0, 1) === 1, r.int(0, 1) === 1];
  const a = lit(0, sinal[0]); const b = lit(1, sinal[1]);
  const tipo = n === 1 ? r.pick(['and', 'or']) : r.pick(['and', 'or', 'imp']);
  const S = tipo === 'and' ? E_(a, b) : tipo === 'or' ? OU(a, b) : SE(a, b);
  const correta = tipo === 'and' ? OU(nao(a), nao(b)) : tipo === 'or' ? E_(nao(a), nao(b)) : E_(a, nao(b));
  const k = 2; const sigS = assinatura(S, k); const alvo = complemento(sigS);
  if (assinatura(correta, k) !== alvo) throw new Error('negação canônica inconsistente');
  const todas = universo(k).filter((f) => f.k !== 'lit');
  const cands = todas.filter((f) => assinatura(f, k) !== alvo);
  const rotulo = (c) => {
    const s = assinatura(c, k);
    if (s === sigS) return 'equivale à própria proposição, e não à sua negação';
    if (tipo !== 'imp') {
      const mesmoConectivoNegado = tipo === 'and' ? E_(nao(a), nao(b)) : OU(nao(a), nao(b));
      if (s === assinatura(mesmoConectivoNegado, k)) return `equivale a negar cada parte mantendo o conectivo "${tipo === 'and' ? 'e' : 'ou'}", o que não é a negação (a negação também troca "e" por "ou" e vice-versa)`;
      if (s === assinatura(trocarConectivo(S), k)) return `equivale a trocar "${tipo === 'and' ? 'e' : 'ou'}" por "${tipo === 'and' ? 'ou' : 'e'}" sem negar as partes, o que não é a negação`;
    } else {
      // a inversa (¬A → ¬B) é equivalente à recíproca (B → A): um único rótulo cobre as duas
      if (s === assinatura(SE(b, a), k)) return 'equivale à recíproca (antecedente e consequente trocados) e à inversa (as duas partes negadas), que não são a negação da condicional';
    }
    return null;
  };
  const dif = (c) => { const d = primeiraDiferenca(assinatura(c, k), alvo, k); return `na situação em que ${descrever(d.v, at)}, a negação é ${d.b ? 'verdadeira' : 'falsa'} e esta alternativa é ${d.a ? 'verdadeira' : 'falsa'}`; };
  const comRotulo = cands.filter((c) => rotulo(c)); const semRotulo = r.embaralhar(cands.filter((c) => !rotulo(c)));
  const escolhidos = comRotulo.concat(semRotulo).slice(0, 7);
  const erros = escolhidos.map((c) => E(assinatura(c, k), texto(c, at), rotulo(c) ? `${rotulo(c)}` : `não é equivalente à negação: ${dif(c)}`));
  const regra = tipo === 'and' ? `Negar uma conjunção (“e”) exige que pelo menos uma das partes seja falsa: troca-se “e” por “ou” e nega-se cada parte (lei de De Morgan).`
    : tipo === 'or' ? `Negar uma disjunção (“ou”) exige que as duas partes sejam falsas: troca-se “ou” por “e” e nega-se cada parte (lei de De Morgan).`
      : 'Uma condicional só é falsa quando o antecedente é verdadeiro e o consequente é falso; logo, sua negação é “antecedente e não consequente”.';
  const linhasTxt = linhasVF(k).map((v, i) => `${v.map((x) => (x ? 'V' : 'F')).join(' ')} → ${sigS[i] === '1' ? 'V' : 'F'}`).join('; ');

function gerarEquivalencia(r, n) {

    enunciado: `Qual das alternativas é logicamente equivalente à proposição ${aspas(texto(S, at).replace(/\.$/, ''))}?`,

    params: { forma: 'equivalencia', at, S, correta, candidatas: cands, k }, comentarioCorreta: 'Tem a mesma tabela-verdade da proposição original.',
  };
}

function gerarValorLogico(r, n) {

globalThis.FontesDados = {"versao":1,"fontes":{"alesp-lei-10261-1968":{"id":"DIR-DADM-L10261","nome":"Estatuto dos Funcionários Públicos Civis do Estado de São Paulo (Lei n.º 10.261/68)","rotulo":"do Estatuto dos Funcionários Públicos Civis do Estado de São Paulo (Lei 10.261/68)","titulo":"Direito: Estatuto dos Funcionários Públicos Civis (Lei 10.261/68)","disciplina":"DADM","url":"https://www.al.sp.gov.br/repositorio/legislacao/lei/1968/lei-10261-28.10.1968.html","consultado_em":"2026-11-21","sha256":"fd02d8d42350015c2dada224c2292901668f9239d2d5b9fea81c95c1b5481d5a","observacao":"Texto consolidado consultado em 21/11/2026; conferir se houve alteração após 14/10/2026 antes de tratar como definitivo.","artigos":{"1":{"topicId":"OJ26-DADM-L10261-01","texto":"Artigo 1° - Esta lei institui o regime jurídico dos funcionários públicos civis do Estado.\nParágrafo único - As suas disposições, exceto no que colidirem com a legislação especial, aplicam-se aos funcionários dos 3 Poderes do Estado e aos do Tribunal de Contas do Estado."},"3":{"topicId":"OJ26-DADM-L10261-02","texto":"Artigo 3° - Funcionário público, para os fins deste Estatuto, é a pessoa legalmente investida em cargo público."},"4":{"topicId":"OJ26-DADM-L10261-03","texto":"Artigo 4° - Cargo público é o conjunto de atribuições e responsabilidades cometidas a um funcionário."},"11":{"topicId":"OJ26-DADM-L10261-04","texto":"Artigo 11 - Os cargos públicos serão providos por:\nI - nomeação;\nII - transferência;\nIII - reintegração;\nIV - acesso;\nV - reversão;\nVI - aproveitamento; e\nVII - readmissão."},"13":{"topicId":"OJ26-DADM-L10261-05","texto":"Artigo 13 - As nomeações serão feitas:\nI - em caráter vitalício, nos casos expressamente previstos na Constituição do Brasil;\nII - em comissão, quando se tratar de cargo que em virtude de lei assim deva ser provido; e\nIII - em caráter efetivo, quando se tratar de cargo de provimento dessa natureza.\nSEÇÃO II\nDa Seleção de Pessoal\nSUBSEÇÃO I\nDo Concurso"},"14":{"topicId":"OJ26-DADM-L10261-06","texto":"Artigo 14 - A nomeação para cargo público de provimento efetivo será precedida de concurso público de provas ou de provas e títulos.\nParágrafo único - As provas serão avaliadas na escala de 0 (zero) a 100 (cem) pontos e aos títulos serão atribuídos, no máximo, 50 (cinqüenta) pontos."},"46":{"topicId":"OJ26-DADM-L10261-07","texto":"Artigo 46 - Posse é o ato que investe o cidadão em cargo público."},"47":{"topicId":"OJ26-DADM-L10261-08","texto":"Artigo 47 - São requisitos para a posse em cargo público:\nI - ser brasileiro;\nII - ter completado 18 (dezoito) anos de idade;\nIII - estar em dia com as obrigações militares;\nIV - estar no gozo dos direitos políticos;\nV - ter boa conduta;\nVI - gozar de boa saúde, comprovada em inspeção realizada em órgão médico oficial;\nVI - gozar de boa saúde, comprovada em inspeção realizada por órgão médico oficial do Estado, para provimento de cargo efetivo, ou mediante apresentação de Atestado de Saúde Ocupacional, expedido por médico registrado no Conselho Regional correspondente, para provimento de cargo em comissão; (NR)\n- Inciso VI com redação dada pela Lei Complementar n° 1.123, de 01/07/2010 .\nVII - possuir aptidão para o exercício do cargo; e\nVIII - ter atendido às condições especiais prescritas para o cargo.\nParágrafo único - A deficiência da capacidade física, comprovadamente estacionária, não será considerada impedimento para a caracterização da capacidade psíquica e somática a que se refere o item VI deste artigo, desde que tal deficiência não impeça o desempenho normal das funções inerentes ao cargo de cujo provimento se trata."},"57":{"topicId":"OJ26-DADM-L10261-09","texto":"Artigo 57 - O exercício é o ato pelo qual o funcionário assume as atribuições e responsabilidades do cargo.\n§ 1° - O início, a interrupção e o reinicio do exercício serão registrados no assentamento individual do funcionário.\n§ 2° - O início do exercício e as alterações que ocorrerem serão comunicados ao órgão competente, pelo chefe da repartição ou serviço em que estiver lotado o funcionário."},"78":{"topicId":"OJ26-DADM-L10261-10","texto":"Artigo 78 - Serão considerados de efetivo exercício, para todos os efeitos legais, os dias em que o funcionário estiver afastado do serviço em virtude de:\nI - férias;\nII - casamento, até 8 (oito) dias;\nIII - falecimento do cônjuge, filhos, pais e irmãos, até 8 (oito) dias;\nIV - falecimento dos sogros, do padrasto ou madrasta, até 2 (dois) dias;\nIV - falecimento dos avós, netos, sogros, do padrasto ou madrasta, até 2 (dois) dias; (NR)\n- Inciso IV com redação dada pela Lei Complementar n° 318, de 10/03/1983 , com efeitos a partir de 01/01/1983.\nV - serviços obrigatórios por lei;\nVI - licença quando acidentado no exercício de suas atribuições ou atacado de doença profissional;\nVII - licença à funcionária gestante;\nVIII - licenciamento compulsório, nos termos do art. 206;\nIX - licença-prêmio;\nX - faltas abonadas nos termos do parágrafo 1° do art. 110, observados os limites ali fixados;\nX - Revogado.\n- Inciso X revogado pela Lei Complementar n° 1.361, de 21/10/2021 , com efeitos a partir do primeiro dia do mês subsequente à data da sua publicação.\nXI - missão ou estudo dentro do Estado, em outros pontos do território nacional ou no estrangeiro, nos termos do art. 68;\nXII - nos casos previstos no art. 122;\nXIII - afastamento por processo administrativo, se o funcionário for declarado inocente ou se a pena imposta for de repreensão ou multa; e, ainda, os dias que excederem o total da pena de suspensão efetivamente aplicada;\nXIV - trânsito, em decorrência de mudança de sede de exercício, desde que não exceda o prazo de 8 (oito) dias; e\nXV - provas de competições desportivas, nos termos do item I, do § 2°, do art. 75.\nXVI - nascimento de filho, por um dia, ao pai, no decorrer da primeira semana. (NR)\n- Inciso XVI acrescentado pela Lei Complementar n° 445, de 01/04/1986 .\nXVI - licença-paternidade, por 5 (cinco) dias; (NR)\n- Inciso XVI com redação dada pela Lei Complementar n° 1.054, de 07/07/2008 .\nXVI - licença-paternidade; (NR)\n- Inciso XVI com redação dada pela Lei n° 18.473, de 03/06/2026 .\n- Vide artigo 4° da Lei Complementar n° 1.054, de 07/07/2008 .\nXVII - licença para doação de tecidos, de órgãos, de parte de órgãos e de partes do corpo vivo para fins terapêuticos ou de transplantes intervivos, nos termos do inciso X do artigo 181. (NR)\n- Inciso XVII acrescentado pela Lei Complementar n° 1.361, de 21/10/2021 , com efeitos a partir do primeiro dia do mês subsequente à data da sua publicação.\nXVIII - licença por adoção ou guarda judicial para fins de adoção de que trata a Lei Complementar n° 367, de 14 de dezembro de 1984 . (NR)\n- Inciso XVIII acrescentado pela Lei n° 18.473, de 03/06/2026 ."},"110":{"topicId":"OJ26-DADM-L10261-11","texto":"Artigo 110 - O funcionário perderá:\nI - o vencimento ou remuneração do dia. quando não comparecer ao serviço, salvo no caso previsto no § 1° deste artigo; e\nI - o vencimento ou remuneração do dia, quando não comparecer ao serviço; (NR)\n- Inciso I com redação dada pela Lei Complementar n° 1.361, de 21/10/2021 , com efeitos a partir do primeiro dia do mês subsequente à data da sua publicação.\nII - 1/3 (um terço) do vencimento ou remuneração diária, quando comparecer ao serviço dentro da hora seguinte à marcada para o início do expediente ou quando dele retirar-se dentro da última hora.\n- Vide artigo 72 da Lei Complementar n° 1.374, de 30/03/2022 , com efeitos a partir de 60 (sessenta) dias após a data da sua publicação.\n§ 1° — As faltas ao serviço, até o máximo de 6 (seis) por ano, não excedendo a uma por mês, poderão ser abonadas por motivo de moléstia comprovada, mediante apresentação de atestado médico no primeiro dia em que comparecer ao serviço.\n§ 1° - As faltas ao serviço, até o máximo de 6 (seis) por ano, não excedendo a uma por mês, em razão de moléstia ou outro motivo relevante, poderão ser abonadas pelo superior imediato, a requerimento do funcionário, no primeiro dia útil subseqüente ao da falta. (NR)\n- § 1° com redação dada pela Lei Complementar n° 294, de 02/09/1982 .\n§ 1° - Revogado.\n- § 1° revogado pela Lei Complementar n° 1.361, de 21/10/2021 , com efeitos a partir do primeiro dia do mês subsequente à data da sua publicação.\n§ 2° - No caso de faltas sucessivas, justificadas ou injustificadas, os dias intercalados — domingos, feriados e aqueles em que não haja expediente — serão computados exclusivamente para efeito de desconto do vencimento ou remuneração.\n- Vide artigo 72 da Lei Complementar n° 1.374, de 30/03/2022 , com efeitos a partir de 60 (sessenta) dias após a data da sua publicação.\n§ 3° - Não se aplica o disposto no ‘caput’ deste artigo às hipóteses de compensação de horas previstas no parágrafo único do artigo 117 desta Lei. (NR)\n- § 3° acrescentado pela Lei Complementar n° 1.361, de 21/10/2021 , com efeitos a partir do primeiro dia do mês subsequente à data da sua publicação.\n§ 4° - O disposto no inciso II e no § 2° deste artigo não se aplicam aos integrantes do Quadro do Magistério da Secretaria da Educação. (NR)\n- § 4° acrescentado pela Lei Complementar n° 1.374, de 30/03/2022 , com efeitos a partir de 60 (sessenta) dias após a data da sua publicação,"},"120":{"topicId":"OJ26-DADM-L10261-12","texto":"Artigo 120 - Ponto é o registro pelo qual se verificará, diariamente, a entrada e saída do funcionário em serviço.\n§ 1° - Para registro do ponto serão usados, de preferência, meios mecânicos.\n§ 2° - É vedado dispensar o funcionário do registro do ponto, salvo os casos expressamente previstos em lei.\n§ 3° - A infração do disposto no parágrafo anterior determinará a responsabilidade da autoridade que tiver expedido a ordem, sem prejuízo da ação disciplinar cabível."},"127":{"topicId":"OJ26-DADM-L10261-13","texto":"Artigo 127 - O funcionário terá direito, após cada período de 5 (cinco) anos, contínuos, ou não, à percepção de adicional por tempo de serviço, calculado à razão de 5% (cinco por cento) sobre o vencimento ou remuneração, a que se incorpora para todos os efeitos.\nParágrafo único - O adicional por tempo de serviço será concedido pela autoridade competente, na forma que fôr estabelecida em regulamento.\nParágrafo único - O adicional por tempo de serviço será concedido pela autoridade competente, na forma que for estabelecida em regulamento, no prazo máximo de 180 (cento e oitenta) dias, contados da data da completação do período aquisitivo, sob pena de ser responsabilizado o servidor que der causa ao descumprimento do prazo ora fixado. (NR)\n- Parágrafo único com redação dada pela Lei Complementar n° 792, de 20/03/1995 .\nParágrafo único - O adicional por tempo de serviço será concedido pela autoridade competente, na forma que fôr estabelecida em regulamento.\n- Parágrafo único com redação original restaurada. Lei Complementar n° 792, de 20/03/1995 , declarada inconstitucional, em controle concentrado, pelo Supremo Tribunal Federal nos autos da ADI n° 3.167 ."},"176":{"topicId":"OJ26-DADM-L10261-14","texto":"Artigo 176 - O funcionário terá direito ao gozo de 30 (trinta) dias de férias anuais, observada a escala que for aprovada.\n§ 1° - É proibido levar à conta de férias qualquer falta ao trabalho.\n§ 2° - É proibida a acumulação de férias, salvo por absoluta necessidade de serviço e pelo máximo de 2 (dois) anos consecutivos.\n§ 2° - É proibida a acumulação de férias, salvo por absoluta necessidade do serviço, até o máximo de 2 (dois) anos consecutivos ou não. (NR)\n- § 2° com redação dada pela Lei Complementar n° 1.437, de 23/12/2025 .\n§ 3° - O período de férias será reduzido para 20 (vinte) dias, se o servidor, no exercício anterior, tiver, considerados em conjunto, mais de 10 (dez) não comparecimentos correspondentes a faltas abonadas, justificadas e injustificadas ou às licenças previstas nos itens IV, VI e VII do art. 181.\n§ 3° - O período de férias será reduzido para 20 (vinte) dias, se o funcionário, no exercício anterior, tiver, considerados em conjunto, mais de 10 (dez) não comparecimentos correspondentes a faltas justificadas e injustificadas ou às licenças previstas nos itens IV, VI e VII do artigo 181. (NR)\n- § 3° com redação dada pela Lei Complementar n° 1.361, de 21/10/2021 , com efeitos a partir do primeiro dia do mês subsequente à data da sua publicação.\n§ 4° - Durante as férias, o funcionário terá direito a todas as vantagens, como se estivesse em exercício."},"241":{"topicId":"OJ26-DADM-L10261-15","texto":"Artigo 241 - São deveres do funcionário:\nI - ser assíduo e pontual;\nII - cumprir as ordens superiores, representando quando forem manifestamente ilegais;\nIII - desempenhar com zelo e presteza os trabalhos de que for incumbido;\nIV - guardar sigilo sobre os assuntos da repartição e, especialmente, sobre despachos, decisões ou providências;\nV - representar aos superiores sobre todas as irregularidades de que tiver conhecimento no exercício de suas funções;\nVI - tratar com urbanidade os companheiros de serviço e as partes;\nVI - tratar com urbanidade as pessoas; (NR)\n- Inciso VI com redação dada pela Lei Complementar n° 1.096, de 24/09/2009 .\nVII - residir no local onde exerce o cargo ou, onde autorizado;\nVIII - providenciar para que esteja sempre em ordem, no assentamento individual, a sua declaração de família;\nIX - zelar pela economia do material do Estado e pela conservação do que for confiado à sua guarda ou utilização;\nX - apresentar -se convenientemente trajado em serviço ou com uniforme determinado, quando for o caso;\nXI - atender prontamente, com preferência sobre qualquer outro serviço, às requisições de papéis, documentos, informações ou providências que lhe forem feitas pelas autoridades judiciárias ou administrativas, para defesa do Estado, em Juízo;\nXII - cooperar e manter espírito de solidariedade com os companheiros de trabalho,\nXIII - estar em dia com as leis, regulamentos, regimentos, instruções e ordens de serviço que digam respeito às suas funções; e\nXIV - proceder na vida pública e privada na forma que dignifique a função pública.\nParágrafo único - Será considerado cumprido o dever a que se refere o inciso V deste artigo quando o funcionário apresentar denúncia sobre referida irregularidade diretamente à unidade de ouvidoria do órgão ou entidade a que esteja vinculado, ou a outro órgão da Administração com competência para apuração da irregularidade. (NR)\n- Parágrafo único acrescentado pela Lei Complementar n° 1.419, de 27/12/2024 .\nSEÇÃO II\nDas Proibições"},"242":{"topicId":"OJ26-DADM-L10261-15","texto":"Artigo 242 - Ao funcionário é proibido:\nI - referir-se depreciativamente, em informação, parecer ou despacho ou pela imprensa, ou qualquer meio de divugação, às autoridades constituídas e aos atos da Administração, podendo, porém, em trabalho devidamente assinado, apreciá-los sob o aspecto doutrinário e da organização e eficiência do serviço;\nI - Revogado.\n- Inciso I revogado pela Lei Complementar n° 1.096, de 24/09/2009 .\nII - retirar, sem prévia permissão da autoridade competente, qualquer documento ou objeto existente na repartição;\nIII - entreter-se, durante as horas de trabalho, em palestras, leituras ou outras atividades estranhas ao serviço;\nIV - deixar de comparecer ao serviço sem causa justificada;\nV - tratar de interesses particulares na repartição;\nVI - promover manifestações de apreço ou desapreço dentro da repartição, ou tornar-se solidário com elas;\nVII - exercer comércio entre os companheiros de serviço, promover ou subscrever listas de donativos dentro da repartição; e\nVIII - empregar material do serviço público em serviço particular."},"243":{"topicId":"OJ26-DADM-L10261-15","texto":"Artigo 243 - É proibido ainda, ao funcionário:\nI - fazer contratos de natureza comercial e industrial com o Governo, por si, ou como representante de outrem;\nII - participar da gerência ou administração de empresas bancárias ou industriais, ou de sociedades comerciais, que mantenham relações comerciais ou administrativas com o Governo do Estado, sejam por este subvencionadas ou estejam diretamente relacionadas com a finalidade da repartição ou serviço em que esteja lotado;\nIII - requerer ou promover a concessão de privilégios, garantias de juros ou outros favores semelhantes, federais, estaduais ou municipais, exceto privilégio de invenção própria;\nIV - exercer, mesmo fora das horas de trabalho, emprego ou função em empresas, estabelecimentos ou instituições que tenham relações com o Governo, em matéria que se relacione com a finalidade da repartição ou serviço em que esteja lotado;\nV - aceitar representação de Estado estrangeiro, sem autorização do Presidente da República;\nVI - comerciar ou ter parte em sociedades comerciais nas condições mencionadas no item II deste artigo, podendo, em qualquer caso, ser acionista, quotista ou comanditário;\nVII - incitar greves ou a elas aderir, ou praticar atos de sabotagem contra o serviço público;\nVIII - praticar a usura;\nIX - constituir-se procurador de partes ou servir de intermediário perante qualquer repartição pública, exceto quando se tratar de interesse de cônjuge ou parente até segundo grau;\nX - receber estipêndios de firmas fornecedoras ou de entidades fiscalizadas, no País, ou no estrangeiro, mesmo quando estiver em missão referente à compra de material ou fiscalização de qualquer natureza;\nXI - valer-se de sua qualidade de funcionário para desempenhar atividade estranha às funções ou para lograr, direta ou indiretamente, qualquer proveito; e\nXII - fundar sindicato de funcionários ou deles fazer parte.\nParágrafo único - Não está compreendida na proibição dos itens II e VI deste artigo, a participação do funcionário em sociedades em que o Estado seja acionista, bem assim na direção ou gerência de cooperativas e associações de classe, ou como seu sócio."},"251":{"topicId":"OJ26-DADM-L10261-16","texto":"Artigo 251 - São penas disciplinares:\nI - repreensão;\nII - suspensão;\nIII - multa;\nIV - demissão;\nV - demissão a bem do serviço público; e\nVI - cassação de aposentadoria ou disponibilidade"},"243-A":{"topicId":"OJ26-DADM-L10261-15","texto":"Artigo 243-A - O disposto no artigo 243, inciso IV, desta lei, não se aplica ao funcionário de órgão ou entidade concedente de estágio que atuar como professor orientador. (NR)\n- \"Caput\" acrescentado pela Lei Complementar n° 1.361, de 21/10/2021 , com efeitos a partir do primeiro dia do mês subsequente à data da sua publicação.\nParágrafo único - O funcionário de que trata o ‘caput’ deste artigo deverá evitar qualquer conflito de interesses e estará sujeito, inclusive, aos deveres de: (NR)\n- Parágrafo único acrescentado pela Lei Complementar n° 1.361, de 21/10/2021 , com efeitos a partir do primeiro dia do mês subsequente à data da sua publicação.\n1 - comunicar, ao superior hierárquico, qualquer circunstância, suspeição ou fato impeditivo de sua participação em decisão a ser tomada no âmbito da unidade administrativa; (NR)\n- Item 1 acrescentado pela Lei Complementar n° 1.361, de 21/10/2021 , com efeitos a partir do primeiro dia do mês subsequente à data da sua publicação.\n2 - abster-se de atuar nos processos ou procedimentos em que houver interesse da instituição de ensino. (NR)\n- Item 2 acrescentado pela Lei Complementar n° 1.361, de 21/10/2021 , com efeitos a partir do primeiro dia do mês subsequente à data da sua publicação."}}},"alesp-lei-11608-2003":{"id":"DIR-LESP-L11608","nome":"Lei n.º 11.608/2003","rotulo":"da Lei 11.608/2003 (taxa judiciária)","titulo":"Direito: Lei 11.608/2003 (taxa judiciária)","disciplina":"LESP","url":"https://www.al.sp.gov.br/repositorio/legislacao/lei/2003/lei-11608-29.12.2003.html","consultado_em":"2026-11-21","sha256":"41b754e31e8fc07a54948b25afb04005ae3217c22be91dcee6bbecbd23815a41","observacao":"Texto consolidado consultado em 21/11/2026; conferir se houve alteração após 14/10/2026 antes de tratar como definitivo.","artigos":{"1":{"topicId":"OJ26-LESP-L11608-01","texto":"Artigo 1° - A taxa judiciária, que tem por fato gerador a prestação de serviços públicos de natureza forense, devida pelas partes ao Estado, nas ações de conhecimento, na execução, nas ações cautelares, nos procedimentos de jurisdição voluntária e nos recursos, passa a ser regida por esta lei."},"2":{"topicId":"OJ26-LESP-L11608-01","texto":"Artigo 2° - A taxa judiciária abrange todos os atos processuais, inclusive os relativos aos serviços de distribuidor, contador, partidor, de hastas públicas, da Secretaria dos Tribunais, bem como as despesas com registros, intimações e publicações na Imprensa Oficial.\nParágrafo único - Na taxa judiciária não se incluem:\nI - as publicações de editais;\nII - as despesas com o porte de remessa e de retorno dos autos, no caso de recurso, cujo valor será estabelecido por ato do Conselho Superior da Magistratura;\nIII - as despesas postais com citações e intimações;\nIV - a comissão dos leiloeiros e assemelhados;\nV - a expedição de certidão, cartas de sentença, de arrematação, de adjudicação ou de remição, e a reprodução de peças do processo, cujos custos serão fixados periodicamente pelo Conselho Superior da Magistratura;\nVI - a remuneração do perito, assistente técnico, avaliador, depositário, tradutor, intérprete e administrador;\nVII - a indenização de viagem e diária de testemunha;\nVIII - as consultas de andamento dos processos por via eletrônica, ou da informática;\nIX - as despesas de diligências dos Oficiais de Justiça, salvo em relação aos mandados:\na) expedidos de ofício;\nb) requeridos pelo Ministério Público;\nc) do interesse de beneficiário de assistência judiciária;\nd) expedidos nos processos referidos no Artigo 5°, incisos I a IV;\nX - todas as demais despesas que não correspondam aos serviços relacionados no \"caput\" deste artigo.\nX - as despesas com o desarquivamento de processos e sua manutenção em arquivo, cujos custos serão fixados periodicamente pelo Conselho Superior da Magistratura; (NR)\n- Inciso X com redação dada pela Lei n° 14.838, de 23/07/2012 .\nX - a despesa com o desarquivamento de processo físico ou digital no Arquivo Geral do Tribunal ou em empresa terceirizada é fixada em 1,212 Unidade Fiscal do Estado de São Paulo (UFESP) e para processo arquivado nas Unidades Judiciais é fixada em 0,661 UFESP. (NR)\n- Inciso X com redação dada pela Lei n° 16.897, de 28/12/2018 .\nXI - a obtenção de informações da Secretaria da Receita Federal, das instituições bancárias e do cadastro de registro de veículos, via Infojud, BacenJud e Renajud, ou análogas, cujos custos serão fixados periodicamente pelo Conselho Superior da Magistratura; (NR)\n- Inciso XI acrescentado pela Lei n° 14.838, de 23/07/2012 .\nXI - a inclusão e a exclusão de ordens judiciais ou a obtenção de informações via sistemas informatizados, tais como Infojud, Sisbajud, Renajud, SerasaJud ou análogos, cujos custos serão fixados periodicamente pelo Conselho Superior da Magistratura; (NR)\n- Inciso XI com redação dada pela Lei n° 17.785, de 03/10/2023 .\nXII - todas as demais despesas não correspondentes aos serviços relacionados no \"caput\" deste artigo. (NR)\n- Inciso XII acrescentado pela Lei n° 14.838, de 23/07/2012 .\nXII - a obtenção das informações cadastrais do sistema SERASAJUD, cujos custos serão fixados periodicamente pelo Conselho Superior da Magistratura; (NR)\n- Inciso XII com redação dada pela Lei n° 15.855, de 02/07/2015 .\nXII - as despesas de arrombamento e remoção, nas ações de despejo e reintegração de posse, ou de quaisquer outras diligências preparatórias de ação ordenadas por magistrados, cujos custos serão fixados periodicamente pelo Conselho Superior da Magistratura; (NR)\n- Inciso XII com redação dada pela Lei n° 17.785, de 03/10/2023 .\nXIII - todas as demais despesas que não correspondam aos serviços relacionados no \"caput\" deste artigo. (NR)\n- Inciso XIII acrescentado pela Lei n° 15.855, de 02/07/2015 .\nXIII - o envio eletrônico de citações, intimações, ofícios e notificações, por qualquer meio eletrônico, cujos custos serão fixados periodicamente pelo Conselho Superior da Magistratura; (NR)\n- Inciso XIII com redação dada pela Lei n° 17.785, de 03/10/2023 .\nXIV - as despesas com restauração de autos e cancelamento de processos, cujos custos serão fixados periodicamente pelo Conselho Superior da Magistratura; (NR)\n- Inciso XIV acrescentado pela Lei n° 17.785, de 03/10/2023 .\nXV - todas as demais despesas que não correspondam aos serviços relacionados no \"caput\" deste artigo. (NR)\n- Inciso XV acrescentado pela Lei n° 17.785, de 03/10/2023 ."},"3":{"topicId":"OJ26-LESP-L11608-01","texto":"Artigo 3° - O valor e a forma de ressarcimento das despesas de condução dos Oficiais de Justiça, não incluídos na taxa judiciária, serão estabelecidos pelo Corregedor Geral da Justiça, nos termos dos parágrafos 1° e 2° do Artigo 19 do Código de Processo Civil, respectivamente.\nCAPÍTULO II\nDa Forma de Cálculo e do Momento do Recolhimento da Taxa"},"4":{"topicId":"OJ26-LESP-L11608-01","texto":"Artigo 4° - O recolhimento da taxa judiciária será feito da seguinte forma:\nI - 1% (um por cento) sobre o valor da causa no momento da distribuição ou, na falta desta, antes do despacho inicial; essa mesma regra se aplica às hipóteses de reconvenção e de oposição;\nI - 1,5% (um e meio por cento) sobre o valor da causa no momento da distribuição ou, na falta desta, antes do despacho inicial, aplicando-se esta mesma regra às hipóteses de reconvenção e oposição; (NR)\n- Inciso I com redação dada pela Lei n° 17.785, de 03/10/2023 .\nII - 2% (dois por cento) sobre o valor da causa, nos termos do Artigo 511 do Código de Processo Civil, como preparo da apelação e do recurso adesivo, ou, nos processos de competência originária do Tribunal, como preparo dos embargos infringentes;\nII - 4% (quatro por cento) sobre o valor da causa, nos termos do artigo 511 do Código de Processo Civil, como preparo da apelação e do recurso adesivo, ou, nos processos de competência originária do Tribunal, como preparo dos embargos infringentes; (NR)\n- Inciso II com redação dada pela Lei n° 15.855, de 02/07/2015 .\nII - 4% (quatro por cento) sobre o valor da causa, nos termos do artigo 1.007 do Código de Processo Civil, como preparo da apelação e do recurso adesivo; (NR)\n- Inciso II com redação dada pela Lei n° 17.785, de 03/10/2023 .\nIII - 1% (um por cento) ao ser satisfeita a execução.\nIII - 2% (dois por cento) sobre o valor da causa no momento da distribuição da execução de título extrajudicial; (NR)\n- Inciso III com redação dada pela Lei n° 17.785, de 03/10/2023 .\nIV - 2% (dois por cento) sobre o valor do crédito a ser satisfeito, por ocasião da instauração da fase de cumprimento de sentença. (NR)\n- Inciso IV acrescentado pela Lei n° 17.785, de 03/10/2023 .\n§ 1° - Os valores mínimo e máximo a recolher-se, em cada uma das hipóteses previstas nos incisos anteriores, equivalerão a 5 (cinco) e a 3.000 (três mil) UFESPs - Unidades Fiscais do Estado de São Paulo, respectivamente, segundo o valor de cada UFESP vigente no primeiro dia do mês em que deva ser feito o recolhimento.\n§ 2° - Nas hipóteses de pedido condenatório, o valor do preparo a que se refere o inciso II, será calculado sobre o valor fixado na sentença, se for líquido, ou, se ilíquido, sobre o valor fixado eqüitativamente para esse fim, pelo MM. Juiz de Direito, de modo a viabilizar o acesso à Justiça, observado o disposto no § 1°.\n§ 3° - Nas cartas de ordem e nas cartas precatórias, além de outras despesas ressalvadas no parágrafo único do Artigo 2°, o valor da taxa judiciária será de 10 (dez) UFESPs.\n§ 4° - O Conselho Superior da Magistratura baixará Provimento fixando os valores a serem recolhidos para cobrir as despesas postais, para fins de citação e intimação, bem como com o porte de remessa e de retorno dos autos, no caso de interposição de recurso, como previsto no Artigo 511 do Código de Processo Civil.\n§ 5° - A petição do agravo de instrumento deverá ser instruída com o comprovante do pagamento da taxa judiciária correspondente a 10 (dez) UFESPs e do porte de retorno, fixado na forma do parágrafo anterior, nos termos do § 1° do Artigo 525 do Código de Processo Civil.\n§5° - A petição do agravo de instrumento deverá ser instruída com o comprovante de pagamento da taxa judiciária correspondente a 15 (quinze) UFESPs e do porte de retorno, fixado na forma do parágrafo anterior, nos termos do art. 1.007 do Código de Processo Civil. (NR)\n- § 5° com redação dada pela Lei n° 17.785, de 03/10/2023 .\n§ 6° - Na ação popular, a taxa será paga a final (Artigo 10 da Lei Federal n° 4.717, de 29 de junho de 1965) e, na ação civil pública, na forma prevista no Artigo 18 da Lei n° 7.347, de 24 de julho de 1985.\n§ 7° - Nos inventários, arrolamentos e nas causas de separação judicial e de divórcio, e outras, em que haja partilha de bens ou direitos, a taxa judiciária será recolhida antes da adjudicação ou da homologação da partilha, observado o disposto no § 2° do Artigo 1.031, do Código de Processo Civil, de acordo com a seguinte tabela, considerado o valor total dos bens que integram o monte mor, inclusive a meação do cônjuge supérstite, nos inventários e arrolamentos:\n1 - até R$ 50.000,00................................................... UFESPs\n2 - de R$ 50.001,00 até R$ 500.000,00............……...100 UFESPs\n3 - de R$ 500.001,00 até R$ 2.000.000,00.........……..300 UFESPs\n4 - de R$ 2.000.001,00 até R$ 5.000.000,00...……….1.000 UFESPs\n5 - acima de R$ 5.000.000,00............................……..3.000 UFESPs\n§ 8° - No caso de habilitação retardatária de crédito em processo de concordata, a credora recolherá a taxa judiciária na forma prevista nos incisos I e II do Artigo 4°, calculada sobre o valor atualizado do crédito, observados os limites estabelecidos no § 1°.\n§ 8° - No caso de habilitação retardatária de crédito em processo de recuperação judicial e de falência, o credor recolherá a taxa judiciária na forma prevista nos incisos I e II do artigo 4°, calculada sobre o valor atualizado do crédito, observados os limites estabelecidos no § 1°. (NR)\n- § 8° com redação dada pela Lei n° 15.760, de 31/03/2015 .\n§ 9° - Nas ações penais, salvo aquelas de competência do Juizado Especial Criminal - JECRIM, em primeiro grau de jurisdição, o recolhimento da taxa judiciária será feito da seguinte forma:\na) nas ações penais, em geral, o valor equivalente a 100 (cem) UFESPs, será pago, a final, pelo réu, se condenado;\nb) nas ações penais privadas, será recolhido o valor equivalente a 50 (cinqüenta) UFESPs no momento da distribuição, ou, na falta desta, antes do despacho inicial, bem como o valor equivalente a 50 (cinqüenta) UFESPs no momento da interposição do recurso cabível, nos termos do disposto no § 2° do Artigo 806 do Código de Processo Penal.\n§ 10 - Na hipótese de litisconsórcio ativo voluntário, além dos valores previstos nos incisos I e II, será cobrada a parcela equivalente a 10 (dez) Unidades Fiscais do Estado de São Paulo - UFESPs, para cada grupo de dez autores, ou fração, que exceder a primeira dezena.\n§ 11 - Nos casos de admissão de litisconsorte ativo voluntário ulterior e de assistente, cada qual deverá recolher o mesmo valor pago, até aquele momento, pelo autor da ação.\n§12 - O valor da causa, para fins de cálculo da taxa judiciária, em qualquer fase do processo, deverá ser sempre atualizado monetariamente. (NR)\n- § 12 acrescentado pela Lei n° 17.785, de 03/10/2023 .\n§13 - Ao dar início à execução, o exequente incluirá no demonstrativo de débito a taxa prevista nos incisos III e IV do presente artigo. (NR)\n- § 13 acrescentado pela Lei n° 17.785, de 03/10/2023 .\nCAPÍTULO III\nDo Diferimento e das Isenções"},"5":{"topicId":"OJ26-LESP-L11608-01","texto":"Artigo 5° - O recolhimento da taxa judiciária será diferido para depois da satisfação da execução quando comprovada, por meio idôneo, a momentânea impossibilidade financeira do seu recolhimento, ainda que parcial:\nI - nas ações de alimentos e nas revisionais de alimentos;\nII - nas ações de reparação de dano por ato ilícito extracontratual, quando promovidas pela própria vítima ou seus herdeiros;\nIII - na declaratória incidental;\nIV - nos embargos à execução.\nParágrafo único - O disposto no \"caput\" deste artigo aplica-se a pessoas físicas e a pessoas jurídicas."},"6":{"topicId":"OJ26-LESP-L11608-01","texto":"Artigo 6° - A União, o Estado, o Município e respectivas autarquias e fundações, assim como o Ministério Público estão isentos da taxa judiciária.\nCAPÍTULO IV\nDa Não Incidência"},"7":{"topicId":"OJ26-LESP-L11608-01","texto":"Artigo 7° - Não incidirá a taxa judiciária nas seguintes causas:\nI - as da jurisdição de menores;\nII - as de acidentes do trabalho;\nIII - as ações de alimentos em que o valor da prestação mensal não seja superior a 2 (dois) salários-mínimos.\nCAPÍTULO V\nDas Disposições Finais"},"8":{"topicId":"OJ26-LESP-L11608-01","texto":"Artigo 8° - Alterado para mais o valor da causa, a diferença da taxa será recolhida em até 30 (trinta) dias.\nParágrafo único - O recolhimento da diferença da taxa será diferido para final quando comprovada, por meio idôneo, a impossibilidade financeira de seu recolhimento, ainda que parcial, no prazo referido no \"caput\" deste artigo."},"9":{"topicId":"OJ26-LESP-L11608-01","texto":"Artigo 9° - Do montante da taxa judiciária arrecadada, 10% (dez por cento) serão destinados ao custeio das diligências dos Oficiais de Justiça indicadas no inciso IX do parágrafo único do Artigo 2° desta lei, e 21% (vinte e um por cento), ao Fundo Especial de Despesa do Tribunal de Justiça instituído pela Lei n° 8.876, de 2 de setembro de 1994 , e 9% (nove por cento) distribuídos, em partes iguais, aos Fundos Especiais de Despesas do Primeiro Tribunal de Alçada Civil, do Segundo Tribunal de Alçada Civil e do Tribunal de Alçada Criminal, instituídos pela Lei n° 9.653, de 14 de maio de 1997 , para expansão, aperfeiçoamento e modernização do Poder Judiciário do Estado."},"10":{"topicId":"OJ26-LESP-L11608-01","texto":"Artigo 10 - O Artigo 3° da Lei n° 8.876, de 2 de setembro de 1994 , com a redação dada pelo Artigo 8° da Lei n° 9.653, de 14 de maio de 1997 , passa a vigorar acrescido do inciso I, renumerando-se os demais, com a seguinte redação:\n\"Artigo 3° - ...............................................................\nI - 21% (vinte e um por cento) do valor arrecadado a título de taxa judiciária, que será repassado, mensalmente, pela Secretaria da Fazenda do Estado;\""},"11":{"topicId":"OJ26-LESP-L11608-01","texto":"Artigo 11 - O Artigo 3° da Lei n° 9.653, de 14 de maio de 1997 , passa a vigorar acrescido do inciso I, renumerando-se os demais, com a seguinte redação:\n\"Artigo 3° - ..............................................................\nI - 9% (nove por cento) do valor arrecadado a título de taxa judiciária, que será repassado, mensalmente, pela Secretaria da Fazenda do Estado, na seguinte conformidade:\na) 3% (três por cento) para o Fundo Especial de Despesa - Poder Judiciário - Primeiro Tribunal de Alçada Civil, a que se refere o inciso I do Artigo 1° desta lei;\nb) 3% (três por cento) para o Fundo Especial de Despesa - Poder Judiciário - Segundo Tribunal de Alçada Civil, a que se refere o inciso II do Artigo 1° desta lei;\nc) 3% (três por cento) para o Fundo Especial de Despesa - Poder Judiciário - Tribunal de Alçada Criminal, a que se refere o inciso III do Artigo 1° desta lei.-"},"12":{"topicId":"OJ26-LESP-L11608-01","texto":"Artigo 12 - Esta lei entra em vigor na data de sua publicação e produzirá efeitos a partir de 1° de janeiro de 2004, revogadas as disposições em contrário, em especial as contidas nas Leis n°s. 4.476, de 20 de dezembro de 1984, e 4.952, de 27 de dezembro de 1985.\nPalácio dos Bandeirantes, 29 de dezembro de 2003.\nGERALDO ALCKMIN\nAlexandre de Moraes\nSecretário da Justiça e da Defesa da Cidadania\nEduardo Refinetti Guardia\nSecretário da Fazenda\nAndrea Sandro Calabi\nSecretário de Economia e Planejamento\nArnaldo Madeira\nSecretário-Chefe da Casa Civil\nPublicada na Assessoria Técnico-Legislativa, aos 29 de dezembro de 2003."}}},"tjsp-nscgj-tomo1":{"id":"DIR-LESP-NSCGJ","nome":"Normas Judiciais da Corregedoria Geral da Justiça (Tomo I)","rotulo":"das Normas de Serviço da Corregedoria Geral da Justiça (Tomo I)","titulo":"Direito: Normas da Corregedoria Geral da Justiça (Tomo I)","disciplina":"LESP","url":"https://api.tjsp.jus.br/Handlers/Handler/FileFetch.ashx?codigo=203718","consultado_em":"2026-11-21","sha256":"6e23fa86153e42192caa43858573ab8e8e4844f11a247fb3f767e94e28d9537b","observacao":"Texto atualizado até 22/10/2026; o edital manda considerar a legislação vigente até a publicação (14/10/2026). Alterações entre 14 e 22/10/2026, se houver, não foram separadas.","artigos":{"1":{"topicId":"OJ26-LESP-NSCGJ-01","texto":"Art. 1º A Corregedoria Geral da Justiça alinha-se às diretrizes do Conselho\nNacional de Justiça, Presidência, Conselho Superior da Magistratura e Órgão Especial\ndo Tribunal de Justiça do Estado de São Paulo, na implementação de um Poder\nJudiciário voltado para a eficiência, no intuito de reconhecimento pela Sociedade como\nefetivo instrumento de justiça, equidade e paz social."},"2":{"topicId":"OJ26-LESP-NSCGJ-01","texto":"Art. 2º São princípios institucionais da Corregedoria Geral da Justiça:\nI - a eticidade;\nII - a imparcialidade;\nIII - a probidade;\nIV - a transparência administrativa e processual;\nV - o aperfeiçoamento da qualidade e produtividade dos serviços prestados;\nVI - a satisfação e bom atendimento do usuário, sem preconceitos de\norigem, raça, sexo, cor, idade, condição social, filiação religiosa, orientação sexual e\nquaisquer outras formas de discriminação; 1\nVII - a celeridade processual;\nVIII - a acessibilidade;\nIX - a responsabilidade social e ambiental;\nX - a responsabilidade na gestão da informação e do conhecimento;\nXI - a credibilidade;\nXII - o aprimoramento dos canais de comunicação internos e externos;\nXIII - a modernização tecnológica.\nParágrafo único. Os princípios contidos neste artigo, de observância\nobrigatória, contínua e permanente, conformam a existência da Corregedoria Geral da\nJustiça, regem sua atuação normativa, orientadora, reorganizadora, fiscalizadora e\ndisciplinar-punitiva e norteiam a conduta de todos os órgãos e agentes a ela\nsubordinados."},"3":{"topicId":"OJ26-LESP-NSCGJ-01","texto":"Art. 3º A Corregedoria Geral da Justiça estimulará a conciliação entre as\npartes, divulgará decisões judiciais predominantes em litígios recorrentes e incentivará\no debate sobre o significado do princípio da dignidade da pessoa e o respeito aos\ndireitos fundamentais como forma de prevenção de conflitos."},"4":{"topicId":"OJ26-LESP-NSCGJ-01","texto":"Art. 4º Para a efetivação da missão, observância dos princípios e medidas\ninstitucionais contidos neste capítulo, os órgãos subordinados à Corregedoria Geral da\nJustiça adotarão, de imediato, os seguintes instrumentos de gestão:\nI - a desconcentração do processo decisório na resolução de problemas da\nunidade, em reuniões periódicas sob a coordenação do escrivão judicial, facultada a\nparticipação de todos os servidores;\nII - o sistema de gestão por atividades;\nIII – o aprimoramento dos procedimentos, sem prejuízo da segurança, da\ncompletude dos atos judiciais e do devido processo legal, de forma a torná-los\nsimplificados, padronizados, integrados e convergentes entre as diversas áreas, de\nmodo a evitar superposição de competências e repetição de serviços;\nIV - a incorporação, na dinâmica institucional:\na) da cultura da melhoria e da adaptação contínuas;\n1\nProv. CG 15/2020.\nb) da cooperação, colaboração, respeito e urbanidade entre os servidores,\nindependentemente da função desempenhada;\nc) da excelência no atendimento do público externo (partes, advogados e\npopulação em geral);\nV - o constante treinamento e ações de transferência de conhecimentos,\nmediante revezamento periódico de atribuições, para que todos os funcionários\ndominem por completo a integralidade dos procedimentos e serviços desempenhados\npela unidade judicial, respeitando-se, contudo, as competências legais do cargo;\nVI – a identificação de talentos, o incentivo à habilidade e ao conhecimento\ndos servidores, o fomento de boas práticas, visando à sistemática revisão e melhoria\ndas rotinas de trabalho;\nVII - a satisfação do usuário, mediante:\na) uma prestação célere e eficiente dos serviços judiciais e administrativos\ndisponibilizados;\nb) o recebimento de críticas, sugestões e reclamações, ou o\nencaminhamento dos interessados aos órgãos competentes para o processamento\ndessas demandas;\nc) um tratamento interpessoal educado, cortês e respeitoso;\nd) a utilização de linguagem clara e acessível em todas as informações\nverbais, publicações ou divulgações oficiais.\n§ 1º A implementação dos instrumentos de gestão previstos neste artigo não\nimporta em inobservância das rotinas e procedimentos estabelecidos nas Normas de\nServiço. Se a unidade estiver sob intervenção específica da Corregedoria, observar-se-\ná o método de trabalho resultante da excepcionalidade.\n§ 2º As medidas ora editadas serão implementadas sob a coordenação e\nresponsabilidade do escrivão judicial, mediante colaboração de toda a equipe e\nfiscalização do Juiz Corregedor Permanente.\n§ 3º O Juiz Corregedor Permanente, ao constatar a eficácia das\nprovidências adotadas, poderá indicar à Corregedoria Geral da Justiça os nomes dos\nservidores que mereçam elogio em ficha funcional.\n§ 4º As propostas de inovação experimentadas e consideradas exitosas\npoderão ser submetidas à análise da Corregedoria Geral da Justiça, para extensão às\ndemais unidades de serviço.\n1\nProv. CG 15/2020.\nCAPÍTULO II\nDA FUNÇÃO CORRECIONAL\nSeção I\nDas Atribuições"},"33":{"topicId":"OJ26-LESP-NSCGJ-02","texto":"Art. 33. Os servidores registrarão diariamente, na entrada e saída, o ponto\

r calendário para a prática dos atos processuais, quando for o caso.\n§ 1º O calendário vincula as partes e o juiz, e os prazos nele previstos somente serão modificados em casos excepcionais, devidamente justificados.\n§ 2º Dispensa-se a intimação das partes para a prática de ato processual ou a realização de audiência cujas datas tiverem sido designadas no calendário."},"192":{"topicId":"OJ26-DPCI-CPC-14","texto":"Art. 192. Em todos os atos e termos do processo é obrigatório o uso da língua portuguesa.\nParágrafo único. O documento redigido em língua estrangeira somente poderá ser juntado aos autos quando acompanhado de versão para a língua portuguesa tramitada por via diplomática ou pela autoridade central, ou firmada por tradutor juramentado."},"193":{"topicId":"OJ26-DPCI-CPC-14","texto":"Art. 193. Os atos processuais podem ser total ou parcialmente digitais, de forma a permitir que sejam produzidos, comunicados, armazenados e validados por meio eletrônico, na forma da lei.\nParágrafo único. O disposto nesta Seção aplica-se, no que for cabível, à prática de atos notariais e de registro."},"194":{"topicId":"OJ26-DPCI-CPC-14","texto":"Art. 194. Os sistemas de automação processual respeitarão a publicidade dos atos, o acesso e a participação das partes e de seus procuradores, inclusive nas audiências e sessões de julgamento, observadas as garantias da disponibilidade, independência da plataforma computacional, acessibilidade e interoperabilidade dos sistemas, serviços, dados e informações que o Poder Judiciário administre no exercício de suas funções."},"195":{"topicId":"OJ26-DPCI-CPC-14","texto":"Art. 195. O registro de ato processual eletrônico deverá ser feito em padrões abertos, que atenderão aos requisitos de autenticidade, integridade, temporalidade, não repúdio, conservação e, nos casos que tramitem em segredo de justiça, confidencialidade, observada a infraestrutura de chaves públicas unificada nacionalmente, nos termos da lei."},"196":{"topicId":"OJ26-DPCI-CPC-14","texto":"Art. 196. Compete ao Conselho Nacional de Justiça e, supletivamente, aos tribunais, regulamentar a prática e a comunicação oficial de atos processuais por meio eletrônico e velar pela compatibilidade dos sistemas, disciplinando a incorporação progressiva de novos avanços tecnológicos e editando, para esse fim, os atos que forem necessários, respeitadas as normas fundamentais deste Código."},"197":{"topicId":"OJ26-DPCI-CPC-14","texto":"Art. 197. Os tribunais divulgarão as informações constantes de seu sistema de automação em página própria na rede mundial de computadores, gozando a divulgação de presunção de veracidade e confiabilidade.\nParágrafo único. Nos casos de problema técnico do sistema e de erro ou omissão do auxiliar da justiça responsável pelo registro dos andamentos, poderá ser configurada a justa causa prevista no art. 223, caput e § 1º."},"198":{"topicId":"OJ26-DPCI-CPC-14","texto":"Art. 198. As unidades do Poder Judiciário deverão manter gratuitamente, à disposição dos interessados, equipamentos necessários à prática de atos processuais e à consulta e ao acesso ao sistema e aos documentos dele constantes.\nParágrafo único. Será admitida a prática de atos por meio não eletrônico no local onde não estiverem disponibilizados os equipamentos previstos no caput."},"199":{"topicId":"OJ26-DPCI-CPC-14","texto":"Art. 199. As unidades do Poder Judiciário assegurarão às pessoas com deficiência acessibilidade aos seus sítios na rede mundial de computadores, ao meio eletrônico de prática de atos judiciais, à comunicação eletrônica dos atos processuais e à assinatura eletrônica."},"203":{"topicId":"OJ26-DPCI-CPC-15","texto":"Art. 203. Os pronunciamentos do juiz consistirão em sentenças, decisões interlocutórias e despachos.\n§ 1º Ressalvadas as disposições expressas dos procedimentos especiais, sentença é o pronunciamento por meio do qual o juiz, com fundamento nos arts. 485 e 487, põe fim à fase cognitiva do procedimento comum, bem como extingue a execução.\n§ 2º Decisão interlocutória é todo pronunciamento judicial de natureza decisória que não se enquadre no § 1º.\n§ 3º São despachos todos os demais pronunciamentos do juiz praticados no processo, de ofício ou a requerimento da parte.\n§ 4º Os atos meramente ordinatórios, como a juntada e a vista obrigatória, independem de despacho, devendo ser praticados de ofício pelo servidor e revistos pelo juiz quando necessário."},"204":{"topicId":"OJ26-DPCI-CPC-15","texto":"Art. 204. Acórdão é o julgamento colegiado proferido pelos tribunais."},"205":{"topicId":"OJ26-DPCI-CPC-15","texto":"Art. 205. Os despachos, as decisões, as sentenças e os acórdãos serão redigidos, datados e assinados pelos juízes.\n§ 1º Quando os pronunciamentos previstos no caput forem proferidos oralmente, o servidor os documentará, submetendo-os aos juízes para revisão e assinatura.\n§ 2º A assinatura dos juízes, em todos os graus de jurisdição, pode ser feita eletronicamente, na forma da lei.\n§ 3º Os despachos, as decisões interlocutórias, o dispositivo das sentenças e a ementa dos acórdãos serão publicados no Diário de Justiça Eletrônico."},"206":{"topicId":"OJ26-DPCI-CPC-15","texto":"Art. 206. Ao receber a petição inicial de processo, o escrivão ou o chefe de secretaria a autuará, mencionando o juízo, a natureza do processo, o número de seu registro, os nomes das partes e a data de seu início, e procederá do mesmo modo em relação aos volumes em formação."},"207":{"topicId":"OJ26-DPCI-CPC-15","texto":"Art. 207. O escrivão ou o chefe de secretaria numerará e rubricará todas as folhas dos autos.\nParágrafo único. À parte, ao procurador, ao membro do Ministério Público, ao defensor público e aos auxiliares da justiça é facultado rubricar as folhas correspondentes aos atos em que intervierem."},"208":{"topicId":"OJ26-DPCI-CPC-15","texto":"Art. 208. Os termos de juntada, vista, conclusão e outros semelhantes constarão de notas datadas e rubricadas pelo escrivão ou pelo chefe de secretaria."},"209":{"topicId":"OJ26-DPCI-CPC-15","texto":"Art. 209. Os atos e os termos do processo serão assinados pelas pessoas que neles intervierem, todavia, quando essas não puderem ou não quiserem firmá-los, o escrivão ou o chefe de secretaria certificará a ocorrência.\n§ 1º Quando se tratar de processo total ou parcialmente documentado em autos eletrônicos, os atos processuais praticados na presença do juiz poderão ser produzidos e armazenados de modo integralmente digital em arquivo eletrônico inviolável, na forma da lei, mediante registro em termo, que será assinado digitalmente pelo juiz e pelo escrivão ou chefe de secretaria, bem como pelos advogados das partes.\n§ 2º Na hipótese do § 1º, eventuais contradições na transcrição deverão ser suscitadas oralmente no momento de realização do ato, sob pena de preclusão, devendo o juiz decidir de plano e ordenar o registro, no termo, da alegação e da decisão."},"210":{"topicId":"OJ26-DPCI-CPC-15","texto":"Art. 210. É lícito o uso da taquigrafia, da estenotipia ou de outro método idôneo em qualquer juízo ou tribunal."},"211":{"topicId":"OJ26-DPCI-CPC-15","texto":"Art. 211. Não se admitem nos atos e termos processuais espaços em branco, salvo os que forem inutilizados, assim como entrelinhas, emendas ou rasuras, exceto quando expressamente ressalvadas."},"212":{"topicId":"OJ26-DPCI-CPC-15","texto":"Art. 212. Os atos processuais serão realizados em dias úteis, das 6 (seis) às 20 (vinte) horas.\n§ 1º Serão concluídos após as 20 (vinte) horas os atos iniciados antes, quando o adiamento prejudicar a diligência ou causar grave dano.\n§ 2º Independentemente de autorização judicial, as citações, intimações e penhoras poderão realizar-se no período de férias forenses, onde as houver, e nos feriados ou dias úteis fora do horário estabelecido neste artigo, observado o disposto no art. 5º, inciso XI, da Constituição Federal .\n§ 3º Quando o ato tiver de ser praticado por meio de petição em autos não eletrônicos, essa deverá ser protocolada no horário de funcionamento do fórum ou tribunal, conforme o disposto na lei de organização judiciária local."},"213":{"topicId":"OJ26-DPCI-CPC-15","texto":"Art. 213. A prática eletrônica de ato processual pode ocorrer em qualquer horário até as 24 (vinte e quatro) horas do último dia do prazo.\nParágrafo único. O horário vigente no juízo perante o qual o ato deve ser praticado será considerado para fins de atendimento do prazo."},"214":{"topicId":"OJ26-DPCI-CPC-15","texto":"Art. 214. Durante as férias forenses e nos feriados, não se praticarão atos processuais, excetuando-se:\nI - os atos previstos no art. 212, § 2º;\nII - a tutela de urgência."},"215":{"topicId":"OJ26-DPCI-CPC-15","texto":"Art. 215. Processam-se durante as férias forenses, onde as houver, e não se suspendem pela superveniência delas:\nI - os procedimentos de jurisdição voluntária e os necessários à conservação de direitos, quando puderem ser prejudicados pelo adiamento;\nII - a ação de alimentos e os processos de nomeação ou remoção de tutor e curador;\nIII - os processos que a lei determinar."},"216":{"topicId":"OJ26-DPCI-CPC-15","texto":"Art. 216. Além dos declarados em lei, são feriados, para efeito forense, os sábados, os domingos e os dias em que não haja expediente forense."},"217":{"topicId":"OJ26-DPCI-CPC-15","texto":"Art. 217. Os atos processuais realizar-se-ão ordinariamente na sede do juízo, ou, excepcionalmente, em outro lugar em razão de deferência, de interesse da justiça, da natureza do ato ou de obstáculo arguido pelo interessado e acolhido pelo juiz."},"218":{"topicId":"OJ26-DPCI-CPC-15","texto":"Art. 218. Os atos processuais serão realizados nos prazos prescritos em lei.\n§ 1º Quando a lei for omissa, o juiz determinará os prazos em consideração à complexidade do ato.\n§ 2º Quando a lei ou o juiz não determinar prazo, as intimações somente obrigarão a comparecimento após decorridas 48 (quarenta e oito) horas.\n§ 3º Inexistindo preceito legal ou prazo determinado pelo juiz, será de 5 (cinco) dias o prazo para a prática de ato processual a cargo da parte.\n§ 4º Será considerado tempestivo o ato praticado antes do termo inicial do prazo."},"219":{"topicId":"OJ26-DPCI-CPC-15","texto":"Art. 219. Na contagem de prazo em dias, estabelecido por lei ou pelo juiz, computar-se-ão somente os dias úteis.\nParágrafo único. O disposto neste artigo aplica-se somente aos prazos processuais."},"220":{"topicId":"OJ26-DPCI-CPC-15","texto":"Art. 220. Suspende-se o curso do prazo processual nos dias compreendidos entre 20 de dezembro e 20 de janeiro, inclusive.\n§ 1º Ressalvadas as férias individuais e os feriados instituídos por lei, os juízes, os membros do Ministério Público, da Defensoria Pública e da Advocacia Pública e os auxiliares da Justiça exercerão suas atribuições durante o período previsto no caput.\n§ 2º Durante a suspensão do prazo, não se realizarão audiências nem sessões de julgamento."},"221":{"topicId":"OJ26-DPCI-CPC-15","texto":"Art. 221. Suspende-se o curso do prazo por obstáculo criado em detrimento da parte ou ocorrendo qualquer das hipóteses do art. 313, devendo o prazo ser restituído por tempo igual ao que faltava para sua complementação.\nParágrafo único. Suspendem-se os prazos durante a execução de programa instituído pelo Poder Judiciário para promover a autocomposição, incumbindo aos tribunais especificar, com antecedência, a duração dos trabalhos."},"222":{"topicId":"OJ26-DPCI-CPC-15","texto":"Art. 222. Na comarca, seção ou subseção judiciária onde for difícil o transporte, o juiz poderá prorrogar os prazos por até 2 (dois) meses.\n§ 1º Ao juiz é vedado reduzir prazos peremptórios sem anuência das partes.\n§ 2º Havendo calamidade pública, o limite previsto no caput para prorrogação de prazos poderá ser excedido."},"223":{"topicId":"OJ26-DPCI-CPC-15","texto":"Art. 223. Decorrido o prazo, extingue-se o direito de praticar ou de emendar o ato processual, independentemente de declaração judicial, ficando assegurado, porém, à parte provar que não o realizou por justa causa.\n§ 1º Considera-se justa causa o evento alheio à vontade da parte e que a impediu de praticar o ato por si ou por mandatário.\n§ 2º Verificada a justa causa, o juiz permitirá à parte a prática do ato no prazo que lhe assinar."},"224":{"topicId":"OJ26-DPCI-CPC-15","texto":"Art. 224. Salvo disposição em contrário, os prazos serão contados excluindo o dia do começo e incluindo o dia do vencimento.\n§ 1º Os dias do começo e do vencimento do prazo serão protraídos para o primeiro dia útil seguinte, se coincidirem com dia em que o expediente forense for encerrado antes ou iniciado depois da hora normal ou houver indisponibilidade da comunicação eletrônica.\n§ 2º Considera-se como data de publicação o primeiro dia útil seguinte ao da disponibilização da informação no Diário da Justiça eletrônico.\n§ 3º A contagem do prazo terá início no primeiro dia útil que seguir ao da publicação."},"225":{"topicId":"OJ26-DPCI-CPC-15","texto":"Art. 225. A parte poderá renunciar ao prazo estabelecido exclusivamente em seu favor, desde que o faça de maneira expressa."},"226":{"topicId":"OJ26-DPCI-CPC-15","texto":"Art. 226. O juiz proferirá:\nI - os despachos no prazo de 5 (cinco) dias;\nII - as decisões interlocutórias no prazo de 10 (dez) dias;\nIII - as sentenças no prazo de 30 (trinta) dias."},"227":{"topicId":"OJ26-DPCI-CPC-15","texto":"Art. 227. Em qualquer grau de jurisdição, havendo motivo justificado, pode o juiz exceder, por igual tempo, os prazos a que está submetido."},"228":{"topicId":"OJ26-DPCI-CPC-15","texto":"Art. 228. Incumbirá ao serventuário remeter os autos conclusos no prazo de 1 (um) dia e executar os atos processuais no prazo de 5 (cinco) dias, contado da data em que:\nI - houver concluído o ato processual anterior, se lhe foi imposto pela lei;\nII - tiver ciência da ordem, quando determinada pelo juiz.\n§ 1º Ao receber os autos, o serventuário certificará o dia e a hora em que teve ciência da ordem referida no inciso II.\n§ 2º Nos processos em autos eletrônicos, a juntada de petições ou de manifestações em geral ocorrerá de forma automática, independentemente de ato de serventuário da justiça."},"229":{"topicId":"OJ26-DPCI-CPC-15","texto":"Art. 229. Os litisconsortes que tiverem diferentes procuradores, de escritórios de advocacia distintos, terão prazos contados em dobro para todas as suas manifestações, em qualquer juízo ou tribunal, independentemente de requerimento.\n§ 1º Cessa a contagem do prazo em dobro se, havendo apenas 2 (dois) réus, é oferecida defesa por apenas um deles.\n§ 2º Não se aplica o disposto no caput aos processos em autos eletrônicos."},"230":{"topicId":"OJ26-DPCI-CPC-15","texto":"Art. 230. O prazo para a parte, o procurador, a Advocacia Pública, a Defensoria Pública e o Ministério Público será contado da citação, da intimação ou da notificação."},"231":{"topicId":"OJ26-DPCI-CPC-15","texto":"Art. 231. Salvo disposição em sentido diverso, considera-se dia do começo do prazo:\nI - a data de juntada aos autos do aviso de recebimento, quando a citação ou a intimação for pelo correio;\nII - a data de juntada aos autos do mandado cumprido, quando a citação ou a intimação for por oficial de justiça;\nIII - a data de ocorrência da citação ou da intimação, quando ela se der por ato do escrivão ou do chefe de secretaria;\nIV - o dia útil seguinte ao fim da dilação assinada pelo juiz, quando a citação ou a intimação for por edital;\nV - o dia útil seguinte à consulta ao teor da citação ou da intimação ou ao término do prazo para que a consulta se dê, quando a citação ou a intimação for eletrônica;\nVI - a data de juntada do comunicado de que trata o art. 232 ou, não havendo esse, a data de juntada da carta aos autos de origem devidamente cumprida, quando a citação ou a intimação se realizar em cumprimento de carta;\nVII - a data de publicação, quando a intimação se der pelo Diário da Justiça impresso ou eletrônico;\nVIII - o dia da carga, quando a intimação se der por meio da retirada dos autos, em carga, do cartório ou da secretaria;\nIX - o quinto dia útil seguinte à confirmação, na forma prevista na mensagem de citação, do recebimento da citação realizada por meio eletrônico.\n§ 1º Quando houver mais de um réu, o dia do começo do prazo para contestar corresponderá à última das datas a que se referem os incisos I a VI do caput.\n§ 2º Havendo mais de um intimado, o prazo para cada um é contado individualmente.\n§ 3º Quando o ato tiver de ser praticado diretamente pela parte ou por quem, de qualquer forma, participe do processo, sem a intermediação de representante judicial, o dia do começo do prazo para cumprimento da determinação judicial corresponderá à data em que se der a comunicação.\n§ 4º Aplica-se o disposto no inciso II do caput à citação com hora certa."},"232":{"topicId":"OJ26-DPCI-CPC-15","texto":"Art. 232. Nos atos de comunicação por carta precatória, rogatória ou de ordem, a realização da citação ou da intimação será imediatamente informada, por meio eletrônico, pelo juiz deprecado ao juiz deprecante."},"233":{"topicId":"OJ26-DPCI-CPC-15","texto":"Art. 233. Incumbe ao juiz verificar se o serventuário excedeu, sem motivo legítimo, os prazos estabelecidos em lei.\n§ 1º Constatada a falta, o juiz ordenará a instauração de processo administrativo, na forma da lei.\n§ 2º Qualquer das partes, o Ministério Público ou a Defensoria Pública poderá representar ao juiz contra o serventuário que injustificadamente exceder os prazos previstos em lei."},"234":{"topicId":"OJ26-DPCI-CPC-15","texto":"Art. 234. Os advogados públicos ou privados, o defensor público e o membro do Ministério Público devem restituir os autos no prazo do ato a ser praticado.\n§ 1º É lícito a qualquer interessado exigir os autos do advogado que exceder prazo legal.\n§ 2º Se, intimado, o advogado não devolver os autos no prazo de 3 (três) dias, perderá o direito à vista fora de cartório e incorrerá em multa correspondente à metade do salário-mínimo.\n§ 3º Verificada a falta, o juiz comunicará o fato à seção local da Ordem dos Advogados do Brasil para procedimento disciplinar e imposição de multa.\n§ 4º Se a situação envolver membro do Ministério Público, da Defensoria Pública ou da Advocacia Pública, a multa, se for o caso, será aplicada ao agente público responsável pelo ato.\n§ 5º Verificada a falta, o juiz comunicará o fato ao órgão competente responsável pela instauração de procedimento disciplinar contra o membro que atuou no feito."},"235":{"topicId":"OJ26-DPCI-CPC-15","texto":"Art. 235. Qualquer parte, o Ministério Público ou a Defensoria Pública poderá representar ao corregedor do tribunal ou ao Conselho Nacional de Justiça contra juiz ou relator que injustificadamente exceder os prazos previstos em lei, regulamento ou regimento interno .\n§ 1º Distribuída a representação ao órgão competente e ouvido previamente o juiz, não sendo caso de arquivamento liminar, será instaurado procedimento para apuração da responsabilidade, com intimação do representado por meio eletrônico para, querendo, apresentar justificativa no prazo de 15 (quinze) dias.\n§ 2º Sem prejuízo das sanções administrativas cabíveis, em até 48 (quarenta e oito) horas após a apresentação ou não da justificativa de que trata o § 1º, se for o caso, o corregedor do tribunal ou o relator no Conselho Nacional de Justiça determinará a intimação do representado por meio eletrônico para que, em 10 (dez) dias, pratique o ato.\n§ 3º Mantida a inércia, os autos serão remetidos ao substituto legal do juiz ou do relator contra o qual se representou para decisão em 10 (dez) dias."},"236":{"topicId":"OJ26-DPCI-CPC-15","texto":"Art. 236. Os atos processuais serão cumpridos por ordem judicial.\n§ 1º Será expedida carta para a prática de atos fora dos limites territoriais do tribunal, da comarca, da seção ou da subseção judiciárias, ressalvadas as hipóteses previstas em lei.\n§ 2º O tribunal poderá expedir carta para juízo a ele vinculado, se o ato houver de se realizar fora dos limites territoriais do local de sua sede.\n§ 3º Admite-se a prática de atos processuais por meio de videoconferência ou outro recurso tecnológico de transmissão de sons e imagens em tempo real."},"237":{"topicId":"OJ26-DPCI-CPC-15","texto":"Art. 237. Será expedida carta:\nI - de ordem, pelo tribunal, na hipótese do § 2º do art. 236;\nIII - precatória, para que órgão jurisdicional brasileiro pratique ou determine o cumprimento, na área de sua competência territorial, de ato relativo a pedido de cooperação judiciária formulado por órgão jurisdicional de competência territorial diversa;\nIV - arbitral, para que órgão do Poder Judiciário pratique ou determine o cumprimento, na área de sua competência territorial, de ato objeto de pedido de cooperação judiciária formulado por juízo arbitral, inclusive os que importem efetivação de tutela provisória.\nParágrafo único. Se o ato relativo a processo em curso na justiça federal ou em tribunal superior houver de ser praticado em local onde não haja vara federal, a carta poderá ser dirigida ao juízo estadual da respectiva comarca."},"238":{"topicId":"OJ26-DPCI-CPC-15","texto":"Art. 238. Citação é o ato pelo qual são convocados o réu, o executado ou o interessado para integrar a relação processual.\nParágrafo único. A citação será efetivada em até 45 (quarenta e cinco) dias a partir da propositura da ação."},"239":{"topicId":"OJ26-DPCI-CPC-15","texto":"Art. 239. Para a validade do processo é indispensável a citação do réu ou do executado, ressalvadas as hipóteses de indeferimento da petição inicial ou de improcedência liminar do pedido.\n§ 1º O comparecimento espontâneo do réu ou do executado supre a falta ou a nulidade da citação, fluindo a partir desta data o prazo para apresentação de contestação ou de embargos à execução.\n§ 2º Rejeitada a alegação de nulidade, tratando-se de processo de:\nI - conhecimento, o réu será considerado revel;\nII - execução, o feito terá seguimento."},"240":{"topicId":"OJ26-DPCI-CPC-15","texto":"Art. 240. A citação válida, ainda quando ordenada por juízo incompetente, induz litispendência, torna litigiosa a coisa e constitui em mora o devedor, ressalvado o disposto nos arts. 397 e 398 da Lei nº 10.406, de 10 de janeiro de 2002 (Código Civil).\n§ 1º A interrupção da prescrição, operada pelo despacho que ordena a citação, ainda que proferido por juízo incompetente, retroagirá à data de propositura da ação.\n§ 2º Incumbe ao autor adotar, no prazo de 10 (dez) dias, as providências necessárias para viabilizar a citação, sob pena de não se aplicar o disposto no § 1º.\n§ 3º A parte não será prejudicada pela demora imputável exclusivamente ao serviço judiciário.\n§ 4º O efeito retroativo a que se refere o § 1º aplica-se à decadência e aos demais prazos extintivos previstos em lei."},"241":{"topicId":"OJ26-DPCI-CPC-15","texto":"Art. 241. Transitada em julgado a sentença de mérito proferida em favor do réu antes da citação, incumbe ao escrivão ou ao chefe de secretaria comunicar-lhe o resultado do julgamento."},"242":{"topicId":"OJ26-DPCI-CPC-15","texto":"Art. 242. A citação será pessoal, podendo, no entanto, ser feita na pessoa do representante legal ou do procurador do réu, do executado ou do interessado.\n§ 1º Na ausência do citando, a citação será feita na pessoa de seu mandatário, administrador, preposto ou gerente, quando a ação se originar de atos por eles praticados.\n§ 2º O locador que se ausentar do Brasil sem cientificar o locatário de que deixou, na localidade onde estiver situado o imóvel, procurador com poderes para receber citação será citado na pessoa do administrador do imóvel encarregado do recebimento dos aluguéis, que será considerado habilitado para representar o locador em juízo."},"243":{"topicId":"OJ26-DPCI-CPC-15","texto":"Art. 243. A citação poderá ser feita em qualquer lugar em que se encontre o réu, o executado ou o interessado.\nParágrafo único. O militar em serviço ativo será citado na unidade em que estiver servindo, se não for conhecida sua residência ou nela não for encontrado."},"244":{"topicId":"OJ26-DPCI-CPC-15","texto":"Art. 244. Não se fará a citação, salvo para evitar o perecimento do direito:\nI - de quem estiver participando de ato de culto religioso;\nII - de cônjuge, de companheiro ou de qualquer parente do morto, consanguíneo ou afim, em linha reta ou na linha colateral em segundo grau, no dia do falecimento e nos 7 (sete) dias seguintes;\nIII - de noivos, nos 3 (três) primeiros dias seguintes ao casamento;\nIV - de doente, enquanto grave o seu estado."},"245":{"topicId":"OJ26-DPCI-CPC-15","texto":"Art. 245. Não se fará citação quando se verificar que o citando é mentalmente incapaz ou está impossibilitado de recebê-la.\n§ 1º O oficial de justiça descreverá e certificará minuciosamente a ocorrência.\n§ 2º Para examinar o citando, o juiz nomeará médico, que apresentará laudo no prazo de 5 (cinco) dias.\n§ 3º Dispensa-se a nomeação de que trata o § 2º se pessoa da família apresentar declaração do médico do citando que ateste a incapacidade deste.\n§ 4º Reconhecida a impossibilidade, o juiz nomeará curador ao citando, observando, quanto à sua escolha, a preferência estabelecida em lei e restringindo a nomeação à causa.\n§ 5º A citação será feita na pessoa do curador, a quem incumbirá a defesa dos interesses do citando."},"246":{"topicId":"OJ26-DPCI-CPC-15","texto":"Art. 246. A citação será feita preferencialmente por meio eletrônico, no prazo de até 2 (dois) dias úteis, contado da decisão que a determinar, por meio dos endereços eletrônicos indicados pelo citando no banco de dados do Poder Judiciário, conforme regulamento do Conselho Nacional de Justiça.\n§ 1º As empresas públicas e privadas são obrigadas a manter cadastro nos sistemas de processo em autos eletrônicos, para efeito de recebimento de citações e intimações, as quais serão efetuadas preferencialmente por esse meio.\n- A ausência de confirmação, em até 3 (três) dias úteis, contados do recebimento da citação eletrônica, implicará a realização da citação:\nI - pelo correio;\nII - por oficial de justiça;\nIII - pelo escrivão ou chefe de secretaria, se o citando comparecer em cartório;\nIV - por edital.\n- Na primeira oportunidade de falar nos autos, o réu citado nas formas previstas nos incisos I, II, III e IV do § 1º-A deste artigo deverá apresentar justa causa para a ausência de confirmação do recebimento da citação enviada eletronicamente.\n- Considera-se ato atentatório à dignidade da justiça, passível de multa de até 5% (cinco por cento) do valor da causa, deixar de confirmar no prazo legal, sem justa causa, o recebimento da citação recebida por meio eletrônico.\n§ 2º O disposto no § 1º aplica-se à União, aos Estados, ao Distrito Federal, aos Municípios e às entidades da administração indireta.\n§ 3º Na ação de usucapião de imóvel, os confinantes serão citados pessoalmente, exceto quando tiver por objeto unidade autônoma de prédio em condomínio, caso em que tal citação é dispensada.\n§ 4º As citações por correio eletrônico serão acompanhadas das orientações para realização da confirmação de recebimento e de código identificador que permitirá a sua identificação na página eletrônica do órgão judicial citante.\n§ 5º As microempresas e as pequenas empresas somente se sujeitam ao disposto no § 1º deste artigo quando não possuírem endereço eletrônico cadastrado no sistema integrado da Rede Nacional para a Simplificação do Registro e da Legalização de Empresas e Negócios (Redesim).\n§ 6º Para os fins do § 5º deste artigo, deverá haver compartilhamento de cadastro com o órgão do Poder Judiciário, incluído o endereço eletrônico constante do sistema integrado da Redesim, nos termos da legislação aplicável ao sigilo fiscal e ao tratamento de dados pessoais."},"247":{"topicId":"OJ26-DPCI-CPC-15","texto":"Art. 247. A citação será feita por meio eletrônico ou pelo correio para qualquer comarca do País, exceto:\nI - nas ações de estado, observado o disposto no art. 695, § 3º;\nII - quando o citando for incapaz;\nIII - quando o citando for pessoa de direito público;\nIV - quando o citando residir em local não atendido pela entrega domiciliar de correspondência;\nV - quando o autor, justificadamente, a requerer de outra forma."},"248":{"topicId":"OJ26-DPCI-CPC-15","texto":"Art. 248. Deferida a citação pelo correio, o escrivão ou o chefe de secretaria remeterá ao citando cópias da petição inicial e do despacho do juiz e comunicará o prazo para resposta, o endereço do juízo e o respectivo cartório.\n§ 1º A carta será registrada para entrega ao citando, exigindo-lhe o carteiro, ao fazer a entrega, que assine o recibo.\n§ 2º Sendo o citando pessoa jurídica, será válida a entrega do mandado a pessoa com poderes de gerência geral ou de administração ou, ainda, a funcionário responsável pelo recebimento de correspondências.\n§ 3º Da carta de citação no processo de conhecimento constarão os requisitos do art. 250.\n§ 4º Nos condomínios edilícios ou nos loteamentos com controle de acesso, será válida a entrega do mandado a funcionário da portaria responsável pelo recebimento de correspondência, que, entretanto, poderá recusar o recebimento, se declarar, por escrito, sob as penas da lei, que o destinatário da correspondência está ausente."},"249":{"topicId":"OJ26-DPCI-CPC-15","texto":"Art. 249. A citação será feita por meio de oficial de justiça nas hipóteses previstas neste Código ou em lei, ou quando frustrada a citação pelo correio."},"250":{"topicId":"OJ26-DPCI-CPC-15","texto":"Art. 250. O mandado que o oficial de justiça tiver de cumprir conterá:\nI - os nomes do autor e do citando e seus respectivos domicílios ou residências;\nII - a finalidade da citação, com todas as especificações constantes da petição inicial, bem como a menção do prazo para contestar, sob pena de revelia, ou para embargar a execução;\nIII - a aplicação de sanção para o caso de descumprimento da ordem, se houver;\nIV - se for o caso, a intimação do citando para comparecer, acompanhado de advogado ou de defensor público, à audiência de conciliação ou de mediação, com a menção do dia, da hora e do lugar do comparecimento;\nV - a cópia da petição inicial, do despacho ou da decisão que deferir tutela provisória;\nVI - a assinatura do escrivão ou do chefe de secretaria e a declaração de que o subscreve por ordem do juiz."},"251":{"topicId":"OJ26-DPCI-CPC-15","texto":"Art. 251. Incumbe ao oficial de justiça procurar o citando e, onde o encontrar, citá-lo:\nI - lendo-lhe o mandado e entregando-lhe a contrafé;\nII - portando por fé se recebeu ou recusou a contrafé;\nIII - obtendo a nota de ciente ou certificando que o citando não a apôs no mandado."},"252":{"topicId":"OJ26-DPCI-CPC-15","texto":"Art. 252. Quando, por 2 (duas) vezes, o oficial de justiça houver procurado o citando em seu domicílio ou residência sem o encontrar, deverá, havendo suspeita de ocultação, intimar qualquer pessoa da família ou, em sua falta, qualquer vizinho de que, no dia útil imediato, voltará a fim de efetuar a citação, na hora que designar.\nParágrafo único. Nos condomínios edilícios ou nos loteamentos com controle de acesso, será válida a intimação a que se refere o caput feita a funcionário da portaria responsável pelo recebimento de correspondência."},"253":{"topicId":"OJ26-DPCI-CPC-15","texto":"Art. 253. No dia e na hora designados, o oficial de justiça, independentemente de novo despacho, comparecerá ao domicílio ou à residência do citando a fim de realizar a diligência.\n§ 1º Se o citando não estiver presente, o oficial de justiça procurará informar-se das razões da ausência, dando por feita a citação, ainda que o citando se tenha ocultado em outra comarca, seção ou subseção judiciárias.\n§ 2º A citação com hora certa será efetivada mesmo que a pessoa da família ou o vizinho que houver sido intimado esteja ausente, ou se, embora presente, a pessoa da família ou o vizinho se recusar a receber o mandado.\n§ 3º Da certidão da ocorrência, o oficial de justiça deixará contrafé com qualquer pessoa da família ou vizinho, conforme o caso, declarando-lhe o nome.\n§ 4º O oficial de justiça fará constar do mandado a advertência de que será nomeado curador especial se houver revelia."},"254":{"topicId":"OJ26-DPCI-CPC-15","texto":"Art. 254. Feita a citação com hora certa, o escrivão ou chefe de secretaria enviará ao réu, executado ou interessado, no prazo de 10 (dez) dias, contado da data da juntada do mandado aos autos, carta, telegrama ou correspondência eletrônica, dando-lhe de tudo ciência."},"255":{"topicId":"OJ26-DPCI-CPC-15","texto":"Art. 255. Nas comarcas contíguas de fácil comunicação e nas que se situem na mesma região metropolitana, o oficial de justiça poderá efetuar, em qualquer delas, citações, intimações, notificações, penhoras e quaisquer outros atos executivos."},"256":{"topicId":"OJ26-DPCI-CPC-15","texto":"Art. 256. A citação por edital será feita:\nI - quando desconhecido ou incerto o citando;\nII - quando ignorado, incerto ou inacessível o lugar em que se encontrar o citando;\nIII - nos casos expressos em lei.\n§ 1º Considera-se inacessível, para efeito de citação por edital, o país que recusar o cumprimento de carta rogatória.\n§ 2º No caso de ser inacessível o lugar em que se encontrar o réu, a notícia de sua citação será divulgada também pelo rádio, se na comarca houver emissora de radiodifusão.\n§ 3º O réu será considerado em local ignorado ou incerto se infrutíferas as tentativas de sua localização, inclusive mediante requisição pelo juízo de informações sobre seu endereço nos cadastros de órgãos públicos ou de concessionárias de serviços públicos."},"257":{"topicId":"OJ26-DPCI-CPC-15","texto":"Art. 257. São requisitos da citação por edital:\nI - a afirmação do autor ou a certidão do oficial informando a presença das circunstâncias autorizadoras;\nII - a publicação do edital na rede mundial de computadores, no sítio do respectivo tribunal e na plataforma de editais do Conselho Nacional de Justiça, que deve ser certificada nos autos;\nIII - a determinação, pelo juiz, do prazo, que variará entre 20 (vinte) e 60 (sessenta) dias, fluindo da data da publicação única ou, havendo mais de uma, da primeira;\nIV - a advertência de que será nomeado curador especial em caso de revelia.\nParágrafo único. O juiz poderá determinar que a publicação do edital seja feita também em jornal local de ampla circulação ou por outros meios, considerando as peculiaridades da comarca, da seção ou da subseção judiciárias."},"258":{"topicId":"OJ26-DPCI-CPC-15","texto":"Art. 258. A parte que requerer a citação por edital, alegando dolosamente a ocorrência das circunstâncias autorizadoras para sua realização, incorrerá em multa de 5 (cinco) vezes o salário-mínimo.\nParágrafo único. A multa reverterá em benefício do citando."},"259":{"topicId":"OJ26-DPCI-CPC-15","texto":"Art. 259. Serão publicados editais:\nI - na ação de usucapião de imóvel;\nII - na ação de recuperação ou substituição de título ao portador;\nIII - em qualquer ação em que seja necessária, por determinação legal, a provocação, para participação no processo, de interessados incertos ou desconhecidos."},"269":{"topicId":"OJ26-DPCI-CPC-16","texto":"Art. 269. Intimação é o ato pelo qual se dá ciência a alguém dos atos e dos termos do processo.\n§ 1º É facultado aos advogados promover a intimação do advogado da outra parte por meio do correio, juntando aos autos, a seguir, cópia do ofício de intimação e do aviso de recebimento.\n§ 2º O ofício de intimação deverá ser instruído com cópia do despacho, da decisão ou da sentença.\n§ 3º A intimação da União, dos Estados, do Distrito Federal, dos Municípios e de suas respectivas autarquias e fundações de direito público será realizada perante o órgão de Advocacia Pública responsável por sua representação judicial."},"270":{"topicId":"OJ26-DPCI-CPC-16","texto":"Art. 270. As intimações realizam-se, sempre que possível, por meio eletrônico, na forma da lei.\nParágrafo único. Aplica-se ao Ministério Público, à Defensoria Pública e à Advocacia Pública o disposto no § 1º do art. 246."},"271":{"topicId":"OJ26-DPCI-CPC-16","texto":"Art. 271. O juiz determinará de ofício as intimações em processos pendentes, salvo disposição em contrário."},"272":{"topicId":"OJ26-DPCI-CPC-16","texto":"Art. 272. Quando não realizadas por meio eletrônico, consideram-se feitas as intimações pela publicação dos atos no órgão oficial.\n§ 1º Os advogados poderão requerer que, na intimação a eles dirigida, figure apenas o nome da sociedade a que pertençam, desde que devidamente registrada na Ordem dos Advogados do Brasil.\n§ 2º Sob pena de nulidade, é indispensável que da publicação constem os nomes das partes e de seus advogados, com o respectivo número de inscrição na Ordem dos Advogados do Brasil, ou, se assim requerido, da sociedade de advogados.\n§ 3º A grafia dos nomes das partes não deve conter abreviaturas.\n§ 4º A grafia dos nomes dos advogados deve corresponder ao nome completo e ser a mesma que constar da procuração ou que estiver registrada na Ordem dos Advogados do Brasil.\n§ 5º Constando dos autos pedido expresso para que as comunicações dos atos processuais sejam feitas em nome dos advogados indicados, o seu desatendimento implicará nulidade.\n§ 6º A retirada dos autos do cartório ou da secretaria em carga pelo advogado, por pessoa credenciada a pedido do advogado ou da sociedade de advogados, pela Advocacia Pública, pela Defensoria Pública ou pelo Ministério Público implicará intimação de qualquer decisão contida no processo retirado, ainda que pendente de publicação.\n§ 7º O advogado e a sociedade de advogados deverão requerer o respectivo credenciamento para a retirada de autos por preposto.\n§ 8º A parte arguirá a nulidade da intimação em capítulo preliminar do próprio ato que lhe caiba praticar, o qual será tido por tempestivo se o vício for reconhecido.\n§ 9º Não sendo possível a prática imediata do ato diante da necessidade de acesso prévio aos autos, a parte limitar-se-á a arguir a nulidade da intimação, caso em que o prazo será contado da intimação da decisão que a reconheça."},"273":{"topicId":"OJ26-DPCI-CPC-16","texto":"Art. 273. Se inviável a intimação por meio eletrônico e não houver na localidade publicação em órgão oficial, incumbirá ao escrivão ou chefe de secretaria intimar de todos os atos do processo os advogados das partes:\nI - pessoalmente, se tiverem domicílio na sede do juízo;\nII - por carta registrada, com aviso de recebimento, quando forem domiciliados fora do juízo."},"274":{"topicId":"OJ26-DPCI-CPC-16","texto":"Art. 274. Não dispondo a lei de outro modo, as intimações serão feitas às partes, aos seus representantes legais, aos advogados e aos demais sujeitos do processo pelo correio ou, se presentes em cartório, diretamente pelo escrivão ou chefe de secretaria.\nParágrafo único. Presumem-se válidas as intimações dirigidas ao endereço constante dos autos, ainda que não recebidas pessoalmente pelo interessado, se a modificação temporária ou definitiva não tiver sido devidamente comunicada ao juízo, fluindo os prazos a partir da juntada aos autos do comprovante de entrega da correspondência no primitivo endereço."},"275":{"topicId":"OJ26-DPCI-CPC-16","texto":"Art. 275. A intimação será feita por oficial de justiça quando frustrada a realização por meio eletrônico ou pelo correio.\n§ 1º A certidão de intimação deve conter:\nI - a indicação do lugar e a descrição da pessoa intimada, mencionando, quando possível, o número de seu documento de identidade e o órgão que o expediu;\nII - a declaração de entrega da contrafé;\nIII - a nota de ciente ou a certidão de que o interessado não a apôs no mandado.\n§ 2º Caso necessário, a intimação poderá ser efetuada com hora certa ou por edital."},"447":{"topicId":"OJ26-DPCI-CPC-17","texto":"Art. 447. Podem depor como testemunhas todas as pessoas, exceto as incapazes, impedidas ou suspeitas.\n§ 1º São incapazes:\nI - o interdito por enfermidade ou deficiência mental;\nII - o que, acometido por enfermidade ou retardamento mental, ao tempo em que ocorreram os fatos, não podia discerni-los, ou, ao tempo em que deve depor, não está habilitado a transmitir as percepções;\nIII - o que tiver menos de 16 (dezesseis) anos;\nIV - o cego e o surdo, quando a ciência do fato depender dos sentidos que lhes faltam.\n§ 2º São impedidos:\nI - o cônjuge, o companheiro, o ascendente e o descendente em qualquer grau e o colateral, até o terceiro grau, de alguma das partes, por consanguinidade ou afinidade, salvo se o exigir o interesse público ou, tratando-se de causa relativa ao estado da pessoa, não se puder obter de outro modo a prova que o juiz repute necessária ao julgamento do mérito;\nII - o que é parte na causa;\nIII - o que intervém em nome de uma parte, como o tutor, o representante legal da pessoa jurídica, o juiz, o advogado e outros que assistam ou tenham assistido as partes.\n§ 3º São suspeitos:\nI - o inimigo da parte ou o seu amigo íntimo;\nII - o que tiver interesse no litígio.\n§ 4º Sendo necessário, pode o juiz admitir o depoimento das testemunhas menores, impedidas ou suspeitas.\n§ 5º Os depoimentos referidos no § 4º serão prestados independentemente de compromisso, e o juiz lhes atribuirá o valor que possam merecer."},"448":{"topicId":"OJ26-DPCI-CPC-17","texto":"Art. 448. A testemunha não é obrigada a depor sobre fatos:\nI - que lhe acarretem grave dano, bem como ao seu cônjuge ou companheiro e aos seus parentes consanguíneos ou afins, em linha reta ou colateral, até o terceiro grau;\nII - a cujo respeito, por estado ou profissão, deva guardar sigilo."},"449":{"topicId":"OJ26-DPCI-CPC-17","texto":"Art. 449. Salvo disposição especial em contrário, as testemunhas devem ser ouvidas na sede do juízo.\nParágrafo único. Quando a parte ou a testemunha, por enfermidade ou por outro motivo relevante, estiver impossibilitada de comparecer, mas não de prestar depoimento, o juiz designará, conforme as circunstâncias, dia, hora e lugar para inquiri-la."},"453":{"topicId":"OJ26-DPCI-CPC-18","texto":"Art. 453. As testemunhas depõem, na audiência de instrução e julgamento, perante o juiz da causa, exceto:\nI - as que prestam depoimento antecipadamente;\nII - as que são inquiridas por carta.\n§ 1º A oitiva de testemunha que residir em comarca, seção ou subseção judiciária diversa daquela onde tramita o processo poderá ser realizada por meio de videoconferência ou outro recurso tecnológico de transmissão e recepção de sons e imagens em tempo real, o que poderá ocorrer, inclusive, durante a audiência de instrução e julgamento.\n§ 2º Os juízos deverão manter equipamento para a transmissão e recepção de sons e imagens a que se refere o § 1º."},"454":{"topicId":"OJ26-DPCI-CPC-18","texto":"Art. 454. São inquiridos em sua residência ou onde exercem sua função:\nI - o presidente e o vice-presidente da República;\nII - os ministros de Estado;\nIII - os ministros do Supremo Tribunal Federal, os conselheiros do Conselho Nacional de Justiça e os ministros do Superior Tribunal de Justiça, do Superior Tribunal Militar, do Tribunal Superior Eleitoral, do Tribunal Superior do Trabalho e do Tribunal de Contas da União;\nIV - o procurador-geral da República e os conselheiros do Conselho Nacional do Ministério Público;\nV - o advogado-geral da União, o procurador-geral do Estado, o procurador-geral do Município, o defensor público-geral federal e o defensor público-geral do Estado;\nVI - os senadores e os deputados federais;\nVII - os governadores dos Estados e do Distrito Federal;\nVIII - o prefeito;\nIX - os deputados estaduais e distritais;\nX - os desembargadores dos Tribunais de Justiça, dos Tribunais Regionais Federais, dos Tribunais Regionais do Trabalho e dos Tribunais Regionais Eleitorais e os conselheiros dos Tribunais de Contas dos Estados e do Distrito Federal;\nXI - o procurador-geral de justiça;\nXII - o embaixador de país que, por lei ou tratado, concede idêntica prerrogativa a agente diplomático do Brasil.\n§ 1º O juiz solicitará à autoridade que indique dia, hora e local a fim de ser inquirida, remetendo-lhe cópia da petição inicial ou da defesa oferecida pela parte que a arrolou como testemunha.\n§ 2º Passado 1 (um) mês sem manifestação da autoridade, o juiz designará dia, hora e local para o depoimento, preferencialmente na sede do juízo.\n§ 3º O juiz também designará dia, hora e local para o depoimento, quando a autoridade não comparecer, injustificadamente, à sessão agendada para a colheita de seu testemunho no dia, hora e local por ela mesma indicados."},"502":{"topicId":"OJ26-DPCI-CPC-19","texto":"Art. 502. Denomina-se coisa julgada material a autoridade que torna imutável e indiscutível a decisão de mérito não mais sujeita a recurso."},"528":{"topicId":"OJ26-DPCI-CPC-20","texto":"Art. 528. No cumprimento de sentença que condene ao pagamento de prestação alimentícia ou de decisão interlocutória que fixe alimentos, o juiz, a requerimento do exequente, mandará intimar o executado pessoalmente para, em 3 (três) dias, pagar o débito, provar que o fez ou justificar a impossibilidade de efetuá-lo.\n§ 1º Caso o executado, no prazo referido no caput, não efetue o pagamento, não prove que o efetuou ou não apresente justificativa da impossibilidade de efetuá-lo, o juiz mandará protestar o pronunciamento judicial, aplicando-se, no que couber, o disposto no art. 517.\n§ 2º Somente a comprovação de fato que gere a impossibilidade absoluta de pagar justificará o inadimplemento.\n§ 3º Se o executado não pagar ou se a justificativa apresentada não for aceita, o juiz, além de mandar protestar o pronunciamento judicial na forma do § 1º, decretar-lhe-á a prisão pelo prazo de 1 (um) a 3 (três) meses.\n§ 4º A prisão será cumprida em regime fechado, devendo o preso ficar separado dos presos comuns.\n§ 5º O cumprimento da pena não exime o executado do pagamento das prestações vencidas e vincendas.\n§ 6º Paga a prestação alimentícia, o juiz suspenderá o cumprimento da ordem de prisão.\n§ 7º O débito alimentar que autoriza a prisão civil do alimentante é o que compreende até as 3 (três) prestações anteriores ao ajuizamento da execução e as que se vencerem no curso do processo.\n§ 8º O exequente pode optar por promover o cumprimento da sentença ou decisão desde logo, nos termos do disposto neste Livro, Título II, Capítulo III, caso em que não será admissível a prisão do executado, e, recaindo a penhora em dinheiro, a concessão de efeito suspensivo à impugnação não obsta a que o exequente levante mensalmente a importância da prestação.\n§ 9º Além das opções previstas no art. 516, parágrafo único, o exequente pode promover o cumprimento da sentença ou decisão que condena ao pagamento de prestação alimentícia no juízo de seu domicílio."},"535":{"topicId":"OJ26-DPCI-CPC-21","texto":"Art. 535. A Fazenda Pública será intimada na pessoa de seu representante judicial, por carga, remessa ou meio eletrônico, para, querendo, no prazo de 30 (trinta) dias e nos próprios autos, impugnar a execução, podendo arguir:\nI - falta ou nulidade da citação se, na fase de conhecimento, o processo correu à revelia;\nII - ilegitimidade de parte;\nIII - inexequibilidade do título ou inexigibilidade da obrigação;\nIV - excesso de execução ou cumulação indevida de execuções;\nV - incompetência absoluta ou relativa do juízo da execução;\nVI - qualquer causa modificativa ou extintiva da obrigação, como pagamento, novação, compensação, transação ou prescrição, desde que supervenientes ao trânsito em julgado da sentença.\n§ 1º A alegação de impedimento ou suspeição observará o disposto nos arts. 146 e 148.\n§ 2º Quando se alegar que o exequente, em excesso de execução, pleiteia quantia superior à resultante do título, cumprirá à executada declarar de imediato o valor que entende correto, sob pena de não conhecimento da arguição.\n§ 3º Não impugnada a execução ou rejeitadas as arguições da executada:\nI - expedir-se-á, por intermédio do presidente do tribunal competente, precatório em favor do exequente, observando-se o disposto na Constituição Federal ;\nII - por ordem do juiz, dirigida à autoridade na pessoa de quem o ente público foi citado para o processo, o pagamento de obrigação de pequeno valor será realizado no prazo de 2 (dois) meses contado da entrega da requisição, mediante depósito na agência de banco oficial mais próxima da residência do exequente.\n§ 5º Para efeito do disposto no inciso III do caput deste artigo, considera-se também inexigível a obrigação reconhecida em título executivo judicial fundado em lei ou ato normativo considerado inconstitucional pelo Supremo Tribunal Federal, ou fundado em aplicação ou interpretação da lei ou do ato normativo tido pelo Supremo Tribunal Federal como incompatível com a Constituição Federal , em controle de constitucionalidade concentrado ou difuso.\n§ 6º No caso do § 5º, os efeitos da decisão do Supremo Tribunal Federal poderão ser modulados no tempo, de modo a favorecer a segurança jurídica.\n§ 7º A decisão do Supremo Tribunal Federal referida no § 5º deve ter sido proferida antes do trânsito em julgado da decisão exequenda.\n§ 8º Se a decisão referida no § 5º for proferida após o trânsito em julgado da decisão exequenda, caberá ação rescisória, cujo prazo será contado do trânsito em julgado da decisão proferida pelo Supremo Tribunal Federal."},"536":{"topicId":"OJ26-DPCI-CPC-21","texto":"Art. 536.\n§ 2º O mandado de busca e apreensão de pessoas e coisas será cumprido por 2 (dois) oficiais de justiça, observando-se o disposto no art. 846, §§ 1º a 4º, se houver necessidade de arrombamento.\n§ 3º O executado incidirá nas penas de litigância de má-fé quando injustificadamente descumprir a ordem judicial, sem prejuízo de sua responsabilização por crime de desobediência.\n§ 4º No cumprimento de sentença que reconheça a exigibilidade de obrigação de fazer ou de não fazer, aplica-se o art. 525, no que couber.\n§ 5º O disposto neste artigo aplica-se, no que couber, ao cumprimento de sentença que reconheça deveres de fazer e de não fazer de natureza não obrigacional."},"538":{"topicId":"OJ26-DPCI-CPC-22","texto":"Art. 538. Não cumprida a obrigação de entregar coisa no prazo estabelecido na sentença, será expedido mandado de busca e apreensão ou de imissão na posse em favor do credor, conforme se tratar de coisa móvel ou imóvel.\n§ 1º A existência de benfeitorias deve ser alegada na fase de conhecimento, em contestação, de forma discriminada e com atribuição, sempre que possível e justificadamente, do respectivo valor.\n§ 2º O direito de retenção por benfeitorias deve ser exercido na contestação, na fase de conhecimento.\n§ 3º Aplicam-se ao procedimento previsto neste artigo, no que couber, as disposições sobre o cumprimento de obrigação de fazer ou de não fazer."},"554":{"topicId":"OJ26-DPCI-CPC-23","texto":"Art. 554. A propositura de uma ação possessória em vez de outra não obstará a que o juiz conheça do pedido e outorgue a proteção legal correspondente àquela cujos pressupostos estejam provados.\n§ 1º No caso de ação possessória em que figure no polo passivo grande número de pessoas, serão feitas a citação pessoal dos ocupantes que forem encontrados no local e a citação por edital dos demais, determinando-se, ainda, a intimação do Ministério Público e, se envolver pessoas em situação de hipossuficiência econômica, da Defensoria Pública.\n§ 2º Para fim da citação pessoal prevista no § 1º, o oficial de justiça procurará os ocupantes no local por uma vez, citando-se por edital os que não forem encontrados.\n§ 3º O juiz deverá determinar que se dê ampla publicidade da existência da ação prevista no § 1º e dos respectivos prazos processuais, podendo, para tanto, valer-se de anúncios em jornal ou rádio locais, da publicação de cartazes na região do conflito e de outros meios."},"560":{"topicId":"OJ26-DPCI-CPC-24","texto":"Art. 560. O possuidor tem direito a ser mantido na posse em caso de turbação e reintegrado em caso de esbulho."},"561":{"topicId":"OJ26-DPCI-CPC-24","texto":"Art. 561. Incumbe ao autor provar:\nI - a sua posse;\nII - a turbação ou o esbulho praticado pelo réu;\nIII - a data da turbação ou do esbulho;\nIV - a continuação da posse, embora turbada, na ação de manutenção, ou a perda da posse, na ação de reintegração."},"562":{"topicId":"OJ26-DPCI-CPC-24","texto":"Art. 562. Estando a petição inicial devidamente instruída, o juiz deferirá, sem ouvir o réu, a expedição do mandado liminar de manutenção ou de reintegração, caso contrário, determinará que o autor justifique previamente o alegado, citando-se o réu para comparecer à audiência que for designada.\nParágrafo único. Contra as pessoas jurídicas de direito público não será deferida a manutenção ou a reintegração liminar sem prévia audiência dos respectivos representantes judiciais."},"563":{"topicId":"OJ26-DPCI-CPC-24","texto":"Art. 563. Considerada suficiente a justificação, o juiz fará logo expedir mandado de manutenção ou de reintegração."},"626":{"topicId":"OJ26-DPCI-CPC-25","texto":"Art. 626. Feitas as primeiras declarações, o juiz mandará citar, para os termos do inventário e da partilha, o cônjuge, o companheiro, os herdeiros e os legatários e intimar a Fazenda Pública, o Ministério Público, se houver herdeiro incapaz ou ausente, e o testamenteiro, se houver testamento.\n§ 1º O cônjuge ou o companheiro, os herdeiros e os legatários serão citados pelo correio, observado o disposto no art. 247, sendo, ainda, publicado edital, nos termos do inciso III do art. 259.\n§ 2º Das primeiras declarações extrair-se-ão tantas cópias quantas forem as partes.\n§ 3º A citação será acompanhada de cópia das primeiras declarações.\n§ 4º Incumbe ao escrivão remeter cópias à Fazenda Pública, ao Ministério Público, ao testamenteiro, se houver, e ao advogado, se a parte já estiver representada nos autos."},"695":{"topicId":"OJ26-DPCI-CPC-26","texto":"Art. 695. Recebida a petição inicial e, se for o caso, tomadas as providências referentes à tutela provisória, o juiz ordenará a citação do réu para comparecer à audiência de mediação e conciliação, observado o disposto no art. 694.\n§ 1º O mandado de citação conterá apenas os dados necessários à audiência e deverá estar desacompanhado de cópia da petição inicial, assegurado ao réu o direito de examinar seu conteúdo a qualquer tempo.\n§ 2º A citação ocorrerá com antecedência mínima de 15 (quinze) dias da data designada para a audiência.\n§ 3º A citação será feita na pessoa do réu.\n§ 4º Na audiência, as partes deverão estar acompanhadas de seus advogados ou de defensores públicos."},"751":{"topicId":"OJ26-DPCI-CPC-27","texto":"Art. 751. O interditando será citado para, em dia designado, comparecer perante o juiz, que o entrevistará minuciosamente acerca de sua vida, negócios, bens, vontades, preferências e laços familiares e afetivos e sobre o que mais lhe parecer necessário para convencimento quanto à sua capacidade para praticar atos da vida civil, devendo ser reduzidas a termo as perguntas e respostas.\n§ 1º Não podendo o interditando deslocar-se, o juiz o ouvirá no local onde estiver.\n§ 2º A entrevista poderá ser acompanhada por especialista.\n§ 3º Durante a entrevista, é assegurado o emprego de recursos tecnológicos capazes de permitir ou de auxiliar o interditando a expressar suas vontades e preferências e a responder às perguntas formuladas.\n§ 4º A critério do juiz, poderá ser requisitada a oitiva de parentes e de pessoas próximas."},"782":{"topicId":"OJ26-DPCI-CPC-28","texto":"Art. 782. Não dispondo a lei de modo diverso, o juiz determinará os atos executivos, e o oficial de justiça os cumprirá.\n§ 1º O oficial de justiça poderá cumprir os atos executivos determinados pelo juiz também nas comarcas contíguas, de fácil comunicação, e nas que se situem na mesma região metropolitana.\n§ 2º Sempre que, para efetivar a execução, for necessário o emprego de força policial, o juiz a requisitará.\n§ 3º A requerimento da parte, o juiz pode determinar a inclusão do nome do executado em cadastros de inadimplentes.\n§ 4º A inscrição será cancelada imediatamente se for efetuado o pagamento, se for garantida a execução ou se a execução for extinta por qualquer outro motivo.\n§ 5º O disposto nos §§ 3º e 4º aplica-se à execução definitiva de título judicial."},"795":{"topicId":"OJ26-DPCI-CPC-29","texto":"Art. 795. Os bens particulares dos sócios não respondem pelas dívidas da sociedade, senão nos casos previstos em lei.\n§ 1º O sócio réu, quando responsável pelo pagamento da dívida da sociedade, tem o direito de exigir que primeiro sejam excutidos os bens da sociedade.\n§ 2º Incumbe ao sócio que alegar o benefício do § 1º nomear quantos bens da sociedade situados na mesma comarca, livres e desembargados, bastem para pagar o débito.\n§ 3º O sócio que pagar a dívida poderá executar a sociedade nos autos do mesmo processo.\n§ 4º Para a desconsideração da personalidade jurídica é obrigatória a observância do incidente previsto neste Código."},"806":{"topicId":"OJ26-DPCI-CPC-30","texto":"Art. 806. O devedor de obrigação de entrega de coisa certa, constante de título executivo extrajudicial, será citado para, em 15 (quinze) dias, satisfazer a obrigação.\n§ 1º Ao despachar a inicial, o juiz poderá fixar multa por dia de atraso no cumprimento da obrigação, ficando o respectivo valor sujeito a alteração, caso se revele insuficiente ou excessivo.\n§ 2º Do mandado de citação constará ordem para imissão na posse ou busca e apreensão, conforme se tratar de bem imóvel ou móvel, cujo cumprimento se dará de imediato, se o executado não satisfizer a obrigação no prazo que lhe foi designado."},"807":{"topicId":"OJ26-DPCI-CPC-30","texto":"Art. 807. Se o executado entregar a coisa, será lavrado o termo respectivo e considerada satisfeita a obrigação, prosseguindo-se a execução para o pagamento de frutos ou o ressarcimento de prejuízos, se houver."},"827":{"topicId":"OJ26-DPCI-CPC-31","texto":"Art. 827. Ao despachar a inicial, o juiz fixará, de plano, os honorários advocatícios de dez por cento, a serem pagos pelo executado.\n§ 1º No caso de integral pagamento no prazo de 3 (três) dias, o valor dos honorários advocatícios será reduzido pela metade.\n§ 2º O valor dos honorários poderá ser elevado até vinte por cento, quando rejeitados os embargos à execução, podendo a majoração, caso não opostos os embargos, ocorrer ao final do procedimento executivo, levando-se em conta o trabalho realizado pelo advogado do exequente."},"828":{"topicId":"OJ26-DPCI-CPC-31","texto":"Art. 828. O exequente poderá obter certidão de que a execução foi admitida pelo juiz, com identificação das partes e do valor da causa, para fins de averbação no registro de imóveis, de veículos ou de outros bens sujeitos a penhora, arresto ou indisponibilidade.\n§ 1º No prazo de 10 (dez) dias de sua concretização, o exequente deverá comunicar ao juízo as averbações efetivadas.\n§ 2º Formalizada penhora sobre bens suficientes para cobrir o valor da dívida, o exequente providenciará, no prazo de 10 (dez) dias, o cancelamento das averbações relativas àqueles não penhorados.\n§ 3º O juiz determinará o cancelamento das averbações, de ofício ou a requerimento, caso o exequente não o faça no prazo.\n§ 4º Presume-se em fraude à execução a alienação ou a oneração de bens efetuada após a averbação.\n§ 5º O exequente que promover averbação manifestamente indevida ou não cancelar as averbações nos termos do § 2º indenizará a parte contrária, processando-se o incidente em autos apartados."},"829":{"topicId":"OJ26-DPCI-CPC-31","texto":"Art. 829. O executado será citado para pagar a dívida no prazo de 3 (três) dias, contado da citação.\n§ 1º Do mandado de citação constarão, também, a ordem de penhora e a avaliação a serem cumpridas pelo oficial de justiça tão logo verificado o não pagamento no prazo assinalado, de tudo lavrando-se auto, com intimação do executado.\n§ 2º A penhora recairá sobre os bens indicados pelo exequente, salvo se outros forem indicados pelo executado e aceitos pelo juiz, mediante demonstração de que a constrição proposta lhe será menos onerosa e não trará prejuízo ao exequente."},"830":{"topicId":"OJ26-DPCI-CPC-31","texto":"Art. 830. Se o oficial de justiça não encontrar o executado, arrestar-lhe-á tantos bens quantos bastem para garantir a execução.\n§ 1º Nos 10 (dez) dias seguintes à efetivação do arresto, o oficial de justiça procurará o executado 2 (duas) vezes em dias distintos e, havendo suspeita de ocultação, realizará a citação com hora certa, certificando pormenorizadamente o ocorrido.\n§ 2º Incumbe ao exequente requerer a citação por edital, uma vez frustradas a pessoal e a com hora certa.\n§ 3º Aperfeiçoada a citação e transcorrido o prazo de pagamento, o arresto converter-se-á em penhora, independentemente de termo."},"831":{"topicId":"OJ26-DPCI-CPC-31","texto":"Art. 831. A penhora deverá recair sobre tantos bens quantos bastem para o pagamento do principal atualizado, dos juros, das custas e dos honorários advocatícios."},"832":{"topicId":"OJ26-DPCI-CPC-31","texto":"Art. 832. Não estão sujeitos à execução os bens que a lei considera impenhoráveis ou inalienáveis."},"834":{"topicId":"OJ26-DPCI-CPC-31","texto":"Art. 834. Podem ser penhorados, à falta de outros bens, os frutos e os rendimentos dos bens inalienáveis."},"835":{"topicId":"OJ26-DPCI-CPC-31","texto":"Art. 835. A penhora observará, preferencialmente, a seguinte ordem:\nI - dinheiro, em espécie ou em depósito ou aplicação em instituição financeira;\nII - títulos da dívida pública da União, dos Estados e do Distrito Federal com cotação em mercado;\nIII - títulos e valores mobiliários com cotação em mercado;\nIV - veículos de via terrestre;\nV - bens imóveis;\nVI - bens móveis em geral;\nVII - semoventes;\nVIII - navios e aeronaves;\nIX - ações e quotas de sociedades simples e empresárias;\nX - percentual do faturamento de empresa devedora;\nXI - pedras e metais preciosos;\nXII - direitos aquisitivos derivados de promessa de compra e venda e de alienação fiduciária em garantia;\nXIII - outros direitos.\n§ 1º É prioritária a penhora em dinheiro, podendo o juiz, nas demais hipóteses, alterar a ordem prevista no caput de acordo com as circunstâncias do caso concreto.\n§ 2º Para fins de substituição da penhora, equiparam-se a dinheiro a fiança bancária e o seguro garantia judicial, desde que em valor não inferior ao do débito constante da inicial, acrescido de trinta por cento.\n§ 3º Na execução de crédito com garantia real, a penhora recairá sobre a coisa dada em garantia, e, se a coisa pertencer a terceiro garantidor, este também será intimado da penhora."},"836":{"topicId":"OJ26-DPCI-CPC-31","texto":"Art. 836. Não se levará a efeito a penhora quando ficar evidente que o produto da execução dos bens encontrados será totalmente absorvido pelo pagamento das custas da execução.\n§ 1º Quando não encontrar bens penhoráveis, independentemente de determinação judicial expressa, o oficial de justiça descreverá na certidão os bens que guarnecem a residência ou o estabelecimento do executado, quando este for pessoa jurídica.\n§ 2º Elaborada a lista, o executado ou seu representante legal será nomeado depositário provisório de tais bens até ulterior determinação do juiz."},"837":{"topicId":"OJ26-DPCI-CPC-31","texto":"Art. 837. Obedecidas as normas de segurança instituídas sob critérios uniformes pelo Conselho Nacional de Justiça, a penhora de dinheiro e as averbações de penhoras de bens imóveis e móveis podem ser realizadas por meio eletrônico."},"838":{"topicId":"OJ26-DPCI-CPC-31","texto":"Art. 838. A penhora será realizada mediante auto ou termo, que conterá:\nI - a indicação do dia, do mês, do ano e do lugar em que foi feita;\nII - os nomes do exequente e do executado;\nIII - a descrição dos bens penhorados, com as suas características;\nIV - a nomeação do depositário dos bens."},"839":{"topicId":"OJ26-DPCI-CPC-31","texto":"Art. 839. Considerar-se-á feita a penhora mediante a apreensão e o depósito dos bens, lavrando-se um só auto se as diligências forem concluídas no mesmo dia.\nParágrafo único. Havendo mais de uma penhora, serão lavrados autos individuais."},"840":{"topicId":"OJ26-DPCI-CPC-31","texto":"Art. 840. Serão preferencialmente depositados:\nI - as quantias em dinheiro, os papéis de crédito e as pedras e os metais preciosos, no Banco do Brasil, na Caixa Econômica Federal ou em banco do qual o Estado ou o Distrito Federal possua mais da metade do capital social integralizado, ou, na falta desses estabelecimentos, em qualquer instituição de crédito designada pelo juiz;\nII - os móveis, os semoventes, os imóveis urbanos e os direitos aquisitivos sobre imóveis urbanos, em poder do depositário judicial;\nIII - os imóveis rurais, os direitos aquisitivos sobre imóveis rurais, as máquinas, os utensílios e os instrumentos necessários ou úteis à atividade agrícola, mediante caução idônea, em poder do executado.\n§ 1º No caso do inciso II do caput, se não houver depositário judicial, os bens ficarão em poder do exequente.\n§ 2º Os bens poderão ser depositados em poder do executado nos casos de difícil remoção ou quando anuir o exequente.\n§ 3º As joias, as pedras e os objetos preciosos deverão ser depositados com registro do valor estimado de resgate."},"841":{"topicId":"OJ26-DPCI-CPC-31","texto":"Art. 841. Formalizada a penhora por qualquer dos meios legais, dela será imediatamente intimado o executado.\n§ 1º A intimação da penhora será feita ao advogado do executado ou à sociedade de advogados a que aquele pertença.\n§ 2º Se não houver constituído advogado nos autos, o executado será intimado pessoalmente, de preferência por via postal.\n§ 3º O disposto no § 1º não se aplica aos casos de penhora realizada na presença do executado, que se reputa intimado.\n§ 4º Considera-se realizada a intimação a que se refere o § 2º quando o executado houver mudado de endereço sem prévia comunicação ao juízo, observado o disposto no parágrafo único do art. 274."},"842":{"topicId":"OJ26-DPCI-CPC-31","texto":"Art. 842. Recaindo a penhora sobre bem imóvel ou direito real sobre imóvel, será intimado também o cônjuge do executado, salvo se forem casados em regime de separação absoluta de bens."},"843":{"topicId":"OJ26-DPCI-CPC-31","texto":"Art. 843. Tratando-se de penhora de bem indivisível, o equivalente à quota-parte do coproprietário ou do cônjuge alheio à execução recairá sobre o produto da alienação do bem.\n§ 1º É reservada ao coproprietário ou ao cônjuge não executado a preferência na arrematação do bem em igualdade de condições.\n§ 2º Não será levada a efeito expropriação por preço inferior ao da avaliação na qual o valor auferido seja incapaz de garantir, ao coproprietário ou ao cônjuge alheio à execução, o correspondente à sua quota-parte calculado sobre o valor da avaliação."},"844":{"topicId":"OJ26-DPCI-CPC-31","texto":"Art. 844. Para presunção absoluta de conhecimento por terceiros, cabe ao exequente providenciar a averbação do arresto ou da penhora no registro competente, mediante apresentação de cópia do auto ou do termo, independentemente de mandado judicial."},"845":{"topicId":"OJ26-DPCI-CPC-31","texto":"Art. 845. Efetuar-se-á a penhora onde se encontrem os bens, ainda que sob a posse, a detenção ou a guarda de terceiros.\n§ 1º A penhora de imóveis, independentemente de onde se localizem, quando apresentada certidão da respectiva matrícula, e a penhora de veículos automotores, quando apresentada certidão que ateste a sua existência, serão realizadas por termo nos autos.\n§ 2º Se o executado não tiver bens no foro do processo, não sendo possível a realização da penhora nos termos do § 1º, a execução será feita por carta, penhorando-se, avaliando-se e alienando-se os bens no foro da situação."},"846":{"topicId":"OJ26-DPCI-CPC-31","texto":"Art. 846. Se o executado fechar as portas da casa a fim de obstar a penhora dos bens, o oficial de justiça comunicará o fato ao juiz, solicitando-lhe ordem de arrombamento.\n§ 1º Deferido o pedido, 2 (dois) oficiais de justiça cumprirão o mandado, arrombando cômodos e móveis em que se presuma estarem os bens, e lavrarão de tudo auto circunstanciado, que será assinado por 2 (duas) testemunhas presentes à diligência.\n§ 2º Sempre que necessário, o juiz requisitará força policial, a fim de auxiliar os oficiais de justiça na penhora dos bens.\n§ 3º Os oficiais de justiça lavrarão em duplicata o auto da ocorrência, entregando uma via ao escrivão ou ao chefe de secretaria, para ser juntada aos autos, e a outra à autoridade policial a quem couber a apuração criminal dos eventuais delitos de desobediência ou de resistência.\n§ 4º Do auto da ocorrência constará o rol de testemunhas, com a respectiva qualificação."},"870":{"topicId":"OJ26-DPCI-CPC-32","texto":"Art. 870. A avaliação será feita pelo oficial de justiça.\nParágrafo único. Se forem necessários conhecimentos especializados e o valor da execução o comportar, o juiz nomeará avaliador, fixando-lhe prazo não superior a 10 (dez) dias para entrega do laudo."},"871":{"topicId":"OJ26-DPCI-CPC-32","texto":"Art. 871. Não se procederá à avaliação quando:\nI - uma das partes aceitar a estimativa feita pela outra;\nII - se tratar de títulos ou de mercadorias que tenham cotação em bolsa, comprovada por certidão ou publicação no órgão oficial;\nIII - se tratar de títulos da dívida pública, de ações de sociedades e de títulos de crédito negociáveis em bolsa, cujo valor será o da cotação oficial do dia, comprovada por certidão ou publicação no órgão oficial;\nIV - se tratar de veículos automotores ou de outros bens cujo preço médio de mercado possa ser conhecido por meio de pesquisas realizadas por órgãos oficiais ou de anúncios de venda divulgados em meios de comunicação, caso em que caberá a quem fizer a nomeação o encargo de comprovar a cotação de mercado.\nParágrafo único. Ocorrendo a hipótese do inciso I deste artigo, a avaliação poderá ser realizada quando houver fundada dúvida do juiz quanto ao real valor do bem."},"872":{"topicId":"OJ26-DPCI-CPC-32","texto":"Art. 872. A avaliação realizada pelo oficial de justiça constará de vistoria e de laudo anexados ao auto de penhora ou, em caso de perícia realizada por avaliador, de laudo apresentado no prazo fixado pelo juiz, devendo-se, em qualquer hipótese, especificar:\nI - os bens, com as suas características, e o estado em que se encontram;\nII - o valor dos bens.\n§ 1º Quando o imóvel for suscetível de cômoda divisão, a avaliação, tendo em conta o crédito reclamado, será realizada em partes, sugerindo-se, com a apresentação de memorial descritivo, os possíveis desmembramentos para alienação.\n§ 2º Realizada a avaliação e, sendo o caso, apresentada a proposta de desmembramento, as partes serão ouvidas no prazo de 5 (cinco) dias."},"873":{"topicId":"OJ26-DPCI-CPC-32","texto":"Art. 873. É admitida nova avaliação quando:\nI - qualquer das partes arguir, fundamentadamente, a ocorrência de erro na avaliação ou dolo do avaliador;\nII - se verificar, posteriormente à avaliação, que houve majoração ou diminuição no valor do bem;\nIII - o juiz tiver fundada dúvida sobre o valor atribuído ao bem na primeira avaliação.\nParágrafo único. Aplica-se o art. 480 à nova avaliação prevista no inciso III do caput deste artigo."},"874":{"topicId":"OJ26-DPCI-CPC-32","texto":"Art. 874. Após a avaliação, o juiz poderá, a requerimento do interessado e ouvida a parte contrária, mandar:\nI - reduzir a penhora aos bens suficientes ou transferi-la para outros, se o valor dos bens penhorados for consideravelmente superior ao crédito do exequente e dos acessórios;\nII - ampliar a penhora ou transferi-la para outros bens mais valiosos, se o valor dos bens penhorados for inferior ao crédito do exequente."},"875":{"topicId":"OJ26-DPCI-CPC-32","texto":"Art. 875. Realizadas a penhora e a avaliação, o juiz dará início aos atos de expropriação do bem."},"994":{"topicId":"OJ26-DPCI-CPC-33","texto":"Art. 994. São cabíveis os seguintes recursos:\nI - apelação;\nII - agravo de instrumento;\nIII - agravo interno;\nIV - embargos de declaração;\nV - recurso ordinário;\nVI - recurso especial;\nVII - recurso extraordinário;\nVIII - agravo em recurso especial ou extraordinário;\nIX - embargos de divergência."},"1001":{"topicId":"OJ26-DPCI-CPC-34","texto":"Art. 1001. Dos despachos não cabe recurso."},"1003":{"topicId":"OJ26-DPCI-CPC-35","texto":"Art. 1003. O prazo para interposição de recurso conta-se da data em que os advogados, a sociedade de advogados, a Advocacia Pública, a Defensoria Pública ou o Ministério Público são intimados da decisão.\n§ 1º Os sujeitos previstos no caput considerar-se-ão intimados em audiência quando nesta for proferida a decisão.\n§ 2º Aplica-se o disposto no art. 231, incisos I a VI, ao prazo de interposição de recurso pelo réu contra decisão proferida anteriormente à citação.\n§ 3º No prazo para interposição de recurso, a petição será protocolada em cartório ou conforme as normas de organização judiciária, ressalvado o disposto em regra especial.\n§ 4º Para aferição da tempestividade do recurso remetido pelo correio, será considerada como data de interposição a data de postagem.\n§ 5º Excetuados os embargos de declaração, o prazo para interpor os recursos e para responder-lhes é de 15 (quinze) dias.\n§ 6º O recorrente comprovará a ocorrência de feriado local no ato de interposição do recurso, e, se não o fizer, o tribunal determinará a correção do vício formal, ou poderá desconsiderá-lo caso a informação já conste do processo eletrônico."},"1009":{"topicId":"OJ26-DPCI-CPC-36","texto":"Art. 1009. Da sentença cabe apelação.\n§ 1º As questões resolvidas na fase de conhecimento, se a decisão a seu respeito não comportar agravo de instrumento, não são cobertas pela preclusão e devem ser suscitadas em preliminar de apelação, eventualmente interposta contra a decisão final, ou nas contrarrazões.\n§ 2º Se as questões referidas no § 1º forem suscitadas em contrarrazões, o recorrente será intimado para, em 15 (quinze) dias, manifestar-se a respeito delas.\n§ 3º O disposto no caput deste artigo aplica-se mesmo quando as questões mencionadas no art. 1.015 integrarem capítulo da sentença."},"1010":{"topicId":"OJ26-DPCI-CPC-37","texto":"Art. 1010. A apelação, interposta por petição dirigida ao juízo de primeiro grau, conterá:\nI - os nomes e a qualificação das partes;\nII - a exposição do fato e do direito;\nIII - as razões do pedido de reforma ou de decretação de nulidade;\nIV - o pedido de nova decisão.\n§ 1º O apelado será intimado para apresentar contrarrazões no prazo de 15 (quinze) dias.\n§ 2º Se o apelado interpuser apelação adesiva, o juiz intimará o apelante para apresentar contrarrazões.\n§ 3º Após as formalidades previstas nos §§ 1º e 2º, os autos serão remetidos ao tribunal pelo juiz, independentemente de juízo de admissibilidade."},"1015":{"topicId":"OJ26-DPCI-CPC-38","texto":"Art. 1015. Cabe agravo de instrumento contra as decisões interlocutórias que versarem sobre:\nI - tutelas provisórias;\nII - mérito do processo;\nIII - rejeição da alegação de convenção de arbitragem;\nIV - incidente de desconsideração da personalidade jurídica;\nV - rejeição do pedido de gratuidade da justiça ou acolhimento do pedido de sua revogação;\nVI - exibição ou posse de documento ou coisa;\nVII - exclusão de litisconsorte;\nVIII - rejeição do pedido de limitação do litisconsórcio;\nIX - admissão ou inadmissão de intervenção de terceiros;\nX - concessão, modificação ou revogação do efeito suspensivo aos embargos à execução;\nXI - redistribuição do ônus da prova nos termos do art. 373, § 1º;\nXII - (VETADO);\nXIII - outros casos expressamente referidos em lei.\nParágrafo único. Também caberá agravo de instrumento contra decisões interlocutórias proferidas na fase de liquidação de sentença ou de cumprimento de sentença, no processo de execução e no processo de inventário."},"1022":{"topicId":"OJ26-DPCI-CPC-39","texto":"Art. 1022. Cabem embargos de declaração contra qualquer decisão judicial para:\nI - esclarecer obscuridade ou eliminar contradição;\nII - suprir omissão de ponto ou questão sobre o qual devia se pronunciar o juiz de ofício ou a requerimento;\nIII - corrigir erro material.\nParágrafo único. Considera-se omissa a decisão que:\nI - deixe de se manifestar sobre tese firmada em julgamento de casos repetitivos ou em incidente de assunção de competência aplicável ao caso sob julgamento;\nII - incorra em qualquer das condutas descritas no art. 489, § 1º."}}},"senado-cpp-1941":{"id":"DIR-DPPE-CPP","concordancia":true,"nome":"Código de Processo Penal","rotulo":"do Código de Processo Penal (Decreto-Lei 3.689/1941)","titulo":"Direito: Código de Processo Penal","disciplina":"DPPE","url":"https://normas.leg.br/api/public/normas?urn=urn:lex:br:federal:decreto.lei:1941-10-03;3689&&tipo_documento=maior-detalhe","consultado_em":"2026-11-21","sha256":"5d71919da9958bf57058e3859626cd5c9dd4595cb1c151adaa533d34c9924d0f","observacao":"Texto compilado vigente, publicado pela fonte (salvo em 2026-08-07); não é reconstruído por data. A própria fonte informa atualização até data não informada: alterações posteriores a essa data podem não constar.","artigos":{"24":{"topicId":"OJ26-DPPE-CPP-01","texto":"Art. 24. Nos crimes de ação pública, esta será promovida por denúncia do Ministério Público, mas dependerá, quando a lei o exigir, de requisição do Ministro da Justiça, ou de representação do ofendido ou de quem tiver qualidade para representá-lo.\n§ 1º No caso de morte do ofendido ou quando declarado ausente por decisão judicial, o direito de representação passará ao cônjuge, ascendente, descendente ou irmão.\n§ 2º Seja qual for o crime, quando praticado em detrimento do patrimônio ou interesse da União, Estado e Município, a ação penal será pública."},"25":{"topicId":"OJ26-DPPE-CPP-01","texto":"Art. 25. A representação será irretratável, depois de oferecida a denúncia."},"26":{"topicId":"OJ26-DPPE-CPP-01","texto":"Art. 26. A ação penal, nas contravenções, será iniciada com o auto de prisão em flagrante ou por meio de portaria expedida pela autoridade judiciária ou policial."},"27":{"topicId":"OJ26-DPPE-CPP-01","texto":"Art. 27. Qualquer pessoa do povo poderá provocar a iniciativa do Ministério Público, nos casos em que caiba a ação pública, fornecendo-lhe, por escrito, informações sobre o fato e a autoria e indicando o tempo, o lugar e os elementos de convicção."},"28":{"topicId":"OJ26-DPPE-CPP-01","texto":"Art. 28. Ordenado o arquivamento do inquérito policial ou de quaisquer elementos informativos da mesma natureza, o órgão do Ministério Público comunicará à vítima, ao investigado e à autoridade policial e encaminhará os autos para a instância de revisão ministerial para fins de homologação, na forma da lei.\n§ 1º Se a vítima, ou seu representante legal, não concordar com o arquivamento do inquérito policial, poderá, no prazo de 30 (trinta) dias do recebimento da comunicação, submeter a matéria à revisão da instância competente do órgão ministerial, conforme dispuser a respectiva lei orgânica.\n§ 2º Nas ações penais relativas a crimes praticados em detrimento da União, Estados e Municípios, a revisão do arquivamento do inquérito policial poderá ser provocada pela chefia do órgão a quem couber a sua representação judicial."},"29":{"topicId":"OJ26-DPPE-CPP-01","texto":"Art. 29. Será admitida ação privada nos crimes de ação pública, se esta não for intentada no prazo legal, cabendo ao Ministério Público aditar a queixa, repudiá-la e oferecer denúncia substitutiva, intervir em todos os termos do processo, fornecer elementos de prova, interpor recurso e, a todo tempo, no caso de negligência do querelante, retomar a ação como parte principal."},"30":{"topicId":"OJ26-DPPE-CPP-01","texto":"Art. 30. Ao ofendido ou a quem tenha qualidade para representá-lo caberá intentar a ação privada."},"31":{"topicId":"OJ26-DPPE-CPP-01","texto":"Art. 31. No caso de morte do ofendido ou quando declarado ausente por decisão judicial, o direito de oferecer queixa ou prosseguir na ação passará ao côn
